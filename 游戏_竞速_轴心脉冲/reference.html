<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>轴心脉冲 AXELPULSE · 俯视环道漂移竞速</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f}
body{
  font:12px/1.45 "DejaVu Sans Mono","Menlo","Consolas",monospace;
  color:#a9c6e0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(140% 110% at 50% -10%,#131a3a 0%,#090c1c 46%,#04050c 100%);
  -webkit-font-smoothing:antialiased;
}
#stage{position:relative;width:1280px;height:720px;display:flex;flex-direction:column;gap:8px;padding:10px 14px}

/* ── 顶栏 ───────────────────────────────────────────── */
#bar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:14px;padding:0 14px;
  border:1px solid #2b2f6e;border-radius:4px;
  background:linear-gradient(180deg,#161b3f 0%,#0a0d20 100%);
  box-shadow:inset 0 1px 0 #4a51b0,0 4px 14px #000a;
}
#hTitle{font-size:15px;font-weight:700;letter-spacing:3px;color:#9ff0ff;text-shadow:0 0 12px #29d8d8}
#hTitle small{font-size:10px;letter-spacing:1px;color:#7a86c8;font-weight:400;margin-left:8px}
#hState{
  font-size:11px;letter-spacing:2px;padding:3px 10px;border-radius:3px;
  color:#0a1222;background:#5fe0c0;font-weight:700;box-shadow:0 0 12px #1d9f8a;
}
#hDiff{font-size:11px;color:#ffd479;letter-spacing:1px}
#hDepth{margin-left:auto;display:flex;gap:16px;font-size:11px;letter-spacing:1px;color:#8b93cf}
#hDepth b{color:#e6f0ff;font-weight:700}

/* ── 主区 ───────────────────────────────────────────── */
#main{flex:1 1 auto;display:flex;gap:10px;min-height:0}
#left{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}
#right{flex:0 0 auto;display:flex;flex-direction:column;gap:8px}

.pane{
  position:relative;border:1px solid #2b2f6e;border-radius:4px;overflow:hidden;
  background:#080b1a;box-shadow:inset 0 0 40px #000c,0 3px 12px #0008;
}
.pane > canvas{display:block}
.tag{
  position:absolute;top:0;left:0;font-size:9px;letter-spacing:2px;
  padding:2px 7px;color:#9fe8ff;background:#1b2154dd;border-right:1px solid #2b2f6e;
  border-bottom:1px solid #2b2f6e;border-radius:0 0 4px 0;z-index:4;pointer-events:none;
}

/* ── 覆盖层与结算面板（挂在 stage 内，随舞台缩放） ──── */
#ov{
  position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;text-align:center;
  background:radial-gradient(92% 84% at 42% 46%,#0c1430ea 0%,#060911e0 62%,#03040af2 100%);
}
#ov.hide{display:none}
#ovT{font-size:30px;letter-spacing:10px;color:#cff8ff;
     text-shadow:0 0 8px #04060f,0 0 18px #04060f,0 0 30px #04060f,0 0 24px #21c7cc,0 0 60px #0d3f68}
#ovS{font-size:12px;letter-spacing:4px;color:#9dc0e2;
     text-shadow:0 0 6px #04060f,0 0 14px #04060f}
#ovB{font-size:11px;letter-spacing:2px;color:#8fd8b8;line-height:2}
#ovB em{color:#ffd479;font-style:normal;font-weight:700}
#ovH{font-size:11px;letter-spacing:1px;color:#ffc98a;max-width:1180px;line-height:1.7}
#ovH em{color:#ffd479;font-style:normal;font-weight:700}
#ovC{font-size:10px;letter-spacing:1px;color:#5f7aad;max-width:1180px;line-height:1.7;
     border-top:1px solid #2b2f6e;padding-top:7px;margin-top:2px}
.diffs{display:flex;gap:12px;margin-top:2px}
.df{
  width:204px;padding:9px 12px;border:1px solid #3a3f8a;border-radius:4px;
  background:linear-gradient(180deg,#141a44,#0a0d22);
}
.df b{display:block;font-size:13px;letter-spacing:3px;color:#bfefff;margin-bottom:5px}
.df i{display:block;font-size:10px;line-height:1.8;color:#8b93cf;font-style:normal}
.df.on{border-color:#4fe0c0;box-shadow:0 0 20px #12756a,inset 0 0 24px #0a3d38}
.df.on b{color:#7fffdc}

#card{
  position:absolute;inset:0;z-index:9;display:none;flex-direction:column;
  padding:18px 24px;gap:9px;background:linear-gradient(180deg,#0a1130f2,#04060ff7);
}
#card.on{display:flex}
#card h2{font-size:22px;letter-spacing:8px;color:#9ff4ff;text-shadow:0 0 18px #1d94b8;font-weight:700}
#card .sub{font-size:11px;letter-spacing:3px;color:#7f8ec8;margin-bottom:3px}
#cGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px}
#cGrid .cell{
  border:1px solid #2b2f6e;border-radius:3px;padding:5px 9px;
  background:#0d1330;display:flex;justify-content:space-between;align-items:baseline;
}
#cGrid .cell u{font-size:10px;color:#8b93cf;text-decoration:none;letter-spacing:1px}
#cGrid .cell b{font-size:13px;color:#e6f0ff}
#cGrid .cell b.warn{color:#ff9d6b}
#cGrid .cell b.good{color:#7fffdc}
#cFoot{display:flex;gap:18px;align-items:flex-end;margin-top:auto;font-size:11px;color:#8b93cf;letter-spacing:1px}
.grade{
  font-size:44px;font-weight:700;letter-spacing:4px;color:#ffd479;
  text-shadow:0 0 26px #b07d2090;line-height:.9;
}

/* ── 引导自检序列（十四段） ─────────────────────────── */
#boot{
  position:absolute;inset:0;z-index:11;display:none;flex-direction:column;
  padding:14px 22px;gap:8px;background:linear-gradient(180deg,#060a1ef7,#03050efb);
}
#boot.on{display:flex}
#boot h1{font-size:17px;letter-spacing:6px;color:#9ff4ff;text-shadow:0 0 14px #1d94b8;font-weight:700}
#boot .sub{font-size:10px;letter-spacing:3px;color:#7a86c8}
#boot .stages{
  flex:1 1 auto;display:grid;grid-template-columns:repeat(4,1fr);
  gap:6px 9px;align-content:start;min-height:0;
}
#boot .stages > div{
  border:1px solid #232a5c;border-radius:3px;padding:4px 8px;background:#0a0f26;
  display:flex;flex-direction:column;gap:1px;overflow:hidden;
}
#boot .stages > div.done{border-color:#2f7f6e;background:#08161c}
#boot .stages > div.run{border-color:#5fe0c0;box-shadow:0 0 14px #0d6a5e inset;background:#0a1c26}
#boot .stages > div.bad{border-color:#ff5a5a;background:#1c0a10}
#boot .stages > div i{font-size:9px;letter-spacing:1px;color:#6b76b4;font-style:normal}
#boot .stages > div b{font-size:11px;letter-spacing:1px;color:#cfe6ff;font-weight:700}
#boot .stages > div em{font-size:9px;letter-spacing:0;color:#7fb6cc;font-style:normal;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boot .stages > div.done b{color:#7fffdc}
#boot .stages > div.bad b,#boot .stages > div.bad em{color:#ff9d6b}
#boot .foot{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;
  color:#8b93cf;border-top:1px solid #232a5c;padding-top:6px}
#boot .foot b{color:#dff0ff}
@media (max-width:1100px){#boot .stages{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="stage">

  <div id="bar">
    <div id="hTitle">轴心脉冲 AXELPULSE<small>俯视环道漂移竞速 · RING DRIFT</small></div>
    <div id="hState">TITLE_LOBBY</div>
    <div id="hDiff">标准</div>
    <div id="hDepth">
      <span>速度 <b id="dSpeed">0</b> km/h</span>
      <span>圈次 <b id="dLap">0 / 10</b></span>
      <span>波次 <b id="dWave">0 / 10</b></span>
      <span>轴心 <b id="dLife">30</b></span>
    </div>
  </div>

  <div id="main">
    <div id="left">
      <div class="pane"><span class="tag">A · 主视窗 环道剖面</span><canvas id="world" width="546" height="546"></canvas></div>
      <div class="pane"><span class="tag">C · 环境雷达与远端预警</span><canvas id="radar" width="546" height="86"></canvas></div>
    </div>
    <div id="right">
      <div class="pane"><span class="tag">B · 动态仪表组</span><canvas id="rig" width="690" height="296"></canvas></div>
      <div class="pane"><span class="tag">F · 分带配额沙盘与汇率包络</span><canvas id="quota" width="690" height="76"></canvas></div>
      <div class="pane"><span class="tag">D · 环形计量</span><canvas id="rings" width="690" height="134"></canvas></div>
      <div class="pane"><span class="tag">E · 收益倍率账本与守恒科目</span><canvas id="ledger" width="690" height="108"></canvas></div>
    </div>
  </div>

  <div id="boot">
    <h1>轴心脉冲 · 引导自检序列</h1>
    <div class="sub" id="bootSub">AXELPULSE BOOT SEQUENCE · 十四段确定性引导</div>
    <div class="stages" id="bootStages"></div>
    <div class="foot"><span id="bootFootL"></span><span id="bootFootR"></span></div>
  </div>

  <div id="ov"></div>
  <div id="card"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   轴心脉冲 AXELPULSE · 俯视环道漂移竞速 —— 平衡数据与静态标定表
   本文件只放常数、表与几何蓝图；一切随时间演化的量都在 app.js 内解算。
   ══════════════════════════════════════════════════════════════════════ */

/* 环道是一条极坐标闭合曲线 r(θ) = R0 + AMP·cos(NC·θ + PH)。
   弯道数 NC 由难度决定，曲率场因此逐段变化 —— 既不是恒定圆，也不是折线，
   限速必须沿 θ 逐点解算，不能靠「直道/弯道」两张表查。 */
var SEG = 24;                       // 环道浮屿数：整圈切成 24 段可站立浮屿
var R0 = 300.0;                     // 中心线基准半径（世界单位）
var HW = 46.0;                      // 环道半宽（世界单位）
var SC = 0.545;                     // 世界单位 → 主视窗像素
var LAPS = 10;                      // 正赛圈数
var KMH = 0.34;                     // 速度读数换算（世界单位/秒 → km/h）
var M_PER_UNIT = 0.5;               // 世界单位 → 米（仅用于读数）

/* 非欧风场：三层内波模态叠加。切变使相邻半径处的风向局部反号，
   因此「顺风」与「逆风」在环道上交替出现，没有哪一段能一顺到底。 */
var WAVE_MODES = [
  { amp: 26.0, k: 3.0, w: 1.000, ph: 0.00 },   // k 为角向波数
  { amp: 16.0, k: 5.0, w: 1.618, ph: 2.11 },
  { amp:  9.0, k: 8.0, w: 2.414, ph: 4.03 }
];

/* 五层环带（由内向外）：半径窗口 + 摩擦系数 + 透光 + 风剪倍率 + 抽取感应系数。
   浮屿不是均匀的 —— 越靠外圈摩擦越低、风剪越强，走线选择因此有代价；
   而抽取感应系数沿同一方向严格递减：外圈好跑，但同样一抽要烧掉更多配额。
   两组数方向相反，走线选择因此没有免费解。 */
var STRATA = [
  { n: '轴心环', r0: 0.00, r1: 0.20, mu: 1.28, light: 0.42, shear: 0.55, sense: 1.30, tint: '#12283f' },
  { n: '内切线', r0: 0.20, r1: 0.45, mu: 1.06, light: 0.72, shear: 0.82, sense: 1.15, tint: '#0f3450' },
  { n: '中线带', r0: 0.45, r1: 0.70, mu: 0.94, light: 1.00, shear: 1.00, sense: 1.00, tint: '#0d4463' },
  { n: '外切线', r0: 0.70, r1: 0.88, mu: 0.82, light: 0.66, shear: 1.22, sense: 0.88, tint: '#0a3a56' },
  { n: '真空带', r0: 0.88, r1: 1.00, mu: 0.70, light: 0.30, shear: 1.48, sense: 0.78, tint: '#07293d' }
];

/* ── 整数千分位守恒底账 ────────────────────────────────────────
   五个科目：屿壳总和（逐段浮屿的剩余寿命）+ 牵引储备 + 蓄能存量 +
   竞速功 + 熵损。任何一次资源变动都必须是「整数科目之间的对转」，
   因此五科目之和恒等于 BUDGET_M，差额 gap 必须恒为 0。
   一旦出现任何一处用浮点直接加减，这个恒等式当场破掉。 */
var LEDGER = {
  BUDGET_M: 200000,      // 五科目总额（千分位），恒定不变
  PLATE_M: 2800,         // 单段浮屿满寿命对应的千分位
  TRACTION_K: 1000,      // 牵引储备：1 单位气量 = 1000 千分位
  EX_FRAC: 0.42,         // 单次抽取可拿走该段剩余屿壳的比例
  EX_MIN: 180,           // 单次抽取下限（千分位）
  EX_MAX: 900,           // 单次抽取上限（千分位）
  EX_FEE: 0.060,         // 抽取税：抽出来的物质有一部分直接沉进熵损
  CONV_FEE: 0.055,       // 兑换手续费
  EXCH_UNIT: 6000,       // 兑换的最小步长（千分位）
  EXCH_CD: 26,           // 兑换冷却（帧）
  CONV_MIN: 2000,        // 兑换起兑额
  QUOTA_ADD: 9000,       // 一次配额置换放回的配额上限
  QUOTA_COST: 3400,      // 一次配额置换烧掉的竞速功
  CHARGE_FULL_M: 22000,  // 蓄能存量满值
  CHARGE_SAFE_M: 17000,  // 蓄能安全线，越过后进入过载预警带
  CHARGE_RATE_M: 12000,  // 蓄能速率（每秒折进来的牵引储备）
  CAT_EFF: 0.74,         // 蓄能转竞速功的转化率，其余沉入熵损
  VOID_REGROW: 1200,     // 虚空重组一段浮屿所需从熵损里取回的千分位
  REBOUND_M: 240         // 一次撞击从屿壳刮走、转记到熵损的千分位
};

/* 分带抽取配额：五带各有自己的余量，抽取按带号感应系数计价。
   配额只出不进 —— 唯一的回补手段是「烧竞速功置换」，因此刷分与开线
   是同一笔预算的两面，任何一边过度都会把另一边锁死。 */
var QUOTA_TOTAL_M = 72000;
var QUOTA_STEP_M = Math.round(QUOTA_TOTAL_M / STRATA.length);

/* 分带汇率包络：兑换率的上限随带号严格递增，再叠加相位往复摆动，
   风廊里被压低、爆发里被抬高，最后钳在上下限之间 —— 因此「什么时候
   在哪个带兑换」是一件要读仪表才能做对的事，不是一句常量。 */
var EX_RATE_LO = 600, EX_RATE_HI = 1000;
/* 动力学与结构常数。凡「每秒」口径的量显式以 _S 结尾。 */
var PHYS = {
  /* 推进与阻力。阻力是速度平方项 + 线性项，因此极速不是一句 clamp 出来的，
     而是两条曲线相交解出来的 —— 风剪改变阻力系数，极速随之逐段漂移。 */
  THROTTLE: 430.0,      // 油门切向加速度
  BRAKE: 560.0,         // 刹车切向减速度
  DRAG2: 0.00062,       // 平方阻力系数
  DRAG1: 0.42,          // 线性阻力系数
  TAIL_DRAG: 1.40,      // 顺风时阻力非线性放大系数
  LIFT_K: 168.0,        // 逆风迎角产生的垂向升力系数
  VMAX: 820.0,          // 速度硬上限（世界单位/秒）

  /* 侧向是三量拔河：驾驶员意图的侧速 uTarget、抓地把它拉过去的速率、
     以及离心外推。三者必须同量级，否则要么一打舵就贴墙，要么转向形同虚设。 */
  UMAX: 200.0,          // 满舵对应的侧向速度上限
  U_REF: 260.0,         // 舵效随速度爬升的参考速度
  GRIP: 5.20,           // 抓地回复速率（把侧速拉向意图）
  DRIFT_GRIP: 2.05,     // 手刹漂移时的抓地回复速率
  CURVE_K: 0.030,       // 离心侧速 = CURVE_K · κ · v²（κ 带符号，凹段朝轴心甩）
  SLIP_MAX: 0.735,      // 滑移角硬上限（弧度，≈42°）
  SLIP_SOFT: 0.559,     // 滑移角过坡阈值（≈32°），越过后蓄能效率折损
  SLIP_LOW: 0.314,      // 滑移角低效阈值（≈18°）
  SLIP_SOFT_K: 0.60,    // 过坡区间效率折算
  SLIP_LOW_K: 0.40,     // 低效区间效率折算
  WALL_BOUNCE: 0.36,    // 撞外侧护墙的速度保留率
  WALL_FATIGUE: 4.2,    // 撞墙一次的结构疲劳增量
  WALL_BREAK: 480.0,    // 撞墙速度门：越过即触发因果回溯而非擦墙
  SHOCK_R_BASE: 96.0,   // 速坠冲击波基准半径
  SHOCK_DMG: 40.0,      // 速坠冲击波基准伤害
  ARMOR_BREAK_V: 430.0, // 击穿重装拦截所需的最小下坠速度

  GRAV: 980.0,          // 垂向重力（世界单位/秒²）
  HOP_V: 296.0,         // 跃迁初速（世界单位/秒）
  HOP_JUMPS: 2,         // 跃迁次数上限

  ATTUNE_MS: 350.0,     // 接触同调所要求的低速持续时间
  ATTUNE_EPS: 0.05,     // 「静止」的速度阈值（世界单位/秒）
  ATTUNE_R_CHARGE: 46.0,// 同调充盈速率（每秒）
  CORE_ZONE: 0.20,      // 浮屿锚定核心区占比（±10% 弧长）
  EDGE_DRAIN: 0.05,     // 停在浮屿边缘：稳定性储备每秒流失 5%

  DECAY_LOAD: 0.052,    // 浮屿承重下沉时的寿命衰减（每秒）
  DECAY_REST: 0.010,    // 浮屿无负载时的自然寿命衰减（每秒）
  REGROW_RATE: 0.34,    // 重组速率（每秒恢复的寿命比）
  SINK_BASE: 1.2,       // 下沉冲量基准
  SINK_DIV: 200.0,      // 下沉冲量的落地速度平方除数
  SINK_SPRING: 5.6,     // 回弹弹簧刚度
  SINK_DAMP: 2.4,       // 回弹阻尼
  REBOUND_K: 0.68,      // 离台瞬间的反方向弹起系数
  FUSE_MS: 500.0,       // 离台后引信时长，逾期碎裂为虚空
  VOID_MS: 900.0,       // 碎裂后的虚空持续时长，期满自行重组

  POL_MS: 300.0,        // 相位翻转的视差倾角扰动时长
  POL_TILT: 0.148,      // 视差倾角最大弧度
  POL_COST_M: 15000,    // 每次相位翻转的固定气耗（千分位）
  POL_IMMUNE_MS: 700.0, // 相位翻转后的相位免疫时长
  PHASE_REARM: 4.0,     // 相位体穿身之后的再装填时长（期间不再造成撞击）
  MERCY_S: 1.0,         // 因果回溯后的重组保护时长（期间免于一切撞击）

  CAT_K: 6.20,          // 张力蓄能弹射：冲量 = CAT_K ·（蓄能存量/1000）^1.6
  CAT_EXP: 1.6,         // 弹射的非线性指数（超线性）
  OVER_MS: 1800.0,      // 过载熔断的硬直与放空窗口时长
  OVER_FATIGUE: 6.5,    // 熔断一次的结构疲劳
  OVER_PENALTY: 80.0,   // 熔断一次的固定扣分（与倍率无关，账本里以负号记一条）

  TETHER_RANGE: 104.0,  // 能量索可抓取半径

      var anchor = BOARD_HINT.anchorPlates.indexOf(i) >= 0;
      /* 寿命初值带种子扰动：同一档难度下每局的衰减顺序都不同。
         千分位取整之后再回算 life —— 屿壳是守恒科目之一，不允许出现小数克。 */
      var l0 = 0.72 + rnd() * 0.28;
      var m0 = Math.round(l0 * LEDGER.PLATE_M);
      out.push({
        i: i, lifeM: m0, life: m0 / LEDGER.PLATE_M, alive: true, fuse: -1, voidT: 0,
        sink: 0, sinkV: 0, sink0: 0,
        impact: 0, anchor: anchor, load: false, everLoad: false, decay: 0
      });
    }
    return out;
  }

  /* 牵引储备是对外读数（氮气 / 气量），内部一律以千分位整数记账；
     对外那一份只是把科目余额除以换算率再读出来，不参与任何加减。 */
  function syncGas() { G.gas = G.tractionM / LEDGER.TRACTION_K; }

  /* 分带配额：逐项带种子偏移，但偏移量必须整体归零 ——
     否则五带配额之和不再等于 QUOTA_TOTAL_M，排程自检会当场把它抓出来。 */
  function genQuota() {
    var rnd = mulberry(G.seed ^ 0x1f3d5b79), off = [], sum = 0, i, o;
    for (i = 0; i < STRATA.length; i++) {
      o = Math.round((rnd() * 2 - 1) * QUOTA_STEP_M * 0.12);
      off.push(o); sum += o;
    }
    off[STRATA.length - 1] -= sum;
    var out = [];
    for (i = 0; i < STRATA.length; i++) out.push(QUOTA_STEP_M + off[i]);
    return out;
  }

  /* 涌潮排程：放行帧号按固定间隔严格递增；强度三档轮转覆盖 1..3；
     目标带由一次置换遍历五带，其后逐波平移。两次预排必须逐字一致。 */
  function genWaves() {
    var perm = [0, 1, 2, 3, 4], rnd = mulberry(G.seed ^ 0x2c9a1137), i, j, t;
    for (i = perm.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1)); t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    var out = [];
    for (i = 0; i < WAVES.length; i++) {
      var w = WAVES[i];
      var bi = (perm[i % perm.length] + Math.floor(i / perm.length)) % perm.length;
      out.push({ i: i, s: w.s, hp: w.hp, spd: w.spd, f: WAVE_FRAME * (i + 1),
                 band: bi, n: w.list.reduce(function (a, e) { return a + e[1]; }, 0) });
    }
    return out;
  }

  function resetRun() {
    G.plates = newPlates();
    G.drones = []; G.fx = []; G.logs = []; G.ledger = []; G.marks = []; G.frags = [];
    G.t = 0; G.f = 0; G.revealed = 0; G.lap = 0; G.totalTh = 0; G.lapT = 0;
    G.lapTimes = []; G.bestLap = 0; G.wave = 0; G.waveState = 'idle'; G.waveT = 0;
    G.kills = 0; G.salvage = 0; G.salvageM = 0;
    G.stab = 100; G.fatigue = 0; G.strain = 0; G.strainPeak = 0; G.idleTime = 0;
    G.combo = 0; G.bestCombo = 0; G.yieldMul = 1; G.comboHold = 0;
    G.coreN = 0; G.landN = 0; G.edgeTime = 0;
    G.plungeCount = 0; G.plungeBest = 0; G.polCount = 0; G.catCount = 0;
    G.tgCount = 0; G.overCount = 0; G.hitCount = 0; G.wallCount = 0;
    G.exCount = 0; G.exRefused = 0; G.fragBreak = 0; G.fragClaim = 0; G.galeCount = 0;
    G.convIn = 0; G.convOut = 0; G.quotaSwap = 0; G.quotaBlock = 0;
    G.score = 0; G.rank = 3; G.rankBest = 3; G.overtakes = 0;
    G.settled = false; G.result = ''; G.overT = 0; G.rollT = -1; G.rollReason = '';
    G.runtime = 0; G.cleanRun = 0; G.boostT = 0; G.boostN = 0; G.shockN = 0;
    G.speedPeak = 0; G.slipPeak = 0; G.gasSpent = 0; G.fatiguePeak = 0;
    G.rateGas = 0; G.rateStab = 0; G.rateFat = 0; G.rateStrain = 0;
    G.mercy = 0; G.rollV = 0; G.domeCd = 0; G.exchCd = 0;
    G.wavePtr = 0; G.rollN = 0; G.ventM = 0; G.galeCool = 0;
    G.galeT = 0; G.galeDir = 0; G.launchLock = 0; G.quotaDead = false;
    G.quotaRefill = 0; G.exRate = EX_RATE_HI;
    G.hazRnd = mulberry(G.seed ^ 0x5bf03635);
    var d = DIFFS[G.diff];
    G.lifeMax = d.life; G.life = d.life; G.gasMax = d.gas;
    G.mer = d.mer; G.espd = d.espd; G.drain = d.drain;
    G.nc = d.nc; G.amp = AMPK / G.nc;
    var rnd = mulberry(G.seed);
    G.ph = rnd() * Math.PI * 2;
    /* ── 五科目底账 ──
       屿壳总和先由浮屿逐段展开，牵引储备按本档难度给的氮气储量折成千分位落账，
       余量全部沉进熵损；蓄能存量与竞速功从 0 起步。此后任何一次资源变动
       都只能是这五个科目之间的对转，五者之和恒等于 BUDGET_M。 */
    var shellM = 0, pi;
    for (pi = 0; pi < G.plates.length; pi++) shellM += G.plates[pi].lifeM;
    G.chargeM = 0; G.foldM = 0;
    G.tractionM = Math.round(G.gasMax * LEDGER.TRACTION_K);
    G.entropyM = LEDGER.BUDGET_M - shellM - G.tractionM;
    syncGas();
    /* ── 分带配额与涌潮排程：都由同一个种子确定性展开 ── */
    G.quota = genQuota();
    G.quotaCap = G.quota.slice();   // 每圈上限：抽取只减不增，跑满一圈才回补
    G.quotaPlan = genWaves();
    P.th = 0; P.d = 0; P.v = 0; P.u = 0; P.slip = 0; P.alt = 0; P.vz = 0;
    P.hop = PHYS.HOP_JUMPS; P.onPlate = -1; P.onGround = false; P.attuneT = 0; P.attune = 0;
    P.attuned = false; P.charge = 0; P.charging = false; P.vent = 0; P.polT = 0; P.polImm = 0;
    P.tether = null; P.tgA = 0; P.tgW = 0; P.steer = 0; P.cool = 0; P.coreMiss = 0;
    P.hitFlash = 0; P.sinkV = 0; P.pulseCool = 0; P._lastCombo = 0;
    P.plunge = false; P.plungeT = 0; P.align = 1;
    /* 输入闩锁也必须清干净。K 是「按住即真」的键位表，上一局结束时按住的键
       会原样带进新一局 —— 重开后再跑同一条输入序列就得到不同结果，
       「同种子同输入 → 同结果」的可复现性直接失效。 */
    for (var kk in K) K[kk] = false;
    syncPos();
    /* 账本的第一条：本局的环道是按这个固定种子逐段解出来的。显影态本身也是
       本局已经发生的事实，不该在账上留一段空白 —— 审计链必须从第 0 帧接上。 */
    ev('种子', 0, '环道 ' + SEG + ' 段逐段解算 · 锚定浮屿 ' +
      BOARD_HINT.anchorPlates.length + ' 段 · 种子 ' + G.seed);
  }

  function syncPos() {
    P.r = rad(P.th) + P.d;
    P.x = P.r * Math.cos(P.th);
    P.y = P.r * Math.sin(P.th);
    P.head = tangent(P.th);
  }

  /* ══════════════ 3. 事件溯源账本 ══════════════ */
  function ev(type, amt, note) {
    var e = { f: G.f, t: G.t, type: type, amt: amt, note: note };
    G.ledger.push(e);
    G.logs.push('[' + G.f + '] ' + type + ' ' + (amt >= 0 ? '+' : '') + f1(amt) + ' ' + note);
    if (G.logs.length > 400) G.logs.shift();
    if (G.ledger.length > 4000) G.ledger.shift();
    return e;
  }
  function score(note, amt) {
    var gain = amt * G.yieldMul;
    G.score += gain;
    ev('入账', gain, note + ' ×' + f2(G.yieldMul));
    return gain;
  }
  function bumpCombo(note) {
    G.combo++; G.comboHold = 3.2;
    if (G.combo > G.bestCombo) G.bestCombo = G.combo;
    G.yieldMul = 1 + Math.min(2.4, Math.max(0, G.combo - 1) * 0.13);
    if (G.combo > 1) ev('连击', G.combo, note + ' · 第 ' + G.combo + ' 段');
  }

  /* ══════════════ 3b. 整数千分位守恒底账 ══════════════
     五个科目：屿壳总和（逐段浮屿）/ 牵引储备 / 蓄能存量 / 竞速功 / 熵损。
     任何一次资源变动都只能是这五者之间的整数对转，因此五者之和恒等于
     BUDGET_M，差额 gap 恒为 0。这是本题最硬的一条结构自洽约束：
     只要有一处资源用浮点直接加减、或者哪一笔进出忘了配平，gap 立刻非零。 */
  /* 屿壳科目 = 还长在浮屿上的 + 已经被抛出去、还漂在空域里的崩落体。
     崩落体不是装饰：它们携带着真实物量，被脉冲瓦解就转回牵引储备、
     撞上或被逾期解体才沉进熵损。若把它们排除在科目之外，守恒式会在
     第一次浮屿碎裂时就当场漂移。 */
  function shellSumM() {
    var s = 0, i;
    for (i = 0; i < G.plates.length; i++) s += G.plates[i].lifeM;
    for (i = 0; i < G.frags.length; i++) s += G.frags[i].m;
    return s;
  }
  function acct(k) {
    return k === 'traction' ? G.tractionM : k === 'charge' ? G.chargeM
         : k === 'fold' ? G.foldM : k === 'entropy' ? G.entropyM : 0;
  }
  function setAcct(k, v) {
    if (k === 'traction') G.tractionM = v;
    else if (k === 'charge') G.chargeM = v;
    else if (k === 'fold') G.foldM = v;
    else if (k === 'entropy') G.entropyM = v;
  }
  function budget() {
    var sh = shellSumM();
    var sum = sh + G.tractionM + G.chargeM + G.foldM + G.entropyM;
    return {
      shell: sh, traction: G.tractionM, charge: G.chargeM, fold: G.foldM,
      entropy: G.entropyM, sum: sum, budget: LEDGER.BUDGET_M,
      gap: sum - LEDGER.BUDGET_M
    };
  }
  /* 科目对转：整数量、单向、绝不产生小数。cap 给出目标科目的容纳上限，
     装不下的那一部分转而沉进熵损（而不是凭空蒸发）—— 否则「储罐满了」
     这一步会把守恒式当场打穿。返回实际从来源拿走的量。 */
  function xfer(from, to, amt, cap) {
    amt = Math.round(amt);
    if (!(amt > 0) || from === to) return 0;
    var take = Math.min(amt, Math.max(0, acct(from)));
    if (take <= 0) return 0;
    setAcct(from, acct(from) - take);
    var put = take;
    if (cap !== undefined) put = Math.min(take, Math.max(0, cap - acct(to)));
    setAcct(to, acct(to) + put);
    if (put < take) G.entropyM += (take - put);
    syncGas();
    return take;
  }
  /* 屿壳是两个方向都要夹的科目：拿不能拿成负数，还也不能还过满寿命。 */
  function plateTake(pl, amt) {
    var take = Math.min(Math.max(0, Math.round(amt)), Math.max(0, pl.lifeM));
    pl.lifeM -= take; pl.life = pl.lifeM / LEDGER.PLATE_M;
    return take;
  }
  function plateGive(pl, amt) {
    var room = Math.max(0, LEDGER.PLATE_M - pl.lifeM);
    var put = Math.min(Math.max(0, Math.round(amt)), room);
    put = Math.min(put, Math.max(0, G.entropyM));
    if (put <= 0) return 0;
    G.entropyM -= put; pl.lifeM += put; pl.life = pl.lifeM / LEDGER.PLATE_M;
    return put;
  }

  /* ══════════════ 3c. 分带汇率包络与三笔经济操作 ══════════════
     汇率上限随带号严格递增，再叠加相位往复摆动，风廊里被压低、爆发里被抬高，
     最后钳在上下限之间 —— 「什么时候在哪个带兑换」因此要读仪表才做得对。 */
  function exRate(bi) {
    var cap = 880 + bi * 24;
    var osc = 0.5 + 0.5 * Math.sin(G.t * 0.6 + bi * 1.7 + G.ph);
    var v = cap * (0.86 + 0.22 * osc);
    if (G.galeT > 0) v *= 0.90;
    if (G.boostT > 0) v *= 1.08;
    return clamp(Math.round(v), EX_RATE_LO, EX_RATE_HI);
  }
  function quotaCost(bi, take) { return Math.round(take * STRATA[bi].sense); }
  function quotaDead() {
    var bi = strataAt(P.d);
    return G.quota[bi] <= 0;
  }

  /* 分带抽取：驻台同调满窗口时，把脚下这段浮屿的屿壳折进牵引储备科目。
     两道闸门缺一不可 —— 少了配额闸门，这道题就退化成「站着不动就变强」；
     少了守恒闸门，五科目之和会当场漂移，守恒自检立刻失败。
     闸门顺序也有讲究：先查配额（不许抽），再查守恒（抽不动），
     拒绝的理由写在事件账上，探针据此逐条复核是哪一道门拦下的。 */
  function extract(pl, bi, wantM) {
    if (G.quota[bi] <= 0) {
      G.quotaBlock++;
      ev('配额', 0, STRATA[bi].n + ' 配额枯竭 · 抽取被拒');
      return 0;
    }
    var cost = quotaCost(bi, wantM);
    if (cost > G.quota[bi]) {                  // 余量不足就按余量缩，不整单拒绝
      wantM = Math.round(wantM * G.quota[bi] / cost);
      cost = quotaCost(bi, wantM);
    }
    var take = plateTake(pl, wantM);
    if (take <= 0) { ev('抽取', 0, '屿壳枯竭 · 抽不出物量'); return 0; }
    if (cost > G.quota[bi]) cost = G.quota[bi];
    G.quota[bi] -= cost;
    /* 抽取不是无损的：按 EX_FEE 抽一笔手续费沉进熵损，其余进牵引储备。
       储备槽满了就把溢出的部分也沉进熵损 —— 溢出的物量不会凭空消失。 */
    var fee = Math.round(take * LEDGER.EX_FEE);
    var net = take - fee;
    var cap = Math.round(G.gasMax * LEDGER.TRACTION_K);
    var put = Math.max(0, Math.min(net, cap - G.tractionM));
    G.tractionM += put;
    G.entropyM += (take - put);
    syncGas();
    G.exCount++;
    ev('抽取', put, STRATA[bi].n + ' 屿壳 ' + take + ' → 牵引 ' + put +
       ' · 税 ' + fee + ' · 余配额 ' + G.quota[bi]);
    return put;
  }

  /* ══════════════ 4. 输入 ══════════════ */
  var K = {};
  var KEYS = {
    KeyW: 'up', ArrowUp: 'up', KeyS: 'dn', ArrowDown: 'dn',
    KeyA: 'lf', ArrowLeft: 'lf', KeyD: 'rt', ArrowRight: 'rt',
    Space: 'hand', KeyJ: 'hop', KeyK: 'cat', KeyL: 'pol', KeyU: 'tg', KeyI: 'pulse',
    KeyH: 'plunge', KeyG: 'exin', KeyY: 'exout', KeyB: 'qswap'
  };
  function act(a) { return !!K[a]; }

  /* ══════════════ 5. 手势：蓄能弹射 / 相位翻转 / 能量索 / 脉冲 ══════════════ */
  function doHop() {
    /* 接触同调时延（核心地雷）：落地把跃迁余量直接清零，绝不重置。
       余量唯一来源是「驻留同调满窗口」——所以落地后 350 ms 内发这条命令必然失败。 */
    if (P.hop <= 0) { ev('跃迁', 0, '余量不足 · 需驻留同调回充'); return false; }
    if (P.alt <= 0.5) { P.vz = PHYS.HOP_V * (G.diff === 'hard' ? 1.04 : 1.0); P.alt = 0.6; }
    else { P.vz = PHYS.HOP_V * 0.86; }          // 二段跳：余量够就能再补一次
    P.hop--;
    ev('跃迁', 0, (P.alt <= 0.6 ? '起跳' : '二段跳') + ' · 余量 ' + P.hop);
    return true;
  }
  function doPolarity() {
    if (P.polT > 0) return false;
    if (G.tractionM < PHYS.POL_COST_M) { ev('相位', 0, '牵引储备不足'); return false; }
    /* 花掉的牵引储备不是消失，而是沉进熵损科目 —— 守恒式两侧同时记账 */
    xfer('traction', 'entropy', PHYS.POL_COST_M);
    G.gasSpent += PHYS.POL_COST_M / LEDGER.TRACTION_K;
    P.polT = PHYS.POL_MS / 1000; P.polImm = PHYS.POL_IMMUNE_MS / 1000;
    G.polCount++;
    score('空间相位翻转 · 免疫相位体', 12);
    return true;
  }
  function tryTether() {
    if (P.tether) {
      /* 脱离角自选：切向速度越过下限才回补牵引储备，否则只是空放。
         回补是从熵损科目里「取回」，不是凭空生成 —— 所以摆荡回补与
         浮屿重组抢的是同一笔余量，荡得太狠会让可站立面长不回来。 */
      var sp = Math.abs(P.tgW) * PHYS.TETHER_L;
      P.tether = null;
      if (sp >= PHYS.TETHER_SWING_MIN * 220) {
        var want = Math.round(PHYS.TETHER_GAIN_M * clamp(sp / 400, 0.4, 1.6));
        var cap = Math.round(G.gasMax * LEDGER.TRACTION_K);
        var got = Math.max(0, Math.min(want, G.entropyM, cap - G.tractionM));
        G.entropyM -= got; G.tractionM += got; syncGas();
        G.tgCount++;
        ev('能量索', got, '摆荡释放 · 切向 ' + f0(sp) + ' · 取回牵引 ' + got);
        score('能量索摆荡释放', 16);
        bumpCombo('能量索');
      } else {
        ev('能量索', 0, '切向速度不足 ' + f0(sp) + ' < 下限');
      }
      return true;
    }
    var best = null, bd = 1e9;
    for (var i = 0; i < BOARD_HINT.pylons.length; i++) {
      var py = BOARD_HINT.pylons[i];
      var th = (py[0] + py[1] / 13) * SEG_A;
      var dd = Math.abs(th - P.th);
      dd = Math.min(dd, Math.PI * 2 - dd);
      var dist = dd * rad(P.th);
      if (dist < PHYS.TETHER_RANGE && dist < bd) { bd = dist; best = { th: th, r: rad(th) }; }
    }
    if (!best) { ev('能量索', 0, '范围内无锚塔'); return false; }
    P.tether = best; P.tgA = Math.atan2(P.y - best.r * Math.sin(best.th), P.x - best.r * Math.cos(best.th));
    P.tgW = clamp(P.v / PHYS.TETHER_L * 0.5, -3, 3);
    ev('能量索', 0, '锁定锚塔 · 摆荡中');
    return true;
  }
  function doPulse() {
    if (P.pulseCool > 0) return false;
    if (!P.attuned) { ev('同调脉冲', 0, '未完成同调 · 拒绝释放'); return false; }
    if (G.tractionM < PHYS.PULSE_COST_M) { ev('同调脉冲', 0, '牵引储备不足'); return false; }
    xfer('traction', 'entropy', PHYS.PULSE_COST_M);
    G.gasSpent += PHYS.PULSE_COST_M / LEDGER.TRACTION_K;
    P.pulseCool = PHYS.PULSE_COOL;
    var n = 0, fr = 0, i;
    for (i = G.drones.length - 1; i >= 0; i--) {
      var h = G.drones[i];
      if (Math.hypot(h.x - P.x, h.y - P.y) <= PHYS.PULSE_R) {
        h.hp -= PHYS.PULSE_DMG; n++;
        if (h.hp <= 0) { G.drones.splice(i, 1); G.kills++; }
      }
    }
    /* 脉冲同时瓦解空域里的崩落体：这是把「碎裂的浮屿」从威胁变回物量的唯一手段 */
    for (i = G.frags.length - 1; i >= 0; i--) {
      if (Math.hypot(G.frags[i].x - P.x, G.frags[i].y - P.y) <= PHYS.PULSE_FRAG_R) {
        shatterFrag(i, true); fr++;
      }
    }
    G.shockN++;
    burst(P.x, P.y, '#7fffdc', 34);
    score('浮屿共振同调脉冲 · 瓦解崩落体 ' + fr, 20 + n * 4 + fr * 3);
    if (n || fr) bumpCombo('脉冲清场');
    return true;
  }

  /* 动量下压速坠冲击：在空中按住下压键，额外叠一笔下向加速度并持续抽走牵引储备；
     触地那一刻按落速生成冲击波 —— 只有落速越过门槛才打得穿重装拦截的甲壳。 */
  function doPlunge() {
    if (P.plunge) return false;
    if (P.alt <= 0.5) { ev('速坠', 0, '未离地 · 下压无对象'); return false; }
    if (G.tractionM < PHYS.PLUNGE_COST_M) { ev('速坠', 0, '牵引储备不足'); return false; }
    xfer('traction', 'entropy', PHYS.PLUNGE_COST_M);
    G.gasSpent += PHYS.PLUNGE_COST_M / LEDGER.TRACTION_K;
    P.plunge = true; P.plungeT = 0;
    G.plungeCount++;
    ev('速坠', 0, '动量下压 · 下向加速度叠加');
    return true;
  }

  /* 兑换审计：兑换入把竞速功折回牵引储备，兑换出把牵引储备按分带汇率折成竞速功。
     两条腿都必须按整数配平 —— 手续费与汇率折算的余数一律沉进熵损。 */
  function doExchange(dir) {
    if (G.exchCd > 0) { ev('兑换', 0, '冷却中 ' + G.exchCd + ' 帧'); return false; }
    var bi = strataAt(P.d), rate = exRate(bi);
    G.exRate = rate;
    var amt = LEDGER.EXCH_UNIT, take, fee, got;
    if (dir > 0) {
      if (G.foldM < amt) { ev('兑换入', 0, '竞速功不足 · 余 ' + G.foldM + ' < ' + amt); return false; }
      take = Math.min(amt, G.foldM);
      fee = Math.round(take * LEDGER.CONV_FEE);
      var room = Math.max(0, Math.round(G.gasMax * LEDGER.TRACTION_K) - G.tractionM);
      got = Math.max(0, Math.min(take - fee, room));
      G.foldM -= take; G.tractionM += got; G.entropyM += (take - got);
      G.convIn += got; syncGas(); G.exchCd = LEDGER.EXCH_CD;
      ev('兑换入', got, '竞速功 ' + take + ' → 牵引 ' + got + ' · 税 ' + (take - got) +
         ' · ' + STRATA[bi].n + ' 汇率 ' + rate + '‰');
    } else {
      if (G.tractionM < amt) { ev('兑换出', 0, '牵引储备不足 · 余 ' + G.tractionM + ' < ' + amt); return false; }
      take = Math.min(amt, G.tractionM);
      fee = Math.round(take * LEDGER.CONV_FEE);
      got = Math.round((take - fee) * rate / 1000);
      G.tractionM -= take; G.foldM += got; G.entropyM += (take - got);
      G.convOut += got; syncGas(); G.exchCd = LEDGER.EXCH_CD;
      ev('兑换出', got, '牵引 ' + take + ' → 竞速功 ' + got + ' · ' + STRATA[bi].n +
         ' 汇率 ' + rate + '‰');
    }
    score('兑换审计', 4);
    return true;
  }

  /* 分带配额置换：烧竞速功，把本带「已经用掉的配额」放回一部分。
     它只能把一条被打穿的带救回来，不能凭空造出总量 —— 配额池是只出不进的。 */
  function doQuotaSwap() {
    var bi = strataAt(P.d);
    if (G.foldM < LEDGER.QUOTA_COST) {
      ev('配额置换', 0, '竞速功不足 · 余 ' + G.foldM + ' < ' + LEDGER.QUOTA_COST); return false;
    }
    var used = G.quotaCap[bi] - G.quota[bi];
    if (used <= 0) { ev('配额置换', 0, STRATA[bi].n + ' 尚未动用 · 无需置换'); return false; }
    var put = Math.min(LEDGER.QUOTA_ADD, used);
    G.foldM -= LEDGER.QUOTA_COST; G.entropyM += LEDGER.QUOTA_COST;
    G.quota[bi] += put; G.quotaSwap++; syncGas();
    ev('配额置换', put, STRATA[bi].n + ' 放回 ' + put + ' · 烧竞速功 ' + LEDGER.QUOTA_COST);
    return true;
  }
  function f0(v) { return Math.round(v); }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + G.f * 0.017;
      var s = 40 + (i % 7) * 22;
      G.fx.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + (i % 5) * 0.08, col: col });
    }
    if (G.fx.length > 900) G.fx.splice(0, G.fx.length - 900);
  }

  /* ══════════════ 6. 浮屿：下沉 / 回弹 / 引信 / 虚空 / 重组 ══════════════ */
  function landOn(pl, impact) {
    /* 承重下沉冲量严格按题面公式：v_sink = 1.2 × (1 + v_impact² / 200)。
       impact 原样留存在浮屿上，探针据此逐位复核公式，不必去猜落地速度。 */
    pl.impact = impact;
    pl.sink0 = PHYS.SINK_BASE * (1 + impact * impact / PHYS.SINK_DIV);
    pl.sinkV = pl.sink0;
    pl.decay += 1;
  }
  /* 虚空重组 / 回溯落点兜底共用的一条：把屿壳科目补回来。
     从熵损科目里取回；熵损不够就继续往下取竞速功、再取牵引储备 ——
     因此「路被跑烂」是有代价的（要烧储备去修路），但永远存在解。 */
  function rebuild(pl, need) {
    var order = ['entropy', 'fold', 'traction'], got = 0, i, take;
    for (i = 0; i < order.length && got < need; i++) {
      take = Math.min(need - got, Math.max(0, acct(order[i])));
      take = Math.min(take, Math.max(0, LEDGER.PLATE_M - pl.lifeM));
      if (take <= 0) continue;
      setAcct(order[i], acct(order[i]) - take);
      pl.lifeM += take; got += take;
    }
    pl.life = pl.lifeM / LEDGER.PLATE_M;
    syncGas();
    return got;
  }

  /* 浮屿碎裂把剩余屿壳抛成崩落体。抛射本身有耗散（两成直接沉进熵损），
     其余按份数切开、逐份携带物量 —— 崩落体携带的物量仍算在屿壳科目里，
     所以「回收」是把它们转回牵引储备，「撞上 / 逾期」才是真的沉进熵损。 */
  function spawnFrags(pl) {
    var m = plateTake(pl, pl.lifeM);
    if (m <= 0) return;
    var n = Math.min(PHYS.FRAG_FRAME, Math.max(1, Math.round(m / 240)));
    var loss = Math.round(m * 0.20);
    G.entropyM += loss;
    var rest = m - loss, each = Math.floor(rest / n), i, mm;
    for (i = 0; i < n; i++) {
      mm = (i === n - 1) ? rest - each * (n - 1) : each;
      if (mm <= 0) continue;
      var th = pl.i * SEG_A + SEG_A * (0.12 + 0.76 * G.hazRnd());
      var r0 = rad(th) + (G.hazRnd() * 2 - 1) * HW * 0.82;
      G.frags.push({
        th: th, r: r0, x: r0 * Math.cos(th), y: r0 * Math.sin(th),
        w: (G.hazRnd() * 2 - 1) * 0.55, vr: (G.hazRnd() * 2 - 1) * PHYS.FRAG_SPD,
        m: mm, life: PHYS.FRAG_LIFE * (0.7 + 0.5 * G.hazRnd()), spin: G.hazRnd() * 6
      });
    }
    while (G.frags.length > 72) G.entropyM += G.frags.shift().m;
  }
  function shatterFrag(i, claim) {
    var f = G.frags[i];
    if (!f) return 0;
    G.frags.splice(i, 1);
    if (!claim) { G.entropyM += f.m; return f.m; }
    var cap = Math.round(G.gasMax * LEDGER.TRACTION_K);
    var put = Math.max(0, Math.min(f.m, cap - G.tractionM));
    G.tractionM += put;
    if (put < f.m) G.entropyM += (f.m - put);
    syncGas();
    G.fragClaim += f.m;
    return f.m;
  }
  function stepFrags(dt) {
    for (var i = G.frags.length - 1; i >= 0; i--) {
      var f = G.frags[i];
      f.life -= dt;
      f.th += f.w * dt; f.r += f.vr * dt; f.spin += dt * 2.2;
      var lo = rad(f.th) - HW - 34, hi = rad(f.th) + HW + 34;
      if (f.r < lo) { f.r = lo; f.vr = Math.abs(f.vr); }
      if (f.r > hi) { f.r = hi; f.vr = -Math.abs(f.vr); }
      f.x = f.r * Math.cos(f.th); f.y = f.r * Math.sin(f.th);
      if (f.life <= 0) { G.entropyM += f.m; G.frags.splice(i, 1); continue; }
      if (G.mercy <= 0 && P.alt < 26 && Math.hypot(f.x - P.x, f.y - P.y) < PHYS.FRAG_R + 11) {
        G.entropyM += f.m; G.frags.splice(i, 1);
        G.stab -= PHYS.FRAG_DMG; P.hitFlash = 0.3;
        G.fragBreak++;
        ev('崩落体', -f.m, '撞舱 · 所携物量沉入熵损');
      }
    }
  }

  function stepPlates(dt) {
    var pp = plateOf(P.th), idx = pp[0], f = pp[1];
    /* 「载重」的判据是「当前格位」而不是「脚底离地」：刹车或原地跃迁时格位没变，
       浮屿就不该被抛下，更不该点燃引信 —— 否则低速起跳等于自己把脚下踩塌，
       落地必死，整局卡在回溯循环里。只有真的驶离（格位推进）才引爆尾迹。 */
    for (var i = 0; i < G.plates.length; i++) {
      var pl = G.plates[i];
      /* 引信先走时、后判载重：否则「点燃引信」的那一帧当场就被扣掉一个 dt，
         500 ms 的窗口只剩 483 ms —— 题面写死的时长必须逐帧精确，不能提前引爆。 */
      if (pl.fuse >= 0 && pl.alive) {
        pl.fuse -= dt * 1000;
        if (pl.fuse <= 0) {
          pl.fuse = -1;
          spawnFrags(pl);                       // 碎裂：剩余屿壳抛成崩落体
          pl.alive = false; pl.voidT = PHYS.VOID_MS;
        }
      }
      var loaded = i === idx && pl.alive;
      if (loaded !== pl.load) {
        if (!loaded && pl.load) {
          /* 离台瞬间：反方向弹起，并点燃 500 ms 引信 */
          pl.sinkV = -PHYS.REBOUND_K * pl.sinkV;
          pl.fuse = PHYS.FUSE_MS;
        }
        pl.load = loaded;
        if (loaded) { pl.everLoad = true; pl.fuse = -1; }
      }
      if (loaded) {
        /* 承重衰减：屿壳从浮屿科目转出、沉进熵损科目，整数配平 */
        var dec = Math.round(PHYS.DECAY_LOAD * G.drain * LEDGER.PLATE_M * dt * 60);
        var d2 = plateTake(pl, dec);
        G.entropyM += d2;
        pl.decay += dt;
      } else if (pl.alive) {
        /* 空载重组：从熵损科目里取回屿壳 —— 因此熵损枯竭时，路就长不回来了 */
        var want = Math.round(PHYS.REGROW_RATE * LEDGER.PLATE_M * dt * 60);
        var back = Math.min(want, Math.max(0, G.entropyM),
                            Math.max(0, LEDGER.PLATE_M - pl.lifeM));
        if (back > 0) { G.entropyM -= back; pl.lifeM += back; pl.life = pl.lifeM / LEDGER.PLATE_M; }
      }
      /* 回弹：弹簧 - 阻尼 */
      var a = -PHYS.SINK_SPRING * pl.sink - PHYS.SINK_DAMP * pl.sinkV;
      pl.sinkV += a * dt;
      pl.sink += pl.sinkV * dt * 0.03;
      pl.sink *= 0.999;
      if (!pl.alive) {
        pl.voidT -= dt * 1000;
        if (pl.voidT <= 0) {
          pl.voidT = 0;
          /* 虚空重组同样要走守恒：熵损不够就往下取竞速功、牵引储备 */
          if (rebuild(pl, LEDGER.VOID_REGROW) > 0) pl.alive = true;
          else pl.voidT = 320;                  // 一分物量都拿不出来，就再等一轮
        }
      }
    }
  }

  /* ══════════════ 7. 涌潮波次（排程驱动） ══════════════ */
  /* 波次不再由「清空 + 冷却」驱动，而是由引导阶段就已写死的「放行帧号」排程驱动：
     哪一波在第几帧压上、压在哪一层环带、强度几档，全是种子派生出来的定值，
     清不清场都不改变放行时刻 —— 于是「先清哪一波」从无脑连打变成一道有代价的
     选择题：同时压着两波，还是先撤去抽配额、把残波留在场上吃轴心侵蚀。 */
  function spawnWavePlan(wp) {
    var w = WAVES[clamp(wp.i + 1, 1, WAVES.length) - 1];
    for (var i = 0; i < w.list.length; i++) {
      var kind = w.list[i][0], cnt = w.list[i][1];
      for (var j = 0; j < cnt; j++) spawnDrone(kind, wp);
    }
    G.wave = wp.i + 1; G.waveState = 'fighting'; G.waveT = 0;
    ev('波次', wp.i + 1, '第 ' + w.n + ' 波压上 · ' + STRATA[wp.band].n +
       ' · 强度 ' + wp.s + ' · ' + G.drones.length + ' 架');
  }
  function spawnDrone(kind, wp) {
    if (G.drones.length >= PHYS.HAZ_CAP) return;   // 同屏规模硬顶，防止帧率被拖垮
    var H = HAZ[kind];
    /* 投放位置走「种子化伪随机流」而不是 Math.random：
       整局的因果必须可复现，同种子同输入序列必须逐位同结果，
       用系统熵源会让每一次运行的波次落点都不同，状态因果链就断了。 */
    var th = (0.25 + G.hazRnd() * 0.5) * Math.PI * 2;
    /* 落点由排程给定的「目标环带」决定：内带摩擦大、机动余地小，外带风剪狠、
       立足点薄 —— 同一波压在不同带上，玩家要付的代价完全不同。 */
    var band = wp ? wp.band : Math.floor(G.hazRnd() * STRATA.length);
    var frac = STRATA[band].r0 + (STRATA[band].r1 - STRATA[band].r0) * (0.15 + 0.7 * G.hazRnd());
    var r = rad(th) + (frac * 2 - 1) * HW;
    var hpm = wp ? wp.hp : 1, spm = wp ? wp.spd : 1;
    G.drones.push({
      kind: kind, n: H.n, hp: H.hp * hpm, hpMax: H.hp * hpm, band: band,
      x: r * Math.cos(th), y: r * Math.sin(th), th: th, r: r,
      spd: H.spd * G.espd * spm, dmg: H.dmg, rad: H.r,
      col: H.col, armor: !!H.armor, ethereal: !!H.ethereal, boss: !!H.boss,
      hitT: 0
    });
  }
  function stepDrones(dt) {
    for (var i = G.drones.length - 1; i >= 0; i--) {
      var h = G.drones[i];
      h.hitT = Math.max(0, h.hitT - dt);
      /* 趋近：玩家的位置决定威胁朝哪聚集（HOMING_R 之外只是巡弋） */
      var dth = P.th - h.th;
      while (dth > Math.PI) dth -= Math.PI * 2;
      while (dth < -Math.PI) dth += Math.PI * 2;
      var dist = Math.abs(dth) * h.r;
      var homing = dist < PHYS.HOMING_R;
      var w = homing ? 1.0 : 0.30;
      h.th += sign(dth) * (h.spd * w / h.r) * dt;
      var dr = (P.r - h.r);
      if (homing) h.r += clamp(dr, -1, 1) * h.spd * 0.32 * dt;
      h.r = clamp(h.r, rad(h.th) - HW - 30, rad(h.th) + HW + 30);
      h.x = h.r * Math.cos(h.th); h.y = h.r * Math.sin(h.th);
      /* 碰撞判定。三重闸门，缺任何一条都会退化成「停在原地被无限连撞」的死循环：
         ① 回溯后的重组保护（G.mercy）—— 刚被拉回因果的这段时间不再吃撞击；
         ② 单体再装填（h.hitT）—— 相位体不可击杀，撞完必须飞过去重新进入；
         ③ 相位免疫（P.polImm）—— 主动翻转相位换来的豁免。 */
      var dd = Math.hypot(h.x - P.x, h.y - P.y);
      if (G.mercy > 0 || h.hitT > 0 || P.alt >= 26) continue;
      if (dd < h.rad + 11) {
        if (h.ethereal && P.polImm > 0) continue;
        if (h.dmg > 0 || h.ethereal) {
          G.stab -= PHYS.STAB_HIT; P.hitFlash = 0.35; h.hitT = 0.3;
          G.hitCount++;
          G.fatigue += PHYS.FATIGUE_HIT * P.v * P.v;
          /* 承压：撞击按速度平方累积到承压条上 —— 高速硬撞比低速擦碰贵得多 */
          G.strain += PHYS.STRAIN_HIT * P.v * P.v;
          if (h.ethereal) {
            /* 相位体撞不毁，只会穿身而过：把它甩到前方去，并给它一段再装填期，
               否则它会一直贴在停止的车身上，每 1.1 秒的每次回溯都立刻再崩一次。 */
            h.hitT = PHYS.PHASE_REARM;
            h.th += 0.45;
            crash('撞入相位体 · 相位未翻转');
            return;
          } else { G.drones.splice(i, 1); G.kills++; ev('击杀', 0, '撞击 ' + h.n); }
        }
      }
    }
  }

  /* ══════════════ 8. 失败熔断与因果回溯 ══════════════ */
  function crash(reason) {
    if (G.rollT >= 0 || G.settled) return;
    G.rollT = PHYS.ROLLBACK_S;
    G.rollReason = reason;
    /* 回退距离必须按「触发瞬间」的速率算。读条期间 v 被逐帧乘 0.94 衰减到接近零，
       等到退位置时再读 P.v 就只剩百分之一，退回距离不足半个浮屿 ——
       车会被原地放回同一块碎裂虚空上，下一帧再崩，整局卡死在回溯循环里。 */
    G.rollV = Math.abs(P.v);
    G.mercy = PHYS.MERCY_S;   // 重组保护：把「崩→退→再崩」的链条从物理上切断
    /* 回滚代价必须落在守恒账本上：从牵引储备科目里划走固定份额沉进熵损。
       科目余额不足时能划多少划多少 —— 任何科目都不允许出现负余额，
       否则五科目之和会当场漂移，守恒自检立刻失败。 */
    var cost = Math.min(PHYS.ROLLBACK_M, Math.max(0, G.tractionM));
    if (cost > 0) xfer('traction', 'entropy', cost);
    G.combo = 0; G.yieldMul = 1;
    G.cleanRun = 0;
    /* 回溯必须把「触发判据」本身一并拉回安全区，否则疲劳/稳定性仍越限，
       下一帧立刻再次熔断，整局卡在回溯循环里出不来。 */
    if (G.fatigue >= PHYS.FATIGUE_MAX) G.fatigue = 68;
    if (G.stab <= 0) G.stab = 42;
    if (G.strain >= PHYS.STRAIN_CAP) G.strain = PHYS.STRAIN_CAP * 0.62;
    G.rollN++;
    ev('回溯', -cost, reason + ' · 牵引储备 -' + cost);
  }

  /* ══════════════ 9. 主步进 ══════════════ */
  function tick(dt) {
    G.t += dt; G.f++;
    /* 引导自检优先于一切：十四段确定性引导没有逐段通过之前，物理世界一格都不推进。
       每一段都带可证伪的判据，任何一段判据不成立就地停住并把该段标红 ——
       于是「启动流程」不是装饰性的加载动画，而是一道必须逐段通过的验收序列。 */
    if (!G.boot.done) { bootStep(); resolveState(); return; }
    if (G.mercy > 0) G.mercy -= dt;
    if (G.domeCd > 0) G.domeCd--;
    if (G.exchCd > 0) G.exchCd--;
    if (G.galeCool > 0) G.galeCool -= dt;
    if (!G.started) { resolveState(); return; }
    if (G.settled) { resolveState(); return; }
    if (G.revealed < 1) {
      /* 显影：发车后画面从种子底稿逐层显影到实况，显影期间同样不推进物理，
         显影走满才进入起步锁定窗口 —— 放行与出闸是两件事，不能合成一件。 */
      G.revealed = Math.min(1, G.revealed + dt / 1.1);
      if (G.revealed >= 1) G.launchLock = PHYS.LAUNCH_LOCK_MS / 1000;
      resolveState(); return;
    }

    /* 损耗率的基准值必须在「真的推进物理」的这一帧开头取。早退的四态
       （待机 / 显影 / 引导 / 结算）没有物理推进，取基准只会把渲染节奏混进读数 —— */
    var _g0 = G.tractionM, _s0 = G.stab, _f0 = G.fatigue, _r0 = G.strain;

    /* 回溯读条：期间世界时钟倒转，位置与名次同步回退 */
    if (G.rollT >= 0) {
      G.rollT -= dt;
      P.v *= 0.94; P.u *= 0.94;
      if (G.rollT < 0) {
        G.rollT = -1;
        G.totalTh = Math.max(0, G.totalTh - PHYS.ROLLBACK_S * (G.rollV || 0) / Math.max(1, rad(P.th)));
        P.th = G.totalTh % (Math.PI * 2);
        P.d *= 0.4; P.alt = 0; P.vz = 0;
        /* 落点兜底：回溯的语义是「退回到上一处可站立节点」，不是「原样放回原处」。
           退回点若恰好落在已碎裂的浮屿上，就把它就地重组 —— 重组同样要走守恒，
           熵损不够就往下取竞速功、再取牵引储备，因此「路跑烂了」是有账单的，
           但永远存在解 —— 否则崩→退→再崩，形成永不脱出的死循环。 */
        var rpi = plateOf(P.th)[0], rpl = G.plates[rpi];
        if (!rpl.alive) {
          if (rebuild(rpl, LEDGER.VOID_REGROW) > 0) { rpl.alive = true; rpl.voidT = 0; }
        }
        rpl.fuse = -1; rpl.sinkV = 0;
        syncPos();
      }
      resolveState(); return;
    }

    if (P.pulseCool > 0) P.pulseCool -= dt;
    if (P.polT > 0) P.polT -= dt;
    if (P.polImm > 0) P.polImm -= dt;
    if (P.hitFlash > 0) P.hitFlash -= dt;
    G.lapT += dt; G.runtime += dt;

    /* ── 8.1 手势输入 ─────────────────────────── */
    P.steer = (act('lf') ? -1 : 0) + (act('rt') ? 1 : 0);
    P.throttle = act('up') ? 1 : 0;
    P.brake = act('dn') ? 1 : 0;
    P.hand = act('hand');
    /* 起步锁定：出闸窗口内油门、蓄能、跃迁、速坠一律吞掉，只有舵面还听得见。
       锁定期的最后一段读「出闸对准度」（滑移角与横向速度的联合包络），
       对准度不达标就再锁 0.12 s 重读 —— 于是起步不是踩一脚油门就完事。 */
    var locked = G.launchLock > 0;
    if (locked) {
      P.throttle = 0;
      G.launchLock -= dt;
      G.launchAlign = clamp(1 - Math.abs(P.slip) / PHYS.SLIP_MAX -
                            Math.abs(P.u) / PHYS.UMAX, 0, 1);
      if (G.launchLock <= 0 && G.launchAlign < PHYS.LAUNCH_ALIGN) G.launchLock = 0.12;
    }
    if (act('cat') && G.overT <= 0 && !locked) {
      /* 蓄能：牵引储备被整数折进「蓄能存量」科目，1:1 无损耗；越过安全线仍可继续，
         代价是熔断风险。硬直期间操纵面失效，蓄能键也必须一并锁死，
         否则放空窗口会被当场覆盖。 */
      P.charging = true;
      xfer('traction', 'charge', Math.round(LEDGER.CHARGE_RATE_M * dt),
           LEDGER.CHARGE_FULL_M * 3);
      G.gasSpent += LEDGER.CHARGE_RATE_M * dt / LEDGER.TRACTION_K;
      if (G.chargeM >= LEDGER.CHARGE_FULL_M) {
        /* 熔断是「强制放空」而不是「凭空归零」：蓄能量在硬直窗口里可见地泄掉。
           若一帧跳回 0，仪表上就只剩一条空槽，玩家读不到「刚才顶到了什么量级」，
           题面里「越限即释放」这条也就失去了可观察的证据。 */
        P.ventM = G.chargeM; P.vent = PHYS.OVER_MS / 1000; P.charging = false;
        G.overT = PHYS.OVER_MS / 1000; G.overCount++;
        G.fatigue += PHYS.OVER_FATIGUE;
        /* 「强制释放、扣分并进入硬直」三件事都要在账上留痕：扣分按固定值算，
           不随收益倍率放大，否则后期一次误按就能把整局抹平。 */
        var pen = -PHYS.OVER_PENALTY;
        if (G.score + pen < 0) pen = -G.score;
        G.score += pen;
        ev('熔断', pen, '蓄能超频越限 · 强制放空 · 硬直 ' + (PHYS.OVER_MS / 1000) + ' s');
      }
    } else if (P.charging) {
      P.charging = false;
      var cm = G.chargeM;
      if (cm > 0) {
        /* 释放：蓄能存量按转化率折成「竞速功」，损耗的那一部分沉进熵损 ——
           两笔都是科目间对转，整数配平，五科目之和不动。 */
        var conv = Math.round(cm * LEDGER.CAT_EFF);
        var back = cm - conv;
        xfer('charge', 'fold', cm);
        G.foldM -= back; G.entropyM += back;
        var imp = PHYS.CAT_K * Math.pow(cm / 1000, PHYS.CAT_EXP);
        P.v += imp * 0.60; P.vz += imp * 0.10;
        if (cm > LEDGER.CHARGE_SAFE_M) { G.overT = PHYS.OVER_MS / 1000 * 0.5; G.overCount++; }
        G.catCount++;
        score('非线性张力蓄能弹射 · 蓄能 ' + cm, 14 + cm / 600);
        bumpCombo('蓄能弹射');
      }
    }
    if (act('pol')) { K.pol = false; doPolarity(); }
    if (K.tg) { K.tg = false; tryTether(); }
    if (K.pulse) { K.pulse = false; doPulse(); }
    if (K.hop) { K.hop = false; doHop(); }
    if (K.plunge) { K.plunge = false; doPlunge(); }
    if (K.exin) { K.exin = false; doExchange(1); }
    if (K.exout) { K.exout = false; doExchange(-1); }
    if (K.qswap) { K.qswap = false; doQuotaSwap(); }

    /* 过载硬直：期间舵面锁死，只能靠惯性滑行 */
    var stunned = G.overT > 0;
    if (stunned) { G.overT -= dt; P.steer = 0; P.throttle = 0; }
    /* 强制放空：硬直窗口内把越限的那一槽线性泄到 0，泄掉的部分沉进熵损科目 */
    if (P.vent > 0) {
      P.vent -= dt;
      var ventWant = P.vent > 0 ? Math.round(P.ventM * (P.vent / (PHYS.OVER_MS / 1000))) : 0;
      var drop = G.chargeM - ventWant;
      if (drop > 0) xfer('charge', 'entropy', drop);
    }
    /* 起步锁定同样锁住舵面之外的一切：转向权重被压到两成 */
    if (locked) P.steer = P.steer * 0.2;

    /* ── 8.2 风剪与垂向 ─────────────────────────── */
    var wnd = windAt(P.th, G.t), wt = wnd[0], wx = wnd[1];
    var si = strataAt(P.d), st = STRATA[si];
    var airborne = P.alt > 0.5;
    var tail = (wt * sign(P.v || 1)) > 0;
    /* 风切穿越：矢量风合成模长越过阈值的瞬间进入 GALE_CROSS 窗口，
       窗口内风矢量整体被放大（顺风阻尼与逆风升力同时被放大，惩罚是双向的）。
       窗口结束后有冷却，否则风场在阈值附近抖一下就会反复进出这个态。 */
    var wmag = Math.hypot(wt, wx);
    if (G.galeT > 0) {
      G.galeT -= dt;
      wt *= PHYS.GALE_K; wx *= PHYS.GALE_K;
      if (G.galeT <= 0) { G.galeT = 0; G.galeCool = 1.6; }
    } else if (G.galeCool <= 0 && wmag > PHYS.GALE_MIN * PHYS.GALE_REF) {
      G.galeT = PHYS.GALE_MS / 1000; G.galeCount++;
      G.galeDir = wt >= 0 ? 1 : -1;
      ev('风切', 0, '风切穿越 · 切向 ' + f0(wt) + ' · 横向 ' + f0(wx));
    }

    if (!airborne) {
      P.vz = 0;
      if (P.plunge) { P.plunge = false; }
    } else {
      P.vz -= PHYS.GRAV * dt;
      /* 反常识：逆风迎角产生向上的升力矢量，滞空时间显著拉长 */
      if (!tail) P.vz += PHYS.LIFT_K * Math.abs(wt) / 90 * dt;
      /* 动量下压速坠：下压期间垂向额外吃一份高 g，且持续从牵引储备里抽物量
         沉进熵损 —— 速坠不是免费的落法，它是拿燃料换落速与冲击半径。 */
      if (P.plunge) {
        P.vz -= PHYS.PLUNGE_G * dt;
        P.plungeT += dt;
        var burn = Math.min(G.tractionM, Math.round(PHYS.PLUNGE_GAS_S * dt));
        if (burn > 0) xfer('traction', 'entropy', burn);
      }
      P.alt += P.vz * dt;
      if (P.alt <= 0) {
        var impact = Math.abs(P.vz);
        P.alt = 0;
        P.hop = 0;                 // 落地清零，不回充
        P.plunge = false;
        var pp0 = plateOf(P.th), pl0 = G.plates[pp0[0]];
        if (!pl0.alive) { crash('坠入碎裂虚空'); P.vz = 0; }
        else {
          landOn(pl0, impact);
          /* 高速落地生成冲击波：越快的下坠，半径与伤害越夸张 */
          if (impact > 168) {
            var R0s = PHYS.SHOCK_R_BASE * (1 + impact / 260);
            var n = 0;
            for (var q = G.drones.length - 1; q >= 0; q--) {
              var hh = G.drones[q];
              if (Math.hypot(hh.x - P.x, hh.y - P.y) <= R0s) {
                var dmg = PHYS.SHOCK_DMG * (1 + impact / 300);
                if (hh.armor && impact < 430) { hh.hitT = 0.3; continue; }
                hh.hp -= dmg; n++;
                if (hh.hp <= 0) { G.drones.splice(q, 1); G.kills++; }
              }
            }
            G.plungeCount++; G.shockN++;
            if (impact > G.plungeBest) G.plungeBest = impact;
            burst(P.x, P.y, '#ffd166', 26);
            score('动量下压速坠冲击 · 落速 ' + f0(impact), 10 + n * 5);
            if (n) bumpCombo('速坠清场');
          }
        }
        P.vz = 0;
      }
    }

    /* ── 8.3 切向推进 ─────────────────────────── */
    var vm = DIFFS[G.diff].vmax * (1 + (G.boostT > 0 ? 0.55 : 0));
    var aT = 0;
    if (P.throttle) aT += PHYS.THROTTLE * vm;
    if (P.brake) aT -= PHYS.BRAKE;
    if (G.boostT > 0) { aT += PHYS.THROTTLE * 2.2; G.boostT -= dt; }
    /* 阻力：平方项 + 线性项；顺风时平方项整体放大 40% —— 顺风反而更慢 */
    var dragMul = (airborne && tail) ? PHYS.TAIL_DRAG : 1.0;
    aT -= (PHYS.DRAG2 * dragMul * P.v * Math.abs(P.v)) + PHYS.DRAG1 * P.v * st.mu;
    P.v += aT * dt;
    if (P.v < 0) P.v = 0;
    if (P.v > PHYS.VMAX * vm) P.v = PHYS.VMAX * vm;

    /* ── 8.4 横向动力学 ─────────────────────────── */
    if (P.tether) {
      /* 单摆：角加速度 = -(g/L)·sinθ - 阻尼·ω，横向推力被索约束吸收 */
      var gL = PHYS.TETHER_G / PHYS.TETHER_L;
      P.tgW += (-gL * Math.sin(P.tgA) - PHYS.TETHER_DAMP * P.tgW) * dt;
      P.tgA += P.tgW * dt;
      P.d = (P.tether.r + PHYS.TETHER_L * Math.cos(P.tgA)) - rad(P.th);
      P.u = -PHYS.TETHER_L * Math.sin(P.tgA) * P.tgW;
    } else {
      /* 承压临界时转向权限减半：舵面被结构应变拖住，快打方向打不动 */
      var auth = clamp(P.v / PHYS.U_REF, 0, 1) * (stunned ? 0 : 1) *
                 (G.strain >= PHYS.STRAIN_CAP ? 0.5 : 1);
      var uTarget = PHYS.UMAX * P.steer * auth;
      /* 离心外推：花瓣凸段把车往环外推、凹段往轴心甩，κ 带符号 */
      var acent = PHYS.CURVE_K * curv(P.th) * P.v * P.v;
      var grip = P.hand ? PHYS.DRIFT_GRIP : PHYS.GRIP;
      /* 风剪横向分量按环带倍率放大：跑外线换摩擦，代价是风更硬 */
      P.u += ((uTarget - P.u) * grip - acent + wx * 5.4 * st.shear) * dt;
    }

    /* ── 8.5 位置推进与滑移角 ─────────────────────── */
    P.th += (P.v / Math.max(1, rad(P.th))) * dt;
    /* 累计环程必须记在 G.totalTh 上 —— 圈次判定、回溯回退、结算读数读的都是它。
       曾经写在 P.totalTh 这个没人读的影子字段上，结果圈次永远停在 0，整局打不完。 */
    G.totalTh += (P.v / Math.max(1, rad(P.th))) * dt;
    P.d += P.u * dt;
    if (P.d > HW) { P.d = HW; wall(); }
    else if (P.d < -HW) { P.d = -HW; wall(); }
    syncPos();
    P.slip = Math.atan2(P.u, Math.max(20, P.v));
    if (Math.abs(P.slip) > PHYS.SLIP_MAX) P.slip = sign(P.slip) * PHYS.SLIP_MAX;
    if (Math.abs(P.slip) > G.slipPeak) G.slipPeak = Math.abs(P.slip);
    if (P.v > G.speedPeak) G.speedPeak = P.v;

    /* 漂移不给氮气 —— 氮气只有「核心区锚定同调」与「能量索摆荡释放」两个来源。
       漂移的回报是过弯速度与连击段数，段数再去抬收益倍率，形成经济循环。 */
    var ab = Math.abs(P.slip), eff = 1.0;
    if (ab > PHYS.SLIP_SOFT) eff = PHYS.SLIP_SOFT_K;
    else if (ab < PHYS.SLIP_LOW) eff = PHYS.SLIP_LOW_K;
    if (P.hand) {
      G.cleanRun += dt;
      if (ab > 0.25 && G.f >= (P._lastCombo || 0) + 42) { P._lastCombo = G.f; bumpCombo('漂移连贯'); }
    }
    /* 结构疲劳与承压应变：长时间大滑移两条一起累积。
       疲劳走「越限即回溯」，承压走「越限即降权限」—— 两条不同的失败语义。 */
    if (ab > 0.5) {
      G.fatigue += PHYS.FATIGUE_SLIP * dt * 60 * 0.016;
      G.strain += PHYS.STRAIN_SLIP * dt;
    }

    /* ── 8.6 浮屿与坠落 ─────────────────────────── */
    /* 接地标志必须先算再交给浮屿解算：stepPlates 的载重判据读的就是它，
       放在后面会让浮屿永远慢一帧，引信也就永远点不着。 */
    var pp = plateOf(P.th), pl = G.plates[pp[0]];
    P.onPlate = pp[0];
    P.onGround = P.alt <= 0.5 && pl.alive;
    stepPlates(dt);
    stepFrags(dt);
    if (P.alt <= 0.5 && !pl.alive) { crash('驶入碎裂虚空'); }

    /* ── 8.7 接触同调时延（核心地雷）+ 分带配额抽取 ─── */
    var slow = Math.abs(P.v) < PHYS.ATTUNE_EPS;
    if (P.onGround && slow) {
      P.attuneT += dt * 1000;
      if (P.attuneT >= PHYS.ATTUNE_MS) {
        if (!P.attuned) {
          var core = inCore(pp[1]) && pl.anchor;
          P.attuned = true;
          /* 跃迁余量「由 0 置为 1」—— 这是唯一的回充途径。
             用 max 而不是直接赋值：开局带着的种子余量（2）不该被起跑线上的
             一次驻留同调削掉，只有落地清零过的那一次才需要回充。 */
          P.hop = Math.max(P.hop, 1);
          G.stab = Math.min(100, G.stab + PHYS.STAB_REFILL_S * (PHYS.ATTUNE_MS / 1000));
          G.fatigue = Math.max(0, G.fatigue - PHYS.REPAIR_S * (PHYS.ATTUNE_MS / 1000));
          G.strain = Math.max(0, G.strain - 17);
          P.coreMiss = 0;
          G.landN++;
          /* 驻台同调即「抽取」：把脚下这段浮屿的屿壳按抽取率折进牵引储备科目。
             这里有前后两道闸门，缺一条这道题就退回成「站着不动就变强」：
             ① 守恒闸门 —— 屿壳科目余额不足就抽不出东西；
             ② 配额闸门 —— 本层环带的本圈配额已经抽干，抽得动也不许抽。 */
          var bi2 = strataAt(P.d);
          var wantM = Math.round(Math.min(LEDGER.EX_MAX,
                        Math.max(LEDGER.EX_MIN, pl.lifeM * LEDGER.EX_FRAC)));
          var got = extract(pl, bi2, wantM);
          if (core) {
            G.coreN++; score('核心区锚定同调 · 精准', 24); bumpCombo('精准锚定');
            /* 只有核心区锚定才修复轴心寿命 —— 边缘同调只回气，不回血 */
            G.life = Math.min(G.lifeMax, G.life + PHYS.LIFE_REPAIR);
          } else { score('边缘锚定同调 · 非核心', 6); ev('同调', 0, '未落在核心区 · 无精准加成'); }
          burst(P.x, P.y, core ? '#7fffdc' : '#5f96ad', core ? 22 : 10);
        }
      }
    } else {
      if (P.attuneT > 0 && P.attuneT < PHYS.ATTUNE_MS) ev('同调', 0, '窗口内速度越界 · 进度打回');
      P.attuneT = 0; P.attuned = false;
    }
    P.attune = clamp(P.attuneT / PHYS.ATTUNE_MS, 0, 1);

    /* 边缘驻留：核心区外停着按秒扣稳定性储备。
       同时这也是「静止消耗」那一条：没有任何科目会在零输入下自然增长，
       驻留越久，稳定性储备越是单调往下走。 */
    var onEdge = P.onGround && slow && !(inCore(pp[1]) && pl.anchor);
    if (onEdge) {
      G.stab -= PHYS.EDGE_DRAIN * 100 * dt;
      G.edgeTime += dt;
    }
    /* 零输入计时：油门、刹车、舵面同时缺失才算「零输入」，用于静止消耗断言 */
    if (!P.throttle && !P.brake && P.steer === 0) G.idleTime += dt; else G.idleTime = 0;

    /* ── 8.8 涌潮 / 崩落体 / 账本 ─────────────────── */
    stepDrones(dt);
    /* 承压泄放：承压条只在「主动手段」下才会回落 —— 驻台同调、兑换、脉冲
       各泄一档；什么也不做的话它只会被滑移与撞击继续顶高。 */
    if (G.strain > 0) G.strain = Math.min(PHYS.STRAIN_CAP, G.strain);
    if (G.strainPeak < G.strain) G.strainPeak = G.strain;
    /* 承压临界下的持续代价：结构应变吃掉稳定性储备 */
    if (G.strain >= PHYS.STRAIN_CAP) G.stab -= PHYS.STRAIN_DRAIN * dt;
    /* 轴心本体侵蚀：在航拦截单位按秒啃轴心寿命（轴心卫戍按 boss 倍率单算）。
       没有这条，「轴心守护」这一轴永远是满值 —— 权重最高的 0.30 白送，
       而且清波与不清波没有任何区别，经济循环根本闭不上。 */
    var erode = 0;
    for (var di = 0; di < G.drones.length; di++)
      erode += G.drones[di].boss ? PHYS.LIFE_ERODE * PHYS.LIFE_ERODE_BOSS : PHYS.LIFE_ERODE;
    G.life -= erode * dt;
    /* 轴心归零是「终局失败」而不是可回溯的失误：回溯只退 1.1 秒，
       而寿命是单调累积的消耗，退一秒救不回来，只会退化成永不脱出的崩溃循环。 */
    if (G.life <= 0) { G.life = 0; if (G.rollT < 0 && !G.settled) finishRun('轴心失守 · 任务失败'); }
    for (var i = G.fx.length - 1; i >= 0; i--) {
      var q = G.fx[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.93; q.vy *= 0.93; q.life -= dt;
      if (q.life <= 0) G.fx.splice(i, 1);
    }
    if (G.comboHold > 0) { G.comboHold -= dt; if (G.comboHold <= 0) { G.combo = 0; G.yieldMul = 1; } }

    /* 圈次推进 */
    var lapNow = Math.floor(G.totalTh / (Math.PI * 2));
    if (lapNow > G.lap) {
      G.lap = lapNow;
      G.lapTimes.push(G.lapT);
      if (!G.bestLap || G.lapT < G.bestLap) G.bestLap = G.lapT;
      score('完成第 ' + G.lap + ' 圈 · ' + mmss(G.lapT, 2), 40);
      G.lapT = 0;
      /* 跑满一圈即按排程额度回补一次配额 —— 配额是按「圈」发的，不是按秒发的 */
      for (var qi = 0; qi < G.quota.length; qi++) G.quota[qi] = G.quotaCap[qi];
      G.quotaRefill++;
      ev('配额', 0, '第 ' + G.lap + ' 圈额度已重新发放 · 五带合计 ' + QUOTA_TOTAL_M);
      if (G.lap >= LAPS) finishRun(LAPS + ' 圈完赛');
    }
    /* 涌潮由「放行帧号」排程驱动：帧号到了就压上，与场上还剩几波无关。
       于是「先清哪一波、先去哪一层抽配额」变成一道必须取舍的资源题。 */
    while (G.wavePtr < G.quotaPlan.length && G.quotaPlan[G.wavePtr].f <= G.f) {
      spawnWavePlan(G.quotaPlan[G.wavePtr]);
      G.wavePtr++;
    }
    G.waveT += dt;
    if (G.waveState === 'fighting' && G.drones.length === 0) {
      G.waveState = 'cleared'; G.salvage++;
      score('清空第 ' + G.wave + ' 波', 30);
      /* 清波不再回补牵引储备 —— 被动恢复被彻底切断，回补只能来自抽取与摆荡 */
    }
    G.quotaDead = quotaDead();
    G.fatiguePeak = Math.max(G.fatiguePeak, G.fatigue);
    G.exRate = exRate(strataAt(P.d));

    /* ── 实时损耗率：按仿真步长做指数平滑，不按渲染帧做差分 ──
       监视器要读的是「这一秒资源往哪边走」，那是仿真量；若拿两次重绘之间的
       差值去除，读数就变成渲染节奏的函数（冻结步进下甚至会读到跨场景的差）。
       时间常数 0.25 s：足够平滑，又能在一秒内反映趋势反转。 */
    var rk = Math.min(1, dt / 0.25);
    G.rateGas += ((G.tractionM - _g0) / LEDGER.TRACTION_K / dt - G.rateGas) * rk;
    G.rateStab += ((G.stab - _s0) / dt - G.rateStab) * rk;
    G.rateFat += ((G.fatigue - _f0) / dt - G.rateFat) * rk;
    G.rateStrain += ((G.strain - _r0) / dt - G.rateStrain) * rk;

    /* 失败判据：稳定性清零 / 结构疲劳越限 */
    if (G.stab <= 0) crash('稳定性储备耗尽');
    if (G.fatigue >= PHYS.FATIGUE_MAX) crash('结构疲劳越限 · 解体');

    resolveState();
  }

  function wall() {
    P.u = -P.u * PHYS.WALL_BOUNCE;
    G.fatigue += PHYS.WALL_FATIGUE;
    G.wallCount++;
    if (G.domeCd <= 0) { G.strain += PHYS.STRAIN_WALL; G.domeCd = PHYS.DOME_CD; }
    if (Math.abs(P.v) > PHYS.WALL_BREAK) { crash('高速撞上外侧护墙'); return; }
    P.v *= 0.86;
    ev('擦墙', 0, '速度 ' + f0(P.v) + ' · 结构疲劳 +' + f1(PHYS.WALL_FATIGUE));
  }

  /* ══════════════ 10. 状态机解析（十四阶 · 优先级抢占） ══════════════
     裁决方式不是「串联 if/else」，而是一张写死的优先级表：把当前所有成立的
     候选态全部收集起来，再按 FSM_PRIORITY 里逐字写定的次序取最高优先级的那一个。
     两个直接后果：① 候选集合与裁决次序是两份独立的数据，任何新增条件都不会
     因为书写顺序而意外改变语义；② 外部探针可以拿同一个候选集合与同一张表
     独立复算一遍，逐位对齐才算通过 —— 状态机因此是可证伪的，不是可读的。 */
  function candidates() {
    var c = [];
    c.push('ACTIVE_ENGAGED');                                    // 兜底态，永远成立
    if (G.boot.done && !G.started) c.push('TITLE_LOBBY');
    if (G.revealed < 1 && G.started) c.push('SEEDED_INITIALIZING');
    if (G.launchLock > 0 && G.revealed >= 1 && !G.settled) c.push('GRID_LOCKED');
    if (P.attuneT > 0 || P.attuned) c.push('ATTUNEMENT_DWELL');
    if (G.galeT > 0) c.push('GALE_CROSS');
    if (G.waveState === 'fighting' && G.drones.length > 0) c.push('WAVE_ENGAGED');
    if (G.stab < 34 || G.fatigue > 74 || G.drones.some(function (h) { return h.boss; }))
      c.push('DYNAMIC_BRANCHING');
    if (G.strain >= PHYS.STRAIN_CAP) c.push('STRAIN_CRITICAL');
    if (G.quotaDead && G.revealed >= 1 && !G.settled) c.push('QUOTA_EXHAUSTED');
    if (G.overT > 0) c.push('OVERLOAD_PENALTY');
    if (G.rollT >= 0) c.push('CRISIS_FAILED_ROLLBACK');
    if (G.settled) c.push('RUN_SETTLED_LEDGER');
    if (!G.boot.done) c.push('BOOT_SEQUENCING');
    return c;
  }
  function resolveState() {
    var cand = candidates(), s = 'ACTIVE_ENGAGED', i, k;
    for (i = 0; i < FSM_PRIORITY.length; i++) {
      for (k = 0; k < cand.length; k++) {
        if (cand[k] === FSM_PRIORITY[i]) { s = FSM_PRIORITY[i]; i = FSM_PRIORITY.length; break; }
      }
    }
    G.cand = cand;
    if (s !== G.state) { G.prev = G.state; G.state = s; G.stateT = 0; onEnter(s); }
  }
  function onEnter(s) {
    if (s === 'BOOT_SEQUENCING') ev('状态', 0, '引导自检序列启动 · ' + BOOT_STAGES.length + ' 段');
    else if (s === 'TITLE_LOBBY') ev('状态', 0, '待机大厅 · 等待放行');
    else if (s === 'SEEDED_INITIALIZING') ev('状态', 0, '种子显影中');
    else if (s === 'GRID_LOCKED') ev('状态', 0, '起步锁定 · 出闸对准度待核');
    else if (s === 'ACTIVE_ENGAGED') ev('状态', 0, '主交互循环激活');
    else if (s === 'ATTUNEMENT_DWELL') ev('状态', 0, '进入同调驻留窗口');
    else if (s === 'GALE_CROSS') ev('状态', 0, '风切穿越 · 风剪放大');
    else if (s === 'WAVE_ENGAGED') ev('状态', 0, '涌潮迎击');
    else if (s === 'DYNAMIC_BRANCHING') ev('状态', 0, '空域危机分支');
    else if (s === 'STRAIN_CRITICAL') ev('状态', 0, '承压临界 · 转向权限减半');
    else if (s === 'QUOTA_EXHAUSTED') ev('状态', 0, '配额枯竭 · 本带抽取停摆');
    else if (s === 'OVERLOAD_PENALTY') ev('状态', 0, '过载失稳硬直');
    else if (s === 'CRISIS_FAILED_ROLLBACK') ev('状态', 0, '因果回溯 · ' + G.rollReason);
    else if (s === 'RUN_SETTLED_LEDGER') ev('状态', 0, '结算落账');
  }

  /* ══════════════ 11. 结算聚合（账本回溯） ══════════════ */
  function aggregate() {
    var lifeP = clamp(G.life / G.lifeMax, 0, 1);
    var waveP = clamp(G.wave / WAVES.length, 0, 1);
    var salvP = clamp(G.salvage / 10, 0, 1);
    var clean = clamp(1 - G.fatiguePeak / PHYS.FATIGUE_MAX, 0, 1);
    var chain = clamp(G.bestCombo / 26, 0, 1);
    var hasCore = G.landN > 0;
    var core = hasCore ? clamp(G.coreN / G.landN, 0, 1) : 0;
    /* 守恒轴：结算时五种账本科目的缺口必须为零，任何人造失衡都会在这里
       被读成一个小于 1 的守恒系数 —— 它是「账没做平」最直接的一条读数。 */
    var gap = budget().gap;
    var cons = gap === 0 ? 1 : clamp(1 - Math.abs(gap) / LEDGER.BUDGET_M, 0, 1);
    /* 权重和必须与分子逐项对齐：漏掉连击的 0.16 会让分母只有 0.80
       而分子上限是 0.96，满分制下算出 110+ 的分数。 */
    var wSum = 0.26 + 0.16 + 0.13 + 0.13 + 0.13 + 0.19 + (hasCore ? 0.17 : 0);
    var sc = (lifeP * 0.26 + waveP * 0.16 + salvP * 0.13 + clean * 0.13 +
              chain * 0.13 + cons * 0.19 + (hasCore ? core * 0.17 : 0)) / wSum * 100;
    var grade = sc >= 88 ? 'S' : sc >= 76 ? 'A' : sc >= 62 ? 'B' : sc >= 48 ? 'C' : sc >= 32 ? 'D' : 'F';
    return {
      n: G.ledger.length, sc: sc, grade: grade, lifeP: lifeP, waveP: waveP,
      salvP: salvP, clean: clean, chain: chain, core: core, hasCore: hasCore,
      cons: cons, gap: gap, wSum: wSum, fatiguePeak: G.fatiguePeak,
      speedPeak: G.speedPeak, slipPeak: G.slipPeak, strainPeak: G.strainPeak,
      lapTimes: G.lapTimes.slice()
    };
  }

  function finishRun(result) {
    if (G.settled) return;
    G.settled = true; G.result = result;
    ev('结算', 0, result + ' · 账本 ' + G.ledger.length + ' 条');
    resolveState();
  }

  /* ══════════════ 11b. 引导自检序列（十四段确定性引导） ══════════════
     每一段都必须在给定帧预算内真的跑完一次校验，把结论写进自检台账。
     判据不成立 ⇒ 整条链就地停住并把该段标红，绝不「亮一下进度条就放行」。
     因此这一段是可以被外部探针证伪的：把任意一条不变量弄坏，链就永远
     停在坏掉的那一段上，状态徽标也就永远到不了 TITLE_LOBBY。 */

  var CV_IDS = ['world', 'radar', 'rig', 'quota', 'rings', 'ledger'];
  /* 六块画布的额定尺寸表 —— 与 <canvas width height> 声明的必须逐格一致 */
  var CV_SIZE = [
    ['world', 546, 546], ['radar', 546, 86], ['rig', 690, 296],
    ['quota', 690, 76], ['rings', 690, 134], ['ledger', 690, 108]
  ];

  function hash32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }
  function hex8(v) { return ('0000000' + (v >>> 0).toString(16)).slice(-8); }

  /* 像素探针：六块画布各自的墨量与互相之间的指纹。墨量太低说明没画，
     指纹两两相同说明两块画布画的是同一幅内容 —— 两种都要判失败。 */
  function pixelProbe() {
    var out = { ink: [], fp: [], minInk: 1, distinct: true, hash: 0 };
    for (var i = 0; i < CV_IDS.length; i++) {
      var id = CV_IDS[i], cv = document.getElementById(id), d = null;
      if (cv && cv.getContext) {
        try {
          d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
        } catch (e) { d = null; }
      }
      if (!d) { out.ink.push(-1); out.fp.push(0); out.minInk = -1; out.distinct = false; continue; }
      var ink = 0, n = 0, h = 2166136261;
      for (var p = 0; p < d.length; p += 4 * 23) {
        var k = (d[p] << 16) | (d[p + 1] << 8) | d[p + 2];
        if (k > 0x101010) ink++;
        n++; h = Math.imul(h ^ k, 16777619);
      }
      var r = n ? ink / n : 0;
      out.ink.push(r);
      out.fp.push(h >>> 0);
      if (r < out.minInk) out.minInk = r;
      out.hash = (Math.imul(out.hash ^ (h >>> 0), 16777619)) >>> 0;
    }
    for (var a = 0; a < out.fp.length; a++)
      for (var b = a + 1; b < out.fp.length; b++)
        if (out.fp[a] === out.fp[b]) out.distinct = false;
    return out;
  }

  /* ── 影子推演：把整局状态换成一份副本，跑真实步进，再原样换回来 ──
     不变量复核必须跑在真物理上才有意义；跑完必须一个字节都不留在主状态里。 */
  function shadowFresh() {
    var sG = G, sP = P, sK = K;
    var ng = JSON.parse(JSON.stringify(G));
    var np = JSON.parse(JSON.stringify(P));
    var nk = {};
    for (var kk in K) nk[kk] = false;
    G = ng; P = np; K = nk;
    resetRun();
    var out = { G: G, P: P, K: K };
    G = sG; P = sP; K = sK;
    return out;
  }
  function swapIn(s) { var a = { G: G, P: P, K: K }; G = s.G; P = s.P; K = s.K; return a; }
  function runTicks(n, observe) {
    var seen = [];
    try {
      for (var i = 0; i < n; i++) {
        tick(1 / 60);
        if (observe) { var r = observe(i); if (r !== undefined) seen.push(r); }
      }
    } catch (e) { seen.push('ERR:' + (e && e.message)); }
    return seen;
  }
  function quiet(g) {
    g.boot = { st: 0, f: 0, done: true, err: '', list: [], probe: null, inv: null, bad: false };
    g.started = true; g.state = 'ACTIVE_ENGAGED'; g.revealed = 1;
    g.settled = false; g.rollT = -1; g.overT = 0; g.galeT = 0; g.launchLock = 0;
    g.strain = 0; g.fatigue = 0; g.stab = 100; g.mercy = 0;
    g.drones = []; g.frags = []; g.frags = [];
    g.wave = 1; g.waveState = 'cleared'; g.waveT = -1e9;
    return g;
  }

  /* 三条对抗性不变量的黑盒复核。每条都必须能被「把机制改回常识写法」证伪。 */
  function probeInvariants() {
    var out = { delay: false, idle: false, wind: false };
    var saved = { G: G, P: P, K: K };

    /* ① 接触同调时延：落地把余量清零之后，第 12 帧（= 200 ms）发跳跃必须失败；
          只有把速度压在近零并连续驻留满窗口，余量才由 0 置为 1。 */
    (function () {
      var s = shadowFresh(); swapIn(s);
      try {
        quiet(G);
        var i0 = -1;
        for (var i = 0; i < G.plates.length; i++)
          if (G.plates[i].alive && G.plates[i].anchor) { i0 = i; break; }
        if (i0 < 0) { out.delay = false; }
        else {
          P.th = (i0 + 0.5) * SEG_A; P.d = 0; P.v = 0; P.u = 0; P.alt = 0;
          P.vz = 0; P.hop = 0; P.attuneT = 0; P.attuned = false; P.vent = 0;
          P.charging = false; P.polT = 0; P.tether = null;
          runTicks(12);
          var early = doHop();
          runTicks(24);
          out.delay = (early === false) && (P.hop >= 1) && (P.attuned === true);
        }
      } catch (e) { out.delay = false; }
      swapIn(saved);
    })();

    /* ② 零被动恢复：整整 3 秒零输入，牵引储备 / 蓄能存量 / 竞速功一律不得正向增长。 */
    (function () {
      var s = shadowFresh(); swapIn(s);
      var seen = [];
      try {
        quiet(G);
        /* 停在非锚定浮屿的核心区之外：停在那儿本来就该是按秒流失，不该有回补 */
        P.th = SEG_A * 0.08; P.d = 0; P.v = 0; P.u = 0; P.alt = 0; P.vz = 0;
        P.attuneT = 0; P.attuned = false;
        var g0 = G.tractionM;
        seen = runTicks(180, function () { return { g: G.tractionM, c: G.chargeM, f: G.foldM }; });
        var ok = seen.length === 180;
        for (var i = 0; i < seen.length; i++) {
          if (typeof seen[i] === 'string' || seen[i].g > g0 || seen[i].c > 0 || seen[i].f > 0) { ok = false; break; }
        }
        out.idle = ok;
      } catch (e) { out.idle = false; }
      swapIn(saved);
    })();

    /* ③ 反常识风阻：顺风那一档的阻力必须严格大于逆风那一档 —— 顺风反而更慢。 */
    (function () {
      try {
        var wt = windAt(0.7, 0)[0];
        var v = 420, sgn = wt > 0 ? 1 : -1;
        var tail = (wt * sgn) > 0;
        var aTail = PHYS.DRAG2 * (tail ? PHYS.TAIL_DRAG : 1) * v * v;
        var aHead = PHYS.DRAG2 * (tail ? 1 : PHYS.TAIL_DRAG) * v * v;
        out.wind = (PHYS.TAIL_DRAG > 1) && (aTail > aHead) &&
                   (PHYS.LIFT_K > 0) && (PHYS.REBOUND_K > 0) && (PHYS.REBOUND_K < 1);
      } catch (e) { out.wind = false; }
    })();
    return out;
  }

  var B_TOTAL = BOOT_STAGES.reduce(function (a, s) { return a + s.h; }, 0);

  function bootStep() {
    var B = G.boot;
    if (B.done || B.bad) return;
    B.f++;
    var S = BOOT_STAGES[B.st];
    if (!S) { B.done = true; return; }
    if (B.f === 1) {
      var ok = true, note = '';
      if (S.k === 'BOOT_STRUCTURE') {
        var bad = [];
        for (var i = 0; i < CV_SIZE.length; i++) {
          var id = CV_SIZE[i][0], cv = document.getElementById(id);
          if (!cv || !cv.getContext || cv.width !== CV_SIZE[i][1] || cv.height !== CV_SIZE[i][2]) bad.push(id);
          else if (!cv.getContext('2d')) bad.push(id + ':ctx');
        }
        ok = bad.length === 0;
        note = ok ? '画布 ' + CV_SIZE.length + ' 块 · 上下文齐备 · 尺寸逐格一致'
                  : '画布缺失或尺寸不符：' + bad.join(',');
      } else if (S.k === 'BOOT_SURFACE') {
        paint();
        var pr0 = pixelProbe();
        ok = pr0.minInk > 0.012;
        note = '最小墨量 ' + f3(pr0.minInk) + ' · 阈值 0.012' + (ok ? ' · 六块均铺底' : ' · 有画布未铺底');
      } else if (S.k === 'BOOT_PIXEL') {
        paint();
        var pr = pixelProbe();
        B.probe = pr;
        ok = pr.distinct && pr.minInk > 0.012;
        note = '衍生指纹 0x' + hex8(pr.hash) + (ok ? ' · 六块两两互异' : ' · 存在同源画布');
      } else if (S.k === 'BOOT_DERIVE') {
        var a1 = mulberry(G.seed)(), a2 = mulberry(G.seed)();
        var d1 = mulberry(G.seed ^ 0x1f3d5b79)();
        var base = hash32('AXELPULSE|' + G.seed + '|' + G.diff + '|' + G.nc);
        ok = (a1 === a2) && (a1 !== d1) && (base !== 0);
        note = '派生指纹 0x' + hex8(base) + ' · 同源复算一致 · 空账基线 ' + hex8(hash32(''));
      } else if (S.k === 'BOOT_GRID') {
        var n = 720, rmin = 1e9, signs = 0, prev = 0, edge = 1e9;
        for (var g2 = 0; g2 < n; g2++) {
          var th = g2 / n * Math.PI * 2, rr = rad(th), cc = curv(th);
          if (rr < rmin) rmin = rr;
          if (rr - HW < edge) edge = rr - HW;
          var sg = cc > 0 ? 1 : -1;
          if (prev && sg !== prev) signs++;
          prev = sg;
        }
        ok = (signs === 2 * G.nc) && (edge > 0);
        note = '采样 ' + n + ' 点 · 最小半径 ' + f1(rmin) + ' · 曲率变号 ' + signs + ' 次（应 ' +
               (2 * G.nc) + '）· 内缘余量 ' + f1(edge);
      } else if (S.k === 'BOOT_BAND') {
        var gapb = 0, dec = true, inc = true, snc = true;
        for (var b2 = 0; b2 < STRATA.length; b2++) {
          if (b2 === 0 && STRATA[0].r0 !== 0) gapb++;
          if (b2 && STRATA[b2].r0 !== STRATA[b2 - 1].r1) gapb++;
          if (b2 && !(STRATA[b2].mu < STRATA[b2 - 1].mu)) dec = false;
          if (b2 && !(STRATA[b2].shear > STRATA[b2 - 1].shear)) inc = false;
          if (b2 && !(STRATA[b2].sense < STRATA[b2 - 1].sense)) snc = false;
        }
        if (STRATA[STRATA.length - 1].r1 !== 1) gapb++;
        ok = gapb === 0 && dec && inc && snc;
        note = '五带无缝无叠 · 摩擦严格递减 · 风剪严格递增 · 感应严格递减';
      } else if (S.k === 'BOOT_QUOTA') {
        var q2 = genQuota(), sum2 = 0, pos = true, same = true;
        for (var q3 = 0; q3 < q2.length; q3++) { sum2 += q2[q3]; if (q2[q3] <= 0) pos = false; }
        for (var q4 = 0; q4 < q2.length; q4++) if (q2[q4] !== G.quota[q4]) same = false;
        ok = pos && sum2 === QUOTA_TOTAL_M && same && G.quota.length === STRATA.length;
        note = '总额 ' + sum2 + ' / ' + QUOTA_TOTAL_M + ' · 逐带 ' + G.quota.join('/') + ' · 可复算';
      } else if (S.k === 'BOOT_WAVE') {
        var wp = G.quotaPlan, inc2 = true, sset = {}, bset = {}, pos2 = true, same2 = true;
        var wp2 = genWaves();
        for (var w2 = 0; w2 < wp.length; w2++) {
          if (w2 && !(wp[w2].f > wp[w2 - 1].f)) inc2 = false;
          sset[wp[w2].s] = 1; bset[wp[w2].band] = 1;
          if (!(wp[w2].n > 0)) pos2 = false;
          if (wp2[w2].f !== wp[w2].f || wp2[w2].band !== wp[w2].band) same2 = false;
        }
        ok = inc2 && pos2 && same2 && Object.keys(sset).length === 3 &&
             Object.keys(bset).length === STRATA.length;
        note = '放行帧 ' + wp[0].f + '→' + wp[wp.length - 1].f + ' · 强度档 ' +
               Object.keys(sset).length + '/3 · 目标带 ' + Object.keys(bset).length + '/' +
               STRATA.length + ' · 两次预排一致';
      } else if (S.k === 'BOOT_LEDGER') {
        var bg = budget();
        ok = bg.gap === 0 && bg.shell >= 0 && bg.traction >= 0 && bg.charge >= 0 &&
             bg.fold >= 0 && bg.entropy >= 0;
        note = '总额 ' + bg.budget + ' · 差额 ' + bg.gap + ' · 屿壳 ' + bg.shell +
               ' · 牵引 ' + bg.traction + ' · 熵损 ' + bg.entropy;
      } else if (S.k === 'BOOT_TETHER') {
        var okp = true, plateset = {};
        for (var t2 = 0; t2 < BOARD_HINT.pylons.length; t2++) {
          var py = BOARD_HINT.pylons[t2];
          var off = (-HW + (py[1] / 13) * 2 * HW);
          if (Math.abs(off) >= HW) okp = false;
          if (py[0] < 0 || py[0] >= SEG) okp = false;
          if (plateset[py[0]]) okp = false;
          plateset[py[0]] = 1;
        }
        ok = okp && BOARD_HINT.pylons.length >= 4;
        note = '锚塔 ' + BOARD_HINT.pylons.length + ' 座 · 逐座落在环道内缘之内 · 分段互异';
      } else if (S.k === 'BOOT_WIND') {
        var sgn = 0, prevS = 0, peak = 0, ns = 480;
        for (var k3 = 0; k3 < ns; k3++) {
          var th3 = k3 / ns * Math.PI * 2, wv = windAt(th3, 0)[0];
          if (Math.abs(wv) > peak) peak = Math.abs(wv);
          var s3 = wv > 0 ? 1 : -1;
          if (prevS && s3 !== prevS) sgn++;
          prevS = s3;
        }
        ok = sgn >= 4 && peak > 0;
        note = '模态 ' + WAVE_MODES.length + ' · 采样 ' + ns + ' 点 · 切向风变号 ' + sgn +
               ' 次 · 峰值 ' + f1(peak);
      } else if (S.k === 'BOOT_INVARIANT') {
        var pv = probeInvariants();
        B.inv = pv;
        ok = pv.delay && pv.idle && pv.wind;
        note = '接触同调时延 ' + (pv.delay ? '通过' : '失败') + ' · 零被动恢复 ' +
               (pv.idle ? '通过' : '失败') + ' · 反常识风阻 ' + (pv.wind ? '通过' : '失败');
      } else if (S.k === 'BOOT_BUDGET') {
        var tot = 0;
        for (var h2 = 0; h2 < BOOT_STAGES.length; h2++) tot += BOOT_STAGES[h2].h;
        ok = tot === B_TOTAL;
        note = '十四段额定 ' + tot + ' 帧 = ' + (tot / 60).toFixed(2) + ' s · 步长固定 1/60 s';
      } else if (S.k === 'BOOT_READY') {
        ok = B.err === '';
        note = '十四段全通过 · 放行至待机坞';
      }
      B.list[B.st] = { k: S.k, n: S.n, h: S.h, ok: ok, note: note, f: B.f };
      /* 判据不成立 ⇒ 就地停住并标红，绝不「亮一下进度条就放行」。
         这一段因此是能被外部探针证伪的：把任意一条不变量弄坏，链就永远
         卡在坏掉的那一段，状态徽标也就永远到不了 TITLE_LOBBY。 */
      if (!ok) { B.err = S.n + ' · ' + note; B.bad = true; }
    }
    if (!B.bad && B.f >= S.h) {
      var rec = B.list[B.st];
      if (rec && rec.ok) {
        B.st++; B.f = 0;
        if (B.st >= BOOT_STAGES.length) { B.done = true; G.state = 'TITLE_LOBBY'; }
      }
    }
  }

  /* ══════════════ 12. 画布与绘制工具 ══════════════ */
  var CV = {}, CX = {};
  ['world', 'radar', 'rig', 'quota', 'rings', 'ledger'].forEach(function (id) {
    CV[id] = document.getElementById(id);
    CX[id] = CV[id].getContext('2d');
  });
  function clear(c, w, h, bg) {
    c.clearRect(0, 0, w, h);
    if (bg) { c.fillStyle = bg; c.fillRect(0, 0, w, h); }
  }
  function bar(c, x, y, w, h, frac, back, fore, label, val) {
    c.fillStyle = back; c.fillRect(x, y, w, h);
    c.fillStyle = fore; c.fillRect(x, y, w * clamp(frac, 0, 1), h);
    c.strokeStyle = '#2b3a6e'; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (label) { c.fillStyle = '#8b93cf'; c.font = '10px monospace'; c.fillText(label, x, y - 3); }
    if (val !== undefined) {
      c.fillStyle = '#dff0ff'; c.font = 'bold 11px monospace'; c.textAlign = 'right';
      c.fillText(val, x + w, y - 3); c.textAlign = 'left';
    }
  }
  function ring(c, cx, cy, r, frac, col, back, thick) {
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2);
    c.strokeStyle = back || '#16204a'; c.lineWidth = thick || 5; c.stroke();
    c.beginPath(); c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(frac, 0, 1));
    c.strokeStyle = col; c.lineWidth = thick || 5; c.stroke();
  }

  /* ══════════════ 13. 主视窗 ══════════════ */
  function w2sX(x) { return 273 + x * SC; }
  function w2sY(y) { return 273 + y * SC; }
  function bandPath(c, th0, th1, rIn, rOut, steps) {
    c.beginPath();
    for (var i = 0; i <= steps; i++) {
      var th = lerp(th0, th1, i / steps);
      var r = rIn(th) * SC, x = 273 + r * Math.cos(th), y = 273 + r * Math.sin(th);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    for (var j = steps; j >= 0; j--) {
      var th2 = lerp(th0, th1, j / steps);
      var r2 = rOut(th2) * SC, x2 = 273 + r2 * Math.cos(th2), y2 = 273 + r2 * Math.sin(th2);
      c.lineTo(x2, y2);
    }
    c.closePath();
  }

  var worldW = 546, worldH = 546;
  function paintWorld(c) {
    clear(c, worldW, worldH, '#04060f');
    var g = c.createRadialGradient(273, 273, 20, 273, 273, 300);
    g.addColorStop(0, '#0b1330'); g.addColorStop(0.55, '#070b1c'); g.addColorStop(1, '#03040c');
    c.fillStyle = g; c.fillRect(0, 0, worldW, worldH);

    /* ── 种子底稿 ──
       底稿画的是「这条环道按种子应该长成什么样」：外缘、轴心缘、四条环带分界、
       24 段格位刻度、锚定段与核心区标记、五带参数色标。显影走满时整体淡出。
       底稿不是装饰：引导自检的「环道解算」与「环带协议」两段复核的，
       正是底稿上的几何量与实况逐段是否吻合 —— 对不上就地停机。 */
    if (G.revealed < 1 || !G.boot.done) {
      c.globalAlpha = G.boot.done ? (1 - G.revealed) : 1;
      var e, k3, pz, sb;
      /* 底稿底色：整条环道带铺一层可见的蓝图底 —— 既让「未显影」与
         「白屏 / 黑屏」在像素层上可区分，也让铺底自检有真实的墨量可读。
         注意：这一层随后会被 paintVeil 的未显影暗幕压暗，所以引导期的
         暗幕必须让路（见 paintVeil ①），否则底稿等于白画。 */
      bandPath(c, 0, Math.PI * 2,
               function (t) { return rad(t) - HW; },
               function (t) { return rad(t) + HW; }, 96);
      c.fillStyle = 'rgba(46,96,170,0.92)'; c.fill();
      for (e = 0; e <= 4; e++) {
        var fr = e / 4;
        c.beginPath();
        for (k3 = 0; k3 <= 144; k3++) {
          var t3 = k3 / 144 * Math.PI * 2;
          var rr3 = (rad(t3) + (-HW + fr * 2 * HW)) * SC;
          var xx = 273 + rr3 * Math.cos(t3), yy = 273 + rr3 * Math.sin(t3);
          k3 ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
        }
        c.closePath();
        c.strokeStyle = (e === 0 || e === 4) ? 'rgba(120,170,255,0.55)' : 'rgba(90,140,220,0.26)';
        c.lineWidth = (e === 0 || e === 4) ? 2 : 1;
        c.stroke();
      }
      for (pz = 0; pz < SEG; pz++) {
        var ta = pz * SEG_A, plz = G.plates[pz];
        var rIn3 = (rad(ta) - HW) * SC, rOut3 = (rad(ta) + HW) * SC;
        var ca = Math.cos(ta), sa = Math.sin(ta);
        c.beginPath();
        c.moveTo(273 + rIn3 * ca, 273 + rIn3 * sa);
        c.lineTo(273 + rOut3 * ca, 273 + rOut3 * sa);
        c.strokeStyle = plz.anchor ? 'rgba(127,255,220,0.60)' : 'rgba(80,120,200,0.28)';
        c.lineWidth = plz.anchor ? 2 : 1; c.stroke();
        if (plz.anchor) {
          var tc = (pz + 0.5) * SEG_A, rc = rad(tc) * SC;
          var acx = 273 + rc * Math.cos(tc), acy = 273 + rc * Math.sin(tc);
          c.beginPath(); c.arc(acx, acy, 9, 0, Math.PI * 2);
          c.strokeStyle = 'rgba(127,255,220,0.70)'; c.lineWidth = 1; c.stroke();
          c.fillStyle = 'rgba(127,255,220,0.85)'; c.font = '8px monospace';
          c.textAlign = 'center'; c.fillText(String(pz), acx, acy + 3); c.textAlign = 'left';
        }
      }
      for (sb = 0; sb < STRATA.length; sb++) {
        c.fillStyle = STRATA[sb].tint; c.fillRect(14, 16 + sb * 13, 12, 10);
        c.fillStyle = '#8fb6e6'; c.font = '9px monospace';
        c.fillText(STRATA[sb].n + '  摩擦 ' + f2(STRATA[sb].mu) + '  风剪 ×' + f2(STRATA[sb].shear) +
                   '  感度 ' + f2(STRATA[sb].sense) + '  配额 ' + G.quotaCap[sb], 30, 25 + sb * 13);
      }
      c.fillStyle = '#5f7aad'; c.font = '9px monospace';
      c.fillText('种子底稿 · 尚未显影 · 放行后逐段显影到实况', 14, 30 + STRATA.length * 13);
      c.globalAlpha = 1;
    }

    /* ── 浮屿环：每段按五层环带切成条带 ── */
    for (var i = 0; i < SEG; i++) {
      var pl = G.plates[i];
      var th0 = i * SEG_A, th1 = th0 + SEG_A;
      var rev = clamp(G.revealed * SEG - i, 0, 1);
      if (rev <= 0) continue;
      var e1 = lerp(th0, th1, rev);
      var sink = pl.sink;
      if (!pl.alive) {
        /* 虚空：只剩一圈暗红残迹，中间是能看见星空的洞 */
        bandPath(c, th0, e1, function (t) { return rad(t) - HW; }, function (t) { return rad(t) + HW; }, 5);
        c.fillStyle = 'rgba(255,90,90,0.10)'; c.fill();
        c.strokeStyle = 'rgba(255,120,120,0.35)'; c.lineWidth = 1; c.stroke();
      } else {
        for (var s = 0; s < STRATA.length; s++) {
          var S0 = STRATA[s];
          var rIn = function (t) { return rad(t) + (-HW + S0.r0 * 2 * HW) - sink; };
          var rOut = function (t) { return rad(t) + (-HW + S0.r1 * 2 * HW) - sink; };
          bandPath(c, th0, e1, rIn, rOut, 5);
          var dim = 0.35 + 0.65 * pl.life;
          c.fillStyle = S0.tint; c.globalAlpha = dim; c.fill(); c.globalAlpha = 1;
        }
        /* 核心区高亮：只有带锚定核心的浮屿才画 */
        if (pl.anchor) {
          var cm = 0.5 - PHYS.CORE_ZONE * 0.5, cp = 0.5 + PHYS.CORE_ZONE * 0.5;
          var c0 = th0 + SEG_A * cm, c1 = th0 + SEG_A * cp;
          bandPath(c, c0, Math.min(c1, e1), function (t) { return rad(t) - HW * 0.55; },
                   function (t) { return rad(t) + HW * 0.55; }, 4);
          c.fillStyle = 'rgba(95,224,192,' + (0.16 + 0.20 * pl.life) + ')'; c.fill();
          c.strokeStyle = 'rgba(127,255,220,0.45)'; c.lineWidth = 1; c.stroke();
        }
        /* 引信：琥珀 → 红，越接近碎裂越靠红 */
        if (pl.fuse >= 0) {
          var fq = 1 - clamp(pl.fuse / PHYS.FUSE_MS, 0, 1);
          bandPath(c, th0, th1, function (t) { return rad(t) - HW; }, function (t) { return rad(t) + HW; }, 5);
          c.fillStyle = 'rgba(255,' + Math.round(170 - 120 * fq) + ',60,' + (0.18 + 0.42 * fq) + ')'; c.fill();
        }
        c.strokeStyle = 'rgba(120,160,255,0.16)'; c.lineWidth = 1;
        bandPath(c, th0, th1, function (t) { return rad(t) - HW; }, function (t) { return rad(t) + HW; }, 5);
        c.stroke();
      }
    }

    /* ── 起终点方格线 ── */
    (function () {
      var n = 6;
      for (var k = 0; k < n; k++) {
        var a0 = -0.010 + k * 0.0034, a1 = a0 + 0.0034;
        bandPath(c, a0, a1, function (t) { return rad(t) - HW + HW * 2 * (k % 2) / 2; },
                 function (t) { return rad(t) - HW + HW * 2 * ((k % 2) + 1) / 2; }, 2);
        c.fillStyle = k % 2 ? '#e8f4ff' : '#2a3560'; c.globalAlpha = 0.75; c.fill(); c.globalAlpha = 1;
      }
    })();

    /* ── 能量索锚塔 ── */
