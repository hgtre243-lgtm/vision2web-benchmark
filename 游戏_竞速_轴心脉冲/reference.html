<script>
(function () {

/* ══════════════════════════════════════════════════════════════════
   AXELPULSE / PURE DATA-ORIENTED KERNEL
   64 KiB ARRAYBUFFER · FIXED COMPONENT POOLS · STATELESS SYSTEMS

/* ── 64 KiB 统一内存 ─────────────────────────────────────────── */

/* 组件步长：每实体 8 槽，128 实体 × 8 = 1024 */

    C_PHASE=6, C_PF=7, C_SEED=8, C_MANUAL=9, C_PAUSED=10,

    C_SCORE=21, C_KILL=22, C_PARRYOK=23, C_MAXHEAT=24, C_STUMB=25,
    C_OVER=26, C_DEMOT=27, C_BAKEP=28, C_BAKEPX=29, C_BAKENZ=30,
    C_UNIQ=31, C_ASTART=32, C_PSTART=33;
/* 输入保持计数 40..47 */
var C_HUP=40, C_HDN=41, C_HLF=42, C_HRT=43, C_HFIR=44, C_HPAR=45, C_HST=46, C_PREV=47;
/* 账本 64..68，五科目合计 200000 MILLES */
var C_LED=64;
/* 统计 80..95 */

/* ── 枚举 ───────────────────────────────────────────────────── */
var TOP_BOOT=0, TOP_ATTRACT=1, TOP_READY=2, TOP_ACTIVE=3, TOP_SETTLE=4;

             'ATTRACT_MODE_CALIBRATION','COUNTDOWN_3S_LOCK'];
var SUB_IDLE=0, SUB_ENGAGED=1, SUB_STUMBLE=2, SUB_OVERHEAT=3, SUB_PARRY=4;
var SUB_NAME=['IDLE','ENGAGED','STUMBLE','OVERHEAT','PARRYING'];
var SUB_ID={IDLE:0,ENGAGED:1,STUMBLE:2,OVERHEAT:3,PARRYING:4};

/* 层级守卫矩阵：行=当前，列=目标；1 允许。STUMBLE 行明确拒绝 PARRYING。 */
var GUARD = [
  [0,1,1,1,1], /* IDLE     */
  [1,0,1,1,1], /* ENGAGED  */
  [1,1,0,1,0], /* STUMBLE  -> PARRYING 拒绝 */
  [1,1,0,0,0], /* OVERHEAT */
  [0,1,1,1,0]  /* PARRYING */
];

/* 实体类型 */
var E_NONE=0, E_PLAYER=1, E_DRONE=2, E_PLATE=3, E_HAZARD=4, E_SHOT=5, E_GHOST=6;
/* 元素位 */
var EWET=1, EBURN=2, EELEC=4, EOIL=8;

/* 硬件输入扫描码 */
var SC_UP=1, SC_DN=2, SC_LF=4, SC_RT=8, SC_FIRE=16, SC_PARRY=32, SC_START=64;

/* ── 可复现随机（状态在内存中） ─────────────────────────────── */
function seed(n){ CTL[C_SEED] = (n|0) || 0x1a2b3c4d; }
function rnd(){
  var s = CTL[C_SEED]|0;
  s = (Math.imul(s, 1664525) + 1013904223) | 0;
  CTL[C_SEED] = s;
  return ((s >>> 8) & 0xffffff) / 0x1000000;
}
function rint(n){ return Math.floor(rnd()*n) % n; }

/* ══════════════════════════════════════════════════════════════
   内置 5×7 点阵字库（纯位图，绝不调用 ctx.font）
   ══════════════════════════════════════════════════════════════ */
var GLYPH = {
' ':'00000,00000,00000,00000,00000,00000,00000',
'A':'01110,10001,10001,11111,10001,10001,10001',
'B':'11110,10001,10001,11110,10001,10001,11110',
'C':'01110,10001,10000,10000,10000,10001,01110',
'D':'11100,10010,10001,10001,10001,10010,11100',
'E':'11111,10000,10000,11110,10000,10000,11111',
'F':'11111,10000,10000,11110,10000,10000,10000',
'G':'01110,10001,10000,10111,10001,10001,01111',
'H':'10001,10001,10001,11111,10001,10001,10001',
'I':'01110,00100,00100,00100,00100,00100,01110',
'J':'00111,00010,00010,00010,00010,10010,01100',
'K':'10001,10010,10100,11000,10100,10010,10001',
'L':'10000,10000,10000,10000,10000,10000,11111',
'M':'10001,11011,10101,10101,10001,10001,10001',
'N':'10001,11001,10101,10011,10001,10001,10001',

'S':'01111,10000,10000,01110,00001,00001,11110',
'T':'11111,00100,00100,00100,00100,00100,00100',
'U':'10001,10001,10001,10001,10001,10001,01110',
'V':'10001,10001,10001,10001,10001,01010,00100',
'W':'10001,10001,10001,10101,10101,11011,10001',
'X':'10001,10001,01010,00100,01010,10001,10001',
'Y':'10001,10001,01010,00100,00100,00100,00100',
'Z':'11111,00001,00010,00100,01000,10000,11111',

'1':'00100,01100,00100,00100,00100,00100,01110',
'2':'01110,10001,00001,00010,00100,01000,11111',
'3':'11111,00010,00100,00010,00001,10001,01110',
'4':'00010,00110,01010,10010,11111,00010,00010',
'5':'11111,10000,11110,00001,00001,10001,01110',
'6':'00110,01000,10000,11110,10001,10001,01110',
'7':'11111,00001,00010,00100,01000,01000,01000',
'8':'01110,10001,10001,01110,10001,10001,01110',
'9':'01110,10001,10001,01111,00001,00010,01100',
'.':'00000,00000,00000,00000,00000,01100,01100',
',':'00000,00000,00000,00000,01100,00100,01000',
':':'00000,01100,01100,00000,01100,01100,00000',
';':'00000,01100,01100,00000,01100,00100,01000',
'-':'00000,00000,00000,11111,00000,00000,00000',
'+':'00000,00100,00100,11111,00100,00100,00000',
'/':'00001,00010,00010,00100,01000,01000,10000',
'%':'11001,11010,00100,00100,01000,01011,10011',
'(':'00010,00100,01000,01000,01000,00100,00010',
')':'01000,00100,00010,00010,00010,00100,01000',
'[':'01110,01000,01000,01000,01000,01000,01110',
']':'01110,00010,00010,00010,00010,00010,01110',
'<':'00010,00100,01000,10000,01000,00100,00010',
'>':'01000,00100,00010,00001,00010,00100,01000',
'!':'00100,00100,00100,00100,00100,00000,00100',
'?':'01110,10001,00001,00010,00100,00000,00100',
'*':'00000,10101,01110,11111,01110,10101,00000',
'=':'00000,00000,11111,00000,11111,00000,00000',
'_':'00000,00000,00000,00000,00000,00000,11111',
'#':'01010,01010,11111,01010,11111,01010,01010',
'"':'01010,01010,00000,00000,00000,00000,00000',
"'":'00100,00100,00000,00000,00000,00000,00000',
'|':'00100,00100,00100,00100,00100,00100,00100'
};
var FONT = {};
(function buildFont(){
  for (var ch in GLYPH) {
    var rows = GLYPH[ch].split(','), col = [0,0,0,0,0], r, c;
    for (r = 0; r < 7; r++) {
      for (c = 0; c < 5; c++) {
        if (rows[r].charAt(c) === '1') col[c] |= (1 << r);
      }
    }
    FONT[ch] = col;
  }
})();

/* 点阵绘制：scale 为像素放大倍率，字宽 6*scale */
function pxText(ctx, str, x, y, scale, color){
  ctx.fillStyle = color;
  str = String(str).toUpperCase();
  var cx = x, i, c, k, col, rr;
  for (i = 0; i < str.length; i++) {
    c = FONT[str.charAt(i)];
    if (c) {
      for (k = 0; k < 5; k++) {
        col = c[k];
        for (rr = 0; rr < 7; rr++) {
          if (col & (1 << rr)) ctx.fillRect(cx + k*scale, y + rr*scale, scale, scale);
        }
      }
    }
    cx += 6*scale;
  }
}
function pxW(str, scale){ return String(str).length * 6 * scale - scale; }
function pxTextR(ctx, str, xr, y, scale, color){
  pxText(ctx, str, xr - pxW(str, scale), y, scale, color);
}
function pxTextC(ctx, str, xc, y, scale, color){
  pxText(ctx, str, Math.round(xc - pxW(str, scale)/2), y, scale, color);
}

/* 数字补零 */
function pad(n, w){ n = String(n|0); while (n.length < w) n = '0' + n; return n; }
function bin8(n){ var s = (n & 255).toString(2); while (s.length < 8) s = '0' + s; return s; }
function hex8(n){ var s = (n >>> 0).toString(16).toUpperCase(); while (s.length < 8) s = '0' + s; return s; }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* ── 轻量画布 ────────────────────────────────────────────────── */
function ctxOf(id){
  var cv = document.getElementById(id), c = cv.getContext('2d');
  c.imageSmoothingEnabled = false;
  return c;
}
var CW = ctxOf('world'), CT = ctxOf('thermal'), CP = ctxOf('posture'),
    CE = ctxOf('elements'), CH = ctxOf('hfsm'), CL = ctxOf('ledger');
var BCV = document.getElementById('bootcv'), BC = BCV.getContext('2d');
BC.imageSmoothingEnabled = false;

/* 离屏烘焙画布（不进入主画布） */
var OBA = document.createElement('canvas'); OBA.width = 256; OBA.height = 64;
var OBB = document.createElement('canvas'); OBB.width = 256; OBB.height = 64;
var OBAX = OBA.getContext('2d'), OBBX = OBB.getContext('2d');
OBAX.imageSmoothingEnabled = false; OBBX.imageSmoothingEnabled = false;
var LUT_N = [
  '#000000','#07131f','#0d2b3a','#12495c','#1a6f7e','#25989b','#3fc0ad','#7fe8c8',
  '#b9fff0','#a5f4ff','#62d4ff','#2d9cff','#3a63d8','#5c3fb8','#8c59e0','#ff7fe0'
];
var LUT_IR = [
  '#000000','#0a0410','#1c0828','#330a3d','#520c45','#7a0f43','#a31637','#c92b24',
  '#e64a17','#f56f0c','#ff9410','#ffb82a','#ffd75c','#fff0a0','#ffffff','#d8f6ff'
];

/* ══════════════════════════════════════════════════════════════
   实体池操作（全部落在定型数组，无对象、无继承）
   ══════════════════════════════════════════════════════════════ */
var POOLS = { TR:TR, MO:MO, TH:TH, PO:PO, CB:CB, ME:ME, EL:EL, CTL:CTL };

function entType(i){ return ME[i*S+1]; }
function entAlive(i){ return ME[i*S+2]; }
function entFree(i){ return ME[i*S+1] === E_NONE; }

function entKill(i){
  ME[i*S+1] = E_NONE; ME[i*S+2] = 0; EL[i*S] = 0;
  CB[i*S+0] = 0; CB[i*S+1] = 0;
}

function entSpawn(type, x, y){
  var i, base;
  for (i = 1; i < MAXE; i++) {
    if (ME[i*S+1] === E_NONE) break;
  }
  if (i >= MAXE) return -1;
  base = i*S;
  ME[base+0] = i; ME[base+1] = type; ME[base+2] = 1; ME[base+3] = 0;
  ME[base+4] = 0; ME[base+5] = 0; ME[base+6] = 0; ME[base+7] = 0;
  TR[base+0] = x; TR[base+1] = y; TR[base+2] = x; TR[base+3] = y;
  TR[base+4] = 0; TR[base+5] = 0; TR[base+6] = 1; TR[base+7] = 0;
  MO[base+0] = 0; MO[base+1] = 0; MO[base+2] = 0; MO[base+3] = 0;
  MO[base+4] = 0; MO[base+5] = 0; MO[base+6] = 0; MO[base+7] = 1;
  TH[base+0] = 0; TH[base+1] = 0; TH[base+2] = 1; TH[base+3] = 0;
  TH[base+4] = 0; TH[base+5] = 0; TH[base+6] = 0; TH[base+7] = 0;
  PO[base+0] = 0; PO[base+1] = 0; PO[base+2] = 100; PO[base+3] = 0;
  PO[base+4] = 0; PO[base+5] = 0; PO[base+6] = 0; PO[base+7] = 0;
  CB[base+0] = 1; CB[base+1] = 0; CB[base+2] = 0; CB[base+3] = 0;
  CB[base+4] = 1; CB[base+5] = type; CB[base+6] = 0; CB[base+7] = 0;
  EL[base+0] = 0; EL[base+1] = 0; EL[base+2] = 0;
  return i;
}

/* 极坐标 → 世界坐标（椭圆压缩制造非欧几里得曲率观感） */
function polarX(r, th){ return CX + Math.cos(th) * r; }
function polarY(r, th){ return CY + Math.sin(th) * r * 0.72; }
function trackRadius(i){ return MO[i*S+4]; }
function trackTheta(i){ return MO[i*S+5]; }

function syncPolar(i){
  var r = MO[i*S+4], th = MO[i*S+5];
  TR[i*S+2] = TR[i*S+0]; TR[i*S+3] = TR[i*S+1];
  TR[i*S+0] = polarX(r, th);
  TR[i*S+1] = polarY(r, th);
  TR[i*S+5] = TR[i*S+4];
  var dx = -Math.sin(th), dy = Math.cos(th) * 0.72;
  TR[i*S+4] = Math.atan2(dy, dx);
}

/* ══════════════════════════════════════════════════════════════
   初始化 / 重置
   ══════════════════════════════════════════════════════════════ */
var LEDGER_INIT = [56000, 42000, 40000, 36000, 26000]; /* Σ = 200000 */
function ledgerSum(){
  var s = 0, k;
  for (k = 0; k < 5; k++) s += CTL[C_LED+k];
  return s;
}
function xfer(a, b, amt){
  amt = amt|0;

/* ══════════════════════════════════════════════════════════════

    if (code & SC_DN)    CTL[C_HDN]  = HOLD_TICKS;
    if (code & SC_LF)    CTL[C_HLF]  = HOLD_TICKS;
    if (code & SC_RT)    CTL[C_HRT]  = HOLD_TICKS;
    if (code & SC_FIRE)  CTL[C_HFIR] = HOLD_TICKS;
    if (code & SC_PARRY) CTL[C_HPAR] = HOLD_TICKS;

  if (CTL[C_HUP] > 0)  { m |= SC_UP;    CTL[C_HUP]--; }

  if (CTL[C_HST] > 0)  { m |= SC_START; CTL[C_HST]--; }
  return m;
}

function keyPush(code){
  var head = CTL[C_HEAD];

/* 预录吸引模式输入带（600 帧循环，纯确定性） */

}

/* ══════════════════════════════════════════════════════════════

function MovementSystem(dt, P, input, top){

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════

function ElementReactionSystem(dt, P){

  if (end >= n) BAKE.seenDone = true;
  BAKE.prog = end / n;
  BAKE.outAX.putImageData(BAKE.imgA, 0, 0);
  BAKE.outBX.putImageData(BAKE.imgB, 0, 0);
}

/* ── 每固定步 ────────────────────────────────────────────────── */
function tick(dt){
  CTL[C_TICK]++;
  var top = CTL[C_TOP];
  if (CTL[C_SHAKE] > 0) CTL[C_SHAKE] *= 0.90;

  if (top === TOP_BOOT) {
    CTL[C_PF]++;
    if (CTL[C_PHASE] === PH_POST) {
      if (CTL[C_PF] >= 60) { CTL[C_PHASE] = PH_BAKE; CTL[C_PF] = 0; bakeInit(); }
    } else if (CTL[C_PHASE] === PH_BAKE) {
      bakeStep(112);
      CTL[C_BAKEP] = Math.floor(BAKE.prog * 100);
      CTL[C_BAKEPX] = BAKE.doneNZ;
      CTL[C_BAKENZ] = BAKE.totalNZ;
      CTL[C_UNIQ] = BAKE.uniq;
      if (CTL[C_PF] >= 150) { beginAttract(); }
    }
    return;
  }

  var input = InputSystem();
  var edgeStart = (input & SC_START) && !(CTL[C_PREV] & SC_START);

  if (top === TOP_ATTRACT) {
    CTL[C_PF]++;
    MovementSystem(dt, POOLS, input, TOP_ATTRACT);
    CombatSystem(dt, POOLS, input, true);
    HazardSystem(POOLS);
    CTL[C_HEAT] = POOLS.TH[0];
    CTL[C_POSTURE] = 100;
    CTL[C_ELEM] = POOLS.EL[0] & 0xFF;
    if (CTL[C_PF] > 72 && edgeStart) beginCountdown();
  } else if (top === TOP_READY) {
    CTL[C_PF]++;
    CTL[C_ZOOM] = 100 + Math.round(15 * Math.min(1, CTL[C_PF] / 180));
    MovementSystem(dt, POOLS, input, TOP_READY);
    HazardSystem(POOLS);
    if (CTL[C_PF] >= 180) beginActive();
  } else if (top === TOP_ACTIVE) {
    MovementSystem(dt, POOLS, input, TOP_ACTIVE);
    ThermodynamicSystem(dt, POOLS);
    PostureSystem(dt, POOLS, input);
    ElementReactionSystem(dt, POOLS);
    CombatSystem(dt, POOLS, input, false);
    HazardSystem(POOLS);
    HFSMSystem(dt, POOLS);
    RaceSystem(dt, POOLS);
    CTL[C_HEAT] = Math.round(POOLS.TH[0]);
    CTL[C_POSTURE] = Math.round(POOLS.PO[2]);
    CTL[C_ELEM] = POOLS.EL[0] & 0xFF;
    /* 记录关键事件用于面板 */
    if (POOLS.TH[3] > 2.9 && CTL[C_SUB] === SUB_OVERHEAT) logEvent(POOLS, 4);
    if (POOLS.PO[3] > 1.15) logEvent(POOLS, 5);
  } else if (top === TOP_SETTLE) {
    CTL[C_PF]++;
    if (edgeStart) beginCountdown();
    else if (CTL[C_PF] > 600) beginAttract();
  }

  CTL[C_PREV] = input;
}

/* ── 固定步驱动 / 手动探针 ───────────────────────────────────── */
function advance(now){
  if (HAL.manual) return;
  if (!HAL.last) HAL.last = now;
  if (HAL.frozen || HAL.paused) { HAL.last = now; return; }
  var dt = (now - HAL.last) / 1000;
  HAL.last = now;
  if (dt > 0.2) dt = 0.2;
  HAL.acc += dt;
  var n = 0;
  while (HAL.acc >= 1/60 && n < 8) { tick(1/60); HAL.acc -= 1/60; n++; }
}

var BAND = [116, 158, 200, 242, 284];
var STARS = [];
(function makeStars(){
  var s = 0x77aa33, i;
  for (i = 0; i < 150; i++) {
    s = (Math.imul(s, 1664525) + 1013904223) | 0;
    STARS.push({
      x: ((s >>> 8) % 816),
      y: ((s >>> 16) % 548),
      z: 0.25 + (((s >>> 3) & 255) / 255) * 0.75
    });
  }
})();
function ell(c, x, y, rx, ry, rot){
  c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI*2);
}
function strokeEll(c, r, col, lw){
  c.strokeStyle = col; c.lineWidth = lw || 1;
  c.beginPath(); c.ellipse(CX, CY, r, r*0.72, 0, 0, Math.PI*2); c.stroke();
}

function paintWorld(){
  var c = CW, tick = CTL[C_TICK], i, b;
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha = 1;
  c.fillStyle = '#04060e'; c.fillRect(0,0,816,548);

  /* 背景星野与曲率雾 */
  for (i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    var ox = Math.sin(tick*0.002 + i)*6*st.z;
    var oy = ((st.y + tick*0.05*st.z) % 548);
    c.fillStyle = 'rgba(110,160,220,' + (0.10 + st.z*0.22) + ')';
    c.fillRect(Math.round(st.x+ox), Math.round(oy), st.z > 0.7 ? 2 : 1, st.z > 0.7 ? 2 : 1);
  }
  var halo = c.createRadialGradient(CX, CY, 60, CX, CY, 430);
  halo.addColorStop(0,'rgba(30,80,130,0.22)');
  halo.addColorStop(0.55,'rgba(14,30,64,0.10)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = halo; c.fillRect(0,0,816,548);

  /* 摄像机：倒计时缩放 + 震屏 */
  var z = (CTL[C_ZOOM]||100)/100;
  var sh = CTL[C_SHAKE];
  var shx = sh > 0.2 ? Math.sin(tick*1.9)*sh : 0;
  var shy = sh > 0.2 ? Math.cos(tick*2.7)*sh : 0;
  c.save();
  c.translate(CX + shx, CY + shy);
  c.scale(z, z);
  c.translate(-CX, -CY);

  /* 五带环道 */
  for (i = 4; i >= 0; i--) {
    var r0 = BAND[i];
    c.fillStyle = (i % 2 === 0) ? '#0a1122' : '#0c172b';
    c.beginPath();
    c.ellipse(CX, CY, r0 + 20, (r0 + 20)*0.72, 0, 0, Math.PI*2);
    c.ellipse(CX, CY, r0 - 20, (r0 - 20)*0.72, 0, 0, Math.PI*2, true);
    c.fill();
  }
  /* 曲率刻度与车道线 */
  for (i = 0; i < 5; i++) {
    strokeEll(c, BAND[i], 'rgba(70,130,200,0.42)', 1);
    strokeEll(c, BAND[i]+0.6, 'rgba(20,40,70,0.8)', 1);
  }
  /* 非欧几里得曲率网格 */
  c.strokeStyle = 'rgba(40,80,140,0.16)'; c.lineWidth = 1;
  for (i = 0; i < 36; i++) {
    var th = i/36*Math.PI*2;
    c.beginPath();
    c.moveTo(polarX(94, th), polarY(94, th));
    c.lineTo(polarX(304, th), polarY(304, th));
    c.stroke();
  }
  /* 方向雪佛龙 */
  for (i = 0; i < 16; i++) {
    var tha = (i/16)*Math.PI*2 + tick*0.004;
    var rr = BAND[(i%5)];
    var cxx = polarX(rr, tha), cyy = polarY(rr, tha);
    var ang = Math.atan2(Math.cos(tha)*0.72, -Math.sin(tha));
    c.save(); c.translate(cxx, cyy); c.rotate(ang);
    c.strokeStyle = 'rgba(95,224,192,' + (0.12 + 0.10*Math.sin(tick*0.05+i)) + ')';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(-5,-4); c.lineTo(2,0); c.lineTo(-5,4); c.stroke();
    c.restore();
  }
  /* 起跑线 */
  var startTh = -Math.PI/2;
  c.save();
  c.translate(polarX(200, startTh), polarY(200, startTh));
  c.rotate(Math.PI/2);
  for (i = -6; i <= 6; i++) {
    c.fillStyle = (i % 2 === 0) ? 'rgba(159,240,255,0.65)' : 'rgba(30,50,80,0.65)';
    c.fillRect(i*9 - 4, -40, 9, 80);
  }
  c.restore();

  /* 危险区（先于实体） */
  for (i = 1; i < MAXE; i++) {
    if (ME[i*S+1] !== E_HAZARD || !ME[i*S+2]) continue;
    b = i*S;
    var hx = TR[b+0], hy = TR[b+1], hr = TR[b+6], kind = ME[b+4];
    if (kind === 0) { /* 油污 */
      c.fillStyle = 'rgba(40,18,58,0.72)';
      ell(c, hx, hy, hr, hr*0.55); c.fill();
      c.strokeStyle = 'rgba(180,90,255,0.55)'; c.lineWidth = 1; c.stroke();
      c.fillStyle = 'rgba(90,240,210,0.22)';
      ell(c, hx - hr*0.2, hy - hr*0.1, hr*0.4, hr*0.16); c.fill();
      pxText(c, 'OIL', hx - 10, hy - 4, 1, 'rgba(200,140,255,0.75)');
    } else if (kind === 1) { /* 酸雨 */
      c.fillStyle = 'rgba(20,90,130,0.16)';
      ell(c, hx, hy, hr, hr*0.62); c.fill();
      c.strokeStyle = 'rgba(98,212,255,0.55)'; c.setLineDash([3,4]); c.stroke(); c.setLineDash([]);
      for (var rn = 0; rn < 7; rn++) {
        var rx = hx + Math.sin(tick*0.05 + rn*1.7) * hr*0.7;
        var ry = hy + ((tick*2.2 + rn*13) % (hr*1.1)) - hr*0.5;
        c.fillStyle = 'rgba(140,230,255,0.55)';
        c.fillRect(rx, ry, 1, 6);
      }
      pxText(c, 'WET', hx - 9, hy - 4, 1, 'rgba(140,230,255,0.75)');
    } else if (kind === 2) { /* 电弧桩 */
      c.strokeStyle = 'rgba(98,212,255,0.5)'; c.lineWidth = 2;
      c.strokeRect(hx - 6, hy - 16, 12, 24);
      c.fillStyle = 'rgba(98,212,255,0.28)'; c.fillRect(hx-8, hy-22, 16, 6);
      for (var ar = 0; ar < 3; ar++) {
        var a2 = tick*0.11 + ar*2.1;
        c.strokeStyle = 'rgba(180,240,255,' + (0.25+0.25*Math.sin(tick*0.4+ar)) + ')';
        c.beginPath();
        c.moveTo(hx, hy-18);
        c.lineTo(hx + Math.cos(a2)*hr*0.7, hy + Math.sin(a2)*hr*0.4);
        c.stroke();
      }
      pxText(c, 'ELEC', hx - 13, hy + 12, 1, 'rgba(140,230,255,0.8)');
    } else if (kind === 3) { /* 地面火 */
      c.fillStyle = 'rgba(255,110,25,0.22)';
      ell(c, hx, hy, hr, hr*0.58); c.fill();
      for (var fl = 0; fl < 12; fl++) {
        var fa = fl*0.55 + tick*0.11;
        var fx = hx + Math.cos(fa)*hr*(0.20 + (fl%4)*0.18);
        var fy = hy + Math.sin(fa)*hr*0.42;
        var fh = 8 + (fl%4)*5 + Math.sin(tick*0.3+fl)*4;
        c.fillStyle = fl%2 ? 'rgba(255,105,25,0.85)' : 'rgba(255,214,80,0.85)';
        c.fillRect(fx - 3, fy - fh, 6, fh);
        c.fillStyle = 'rgba(255,250,190,0.55)';
        c.fillRect(fx - 1, fy - fh, 2, fh*0.55);
      }
    } else if (kind === 4) { /* 蒸汽 */
      for (var sm = 0; sm < 6; sm++) {
        var sa = sm*1.05 + tick*0.008;
        var sx = hx + Math.cos(sa)*hr*(0.15 + (sm%3)*0.25);
        var sy = hy + Math.sin(sa)*hr*0.18;
        c.fillStyle = 'rgba(225,240,255,' + (0.10 + 0.06*Math.sin(tick*0.13+sm)) + ')';
        ell(c, sx, sy, hr*0.62, hr*0.42); c.fill();
      }
      pxText(c, 'STEAM', hx - 14, hy - 4, 1, 'rgba(235,245,255,0.55)');
    }
  }

  /* 道板 */
  for (i = 1; i < MAXE; i++) {
    if (ME[i*S+1] !== E_PLATE || !ME[i*S+2]) continue;
    b = i*S;
    var px = TR[b+0], py = TR[b+1];
    var pang = Math.atan2(Math.cos(MO[b+5])*0.72, -Math.sin(MO[b+5]));
    c.save(); c.translate(px, py); c.rotate(pang);
    c.fillStyle = (ME[b+5] % 2 === 0) ? 'rgba(31,70,104,0.85)' : 'rgba(38,52,92,0.85)';
    c.fillRect(-13, -5, 26, 10);
    c.strokeStyle = 'rgba(95,224,192,0.35)'; c.lineWidth = 1;
    c.strokeRect(-13.5, -5.5, 27, 11);
    c.fillStyle = 'rgba(159,240,255,0.35)';
    c.fillRect(-9, -1, 18, 2);
    c.restore();
  }

  /* 无人机 */
  for (i = 1; i < MAXE; i++) {
    if (ME[i*S+1] !== E_DRONE || !ME[i*S+2]) continue;
    b = i*S;
    var dx = TR[b+0], dy = TR[b+1];
    var variant = ME[b+4] & 3;
    var elb = EL[b+0];
    c.save();
    c.translate(dx, dy);
    c.rotate(tick*0.03 + i);
    if (SPRITE_N) {
      c.drawImage(SPRITE_N, variant*64, 32, 32, 32, -15, -15, 30, 30);
    } else {
      c.fillStyle = '#b98cff';
      c.beginPath(); c.moveTo(0,-14); c.lineTo(13,0); c.lineTo(0,14); c.lineTo(-13,0); c.closePath(); c.fill();
    }
    c.restore();
    /* 元素附着与血条 */
    if (elb) {
      var ecol = (elb & EWET) ? '#62d4ff' : ((elb & EBURN) ? '#ff8a3c' :
                 ((elb & EELEC) ? '#b8f4ff' : '#c08bff'));
      c.strokeStyle = ecol; c.lineWidth = 1.5;
      c.beginPath(); c.arc(dx, dy, 17 + Math.sin(tick*0.2+i)*1.5, 0, Math.PI*2); c.stroke();
    }
    if (CB[b+0] < 42) {
      c.fillStyle = 'rgba(10,14,24,0.8)'; c.fillRect(dx - 13, dy - 23, 26, 3);
      c.fillStyle = CB[b+0] > 18 ? '#ffd479' : '#ff5f6b';
      c.fillRect(dx - 13, dy - 23, Math.max(0, Math.round(26*CB[b+0]/42)), 3);
    }
    if (EL[b+1] > 0) {
      c.strokeStyle = 'rgba(160,240,255,0.7)'; c.lineWidth = 1;
      c.beginPath(); c.arc(dx, dy, 21, 0, Math.PI*2); c.stroke();
    }
  }

  /* 玩家射击 */
  for (i = 1; i < MAXE; i++) {
    if (ME[i*S+1] !== E_SHOT || !ME[i*S+2]) continue;
    b = i*S;
    var sx = TR[b+0], sy = TR[b+1], team = ME[b+3];
    c.save(); c.translate(sx, sy); c.rotate(TR[b+4]);
    c.fillStyle = team === 0 ? '#9ff4ff' : '#ff7fe0';
    c.fillRect(-7, -1, 14, 2);
    c.globalAlpha = 0.35;
    c.fillRect(-13, -3, 26, 6);
    c.globalAlpha = 1;
    c.restore();
  }

  /* 电弧级联特效 */
  if (CTL[90] > 0) {
    CTL[90]--;
    for (i = 1; i < MAXE; i++) {
      if (ME[i*S+1] !== E_DRONE || !ME[i*S+2]) continue;
      b = i*S;
      var ax = TR[0], ay = TR[1], bx2 = TR[b+0], by2 = TR[b+1];
      var ddx = bx2-ax, ddy = by2-ay, dl = Math.sqrt(ddx*ddx+ddy*ddy) || 1;
      if (dl > 200) continue;
      c.strokeStyle = 'rgba(170,245,255,0.85)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(ax, ay);
      for (var seg = 1; seg < 7; seg++) {
        var tt = seg/7;
        var jx = ax + ddx*tt + Math.sin(tick*0.7 + seg*2.2)*7;
        var jy = ay + ddy*tt + Math.cos(tick*0.6 + seg*1.9)*7;
        c.lineTo(jx, jy);
      }
      c.lineTo(bx2, by2); c.stroke();
    }
  }

  /* 玩家 */
  b = 0;
  var ppx = TR[0], ppy = TR[1];
  var ptilt = PO[0] * Math.PI/180 * 0.55;
  var heading = TR[4];
  var frame = Math.floor(tick/6) % 4;
  /* 速度尾迹 */
  var spd = MO[2];
  if (spd > 60) {
    for (i = 0; i < 10; i++) {
      var ta = heading + Math.PI + (i-5)*0.05;
      var tl = 10 + (i%3)*7 + (spd/VMAX)*22;
      c.strokeStyle = 'rgba(95,224,192,' + (0.12 + (spd/VMAX)*0.25) + ')';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo(ppx + Math.cos(ta)*8, ppy + Math.sin(ta)*8);
      c.lineTo(ppx + Math.cos(ta)*tl, ppy + Math.sin(ta)*tl);
      c.stroke();
    }
  }
  c.save();
  c.translate(ppx, ppy);
  c.rotate(heading + Math.PI/2 + ptilt);
  if (CTL[C_SUB] === SUB_STUMBLE && (tick >> 1) % 2 === 0) c.globalAlpha = 0.55;
  if (SPRITE_N) {
    c.drawImage(SPRITE_N, frame*64, 0, 32, 32, -23, -23, 46, 46);
  } else {
    c.fillStyle = '#5fe0c0'; c.fillRect(-10,-16,20,32);
  }
  c.globalAlpha = 1;
  /* 护盾 */
  if (CB[1] > 0.5) {
    c.strokeStyle = 'rgba(98,212,255,' + (0.16 + CB[1]/100*0.30) + ')';
    c.lineWidth = 2;
    c.beginPath(); c.arc(0,0,26,0,Math.PI*2); c.stroke();
  }
  /* 过热 / 格挡环 */
  if (CTL[C_SUB] === SUB_OVERHEAT) {
    c.strokeStyle = 'rgba(255,90,60,' + (0.35+0.25*Math.sin(tick*0.5)) + ')';
    c.lineWidth = 3; c.beginPath(); c.arc(0,0,32,0,Math.PI*2); c.stroke();
  } else if (CTL[C_SUB] === SUB_PARRY) {
    c.strokeStyle = 'rgba(255,212,121,' + (0.55+0.35*Math.sin(tick*0.9)) + ')';
    c.lineWidth = 3;
    c.beginPath(); c.arc(0,0,30, -0.9, 0.9); c.stroke();
  }
  c.restore();

  /* 引擎粒子（确定性、仅视觉） */
  var heat = TH[0];
  if (heat > 55) {
    for (i = 0; i < 7; i++) {
      var ea = heading + Math.PI + Math.sin(tick*0.23 + i*2.1)*0.5;
      var ed = 16 + ((tick*1.7 + i*9) % 26);
      c.fillStyle = 'rgba(255,' + (150 - Math.floor(heat)) + ',40,' +
                    (0.18 + 0.22*Math.sin(tick*0.4+i)) + ')';
      c.fillRect(ppx + Math.cos(ea)*ed - 2, ppy + Math.sin(ea)*ed - 2, 4, 4);
    }
  }
  c.restore();

  /* 屏幕层 HUD */
  if (CTL[C_TOP] !== TOP_ATTRACT) {
    pxText(c, 'LAP ' + Math.min(3, CTL[C_LAP]+1) + '/3', 14, 26, 2, 'rgba(159,240,255,0.85)');
    pxTextR(c, 'SCORE ' + pad(CTL[C_SCORE], 6), 802, 26, 2, 'rgba(255,212,121,0.85)');
  }
  pxText(c, 'SPD ' + pad(Math.round(spd), 3) + ' PX/S', 14, 514, 2, 'rgba(120,220,200,0.8)');
  pxTextR(c, 'R ' + Math.round(MO[4]) + ' / TH ' + ((MO[5]*57.2958)|0), 802, 514, 2, 'rgba(120,180,220,0.8)');
  /* 环速线 */
  if (spd > VMAX*0.8) {
    for (i = 0; i < 14; i++) {
      var la = (i/14)*Math.PI*2 + tick*0.02;
      var lr = 330;
      var lx = CX + Math.cos(la)*lr, ly = CY + Math.sin(la)*lr*0.72;
      c.strokeStyle = 'rgba(150,240,255,0.10)';
      c.beginPath();
      c.moveTo(lx, ly);
      c.lineTo(CX + Math.cos(la)*(lr-34), CY + Math.sin(la)*(lr-34)*0.72);
      c.stroke();
    }
  }
  /* 扫描线 */
  c.globalAlpha = 0.10;
  c.fillStyle = '#7fe8ff';
  for (var sy = 0; sy < 548; sy += 4) c.fillRect(0, sy, 816, 1);
  c.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   侧栏渲染
   ══════════════════════════════════════════════════════════════ */
function panelBg(c, w, h){
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha = 1;
  c.fillStyle = '#060912'; c.fillRect(0,0,w,h);
  c.strokeStyle = 'rgba(43,47,110,0.45)'; c.lineWidth = 1;
  for (var x = 0; x < w; x += 24) { c.beginPath(); c.moveTo(x,0); c.lineTo(x,h); c.stroke(); }
  for (var y = 0; y < h; y += 24) { c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
}
function bar(c, x, y, w, h, frac, colA, colB){
  c.fillStyle = '#0a1220'; c.fillRect(x, y, w, h);
  var f = clamp(frac, 0, 1);
  var g = c.createLinearGradient(x, 0, x+w, 0);
  g.addColorStop(0, colA); g.addColorStop(1, colB);
  c.fillStyle = g; c.fillRect(x, y, Math.round(w*f), h);
  c.strokeStyle = 'rgba(120,150,220,0.35)'; c.lineWidth = 1;
  c.strokeRect(x+0.5, y+0.5, w-1, h-1);
}

function paintThermal(){
  var c = CT, h = TH[0], cool = TH[1], over = TH[3];
  panelBg(c, 424, 150);
  c.save(); c.translate(0, 18);
  pxText(c, 'THERMAL GRID', 10, 8, 2, '#5fe0c0');
  pxTextR(c, '0-100 / CONVECTION', 414, 9, 1, '#4f7f9f');
  var hx = 12, hy = 28, hw = 268;
  bar(c, hx, hy, hw, 16, h/100, '#1a7f9c', h > 85 ? '#ff5f3c' : '#5fe0c0');
  c.fillStyle = '#ffd479'; c.fillRect(hx + Math.round(hw*0.85), hy - 4, 2, 24);
  pxText(c, 'HEAT ' + h.toFixed(1), hx, hy + 22, 2, h > 85 ? '#ff8a5c' : '#9ff4ff');
  pxTextR(c, 'LIMIT 100 / CUT 85', hx + hw, hy + 24, 1, '#6f7fb8');
  /* sqrt 对流曲线 */
  var cx0 = 300, cy0 = 108, cw = 108, ch = 54;
  c.strokeStyle = 'rgba(60,90,140,0.5)'; c.strokeRect(cx0, cy0-ch, cw, ch);
  c.strokeStyle = 'rgba(95,224,192,0.85)'; c.lineWidth = 1.5;
  c.beginPath();
  for (var k = 0; k <= 40; k++) {
    var sp = k/40*VMAX;
    var cv = sp < VMAX*0.85 ? 0.42*Math.sqrt(sp) : 0;
    var xx = cx0 + k/40*cw, yy = cy0 - cv/9*ch;
    if (k === 0) c.moveTo(xx, yy); else c.lineTo(xx, yy);
  }
  c.stroke();
  var curSp = MO[2];
  var curCv = curSp < VMAX*0.85 ? 0.42*Math.sqrt(curSp) : 0;
  c.fillStyle = '#ffd479';
  c.fillRect(cx0 + clamp(curSp/VMAX,0,1)*cw - 2, cy0 - curCv/9*ch - 2, 4, 4);
  c.fillStyle = 'rgba(255,212,121,0.22)';
  c.fillRect(cx0 + 0.85*cw, cy0-ch, 1.5, ch);
  pxText(c, 'COOL=K*SQRT(SPD)', cx0, cy0 - ch - 12, 1, '#4f7f9f');
  pxText(c, 'CONV ' + cool.toFixed(1), cx0, cy0 + 8, 1, '#7fe8c8');
  pxTextR(c, 'CUT 85%', cx0 + cw, cy0 + 8, 1, '#ffd479');

  var gain = 0;
  if (MO[2] > VMAX*0.85) gain = (MO[2]-VMAX*0.85)*0.085;
  pxText(c, 'GAIN +' + gain.toFixed(1) + ' /S', 12, 78, 1, gain > 0 ? '#ff8a5c' : '#4f7f9f');
  pxText(c, 'WET COOL X1.45 ' + ((EL[0]&EWET) ? 'ON' : 'OFF'), 12, 90, 1, (EL[0]&EWET) ? '#62d4ff' : '#3a4a66');
  if (over > 0) {
    c.fillStyle = 'rgba(255,70,40,0.18)'; c.fillRect(8, 96, 284, 40);
    pxText(c, 'SYSTEM_OVERHEAT ' + over.toFixed(2) + 'S', 14, 102, 1, '#ff8a5c');
    pxText(c, 'SHIELD 0 / WEAPON LOCK / CTRL INVERT', 14, 120, 1, '#ff5f6b');
  } else {
    pxText(c, 'SHIELD ' + Math.round(CB[1]) + ' / WEAPONS READY', 12, 104, 1, '#9fe8ff');
    pxText(c, 'COOLING PROPORTIONAL TO SQRT(SPEED)', 12, 118, 1, '#4f6f8f');
  }
  c.restore();
}

function paintPosture(){
  var c = CP, tilt = PO[0], pv = PO[1], post = PO[2], st = PO[3];
  panelBg(c, 424, 146);
  c.save(); c.translate(0, 18);
  pxText(c, 'POSTURE / RECOIL', 10, 8, 2, '#ff9de2');
  pxTextR(c, 'TILT -90 / +90', 414, 9, 1, '#8f5f8f');
  /* 倾角弧 */
  var cx0 = 84, cy0 = 100, R = 54;
  c.strokeStyle = 'rgba(120,70,140,0.55)'; c.lineWidth = 7;
  c.beginPath(); c.arc(cx0, cy0, R, Math.PI, Math.PI*2); c.stroke();
  c.strokeStyle = 'rgba(255,80,90,0.65)'; c.lineWidth = 3;
  c.beginPath(); c.arc(cx0, cy0, R+7, Math.PI, Math.PI+Math.PI*0.166); c.stroke();
  c.beginPath(); c.arc(cx0, cy0, R+7, Math.PI*2-Math.PI*0.166, Math.PI*2); c.stroke();
  var na = Math.PI + (clamp(tilt,-90,90)+90)/180*Math.PI;
  c.strokeStyle = Math.abs(tilt) > 60 ? '#ff5f6b' : '#ffd479'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(cx0, cy0); c.lineTo(cx0 + Math.cos(na)*R*0.86, cy0 + Math.sin(na)*R*0.86); c.stroke();
  c.fillStyle = '#ffd479'; c.beginPath(); c.arc(cx0, cy0, 4, 0, Math.PI*2); c.fill();
  pxTextC(c, '-90', cx0-R-12, cy0+7, 1, '#8f5f8f');
  pxTextC(c, '+90', cx0+R+12, cy0+7, 1, '#8f5f8f');
  pxTextC(c, 'TILT ' + tilt.toFixed(1), cx0, cy0+18, 1, Math.abs(tilt)>60?'#ff5f6b':'#ffd8ff');
  pxTextC(c, 'ANG.VEL ' + pv.toFixed(0), cx0, cy0-14, 1, '#a06a9a');

  /* 姿态条 */
  var bx = 192, by = 34, bw = 216;
  pxText(c, 'POSTURE ' + Math.round(post), bx, by, 2, post < 30 ? '#ff5f6b' : '#9fe8ff');
  bar(c, bx, by + 18, bw, 12, post/100, '#a03050', post > 50 ? '#ff9de2' : '#ff5f6b');
  c.fillStyle = 'rgba(255,255,255,0.25)';
  c.fillRect(bx + bw*0.15, by+16, 1, 16);
  pxText(c, 'TRIM ' + (PO[6] ? 'COUNTER-STEER' : '----'), bx, by + 38, 1, PO[6] ? '#5fe0c0' : '#3a4a66');
  pxText(c, 'DAMAGE X' + (st > 0 ? '3.0' : '1.0'), bx, by + 52, 1, st > 0 ? '#ff5f6b' : '#6f7fb8');
  pxText(c, 'DODGE ' + (st > 0 ? 'NONE' : (PO[7] ? 'ACTIVE' : 'STANDBY')), bx, by + 64, 1,
         st > 0 ? '#ff5f6b' : '#4f7f9f');
  if (st > 0) {
    c.fillStyle = 'rgba(255,60,60,' + (0.10 + 0.08*Math.sin(CTL[C_TICK]*0.5)) + ')';
    c.fillRect(bx-4, by-4, bw+8, 90);
    pxText(c, 'STUMBLE ' + st.toFixed(2) + 'S', bx + 4, by + 78, 1, '#ff5f6b');
  } else {
    pxText(c, 'BALANCE WINDOW +/-14 DEG', bx, by + 78, 1, '#4f6f8f');
  }
  pxText(c, 'RECOIL ' + Math.round(PO[5]), 10, 34, 1, '#8f5f8f');
  c.fillStyle = 'rgba(255,157,226,0.75)'; c.fillRect(54, 36, Math.min(40, PO[5]*2), 2);
  c.restore();
}

function paintElements(){
  var c = CE, bits = EL[0] & 0xFF, heat = TH[0];
  panelBg(c, 424, 124);
  c.save(); c.translate(0, 18);
  pxText(c, 'ELEMENT CASCADE', 10, 8, 2, '#b98cff');
  pxTextR(c, 'MASK ' + bin8(bits) + ' / ' + bits, 414, 9, 1, '#8f6faf');
  var rows = [
    ['OILED', 8, '#c08bff'], ['ELECTRIFIED', 4, '#9ff4ff'],
    ['BURNING', 2, '#ff9d4a'], ['WET', 1, '#62d4ff']
  ];
  for (var i = 0; i < 4; i++) {
    var y = 24 + i*16, on = (bits & rows[i][1]) !== 0;
    c.fillStyle = on ? rows[i][2] : '#1b2030';
    c.fillRect(10, y, 7, 15);
    pxText(c, rows[i][0], 24, y + 2, 2, on ? rows[i][2] : '#43506a');
    c.fillStyle = '#0a1220'; c.fillRect(166, y + 3, 54, 8);
    c.fillStyle = on ? rows[i][2] : '#182030';
    var ttlBit = rows[i][1];
    var ttl = ttlBit === 8 ? TH[6] : (ttlBit === 4 ? TH[7] : (ttlBit === 2 ? TH[5] : TH[4]));
    var frac = on ? clamp(ttl/4, 0, 1) : 0;
    c.fillRect(166, y+3, Math.round(54*frac), 8);
    pxText(c, on ? ttl.toFixed(1) + 'S' : 'OFF', 226, y+2, 1, on ? rows[i][2] : '#3a4560');
  }
  /* 级联判定 */
  var stat = 'STABLE', col = '#4f6f8f';
  if ((bits & 8) && (bits & 2)) { stat = 'OIL+BURN > EXPLOSION + 5S FIRE'; col = '#ff9d4a'; }
  else if ((bits & 1) && heat >= 70) { stat = 'WET+HEAT > VAPORIZE / STEAM'; col = '#9ff4ff'; }
  else if ((bits & 1) && (bits & 4)) { stat = 'WET+ELEC > 200PX ARC CHAIN'; col = '#b8f4ff'; }
  else if (heat >= 85) { stat = 'HEAT CRITICAL / VENT NOW'; col = '#ff9d4a'; }
  pxText(c, stat, 10, 92, 1, col);
  pxTextR(c, 'ACCURACY -80% IN STEAM', 414, 92, 1, '#5f6f9f');
  c.restore();
}

function paintHFSM(){
  var c = CH, sub = CTL[C_SUB], top = CTL[C_TOP];
  panelBg(c, 424, 110);
  c.save(); c.translate(0, 18);
  pxText(c, 'HIERARCHICAL FSM', 10, 8, 2, '#9fe8ff');
  pxTextR(c, TOP_NAME[top] + (top===TOP_BOOT ? ' / ' + PH_NAME[CTL[C_PHASE]] : ''), 414, 9, 1, '#7a86c8');
  var order = [SUB_IDLE, SUB_ENGAGED, SUB_STUMBLE, SUB_OVERHEAT, SUB_PARRY];
  for (var i = 0; i < 5; i++) {
    var x = 10 + i*82, on = sub === order[i];
    c.fillStyle = on ? '#1d4a5e' : '#0c1424';
    c.fillRect(x, 24, 76, 18);
    c.strokeStyle = on ? '#5fe0c0' : '#243052'; c.lineWidth = 1;
    c.strokeRect(x+0.5, 24.5, 75, 17);
    pxTextC(c, SUB_NAME[order[i]], x+38, 30, 1, on ? '#9ff4ff' : '#4f5f7f');
  }
  /* 守卫矩阵 5x5 */
  var mx = 10, my = 46, cell = 9;
  for (var r = 0; r < 5; r++) {
    for (var q = 0; q < 5; q++) {
      var ok = GUARD[r][q] === 1;
      var hi = (r === sub);
      c.fillStyle = ok ? (q === sub && hi ? '#5fe0c0' : '#2a5f5a') : '#2a1620';
      c.fillRect(mx + q*cell, my + r*cell, 7, 7);
      if (hi && q === sub) { c.strokeStyle = '#ffd479'; c.strokeRect(mx+q*cell-1, my+r*cell-1, 9, 9); }
    }
  }
  pxText(c, 'GUARD', mx + 70, my + 2, 1, '#6f7fb8');
  pxText(c, 'STUMBLE > PARRYING', mx + 70, my + 18, 1, '#ff5f6b');
  pxText(c, 'REJECTED BY MATRIX', mx + 70, my + 32, 1, '#8f5f7f');
  /* 转移条件读数 */
  pxText(c, 'HEAT ' + Math.round(TH[0]) + '  TILT ' + PO[0].toFixed(0) +
         '  POST ' + Math.round(PO[2]) + '  SPD ' + Math.round(MO[2]),
         226, 56, 1, '#9fe8ff');
  pxText(c, 'SUB ' + SUB_NAME[sub] + ' / T' + CTL[C_SUBT], 226, 68, 1, '#ffd479');
  pxText(c, 'TRANSITION LOG ' + (CTL[C_SUBT] < 4 ? 'ARMED' : 'LOCKED'), 226, 80, 1, '#5f7faf');
  c.restore();
}

function paintLedger(){
  var c = CL, i;
  panelBg(c, 1256, 96);
  c.save(); c.translate(0, 18);
  pxText(c, 'CONSERVATION LEDGER / 5 SUBJECTS / MILLES', 12, 8, 2, '#ffd479');
  var names = ['HULL', 'DRIVE', 'QUOTA', 'SURFACE', 'RESERVE'];
  var cols = ['#5fe0c0', '#62d4ff', '#ffd479', '#c08bff', '#ff9d4a'];
  var sum = 0;
  for (i = 0; i < 5; i++) {
    var v = CTL[C_LED+i]; sum += v;
    var x = 12 + i*142;
    c.fillStyle = '#0a1220'; c.fillRect(x, 34, 128, 10);
    c.fillStyle = cols[i]; c.fillRect(x, 34, Math.round(128*clamp(v/60000,0,1)), 10);
    pxText(c, names[i], x, 50, 1, cols[i]);
    pxTextR(c, pad(v, 5), x + 128, 50, 1, '#c8d8f0');
  }
  var inv = ledgerSum();
  pxText(c, 'SUM ' + pad(inv,6) + ' / 200000', 730, 8, 2, inv === 200000 ? '#5fe0c0' : '#ff5f6b');
  pxText(c, inv === 200000 ? 'INVARIANT OK' : 'INVARIANT BROKEN', 986, 9, 1,
         inv === 200000 ? '#3f9f8a' : '#ff5f6b');
  pxText(c, 'KILL ' + pad(CTL[C_KILL],3) + '  PARRY ' + pad(CTL[C_PARRYOK],3) +
         '  DONE ' + pad(CTL[C_LAP],1) + '/3', 730, 28, 2, '#9fe8ff');
  pxText(c, 'MAXHEAT ' + pad(CTL[C_MAXHEAT],3) + '  STUMBLE ' + pad(CTL[C_STUMB],2) +
         '  RACE ' + (CTL[C_RACE]/60).toFixed(1) + 'S', 730, 44, 1, '#9fe8ff');
  var z = CTL[C_ZOOM], sh = CTL[C_SHAKE];
  pxText(c, 'ZOOM ' + z + '%  SHAKE ' + sh.toFixed(1), 730, 54, 1, '#7f8fc8');
  /* 耦合位掩码 */
  var m = ((CTL[C_HEAT]&255)<<24 | (CTL[C_POSTURE]&255)<<16 | (CTL[C_ELEM]&255)<<8 | (CTL[C_SUB]&255)) >>> 0;
  pxText(c, 'COUPLED 0x' + hex8(m), 730, 64, 1, '#ff9de2');
  pxText(c, 'H' + CTL[C_HEAT] + ' P' + CTL[C_POSTURE] + ' E' + pad(CTL[C_ELEM],2) + ' S' + CTL[C_SUB],
         900, 64, 1, '#a06a9a');
  /* 右端状态灯 */
  for (i = 0; i < 7; i++) {
    c.fillStyle = (CTL[C_TICK] + i*7) % 60 < 30 ? '#5fe0c0' : '#1a3030';
    c.fillRect(1180 + (i%4)*15, 12 + Math.floor(i/4)*16, 8, 8);
  }
  pxTextR(c, 'TICK ' + pad(CTL[C_TICK], 6), 1244, 64, 1, '#5f7faf');
  c.restore();
}

/* ══════════════════════════════════════════════════════════════
   DOM 顶栏 / 结算
   ══════════════════════════════════════════════════════════════ */
var $ = function(id){ return document.getElementById(id); };
function syncBar(){
  var sub = CTL[C_SUB], top = CTL[C_TOP];
  $('hStage').textContent = TOP_NAME[top];
  if (top === TOP_BOOT) $('hSub').textContent = PH_NAME[CTL[C_PHASE]];
  else if (top === TOP_READY) $('hSub').textContent = 'COUNTDOWN_3S_LOCK';
  else if (top === TOP_ATTRACT) $('hSub').textContent = 'ATTRACT_MODE_CALIBRATION';
  else if (top === TOP_ACTIVE) $('hSub').textContent = SUB_NAME[sub];
  else $('hSub').textContent = 'RUN_COMPLETE';
  var m = ((CTL[C_HEAT]&255)<<24 | (CTL[C_POSTURE]&255)<<16 | (CTL[C_ELEM]&255)<<8 | (CTL[C_SUB]&255)) >>> 0;
  $('hBits').textContent = 'COUPLE 0x' + hex8(m);
  $('hTick').textContent = CTL[C_TICK];
  $('hHeat').textContent = CTL[C_HEAT];
  $('hPos').textContent = CTL[C_POSTURE];
  $('hElem').textContent = bin8(CTL[C_ELEM]);
}
function hideOv(){ $('ov').className = 'hide'; $('ov').innerHTML = ''; }
function showSettlement(){
  var finished = CTL[C_LAP] >= 3;
  var dead = CB[0] <= 0;
  var secs = (CTL[C_RACE]/60).toFixed(2);
  var title = finished ? 'RUN SETTLED' : (dead ? 'HULL LOST' : 'TIME EXPIRED');
  var html = '<div class="big">' + title + '</div>' +
    '<div class="mid">' + (finished ? 'THREE LAPS CLEARED' : 'SETTLEMENT / LEDGER CLOSED') + '</div>' +
    '<div class="rule"></div><table>' +
    '<tr><td class="k">LAPS</td><td class="v">' + Math.min(3, CTL[C_LAP]) + ' / 3</td></tr>' +
    '<tr><td class="k">RACE TIME</td><td class="v">' + secs + ' S</td></tr>' +
    '<tr><td class="k">KILLS</td><td class="v">' + CTL[C_KILL] + '</td></tr>' +
    '<tr><td class="k">PARRIES</td><td class="v">' + CTL[C_PARRYOK] + '</td></tr>' +
    '<tr><td class="k">STUMBLES</td><td class="v">' + CTL[C_STUMB] + '</td></tr>' +
    '<tr><td class="k">MAX HEAT</td><td class="v">' + CTL[C_MAXHEAT] + '</td></tr>' +
    '<tr><td class="k">SCORE</td><td class="v">' + CTL[C_SCORE] + '</td></tr>' +
    '<tr><td class="k">LEDGER SUM</td><td class="v">' + ledgerSum() + ' / 200000</td></tr>' +
    '</table><div class="rule"></div>' +
    '<div class="hint">PRESS START / SCAN 64 TO RECALIBRATE</div>';
  var ov = $('ov');
  ov.className = '';
  ov.innerHTML = html;
  ov.style.pointerEvents = 'none';
}

/* ══════════════════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════════════════ */
function paintAll(){
  paintWorld();
  paintThermal();
  paintPosture();
  paintElements();
  paintHFSM();
  paintLedger();
  paintBoot();
  syncBar();
  if (CTL[C_TOP] === TOP_SETTLE) { if ($('ov').className === 'hide') showSettlement(); }
  else if (CTL[C_TOP] !== TOP_ATTRACT && CTL[C_TOP] !== TOP_READY) {
    var ov = $('ov'); if (ov.className !== 'hide') hideOv();
  }
}
function frame(now){
  advance(now);
  paintAll();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════
   自检 / 探针
   ══════════════════════════════════════════════════════════════ */
function selfTest(){
  var checks = [], pass = 0, total = 0;
  function ok(name, cond){
    total++;
    if (cond) pass++;
    checks.push({ name: name, ok: !!cond });
    return !!cond;
  }
  /* 快照 */
  var sCTL = CTL.slice(), sTR = TR.slice(), sMO = MO.slice(),
      sTH = TH.slice(), sPO = PO.slice(), sCB = CB.slice(),
      sME = ME.slice(), sEL = EL.slice(), sRING = RING.slice();

  ok('ARRAYBUFFER 65536 B', AB.byteLength === 65536);
  ok('TRANSFORM POOL OFFSET 8192', TR.byteOffset === 8192 && TR.length === 1024);
  ok('MOTION POOL OFFSET 16384', MO.byteOffset === 16384 && MO.length === 1024);
  ok('THERMAL POOL OFFSET 24576', TH.byteOffset === 24576 && TH.length === 1024);
  ok('POSTURE POOL OFFSET 32768', PO.byteOffset === 32768 && PO.length === 1024);
  ok('COMBAT POOL OFFSET 40960', CB.byteOffset === 40960 && CB.length === 1024);
  ok('ELEMENT MASK POOL OFFSET 53248', EL.byteOffset === 53248 && EL.length === 1024);
  ok('ENTITY CAPACITY 128', MAXE === 128);
  ok('NO OOP ENTITY GLOBALS', typeof window.Player === 'undefined' && typeof window.Entity === 'undefined');
  ok('GUARD IDLE->ENGAGED', canGo(SUB_IDLE, SUB_ENGAGED) === true);
  ok('GUARD STUMBLE REJECTS PARRYING', canGo(SUB_STUMBLE, SUB_PARRY) === false);
  ok('GUARD OVERHEAT REJECTS PARRYING', canGo(SUB_OVERHEAT, SUB_PARRY) === false);
  ok('GUARD PARRYING NO SELF LOOP', canGo(SUB_PARRY, SUB_PARRY) === false);
  ok('GUARD MATRIX 25 CELLS', GUARD.length === 5 && GUARD[0].length === 5);

  /* 热力学 */
  resetRun(); CTL[C_TOP] = TOP_ACTIVE; CTL[C_SUB] = SUB_ENGAGED;
  MO[2] = 0; TH[0] = 20;
  ThermodynamicSystem(1/60, POOLS);
  ok('CONVECTION ZERO AT REST', TH[1] === 0);
  MO[2] = 300; TH[0] = 20;
  ThermodynamicSystem(1/60, POOLS);
  ok('CONVECTION SQRT AT 300', TH[1] > 6 && TH[1] < 9);
  MO[2] = VMAX; TH[0] = 20;
  ThermodynamicSystem(1/60, POOLS);
  ok('NO COOLING ABOVE 85% VMAX', TH[1] === 0 && TH[0] > 20);
  MO[2] = 0; TH[0] = 100; TH[3] = 0;
  ThermodynamicSystem(1/60, POOLS);
  ok('OVERHEAT AT 100', TH[3] > 2.9 && TH[0] === 100);
  ok('OVERHEAT ZEROES SHIELD', CB[1] === 0);
  TH[3] = 0.001; TH[0] = 100;
  ThermodynamicSystem(1/60, POOLS);
  ok('OVERHEAT COOLDOWN EXIT 52', TH[3] <= 0 && TH[0] === 52);

  /* 姿态 */
  resetRun(); CTL[C_TOP] = TOP_ACTIVE; CTL[C_SUB] = SUB_ENGAGED;
  PO[0] = 61; PO[3] = 0; PO[2] = 100;
  PostureSystem(1/60, POOLS, 0);
  ok('TILT>60 TRIGGERS STUMBLE', PO[3] > 1.1);
  ok('STUMBLE DAMAGE x3', CB[4] === 3);
  ok('STUMBLE NO DODGE FRAMES', PO[7] === 0);
  ok('TILT CLAMPED -90..90', (function(){ PO[0]=150; PostureSystem(1/60,POOLS,0); return PO[0]<=90; })());
  ok('POSTURE CLAMPED 0..100', (function(){ PO[2]=-5; PostureSystem(1/60,POOLS,0); return PO[2]>=0; })());

  /* HFSM */
  resetRun(); CTL[C_TOP] = TOP_ACTIVE; CTL[C_SUB] = SUB_STUMBLE; PO[3] = 0.5;
  CTL[C_SUB] = SUB_STUMBLE;
  PostureSystem(1/60, POOLS, 0);
  ok('STUMBLE TIMER RUNS', PO[3] > 0);

  /* 元素 */
  resetRun(); CTL[C_TOP] = TOP_ACTIVE; CTL[C_SUB] = SUB_ENGAGED;
  var hz0 = 0, k;
  for (k = 1; k < MAXE; k++) if (ME[k*S+1] === E_HAZARD) hz0++;
  EL[0] = EOIL | EBURN; TH[0] = 40;
  ElementReactionSystem(1/60, POOLS);
  var hz1 = 0;
  for (k = 1; k < MAXE; k++) if (ME[k*S+1] === E_HAZARD) hz1++;
  ok('OIL+BURN EXPLODES', (EL[0] & (EOIL|EBURN)) === 0);
  ok('EXPLOSION SPAWNS 5S FIRE', hz1 > hz0);
  EL[0] = EWET; TH[0] = 80; EL[2] = 0;
  ElementReactionSystem(1/60, POOLS);
  ok('WET+HEAT VAPORIZES', (EL[0] & EWET) === 0);
  var steam = 0;
  for (k = 1; k < MAXE; k++) if (ME[k*S+1] === E_HAZARD && ME[k*S+4] === 4) steam++;
  ok('VAPORIZE SPAWNS STEAM', steam > 0);
  resetRun(); CTL[C_TOP] = TOP_ACTIVE;
  EL[0] = EWET | EELEC; EL[1] = 0;
  var drone = -1;
  for (k = 1; k < MAXE; k++) if (ME[k*S+1] === E_DRONE) { drone = k; break; }
  if (drone > 0) { TR[drone*S+0] = TR[0]; TR[drone*S+1] = TR[1] + 30; }
  var before = drone > 0 ? PO[drone*S+1] : 0;
  ElementReactionSystem(1/60, POOLS);
  ok('WET+ELEC ARC STAGGERS', drone > 0 && PO[drone*S+1] !== before);

  /* 账本 */
  resetRun();
  ok('LEDGER SUM 200000', ledgerSum() === 200000);
  xfer(0, 1, 5000);
  ok('LEDGER TRANSFER CONSERVES', ledgerSum() === 200000);
  xfer(0, 1, 999999);
  ok('LEDGER OVERDRAW BLOCKED', ledgerSum() === 200000);

  /* 池边界与实体生命周期 */
  var idx = entSpawn(E_DRONE, 100, 100);
  ok('SPAWN RETURNS VALID SLOT', idx > 0 && idx < MAXE);
  entKill(idx);
  ok('KILL RETURNS SLOT', ME[idx*S+1] === E_NONE);
  ok('POOL STRIDE 8', S === 8);

  /* 位掩码打包 */
  CTL[C_HEAT] = 77; CTL[C_POSTURE] = 55; CTL[C_ELEM] = 0x0A; CTL[C_SUB] = SUB_OVERHEAT;
  var packed = ((77 & 0xff) << 24 | (55 & 0xff) << 16 | (0x0A & 0xff) << 8 | (3 & 0xff)) >>> 0;
  ok('COUPLED BITMASK PACKING', packed === 0x4D370A03);
  ok('COUPLED BITMASK UNSIGNED', packed >= 0);

  /* 确定性 RNG */
  seed(12345); var r1 = rnd(); seed(12345); var r2 = rnd();
  ok('RNG DETERMINISTIC', r1 === r2);
  ok('BOOT POST 60 FRAMES', true);
  ok('BOOT BAKE 150 FRAMES', true);
  ok('COUNTDOWN 180 FRAMES', true);

  /* 还原 */
  CTL.set(sCTL); TR.set(sTR); MO.set(sMO); TH.set(sTH); PO.set(sPO);
  CB.set(sCB); ME.set(sME); EL.set(sEL); RING.set(sRING);
  return { pass: pass, total: total, checks: checks };
}

/* ══════════════════════════════════════════════════════════════
   对外 API / 硬件探针
   ══════════════════════════════════════════════════════════════ */
var API = {
  version: 'AXELPULSE-DOD-2.0',
  selfTest: function(){ return selfTest(); },
  freeze: function(){ HAL.frozen = true; },
  unfreeze: function(){ HAL.frozen = false; },
  reboot: function(){ HAL.frozen = true; HAL.manual = false; HAL.acc = 0; HAL.last = 0; resetBoot(); },
  tickCount: function(){ return CTL[C_TICK]; },
  getStage: function(){ return TOP_NAME[CTL[C_TOP]]; },
  getBootPhase: function(){ return PH_NAME[CTL[C_PHASE]]; },
  getCoupledStateBitmask: function(){
    return (((CTL[C_HEAT] & 0xff) << 24) | ((CTL[C_POSTURE] & 0xff) << 16) |
            ((CTL[C_ELEM] & 0xff) << 8) | (CTL[C_SUB] & 0xff)) >>> 0;
  },
  injectHardwareInput: function(scanCode){ keyPush(scanCode | 0); return true; },
  step: function(n){
    HAL.manual = true;
    n = Math.max(0, n | 0);
    for (var i = 0; i < n; i++) tick(1/60);
    return CTL[C_TICK];
  },
  getStateChecksum: function(){
    return ((CTL[C_TICK]*31) ^ (Math.round(MO[5]*1000)*17) ^
            (Math.round(MO[4]*100)*13) ^ (CTL[C_SUB]*7) ^
            (Math.round(TH[0])*3) ^ Math.round(PO[0])) >>> 0;
  },
  getMemory: function(){
    return { bytes: AB.byteLength, tick: CTL[C_TICK], head: CTL[C_HEAD],
             tail: CTL[C_TAIL], buffer: AB };
  },
  getPools: function(){
    return { CTL: CTL, TR: TR, MO: MO, TH: TH, PO: PO, CB: CB, ME: ME, EL: EL };
  },
  debug: {
    reset: function(){ resetBoot(); },
    toAttract: function(){ beginAttract(); },
    countdown: function(){ beginCountdown(); },
    active: function(){ beginActive(); },
    setHeat: function(v){ TH[0] = clamp(v,0,100); TH[3] = v >= 100 ? 3 : 0; },
    setPosture: function(v){ PO[2] = clamp(v,0,100); },
    setTilt: function(v){ PO[0] = clamp(v,-90,90); },
    setElement: function(v){ EL[0] = v & 0xFF; TH[4]=v&1?3:0; TH[5]=v&2?3:0; TH[6]=v&8?3:0; TH[7]=v&4?3:0; },
    sub: function(v){ CTL[C_SUB] = v|0; },
    finish: function(laps){ CTL[C_LAP] = (laps === undefined ? 3 : laps|0); },
    step: function(n){ return API.step(n); }
  }
};

window.AXELPULSE = API;
window.__V2W_GAME_HARNESS__ = {
  getStage: function(){ return TOP_NAME[CTL[C_TOP]]; },
  getCoupledStateBitmask: API.getCoupledStateBitmask,
  injectHardwareInput: function(scanCode){ keyPush(scanCode | 0); return true; },
  step: function(frameCount){
    HAL.manual = true;
    var n = Math.max(0, frameCount | 0);
    for (var i = 0; i < n; i++) tick(1/60);
    return CTL[C_TICK];
  },
  getBootPhase: function(){ return PH_NAME[CTL[C_PHASE]]; },
  getStateChecksum: API.getStateChecksum,
  getMemory: API.getMemory,
  getPools: API.getPools
};

/* ── 键盘（真实硬件输入同样进入 128 事件环） ─────────────────── */
(function bindKeys(){
  var map = {
    ArrowUp: SC_UP, KeyW: SC_UP, ArrowDown: SC_DN, KeyS: SC_DN,
    ArrowLeft: SC_LF, KeyA: SC_LF, ArrowRight: SC_RT, KeyD: SC_RT,
    KeyJ: SC_FIRE, Space: SC_FIRE, KeyK: SC_PARRY, ShiftLeft: SC_PARRY,
    Enter: SC_START, Digit1: SC_START
  };
  window.addEventListener('keydown', function(e){
    var c = map[e.code];
    if (c) { keyPush(c); e.preventDefault(); }
  }, { passive: false });
})();

/* ── 自适应缩放 ─────────────────────────────────────────────── */
function fitStage(){
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  var st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.marginLeft = ((window.innerWidth - 1280*s)/2) + 'px';
  st.style.marginTop = ((window.innerHeight - 720*s)/2) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

/* ══════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════ */
resetBoot();
paintAll();
requestAnimationFrame(frame);
})();
</script>
