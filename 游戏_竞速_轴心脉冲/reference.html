    for (var pi = 0; pi < BOARD_HINT.pylons.length; pi++) {
      var py = BOARD_HINT.pylons[pi];
      var pth = (py[0] + py[1] / 13) * SEG_A;
      var pr = (rad(pth) + (-HW + (py[1] / 13) * 2 * HW)) * SC;
      var px = 273 + pr * Math.cos(pth), pyy = 273 + pr * Math.sin(pth);
      c.beginPath(); c.arc(px, pyy, 5, 0, Math.PI * 2);
      c.fillStyle = '#ffd166'; c.fill();
      c.strokeStyle = 'rgba(255,209,102,0.45)'; c.lineWidth = 1;
      c.beginPath(); c.arc(px, pyy, 11 + Math.sin(G.t * 3 + pi) * 2, 0, Math.PI * 2); c.stroke();
    }

    /* ── 轴心本体 ── */
    (function () {
      var pulse = 0.55 + 0.45 * Math.sin(G.t * 2.2);
      var gg = c.createRadialGradient(273, 273, 2, 273, 273, 74);
      gg.addColorStop(0, 'rgba(159,244,255,' + (0.55 * pulse) + ')');
      gg.addColorStop(0.4, 'rgba(80,120,255,0.20)');
      gg.addColorStop(1, 'rgba(20,30,80,0)');
      c.fillStyle = gg; c.beginPath(); c.arc(273, 273, 74, 0, Math.PI * 2); c.fill();
      for (var k = 0; k < 6; k++) {
        var a = G.t * 0.5 + k * Math.PI / 3;
        c.beginPath(); c.moveTo(273, 273);
        c.lineTo(273 + Math.cos(a) * 46, 273 + Math.sin(a) * 46);
        c.strokeStyle = 'rgba(120,180,255,0.18)'; c.lineWidth = 1; c.stroke();
      }
      c.beginPath(); c.arc(273, 273, 15, 0, Math.PI * 2);
      c.fillStyle = 'rgba(200,240,255,' + (0.35 + 0.3 * pulse) + ')'; c.fill();
      c.fillStyle = '#9ff4ff'; c.font = '9px monospace'; c.textAlign = 'center';
      c.fillText('轴心', 273, 273 + 32); c.textAlign = 'left';
    })();

    /* ── 轮胎印 ── */
    for (var m = 0; m < G.marks.length; m++) {
      var mk = G.marks[m];
      c.fillStyle = 'rgba(120,150,255,' + (0.30 * mk.a) + ')';
      c.fillRect(w2sX(mk.x) - 1.5, w2sY(mk.y) - 1.5, 3, 3);
    }

    /* ── 粒子 ── */
    for (var q = 0; q < G.fx.length; q++) {
      var p = G.fx[q];
      c.globalAlpha = clamp(p.life * 1.6, 0, 1);
      c.fillStyle = p.col;
      c.fillRect(w2sX(p.x) - 1.5, w2sY(p.y) - 1.5, 3, 3);
    }
    c.globalAlpha = 1;

    /* ── 无人机 ── */
    for (var d = 0; d < G.drones.length; d++) {
      var h = G.drones[d];
      var hx = w2sX(h.x), hy = w2sY(h.y);
      if (h.ethereal) c.globalAlpha = 0.42 + 0.3 * Math.sin(G.t * 7 + d);
      c.beginPath(); c.arc(hx, hy, h.rad * 0.62, 0, Math.PI * 2);
      c.fillStyle = h.col; c.fill();
      if (h.armor) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
      if (h.boss) {
        c.beginPath(); c.arc(hx, hy, h.rad * 0.62 + 6, 0, Math.PI * 2);
        c.strokeStyle = h.col; c.lineWidth = 2; c.stroke();
      }
      if (h.hitT > 0) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
      c.globalAlpha = 1;
    }

    /* ── 玩家：影子 + 车体（高度用屏幕位移表达） ── */
    var sx = w2sX(P.x), sy = w2sY(P.y);
    var lift = P.alt * SC * 0.9;
    c.globalAlpha = 0.30;
    c.beginPath(); c.ellipse(sx, sy, 10, 6, 0, 0, Math.PI * 2);
    c.fillStyle = '#000'; c.fill(); c.globalAlpha = 1;
    /* 相位翻转的视差倾角扰动 */
    var tilt = P.polT > 0 ? PHYS.POL_TILT * (P.polT / (PHYS.POL_MS / 1000)) : 0;
    c.save();
    c.translate(sx, sy - lift);
    c.rotate(P.head + Math.PI / 2 + tilt * 0.5);
    c.beginPath();
    c.moveTo(0, -13); c.lineTo(9, 10); c.lineTo(0, 5); c.lineTo(-9, 10); c.closePath();
    c.fillStyle = P.hitFlash > 0 ? '#ffffff' : '#9ff4ff'; c.fill();
    c.strokeStyle = G.boostT > 0 ? '#ff5fd0' : '#4fe0c0'; c.lineWidth = 2; c.stroke();
    if (P.polT > 0) {
      c.beginPath(); c.arc(0, 0, 20, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(200,140,255,' + (P.polT * 3) + ')'; c.lineWidth = 2; c.stroke();
    }
    c.restore();
    if (P.tether) {
      c.beginPath(); c.moveTo(sx, sy - lift);
      c.lineTo(w2sX(P.tether.r * Math.cos(P.tether.th)), w2sY(P.tether.r * Math.sin(P.tether.th)));
      c.strokeStyle = 'rgba(255,209,102,0.85)'; c.lineWidth = 1.5; c.stroke();
    }

    paintVeil(c);
  }

  /* ── 状态差异层：八阶状态在主视窗必须各有可辨认的画面差异 ── */
  function paintVeil(c) {
    var W = worldW, H = worldH;
    /* ① 种子解算：未显影的半环被暗幕盖住，带扫描线。
       暗幕只在「放行之后的显影期」合上：引导期与待机坞要让种子底稿
       整幅可读 —— 这一帧就是「初始画面」，不允许退化成一块黑幕。 */
    if (G.started && G.revealed < 1) {
      var a0 = G.revealed * Math.PI * 2;
      var veilA = G.boot.done ? 0.94 : 0.30;
      c.save();
      c.beginPath(); c.moveTo(273, 273);
      c.arc(273, 273, 300, a0, a0 + Math.PI * 2); c.closePath();
      c.fillStyle = 'rgba(3,5,14,' + veilA + ')'; c.fill();
      c.restore();
      c.beginPath(); c.moveTo(273, 273);
      c.lineTo(273 + Math.cos(a0) * 290, 273 + Math.sin(a0) * 290);
      c.strokeStyle = 'rgba(95,224,192,0.85)'; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#5fe0c0'; c.font = 'bold 11px monospace';
      /* 读数放在画布左下角：左上角被窗格标签占着，两行字叠在一起读不出来 */
      c.fillText('种子 ' + G.seed + ' 逐段解算 ' + Math.round(G.revealed * 100) + '%', 12, H - 10);
    }
    /* ② 同调驻留：以浮屿为圆心的谐振环一圈圈外扩 */
    if (G.state === 'ATTUNEMENT_DWELL') {
      var cx = 273 + (rad(P.th)) * SC * Math.cos(P.th), cy = 273 + (rad(P.th)) * SC * Math.sin(P.th);
      for (var k = 0; k < 3; k++) {
        var rp = (18 + ((G.f * 1.4 + k * 26) % 74)) * SC + 10;
        c.beginPath(); c.arc(cx, cy, rp, 0, Math.PI * 2);
        c.strokeStyle = 'rgba(127,255,220,' + (0.45 * (1 - ((G.f * 1.4 + k * 26) % 74) / 74)) + ')';
        c.lineWidth = 2; c.stroke();
      }
      c.fillStyle = '#7fffdc'; c.font = 'bold 11px monospace';
      c.fillText('锚定同调驻留 ' + f2(P.attune) + ' · 低速窗口', 12, H - 10);
    }
    /* ③ 危机分支：红色暗角 + 呼吸边框 */
    if (G.state === 'DYNAMIC_BRANCHING') {
      var dg = Math.max(clamp((G.fatigue - 74) / 26, 0, 1), clamp(1 - G.stab / 34, 0, 1));
      var vg = c.createRadialGradient(273, 273, 90, 273, 273, 290);
      vg.addColorStop(0, 'rgba(255,40,60,0)');
      vg.addColorStop(1, 'rgba(255,40,60,' + (0.16 + 0.30 * dg) + ')');
      c.fillStyle = vg; c.fillRect(0, 0, W, H);
      c.strokeStyle = 'rgba(255,90,90,' + (0.35 + 0.45 * Math.abs(Math.sin(G.t * 4))) + ')';
      c.lineWidth = 3; c.strokeRect(1.5, 1.5, W - 3, H - 3);
      c.fillStyle = '#ff8a5c'; c.font = 'bold 11px monospace';
      c.fillText('空域危机 · 轴心卫戍在场', 12, H - 10);
    }
    /* ④ 过载熔断：橙色冲洗 + 车体向外扩散的压力环 */
    if (G.overT > 0) {
      var ot = clamp(G.overT / (PHYS.OVER_MS / 1000), 0, 1);
      c.fillStyle = 'rgba(255,138,92,' + (0.24 * ot) + ')'; c.fillRect(0, 0, W, H);
      for (var q = 0; q < 3; q++) {
        var rr = 26 + q * 34 + (1 - ot) * 60;
        c.beginPath(); c.arc(w2sX(P.x), w2sY(P.y), rr, 0, Math.PI * 2);
        c.strokeStyle = 'rgba(255,180,120,' + (0.5 * ot) + ')'; c.lineWidth = 2; c.stroke();
      }
      c.fillStyle = '#ffb27a'; c.font = 'bold 11px monospace';
      c.fillText('过载熔断硬直 ' + f1(G.overT) + ' s · 舵面锁死', 12, H - 10);
    }
    /* ⑤ 因果回溯：把整块视窗按进度盖回去，底部固定通知板 */
    if (G.rollT >= 0) {
      var rp2 = 1 - clamp(G.rollT / PHYS.ROLLBACK_S, 0, 1);
      c.fillStyle = 'rgba(4,6,16,0.88)'; c.fillRect(0, 0, W, H * rp2);
      c.beginPath(); c.moveTo(0, H * rp2); c.lineTo(W, H * rp2);
      c.strokeStyle = 'rgba(255,90,90,0.9)'; c.lineWidth = 2; c.stroke();
      c.fillStyle = 'rgba(8,10,24,0.94)'; c.fillRect(24, H - 62, W - 48, 44);
      c.strokeStyle = '#ff5a5a'; c.lineWidth = 1; c.strokeRect(24.5, H - 61.5, W - 49, 43);
      c.textAlign = 'center';
      c.fillStyle = '#ff9d6b'; c.font = 'bold 13px monospace';
      c.fillText('回溯 · ' + G.rollReason, W / 2, H - 42);
      c.fillStyle = '#8b93cf'; c.font = '10px monospace';
      c.fillText('世界时钟回退 ' + PHYS.ROLLBACK_S + ' s · 剩余 ' + f1(Math.max(0, G.rollT)) + ' s', W / 2, H - 26);
      c.textAlign = 'left';
    }
  }

  /* ══════════════ 14. 环境雷达（低频） ══════════════ */
  var radarW = 546, radarH = 86;
  function paintRadar(c) {
    clear(c, radarW, radarH, '#05070f');
    var cx = 74, cy = 43, k = 0.135;
    /* 整圈轮廓 */
    c.beginPath();
    for (var i = 0; i <= 96; i++) {
      var th = i / 96 * Math.PI * 2, r = rad(th) * k;
      var x = cx + r * Math.cos(th), y = cy + r * Math.sin(th);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
    c.strokeStyle = 'rgba(120,160,255,0.30)'; c.lineWidth = 1; c.stroke();
    /* 浮屿状态环：引信琥珀、虚空红、完好青 */
    for (var p = 0; p < SEG; p++) {
      var pl = G.plates[p];
      var th0 = p * SEG_A, steps = 4;
      c.beginPath();
      for (var j = 0; j <= steps; j++) {
        var t = lerp(th0, th0 + SEG_A, j / steps), r2 = rad(t) * k;
        var x2 = cx + r2 * Math.cos(t), y2 = cy + r2 * Math.sin(t);
        j ? c.lineTo(x2, y2) : c.moveTo(x2, y2);
      }
      c.strokeStyle = !pl.alive ? '#ff5a5a' : (pl.fuse >= 0 ? '#ffb020' : '#2f6f8f');
      c.lineWidth = pl.alive ? (pl.fuse >= 0 ? 3 : 2) : 3;
      c.stroke();
    }
    /* 远端危险预警 */
    for (var d = 0; d < G.drones.length; d++) {
      var h = G.drones[d];
      c.beginPath(); c.arc(cx + h.x * k, cy + h.y * k, h.boss ? 4 : 2, 0, Math.PI * 2);
      c.fillStyle = h.col; c.fill();
    }
    /* 玩家 */
    c.beginPath(); c.arc(cx + P.x * k, cy + P.y * k, 3.4, 0, Math.PI * 2);
    c.fillStyle = '#9ff4ff'; c.fill();
    c.strokeStyle = '#4fe0c0'; c.lineWidth = 1; c.stroke();
    /* 右侧读数 */
    var band = STRATA[strataAt(P.d)];
    var wnd = windAt(P.th, G.t);
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('环境雷达 · 远端预警', 150, 16);
    c.fillStyle = '#dff0ff'; c.font = 'bold 11px monospace';
    c.fillText('外环剩余 ' + G.plates.filter(function (q) { return q.alive; }).length + '/' + SEG, 150, 34);
    c.fillText('引信 ' + G.plates.filter(function (q) { return q.fuse >= 0; }).length +
               ' · 虚空 ' + G.plates.filter(function (q) { return !q.alive; }).length, 150, 51);
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('当前环带 ' + band.n + ' · 摩擦 ' + f2(band.mu) + ' · 风剪 ×' + f2(band.shear), 150, 69);
    c.fillText('切向风 ' + f1(wnd[0]) + ' · 横向风 ' + f1(wnd[1]), 150, 82);
    /* 波次刻度 */
    for (var wv = 0; wv < WAVES.length; wv++) {
      var wx = 380 + wv * 14;
      c.fillStyle = wv < G.wave ? '#ff8a5c' : '#1b2450';
      c.fillRect(wx, 27, 10, 12);
      c.strokeStyle = '#2b3a6e'; c.lineWidth = 1; c.strokeRect(wx + 0.5, 27.5, 9, 11);
    }
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('波次进度 ' + G.wave + ' / ' + WAVES.length, 380, 20);
    c.fillStyle = '#7fb6cc';
    c.fillText(G.drones.length ? '威胁 ' + G.drones.length + ' 架 · ' + (G.waveState === 'fighting' ? '交战中' : '已清空')
                               : '空域清空', 380, 58);
    c.fillText('圈 ' + G.lap + '/' + LAPS + ' · 上一圈 ' + (G.lapTimes.length ? mmss(G.lapTimes[G.lapTimes.length - 1], 2) : '--:--.--'), 380, 76);
  }

  /* ══════════════ 15. 动态仪表组（九表） ══════════════ */
  /* 仪表盘不是「把数字画出来」：每一根指针、每一格量化都对应一条物理量，
     而物理量本身来自守恒账本或动力学解算 —— 读数对不上，说明某个子系统坏了。 */
  var rigW = 690, rigH = 296;
  function dial(c, cx, cy, r, frac, col, title, val, sub) {
    var a0 = Math.PI * 0.78, a1 = Math.PI * 2.22, f = clamp(frac, 0, 1);
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2);
    c.fillStyle = '#080d1e'; c.fill();
    c.strokeStyle = '#16204a'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.arc(cx, cy, r - 7, a0, a1);
    c.strokeStyle = '#1b2450'; c.lineWidth = 6; c.stroke();
    c.beginPath(); c.arc(cx, cy, r - 7, a0, a0 + (a1 - a0) * f);
    c.strokeStyle = col; c.lineWidth = 6; c.stroke();
    var na = a0 + (a1 - a0) * f;
    c.beginPath(); c.moveTo(cx, cy);
    c.lineTo(cx + Math.cos(na) * (r - 12), cy + Math.sin(na) * (r - 12));
    c.strokeStyle = '#dff0ff'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.arc(cx, cy, 3, 0, Math.PI * 2);
    c.fillStyle = '#8b93cf'; c.fill();
    c.fillStyle = '#dff0ff'; c.font = 'bold 12px monospace'; c.textAlign = 'center';
    c.fillText(val, cx, cy + r * 0.42); c.textAlign = 'left';
    c.fillStyle = '#8b93cf'; c.font = '10px monospace'; c.textAlign = 'center';
    c.fillText(title, cx, cy + r + 13);
    if (sub) { c.fillStyle = '#5f7aad'; c.font = '9px monospace'; c.fillText(sub, cx, cy + r + 24); }
    c.textAlign = 'left';
  }
  function paintRig(c) {
    clear(c, rigW, rigH, '#05070f');
    var wnd = windAt(P.th, G.t), wt = wnd[0], wx = wnd[1];
    var gk = G.galeT > 0 ? PHYS.GALE_K : 1;
    var wta = wt * gk, wxa = wx * gk;
    var si = strataAt(P.d), band = STRATA[si];
    var tail = (wta * sign(P.v || 1)) > 0;
    var vm = PHYS.VMAX * DIFFS[G.diff].vmax;

    /* ── ① 速度矢量仪 ── */
    dial(c, 68, 54, 36, P.v / Math.max(1, vm), '#7fffdc', '① 速度矢量仪',
         f1(P.v), 'km/h ' + Math.round(P.v * KMH) + ' · 极限 ' + f0(vm));
    /* ── ② 风切矢量罗盘 ── */
    (function () {
      var cx = 190, cy = 54, r = 36;
      c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2);
      c.fillStyle = '#080d1e'; c.fill();
      c.strokeStyle = G.galeT > 0 ? '#ff8a5c' : '#16204a'; c.lineWidth = 2; c.stroke();
      for (var k = 0; k < 8; k++) {
        var a = k * Math.PI / 4;
        c.beginPath();
        c.moveTo(cx + Math.cos(a) * (r - 8), cy + Math.sin(a) * (r - 8));
        c.lineTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
        c.strokeStyle = '#2b3a6e'; c.lineWidth = 1; c.stroke();
      }
      var m = Math.hypot(wta, wxa), ma = Math.atan2(wxa, wta);
      var L = clamp(m / PHYS.GALE_REF, 0, 1) * (r - 12);
      c.beginPath(); c.moveTo(cx, cy);
      c.lineTo(cx + Math.cos(ma) * L, cy + Math.sin(ma) * L);
      c.strokeStyle = tail ? '#ff8a5c' : '#7fffdc'; c.lineWidth = 3; c.stroke();
      c.beginPath(); c.arc(cx, cy, 3, 0, Math.PI * 2); c.fillStyle = '#8b93cf'; c.fill();
      c.fillStyle = '#dff0ff'; c.font = 'bold 11px monospace'; c.textAlign = 'center';
      c.fillText(f1(m), cx, cy + r * 0.52); c.textAlign = 'left';
      c.fillStyle = '#8b93cf'; c.font = '10px monospace'; c.textAlign = 'center';
      c.fillText('② 风切矢量罗盘', cx, cy + r + 13);
      c.fillStyle = tail ? '#ff8a5c' : '#7fffdc'; c.font = '9px monospace';
      c.fillText(tail ? '顺风 · 阻尼 ×1.40' : '逆风 · 升力矢量', cx, cy + r + 24);
      c.textAlign = 'left';
    })();

    /* ── ③ 五层环带摩擦与风剪整表 ── */
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('③ 五层环带 · 摩擦 / 风剪 / 抽取感度 / 本圈配额余量', 14, 126);
    for (var s2 = 0; s2 < STRATA.length; s2++) {
      var y2 = 139 + s2 * 13, on = s2 === si;
      c.fillStyle = STRATA[s2].tint; c.fillRect(14, y2 - 8, 10, 9);
      if (on) { c.strokeStyle = '#ffd479'; c.lineWidth = 1; c.strokeRect(14.5, y2 - 7.5, 9, 8); }
      c.fillStyle = on ? '#dff4ff' : '#5f7aad';
      c.font = on ? 'bold 10px monospace' : '10px monospace';
      c.fillText(STRATA[s2].n + ' 摩擦 ' + f2(STRATA[s2].mu) + ' 风剪 ×' + f2(STRATA[s2].shear) +
                 ' 配额 ' + G.quota[s2] + '/' + G.quotaCap[s2], 30, y2);
    }

    /* ── ④ 承压应变条 ── */
    bar(c, 14, 214, 300, 12, G.strain / PHYS.STRAIN_CAP, '#2a1b3a',
        G.strain >= PHYS.STRAIN_CAP ? '#ff5a5a' : (G.strain > 66 ? '#ff8a5c' : '#c08bff'),
        '④ 承压应变（越限即承压临界 · 转向权限减半）', f1(G.strain));

    /* ── ⑤ 实时损耗率监视器 ── */
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑤ 实时损耗率监视器（任何正增益都必须能追到一次主动操作）', 14, 238);
    var rates = [['牵引', G.rateGas], ['稳定', G.rateStab], ['结构', G.rateFat], ['承压', G.rateStrain]];
    for (var r2 = 0; r2 < rates.length; r2++) {
      var v = rates[r2][1];
      c.fillStyle = v > 0.01 ? '#ff8a5c' : (v < -0.01 ? '#7fffdc' : '#5f7aad');
      c.font = 'bold 10px monospace';
      c.fillText(rates[r2][0] + ' ' + (v >= 0 ? '+' : '') + f1(v) + '/s', 14 + r2 * 76, 256);
    }

    /* ── ⑥ 稳定性储备条 ── */
    bar(c, 330, 30, 346, 12, G.stab / 100, '#3a2a10', G.stab < 34 ? '#ff8a5c' : '#ffd166',
        '⑥ 稳定性储备（核心区外停驻每秒 −5%）', f1(G.stab));
    /* ── ⑦ 结构疲劳条 ── */
    bar(c, 330, 66, 346, 12, G.fatigue / PHYS.FATIGUE_MAX, '#2a1030',
        G.fatigue > 74 ? '#ff5a5a' : '#c08bff', '⑦ 结构疲劳（撞击 / 大滑移累积）', f1(G.fatigue));

    /* ── ⑧ 氮气三段能量条（读的是牵引储备科目余额） ── */
    var bx = 330, bw = 346, seg = G.gasMax / 3;
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑧ 氮气三段能量 · 科目余额 ' + G.tractionM + ' 千分位', bx, 98);
    for (var k2 = 0; k2 < 3; k2++) {
      var q = clamp((G.gas - k2 * seg) / seg, 0, 1);
      c.fillStyle = '#1b2450'; c.fillRect(bx + k2 * 118, 104, 112, 14);
      c.fillStyle = q >= 1 ? '#ff5fd0' : '#7fffdc';
      c.fillRect(bx + k2 * 118, 104, 112 * q, 14);
      c.strokeStyle = '#2b3a6e'; c.lineWidth = 1; c.strokeRect(bx + k2 * 118 + 0.5, 104.5, 111, 13);
      c.fillStyle = '#8b93cf'; c.font = '9px monospace';
      c.fillText(q <= 0 ? '空' : (q >= 1 ? '满' : Math.round(q * 100) + '%'), bx + k2 * 118 + 48, 114);
    }
    c.fillStyle = '#dff0ff'; c.font = 'bold 11px monospace'; c.textAlign = 'right';
    c.fillText(f1(G.gas / G.gasMax * 100) + '%', bx + bw, 98); c.textAlign = 'left';

    /* ── ⑨ 蓄能压缩量条 ── */
    bar(c, 330, 142, 346, 12, G.chargeM / LEDGER.CHARGE_FULL_M, '#2a1b3a',
        G.chargeM >= LEDGER.CHARGE_FULL_M ? '#ff8a5c'
          : (G.chargeM > LEDGER.CHARGE_SAFE_M ? '#ffd479' : '#c08bff'),
        '⑨ 蓄能压缩量  安全线 ' + LEDGER.CHARGE_SAFE_M + ' / 满值 ' + LEDGER.CHARGE_FULL_M,
        G.chargeM);

    /* ── 手势键位表（十种复合手势，非仪表） ── */
    var hints = [
      'Space 手刹漂移 · 滑移角 > 32° 蓄能折损至六成',
      'J 浮空跃迁 · 余量 ' + P.hop + ' · 只有同调驻留能回充',
      'K 长按蓄能弹射 · 越限即熔断硬直 ' + (PHYS.OVER_MS / 1000) + ' s',
      'L 空间相位翻转 · ' + f0(PHYS.POL_MS) + ' ms 视差倾角扰动 · 免疫 ' + f0(PHYS.POL_IMMUNE_MS) + ' ms',
      'U 能量索抓取摆荡 · 再按脱离，切向速度达标才回补牵引',
      'I 浮屿共振同调脉冲 · 先完成同调驻留 · 瓦解崩落体回收物量',
      'H 动量下压速坠冲击 · 落速越限才打得穿重装甲壳',
      'G 竞速功兑换入 · Y 牵引储备兑换出 · 按分带汇率包络结算',
      'B 分带配额置换 · 烧竞速功把本带已动用的额度放回一部分'
    ];
    for (var h4 = 0; h4 < hints.length; h4++) {
      c.fillStyle = h4 === 1 && P.hop === 0 ? '#ff8a5c' : '#5f7aad';
      c.font = '10px monospace';
      c.fillText(hints[h4], 330, 174 + h4 * 12);
    }
    c.fillStyle = P.attuned ? '#7fffdc' : '#8b93cf';
    c.font = 'bold 11px monospace';
    c.fillText(P.attuned ? '同调已确立 · 跃迁余量已由 0 置为 1'
                         : '同调未确立 · 跃迁余量保持 ' + P.hop +
                           ' · 环带 ' + band.n + ' · 浮屿寿命 ' +
                           f2(G.plates[plateOf(P.th)[0]].life), 330, 288);
  }

  /* ══════════════ 16. 分带配额沙盘与汇率包络（二表） ══════════════ */
  var qW = 690, qH = 76;
  function paintQuota(c) {
    clear(c, qW, qH, '#05070f');
    var si = strataAt(P.d);
    /* ── ⑩ 分带配额沙盘 ──
       注：本栏顶端被窗格标签压着，所以标题不放在 y≈11，改挂在沙盘下方的
       汇总行 —— 五个格子本身从 y=8 起画，正好让开标签。 */
    var senses = [];
    for (var b = 0; b < STRATA.length; b++) {
      var x = 12 + b * 66, cap = G.quotaCap[b], left = G.quota[b];
      var f = cap > 0 ? clamp(left / cap, 0, 1) : 0;
      senses.push(f2(STRATA[b].sense));
      c.fillStyle = '#0d1330'; c.fillRect(x, 16, 60, 34);
      c.fillStyle = left <= 0 ? '#3a1420' : (f < 0.34 ? '#4a3410' : '#0f3450');
      c.fillRect(x, 16, 60, 34 * (1 - f));
      c.strokeStyle = b === si ? '#ffd479' : '#2b3a6e'; c.lineWidth = 1;
      c.strokeRect(x + 0.5, 16.5, 59, 33);
      c.fillStyle = b === si ? '#dff4ff' : '#8b93cf'; c.font = '9px monospace';
      c.fillText(STRATA[b].n, x + 4, 28);
      c.fillStyle = left <= 0 ? '#ff8a5c' : '#7fffdc'; c.font = 'bold 10px monospace';
      c.fillText(String(left), x + 4, 46);
    }
    c.fillStyle = '#8b93cf'; c.font = '9px monospace';
    c.fillText('⑩ 沙盘每圈重发 · 抽取只减不增 · 感度 ' + senses.join('/'), 12, 68);
    /* ── ⑪ 分带汇率包络与置换账 ── */
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑪ 分带汇率包络与置换账（‰）', 352, 11);
    for (var b2 = 0; b2 < STRATA.length; b2++) {
      var rr = exRate(b2), on = b2 === si;
      c.fillStyle = on ? '#dff4ff' : '#5f7aad';
      c.font = (on ? 'bold ' : '') + '9px monospace';
      c.fillText(STRATA[b2].n + ' ' + rr + '‰' + (b2 === 0 ? '（下限）' : (b2 === 4 ? '（上限）' : '')),
                 352 + (b2 % 2) * 168, 26 + Math.floor(b2 / 2) * 11);
    }
    c.fillStyle = '#8b93cf'; c.font = '9px monospace';
    c.fillText('风廊 −10% · 爆发 +8% · 换算税 ' + f1(LEDGER.CONV_FEE * 100) + '%' +
               ' · 兑换入 ' + G.convIn + ' / 兑换出 ' + G.convOut +
               ' · 置换 ' + G.quotaSwap + ' 次 · 冷却 ' + G.exchCd + ' 帧', 352, 62);
    c.fillStyle = G.quotaDead ? '#ff8a5c' : '#5f7aad';
    c.fillText(G.quotaDead ? '本带配额枯竭 · 抽取停摆 · QUOTA_EXHAUSTED'
                           : '本带配额可抽取 · 余额 ' + G.quota[si], 352, 73);
  }

  /* ══════════════ 17. 环形计量（二表） ══════════════ */
  var ringW = 690, ringH = 134;
  function paintRings(c) {
    clear(c, ringW, ringH, '#05070f');
    /* ── ⑫ 浮屿寿命环形条 ──
       标题不占 y≈13：那一带被窗格标签压着。计数搬进环心，标题挂到底部。 */
    var cx = 92, cy = 66, R = 42, i, pl;
    for (i = 0; i < SEG; i++) {
      pl = G.plates[i];
      var a0 = i * SEG_A - Math.PI / 2, a1 = a0 + SEG_A * 0.84;
      c.beginPath(); c.arc(cx, cy, R, a0, a1);
      c.strokeStyle = '#141c3c'; c.lineWidth = 13; c.stroke();
      var lf = clamp(pl.lifeM / LEDGER.PLATE_M, 0, 1);
      var col = !pl.alive ? '#ff5a5a'
              : (pl.fuse >= 0 ? '#ffb020' : (pl.anchor ? '#7fffdc' : '#4fa8d8'));
      c.beginPath(); c.arc(cx, cy, R - 7 + 7 * lf, a0, a1);
      c.strokeStyle = col; c.lineWidth = 13 * lf + 1; c.stroke();
      if (i === P.onPlate) {
        c.beginPath(); c.arc(cx, cy, R + 11, a0, a1);
        c.strokeStyle = '#ffd479'; c.lineWidth = 2; c.stroke();
      }
    }
    c.fillStyle = '#8b93cf'; c.font = '9px monospace'; c.textAlign = 'center';
    c.fillText('完好 ' + G.plates.filter(function (q) { return q.alive; }).length, cx, 54);
    c.fillText('引信 ' + G.plates.filter(function (q) { return q.fuse >= 0; }).length, cx, 66);
    c.fillText('虚空 ' + G.plates.filter(function (q) { return !q.alive; }).length, cx, 78);
    c.textAlign = 'left';
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑫ 浮屿寿命环形条 · ' + SEG + ' 段 · 引信 ' + f0(PHYS.FUSE_MS) + ' ms', 12, 132);

    /* ── ⑬ 同调充盈环 ── */
    ring(c, 262, 76, 44, P.attune, P.attuned ? '#7fffdc' : '#ffd479', '#16204a', 8);
    c.beginPath();
    c.arc(262, 76, 44, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(P.attune, 0, 1));
    c.strokeStyle = P.attuned ? '#7fffdc' : '#ffd479'; c.lineWidth = 8; c.stroke();
    c.fillStyle = '#dff0ff'; c.font = 'bold 12px monospace'; c.textAlign = 'center';
    c.fillText(Math.round(P.attuneT) + '', 262, 74);
    c.fillStyle = '#8b93cf'; c.font = '9px monospace';
    c.fillText('ms / ' + f0(PHYS.ATTUNE_MS), 262, 86);
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑬ 同调充盈环', 262, 134 - 4);
    c.textAlign = 'left';

    /* 读数区（非仪表） */
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('环程 ' + f1(G.totalTh / (Math.PI * 2)) + ' 圈 · 名次 ' + G.rank + '/6 · 反超 ' +
               G.overtakes + ' · 擦墙 ' + G.wallCount + ' · 回溯 ' + G.rollN + ' 次', 336, 26);
    c.fillText('波次排程 ' + G.wavePtr + '/' + G.quotaPlan.length + ' 放行 · 下一波帧号 ' +
               (G.quotaPlan[G.wavePtr] ? G.quotaPlan[G.wavePtr].f : '—') +
               ' · 当前帧 ' + G.f, 336, 44);
    c.fillStyle = G.frags.length ? '#ffb020' : '#5f7aad';
    c.fillText('崩落体 ' + G.frags.length + ' 枚 · 在空物量 ' +
               G.frags.reduce(function (a, q) { return a + q.m; }, 0) +
               ' · 回收 ' + G.fragClaim + ' / 逾期 ' + G.fragBreak, 336, 62);
    c.fillStyle = '#8b93cf';
    c.fillText('风切穿越 ' + G.galeCount + ' 次 · 起步锁定 ' +
               (G.launchLock > 0 ? f2(G.launchLock) + ' s' : '已解除') +
               ' · 出闸对准度 ' + f2(G.launchAlign), 336, 80);
    c.fillText('配额重发 ' + G.quotaRefill + ' 轮 · 抽取被拒 ' + G.quotaBlock +
               ' · 成功抽取 ' + G.exCount + ' 次', 336, 98);
    c.fillText('蓄能弹射 ' + G.catCount + ' · 相位翻转 ' + G.polCount + ' · 能量索 ' + G.tgCount +
               ' · 速坠 ' + G.plungeCount + ' · 熔断 ' + G.overCount, 336, 116);
  }

  /* ══════════════ 18. 守恒账本科目表与收益倍率账本（二表） ══════════════ */
  var ledW = 690, ledH = 108;
  function paintLedger(c) {
    clear(c, ledW, ledH, '#05070f');
    var B = budget();
    /* ── ⑭ 守恒账本科目表 ──
       科目格从 y=18 起画，标题下移到事件溯源那一行，避开窗格标签。 */
    var acc = [
      ['屿壳总和', B.shell, '#7fffdc'], ['牵引储备', B.traction, '#4fa8d8'],
      ['蓄能存量', B.charge, '#c08bff'], ['竞速功', B.fold, '#ffd479'],
      ['熵损', B.entropy, '#ff8a5c']
    ];
    for (var a = 0; a < acc.length; a++) {
      var x = 12 + a * 66;
      c.fillStyle = '#0d1330'; c.fillRect(x, 18, 62, 30);
      c.fillStyle = acc[a][2];
      c.fillRect(x, 18, 62 * clamp(acc[a][1] / LEDGER.BUDGET_M, 0, 1) * 2.6, 3);
      c.strokeStyle = '#2b3a6e'; c.lineWidth = 1; c.strokeRect(x + 0.5, 18.5, 61, 29);
      c.fillStyle = '#8b93cf'; c.font = '9px monospace'; c.fillText(acc[a][0], x + 4, 30);
      c.fillStyle = acc[a][2]; c.font = 'bold 11px monospace';
      c.fillText(String(acc[a][1]), x + 4, 44);
    }
    c.fillStyle = '#0d1330'; c.fillRect(344, 18, 54, 30);
    c.strokeStyle = B.gap === 0 ? '#7fffdc' : '#ff5a5a'; c.lineWidth = 1;
    c.strokeRect(344.5, 18.5, 53, 29);
    c.fillStyle = '#8b93cf'; c.font = '9px monospace'; c.fillText('缺口', 348, 30);
    c.fillStyle = B.gap === 0 ? '#7fffdc' : '#ff5a5a'; c.font = 'bold 11px monospace';
    c.fillText(String(B.gap), 348, 44);

    /* 事件溯源账本（最近三条） */
    c.fillStyle = '#5f7aad'; c.font = '9px monospace';
    c.fillText('⑭ 守恒科目表 · Σ ≡ ' + LEDGER.BUDGET_M +
               ' · 缺口恒等于零 · 溯源 ' + G.ledger.length + ' 条', 12, 62);
    var n = G.ledger.length;
    for (var i = 0; i < 3; i++) {
      var idx = n - 3 + i, y = 74 + i * 12;
      if (idx < 0) continue;
      var e = G.ledger[idx];
      var hot = e.type === '入账' || e.type === '连击';
      c.fillStyle = hot ? '#7fffdc' : (e.type === '回溯' || e.type === '熔断' ? '#ff8a5c' : '#8b93cf');
      c.font = '9px monospace';
      var amt = (e.amt >= 0 ? '+' : '') + f1(e.amt);
      var head = ('     ' + e.f).slice(-5) + '  ' + mmss(e.t, 1) + '  ' + e.type.padEnd(6, ' ') +
                 ('       ' + amt).slice(-7) + '  ';
      /* 事件注记长度不可控：按实测宽度截到 ⑮ 栏左界之前，免得压掉右侧读数 */
      var lim = 400 - (12 + c.measureText(head).width), nt = e.note;
      while (nt.length > 1 && c.measureText(nt).width > lim) nt = nt.slice(0, -1);
      if (nt !== e.note) nt = nt.slice(0, -1) + '…';
      c.fillText(head + nt, 12, y);
    }

    /* ── ⑮ 收益倍率账本与连击蓄能槽 ──
       读数一律压在 x=360 起、宽 322 以内：原来挂在 x=470 的几行会溢出右缘。 */
    var qx = 410, qw2 = 690 - qx - 10;
    c.fillStyle = '#8b93cf'; c.font = '10px monospace';
    c.fillText('⑮ 收益倍率 ×' + f2(G.yieldMul) + ' · 峰值 ×' +
               f2(1 + Math.min(2.4, Math.max(0, G.bestCombo - 1) * 0.13)) +
               ' · 连击蓄能槽 26 格', qx, 11);
    for (var k = 0; k < 26; k++) {
      var on = k < G.combo;
      c.fillStyle = on ? (k < 8 ? '#4fa8d8' : (k < 18 ? '#7fffdc' : '#ffd479')) : '#141c3c';
      c.fillRect(qx + k * (qw2 / 26), 18, qw2 / 26 - 3.4, 14);
    }
    c.fillStyle = '#8b93cf'; c.font = '9px monospace';
    c.fillText('连击段 ' + G.combo + ' · 保持 ' + f2(Math.max(0, G.comboHold)) +
               ' s · 撞击 ' + G.hitCount + ' 次', qx, 44);
    c.fillText('累计得分 ' + Math.round(G.score) + ' · 清波 ' + G.salvage +
               ' · 击杀 ' + G.kills, qx, 57);
    c.fillText('牵引消耗 ' + f1(G.gasSpent) + ' · 速坠峰值 ' + Math.round(G.plungeBest) +
               ' px/s · 承压峰值 ' + f1(G.strainPeak), qx, 70);
    c.fillText('核心区锚定 ' + G.coreN + '/' + G.landN + ' · 边缘暴露 ' + f1(G.edgeTime) +
               ' s · 静默 ' + f1(G.idleTime) + ' s', qx, 83);
    c.fillText('环程 ' + G.lap + '/' + LAPS + ' · 本圈 ' + mmss(G.lapT, 2) +
               ' · 最佳 ' + (G.bestLap ? mmss(G.bestLap, 2) : '--:--.--'), qx, 96);
  }

  /* ══════════════ 19. 覆盖层与结算面板 ══════════════ */
  var ovEl = document.getElementById('ov');

  function buildMenu() {

        '停在浮屿边缘每秒流失 <em>5%</em> 稳定性 · 顺风阻力 ×<em>1.40</em>（顺风反而更慢）</div>' +

  function buildDiffCards() {
    var out = '';
    for (var k in DIFFS) {
      var d = DIFFS[k];
      /* 三档一律给满三行同样的三项，否则短的那档会把最后一项挤成孤字换行 */
      out += '<div class="df' + (k === G.diff ? ' on' : '') + '" data-d="' + k + '"><b>' + d.n + '</b><i>' +
        '弯道 ' + d.nc + ' · 轴心 ' + d.life + ' · 氮气 ' + d.gas + '<br>' +
        '限速 ×' + d.vmax.toFixed(2) + ' · 敌速 ×' + d.espd.toFixed(2) + '<br>' +
        '风剪 ×' + d.mer.toFixed(2) + ' · 衰减 ×' + d.drain.toFixed(2) +
        '</i></div>';
    }
    return out;
  }

      '<h2>' + G.result + '</h2>' +
      '<div class="sub">RUNID ' + RUNID + ' · 种子 ' + G.seed + ' · 难度 ' + DIFFS[G.diff].n +
        ' · 仿真 ' + G.f + ' 帧 / ' + f1(G.t) + ' s</div>' +
      '<div id="cGrid">' +
        cell('圈次进度', G.lap + ' / ' + LAPS) +
        cell('清波回收', G.salvage + ' / ' + WAVES.length) +

        cell('峰值倍率', '×' + f2(1 + Math.min(2.4, Math.max(0, G.bestCombo - 1) * 0.13))) +

        cell('边缘暴露累计', f1(G.edgeTime) + ' s') +
      '</div>' +
      '<div id="cFoot">' +
        '<div class="grade">' + a.grade + '</div>' +
        /* 七个归一化分量必须与题面点名的七项一一对上：轴心守护 / 波次压制 /
           清波回收 / 结构抑制 / 连击连贯度 / 守恒完整性 / 落点精准。同调轴由
           落点精准度归一化而来，无样本时整轴剔除，必须在读数处写明并同步重算。 */
        '<div>综合评分 ' + f1(a.sc) + ' / 100<br>' +
          '轴心守护 ' + f2(a.lifeP) + ' · 波次压制 ' + f2(a.waveP) + ' · 清波回收 ' + f2(a.salvP) + '<br>' +
          '结构抑制 ' + f2(a.clean) + ' · 连击连贯度 ' + f2(a.chain) + ' · 守恒完整性 ' + f2(a.cons) + '<br>' +
          '落点精准 ' + (a.hasCore ? f2(a.core) + '（同调轴）' : '—（无落点样本）') +
          (a.hasCore ? '' : '<br>同调轴整轴剔除 · 权重和已按剩余六轴重算') +
        '</div>' +
        '<div style="margin-left:auto;text-align:right">RUN_SETTLED_LEDGER<br>Enter / R 返回母舰</div>' +
      '</div>';
  }
  function hideCard() { cardEl.className = ''; }

  /* ══════════════ 20. 引导自检蒙皮 ══════════════ */
  var bootEl = document.getElementById('boot');
  var bootGrid = document.getElementById('bootStages');
  var bootSub = document.getElementById('bootSub');
  var bootFL = document.getElementById('bootFootL');
  var bootFR = document.getElementById('bootFootR');
  var bootSig = '';
  function syncBoot() {
    var B = G.boot, on = !B.done;
    if (on !== (bootEl.className === 'on')) bootEl.className = on ? 'on' : '';
    if (!on) return;
    var sig = B.st + '|' + B.f + '|' + B.bad + '|' + B.err;
    if (sig === bootSig) return;
    bootSig = sig;
    var h = '', i;
    for (i = 0; i < BOOT_STAGES.length; i++) {
      var r = B.list[i], st = BOOT_STAGES[i];
      var cls = r ? (r.ok ? 'done' : 'bad') : (i === B.st ? 'run' : '');
      var note = r ? r.note : (i === B.st ? '校验中 · 帧 ' + B.f + '/' + st.h : '待决');
      h += '<div class="' + cls + '"><b>' + (i + 1) + ' · ' + st.n + '</b><i>' + note + '</i></div>';
    }
    bootGrid.innerHTML = h;
    bootSub.textContent = B.bad ? '引导中止 · ' + B.err
      : (B.done ? '引导完成 · ' + BOOT_STAGES.length + ' 段全部通过 · 放行'
                : '第 ' + (B.st + 1) + ' / ' + BOOT_STAGES.length + ' 段 · ' + BOOT_STAGES[B.st].n);
    bootFL.textContent = '帧 ' + G.f + ' / 预算 ' + B_TOTAL + ' 帧';
    bootFR.textContent = B.done ? '放行 → TITLE_LOBBY' : 'BOOT_SEQUENCING';
  }

  /* ══════════════ 21. 顶栏 ══════════════ */
  var barEls = {
    st: document.querySelector('#hState'), df: document.querySelector('#hDiff'),
    sp: document.querySelector('#dSpeed'), lp: document.querySelector('#dLap'),
    wv: document.querySelector('#dWave'), lf: document.querySelector('#dLife')
  };
  var lastBar = '';
  function syncBar() {
    var sig = G.state + '|' + Math.round(P.v * KMH) + '|' + G.lap + '|' + G.wave + '|' +
              f1(G.life) + '|' + G.quotaDead + '|' + (G.strain >= PHYS.STRAIN_CAP);
    if (sig === lastBar) return;
    lastBar = sig;
    barEls.st.textContent = G.state;
    barEls.df.textContent = DIFFS[G.diff].n;
    barEls.sp.textContent = Math.round(P.v * KMH);
    barEls.lp.textContent = G.lap + ' / ' + LAPS;
    barEls.wv.textContent = G.wave + ' / ' + WAVES.length;
    barEls.lf.textContent = f1(G.life);
    var menace = G.state === 'DYNAMIC_BRANCHING' || G.state === 'CRISIS_FAILED_ROLLBACK' ||
                 G.state === 'STRAIN_CRITICAL' || G.state === 'QUOTA_EXHAUSTED';
    barEls.st.style.background = G.state === 'RUN_SETTLED_LEDGER' ? '#ffd479'
      : menace ? '#ff8a5c' : (G.state === 'OVERLOAD_PENALTY' ? '#ff5fd0'
      : (G.state === 'BOOT_SEQUENCING' ? '#8b93cf' : '#5fe0c0'));
  }

  /* ══════════════ 22. 蒙皮同步 ══════════════ */
  function syncOverlay() {
    var menu = (G.state === 'TITLE_LOBBY');
    if (menu) { if (ovEl.className === 'hide') buildMenu(); }
    else if (ovEl.className !== 'hide') ovEl.className = 'hide';
    if (G.settled) { if (cardEl.className !== 'on') showCard(); }
    else if (cardEl.className === 'on') hideCard();
  }
  function paint() {
    syncOverlay(); syncBar(); syncBoot();
    paintWorld(CX.world); paintRadar(CX.radar); paintRig(CX.rig);
    paintQuota(CX.quota); paintRings(CX.rings); paintLedger(CX.ledger);
  }

  /* ══════════════ 21. 公开 API ══════════════ */
  var API = {
    seed: function (n) { G.seed = n | 0; lastBar = ''; return G.seed; },
    setDifficulty: function (k) { if (DIFFS[k]) G.diff = k; return G.diff; },
    /* 放行只在引导十四段全部通过之后才成立：引导没走完就调 start()，
       返回的是当前态而不是「假装已放行」—— 启动流程因此不可被绕过。 */
    start: function () {
      if (!G.boot.done) return G.state;
      if (G.state === 'TITLE_LOBBY' || G.settled) {
        resetRun(); G.started = true;
        G.state = 'SEEDED_INITIALIZING'; G.revealed = 0;
      }
      G.frozen = false; G.paused = false; syncOverlay(); return G.state;
    },
    toMenu: function () {
      G.frozen = true; G.settled = false; G.started = false;
      G.state = 'TITLE_LOBBY'; syncOverlay(); return G.state;
    },
    restart: function () {
      if (!G.boot.done) return G.state;
      G.frozen = false; G.settled = false; resetRun(); G.started = true;
      G.state = 'SEEDED_INITIALIZING'; G.revealed = 0; syncOverlay(); return G.state;
    },
    pause: function () { G.paused = true; G.frozen = true; return true; },
    resume: function () { G.paused = false; G.frozen = false; return true; },
    freeze: function () { G.frozen = true; return true; },
    thaw: function () { G.frozen = false; return true; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) tick(1 / 60); return G.f; },
    seek: function (sec) {
      resetRun(); G.boot.done = true; G.started = true;
      G.state = 'ACTIVE_ENGAGED'; G.revealed = 1; G.launchLock = 0;
      var n = Math.max(0, Math.round(sec * 60));
      for (var i = 0; i < n; i++) tick(1 / 60);
      G.frozen = true; syncOverlay(); return G.f;
    },
    /* ── 引导自检序列：可单段推进、可整链跑完，结论一律写进自检台账 ── */
    boot: function (n) {
      if (n === undefined) { while (!G.boot.done && !G.boot.bad) bootStep(); }
      else { for (var i = 0; i < (n | 0); i++) if (!G.boot.done && !G.boot.bad) bootStep(); }
      resolveState(); syncBoot();
      return { st: G.boot.st, f: G.boot.f, done: G.boot.done, bad: !!G.boot.bad, err: G.boot.err };
    },
    bootState: function () {
      return { st: G.boot.st, f: G.boot.f, done: G.boot.done, bad: !!G.boot.bad,
               err: G.boot.err, total: B_TOTAL,
               list: G.boot.list.map(function (r) {
                 return { k: r.k, n: r.n, h: r.h, ok: r.ok, note: r.note, f: r.f };
               }) };
    },
    bootStages: function () {
      return BOOT_STAGES.map(function (s) { return { k: s.k, n: s.n, h: s.h }; });
    },
    /* ── 守恒账本：五科目读数 + 缺口 + 分带配额 ── */
    accounts: function () { return budget(); },
    gap: function () { return budget().gap; },
    quota: function () { return { left: G.quota.slice(), cap: G.quotaCap.slice(),
                                  plan: G.quotaPlan.map(function (p) { return { i: p.i, f: p.f, s: p.s, band: p.band, hp: p.hp, spd: p.spd, n: p.n }; }),
                                  ptr: G.wavePtr, dead: G.quotaDead, refill: G.quotaRefill,
                                  block: G.quotaBlock, swap: G.quotaSwap }; },
    exRate: function (bi) { return exRate(bi === undefined ? strataAt(P.d) : bi); },
    frags: function () {
      return G.frags.map(function (f) { return { x: f.x, y: f.y, th: f.th, r: f.r, m: f.m, life: f.life }; });
    },
    fragMass: function () { var s = 0, i; for (i = 0; i < G.frags.length; i++) s += G.frags[i].m; return s; },
    /* ── 状态机：候选集合与裁决结果一起交出去，外部可独立复算 ── */
    cand: function () { return candidates().slice(); },
    resolve: function () { resolveState(); return G.state; },
    fsmCn: function () { return FSM_CN; },
    operable: function () { return FSM_OPERABLE.slice(); },
    fastForward: function (sec) { return API.step(Math.round((sec || 0) * 60)); },
    finish: function () { finishRun(LAPS + ' 圈完赛'); return API.state(); },
    paint: function () { paint(); return true; },
    state: function () { return G.state; },
    fsmOrder: function () { return FSM_ORDER.slice(); },
    fsmPriority: function () { return FSM_PRIORITY.slice(); },
    consts: function () { return { SEG: SEG, R0: R0, HW: HW, SC: SC, LAPS: LAPS, KMH: KMH, PHYS: PHYS, HAZ: HAZ, WAVES: WAVES, DIFFS: DIFFS }; },
    info: function () {
      return {
        state: G.state, t: +G.t.toFixed(2), frames: G.f, frozen: G.frozen,
        seed: G.seed, diff: G.diff, nc: G.nc,
        speed: P.v, speedKmh: P.v * KMH, lateral: P.u, slip: P.slip,
        alt: P.alt, vz: P.vz, hop: P.hop, th: P.th, d: P.d,
        attune: P.attune, attuned: P.attuned, attuneT: P.attuneT,
        charge: G.chargeM, charging: P.charging, vent: P.vent, polT: P.polT, tether: !!P.tether,
        plate: P.onPlate, onGround: P.onGround,
        strain: G.strain, strainPeak: G.strainPeak, galeT: G.galeT, galeCool: G.galeCool,
        launchLock: G.launchLock, launchAlign: G.launchAlign, started: G.started,
        plunge: P.plunge, plungeT: P.plungeT, idleTime: G.idleTime,
        boot: { st: G.boot.st, f: G.boot.f, done: G.boot.done, bad: !!G.boot.bad, err: G.boot.err },
        cand: (G.cand || []).slice(), rollN: G.rollN, frags: G.frags.length,
        fragMass: API.fragMass(), quotaDead: G.quotaDead, exRate: exRate(strataAt(P.d)),
        quota: G.quota.slice(), quotaCap: G.quotaCap.slice(), wavePtr: G.wavePtr,
        convIn: G.convIn, convOut: G.convOut, quotaSwap: G.quotaSwap, exCount: G.exCount,
        exRefused: G.exRefused, fragBreak: G.fragBreak, fragClaim: G.fragClaim,
        galeCount: G.galeCount, quotaRefill: G.quotaRefill, quotaBlock: G.quotaBlock,
        lap: G.lap, lapT: G.lapT, lapTimes: G.lapTimes.slice(), bestLap: G.bestLap,
        totalTh: G.totalTh, wave: G.wave, waveState: G.waveState,
        hazards: G.drones.length, kills: G.kills, salvage: G.salvage,
        life: G.life, lifeMax: G.lifeMax, gas: G.gas, gasMax: G.gasMax,
        stab: G.stab, fatigue: G.fatigue, cool: 0,
        combo: G.combo, bestCombo: G.bestCombo, yieldMul: G.yieldMul,
        coreN: G.coreN, landN: G.landN, edgeTime: G.edgeTime,
        plungeCount: G.plungeCount, plungeBest: G.plungeBest,
        polCount: G.polCount, catCount: G.catCount, tgCount: G.tgCount,
        overCount: G.overCount, overT: G.overT, rollT: G.rollT, rollReason: G.rollReason,
        wallCount: G.wallCount, hitCount: G.hitCount,
        score: G.score, rank: G.rank, overtakes: G.overtakes,
        revealed: G.revealed, settled: G.settled, result: G.result,
        ledger: G.ledger.length
      };
    },
    track: function () {
      return { nc: G.nc, amp: G.amp, ph: G.ph, seg: SEG, r0: R0, hw: HW, seed: G.seed };
    },
    plates: function () {
      return G.plates.map(function (p) {
        return { i: p.i, life: p.life, alive: p.alive, fuse: p.fuse, voidT: p.voidT,
                 sink: p.sink, sinkV: p.sinkV, sink0: p.sink0, impact: p.impact, anchor: p.anchor,
                 load: p.load, decay: p.decay };
      });
    },
    drones: function () {
      return G.drones.map(function (h) {
        return { kind: h.kind, n: h.n, x: h.x, y: h.y, hp: h.hp, hpMax: h.hpMax,
                 rad: h.rad, r: h.r, th: h.th, armor: h.armor, ethereal: h.ethereal, boss: h.boss };
      });
    },
    player: function () {
      return { th: P.th, d: P.d, r: P.r, x: P.x, y: P.y, v: P.v, u: P.u, slip: P.slip,
               alt: P.alt, vz: P.vz, hop: P.hop, attune: P.attune, charge: G.chargeM,
               onGround: P.onGround, onPlate: P.onPlate, tether: !!P.tether,
               tgA: P.tgA, tgW: P.tgW, head: P.head, plunge: P.plunge };
    },
    agg: function () { return aggregate(); },
    ledger: function () { return G.ledger.slice(); },
    log: function () { return G.logs.slice(); },
    radial: function (th) { return rad(th); },
    curvature: function (th) { return curv(th); },
    windAt: function (th) { return windAt(th === undefined ? P.th : th, G.t); },
    plateAt: function (th) { return plateOf(th === undefined ? P.th : th); },
    inCore: function (f) { return inCore(f); },
    strataAt: function (d) { return STRATA[strataAt(d === undefined ? P.d : d)]; },
    /* ── 布场钩子 ── */
    /* 操纵面注入必须走按键状态：tick 每帧都会从按键重读操纵面，
       直接写 P.throttle / P.steer 会在同一帧被覆盖掉。 */
    setKine: function (throttle, steer) {
      K.up = throttle > 0.02; K.dn = throttle < -0.02;
      K.lf = steer < -0.02; K.rt = steer > 0.02;
      return true;
    },
    setHand: function (v) { K.hand = !!v; return true; },
    /* 蓄能键同样要能按住：熔断是「顶着安全线继续蓄」的结果，
       只给一次性的 release() 就绕过了熔断判据，过载态便无从复现。 */
    setCat: function (v) { K.cat = !!v; return true; },
    setSlip: function (s) { P.u = Math.tan(clamp(s, -PHYS.SLIP_MAX, PHYS.SLIP_MAX)) * Math.max(20, P.v); return P.slip; },
    setVel: function (v, u) { P.v = v; if (u !== undefined) P.u = u; return true; },
    setAlt: function (a, vz) { P.alt = a; P.vz = vz || 0; return true; },
    teleport: function (th, d) { P.th = th; if (d !== undefined) P.d = d; syncPos(); return true; },
    setHop: function (n) { P.hop = n; return P.hop; },
    /* 注气也走守恒：给牵引储备科目加多少，就从熵损科目里划走多少。
       直接赋值会让五科目之和当场漂移，守恒自检立刻把整条链标红。 */
    setGas: function (g) {
      var want = clamp(g, 0, G.gasMax) * (g <= 1.001 && g >= 0 ? G.gasMax : 1);
      var tgt = Math.round(want * LEDGER.TRACTION_K);
      var d = tgt - G.tractionM;
      if (d > 0) { d = Math.min(d, Math.max(0, G.entropyM)); G.entropyM -= d; G.tractionM += d; }
      else { G.tractionM += d; G.entropyM -= d; }
      syncGas(); return G.gas;
    },
    setStrain: function (v) { G.strain = clamp(v, 0, PHYS.STRAIN_CAP); return G.strain; },
    setGale: function (s) { G.galeT = Math.max(0, s || 0); G.galeCool = 0; return G.galeT; },
    setQuota: function (bi, v) { G.quota[bi] = Math.max(0, v | 0); return G.quota[bi]; },
    setLaunch: function (s) { G.launchLock = Math.max(0, s || 0); return G.launchLock; },
    /* 抽取 / 兑换 / 置换：三笔经济操作的直通钩子，判据一条不减 */
    extract: function (m) {
      var pp = plateOf(P.th);
      return extract(G.plates[pp[0]], strataAt(P.d),
                     Math.max(0, Math.round(m === undefined ? LEDGER.EX_MAX : m)));
    },
    exchangeIn: function () { return doExchange(1); },
    exchangeOut: function () { return doExchange(-1); },
    quotaSwap: function () { return doQuotaSwap(); },
    setStab: function (s) { G.stab = clamp(s <= 1.001 && s >= 0 ? s * 100 : s, 0, 100); return G.stab; },
    setFatigue: function (v) { G.fatigue = clamp(v, 0, PHYS.FATIGUE_MAX); return G.fatigue; },
    setLife: function (v) { G.life = clamp(v <= 1.001 && v >= 0 ? v * G.lifeMax : v, 0, G.lifeMax); return G.life; },
    setCombo: function (n) { G.combo = n | 0; if (G.combo > G.bestCombo) G.bestCombo = G.combo; G.yieldMul = 1 + Math.min(2.4, Math.max(0, G.combo - 1) * 0.13); return G.combo; },
    setSalvage: function (n) { G.salvage = n | 0; return G.salvage; },
    setPlate: function (i, o) {
      var p = G.plates[i]; if (!p || !o) return false;
      if ('life' in o) { p.lifeM = Math.round(clamp(o.life, 0, 1) * LEDGER.PLATE_M); p.life = p.lifeM / LEDGER.PLATE_M; }
      if ('lifeM' in o) { p.lifeM = Math.max(0, o.lifeM | 0); p.life = p.lifeM / LEDGER.PLATE_M; }
      if ('alive' in o) p.alive = !!o.alive;
      if ('fuse' in o) p.fuse = o.fuse;
      if ('voidT' in o) p.voidT = o.voidT;
      if ('sinkV' in o) p.sinkV = o.sinkV;
      return true;
    },
    /* 蓄能注入同样走科目对转：从熵损划进蓄能存量，1:1 不产生小数 */
    setCharge: function (v) {
      var tgt = Math.round(clamp(v <= 1.001 && v >= 0 ? v * LEDGER.CHARGE_FULL_M : v,
                                 0, LEDGER.CHARGE_FULL_M));
      var d = tgt - G.chargeM;
      if (d > 0) { d = Math.min(d, Math.max(0, G.entropyM)); G.entropyM -= d; G.chargeM += d; }
      else { G.chargeM += d; G.entropyM -= d; }
      return G.chargeM;
    },
    charge: function () { P.charging = true; K.cat = true; return G.chargeM; },
    /* 一次性释放：这里刻意保留「非蓄能路径」的语义 —— 它不产生竞速功，
       因此不能拿它绕过 K 键的蓄能-转化-熔断三段因果。探针用它只做力学注入。 */
    release: function () {
      var cm = G.chargeM;
      var imp = PHYS.CAT_K * Math.pow(cm / 1000, PHYS.CAT_EXP);
      P.v += imp * 0.60; P.vz += imp * 0.10;
      xfer('charge', 'entropy', cm);
      G.catCount++; P.charging = false; K.cat = false;
      return imp;
    },
    hop: function () { return doHop(); },
    polarity: function () { return doPolarity(); },
    tether: function () { return tryTether(); },
    pulse: function () { return doPulse(); },
    plunge: function () { return doPlunge(); },
    plungeInject: function (imp) {
      P.vz = -(imp || 260); P.alt = Math.max(P.alt, 1); P.plunge = true;
      G.plungeCount++; return true;
    },
    shatterFrag: function (i, claim) { return shatterFrag(i, claim !== false); },
    seedFrags: function (n) {
      var pp = plateOf(P.th);
      spawnFrags(G.plates[pp[0]]);
      return G.frags.length;
    },
    rebuildPlate: function (i, m) { return rebuild(G.plates[i], m === undefined ? LEDGER.VOID_REGROW : m); },
    overload: function () { G.overT = PHYS.OVER_MS / 1000; G.overCount++; return true; },
    crisis: function (r) { crash(r || '探针注入的致命失败'); return true; },
    wall: function () { wall(); return G.wallCount; },
    setAttune: function (v) { P.attuneT = clamp(v, 0, 1) * PHYS.ATTUNE_MS; P.attuned = v >= 1; return P.attune; },
    wave: function (n) {
      var i = clamp((n === undefined ? G.wave : n) | 0, 1, G.quotaPlan.length) - 1;
      spawnWavePlan(G.quotaPlan[i]);
      return G.wave;
    },
    spawn: function (kind, th, d) {
      var H = HAZ[kind]; if (!H) return false;
      var w = G.quotaPlan[clamp(G.wave, 1, G.quotaPlan.length) - 1] ||
              { hp: 1, spd: 1 };
      var thx = (th === undefined) ? P.th + 0.6 : th;
      var r = rad(thx) + (d === undefined ? 0 : d);
      G.drones.push({
        kind: kind, n: H.n, hp: H.hp * w.hp, hpMax: H.hp * w.hp,
        x: r * Math.cos(thx), y: r * Math.sin(thx), th: thx, r: r,
        spd: H.spd * G.espd * w.spd, dmg: H.dmg, rad: H.r, col: H.col,
        armor: !!H.armor, ethereal: !!H.ethereal, boss: !!H.boss, hitT: 0
      });
      return true;
    },
    clearDrones: function () { G.drones = []; return true; },
    killAll: function () { G.kills += G.drones.length; G.drones = []; return true; },
    clearFx: function () { G.fx = []; G.marks = []; return true; },
    settle: function (r) { finishRun(r || LAPS + ' 圈完赛'); return true; },
    marks: function () { return G.marks.slice(); }
  };
  /* 标记：撞击 / 漂移痕，交给主循环采样 */
  function sampleMarks() {
    if (Math.abs(P.slip) > 0.28 && P.alt <= 0.5)
      G.marks.push({ x: P.x, y: P.y, a: clamp(Math.abs(P.slip) / PHYS.SLIP_MAX, 0, 1) });
    else if (G.marks.length && G.f % 3 === 0) G.marks.push({ x: P.x, y: P.y, a: 0.12 });
    if (G.marks.length > 300) G.marks.splice(0, G.marks.length - 300);
  }

  /* ══════════════ 22. 输入绑定 ══════════════ */
  window.addEventListener('keydown', function (e) {
    var a = KEYS[e.code];
    if (a) { K[a] = true; if (e.code === 'Space') e.preventDefault(); }
    if (e.code === 'Enter') {
      if (G.state === 'TITLE_LOBBY') API.start();
      else if (G.settled) API.toMenu();
    }
    if (e.code === 'KeyR') { G.seed = (G.seed * 1103515245 + 12345) & 0x7fffffff; buildMenu(); }
    if (e.code === 'Digit1') { G.diff = 'easy'; buildMenu(); }
    if (e.code === 'Digit2') { G.diff = 'normal'; buildMenu(); }
    if (e.code === 'Digit3') { G.diff = 'hard'; buildMenu(); }
  });
  window.addEventListener('keyup', function (e) {
    var a = KEYS[e.code];
    if (a) K[a] = false;
  });
  window.addEventListener('blur', function () { for (var k in K) K[k] = false; });
  document.addEventListener('mousedown', function (e) {
    var el = e.target.closest ? e.target.closest('.df') : null;
    if (el) { G.diff = el.getAttribute('data-d'); buildMenu(); }
  });

  /* ══════════════ 23. 主循环（定长步进 + 六路独立重绘） ══════════════ */
  /* 六块画布各自挂一条 requestAnimationFrame 循环，互相不等待：
     任意一块的重绘开销都不会拖慢另外五块，也不会拖慢定长步进的仿真时钟。 */
  var acc = 0, last = 0;
  function advance(now) {
    if (G.frozen || G.paused) {
      last = now;
      /* 引导自检序列不受「冻结」约束：冻结冻的是对局物理，不是启动流程。
         否则探针一调 freeze()，引导就永远停在第一段，启动序列无从验收。 */
      if (!G.boot.done) { bootStep(); resolveState(); }
      return;
    }
    if (!last) last = now;
    var dt = (now - last) / 1000; last = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    var n = 0;
    while (acc >= 1 / 60 && n < 8) { tick(1 / 60); sampleMarks(); acc -= 1 / 60; n++; }
  }
  function loopWorld(now) {
    advance(now); paintWorld(CX.world);
    syncBar(); syncOverlay(); syncBoot(); requestAnimationFrame(loopWorld);
  }
  function loopRadar() { paintRadar(CX.radar); requestAnimationFrame(loopRadar); }
  function loopRig() { paintRig(CX.rig); requestAnimationFrame(loopRig); }
  function loopQuota() { paintQuota(CX.quota); requestAnimationFrame(loopQuota); }
  function loopRings() { paintRings(CX.rings); requestAnimationFrame(loopRings); }
  function loopLedger() { paintLedger(CX.ledger); requestAnimationFrame(loopLedger); }

  /* ══════════════ 24. 启动 ══════════════ */
  resetRun();
  G.boot.done = false; G.boot.st = 0; G.boot.f = 0; G.boot.err = ''; G.boot.bad = false;
  G.boot.list = [];
  G.started = false;
  G.state = 'BOOT_SEQUENCING';
  G.frozen = true;
  buildMenu();
  window.AXELPULSE = API;
  paint();
  requestAnimationFrame(loopWorld);
  requestAnimationFrame(loopRadar);
  requestAnimationFrame(loopRig);
  requestAnimationFrame(loopQuota);
  requestAnimationFrame(loopRings);
  requestAnimationFrame(loopLedger);
})();

</script>
</body>
</html>
