.tailhi{fill:none;stroke:var(--furL);stroke-linecap:round}

.watermark-sub{fill:var(--ink);opacity:.2;font-size:16px;letter-spacing:10px}
#fox .part{transition:filter .18s ease}
#fox .part:hover{filter:brightness(1.06) drop-shadow(0 0 8px rgba(232,137,60,.5));cursor:pointer}

#bpGrid{display:none}
#annotations{display:none}
#legend{display:none}
#foxSvg.bp #backdrop{display:none}
#foxSvg.bp #bpGrid{display:block}

#foxSvg.ann #annotations{display:block}
#foxSvg.ann #legend{display:block}
.ann-dot{fill:#e8893c}.ann-num{fill:#fff;font-size:17px;font-weight:700;font-family:Georgia,serif}

(function(){
  var state={view:'overview'};

  var ZOOM={ head:{x:575,y:225,w:390,h:295}, tail:{x:830,y:400,w:260,h:230} };
  function zoomTo(box){
    var W=1536,H=864,pad=40;
    var s=Math.min(W/(box.w+pad*2), H/(box.h+pad*2));
    var tx=W/2-(box.x+box.w/2)*s, ty=H/2-(box.y+box.h/2)*s;
    cam.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') scale('+s.toFixed(3)+')');
  }
  function setView(v){
    state.view=v;
    svg.classList.remove('theme-arctic','bp','ann');
    cam.removeAttribute('transform');
    if(v==='arctic') svg.classList.add('theme-arctic');
    else if(v==='blueprint') svg.classList.add('bp');
    else if(v==='annotate') svg.classList.add('ann');
    else if(v==='head') zoomTo(ZOOM.head);
    else if(v==='tail') zoomTo(ZOOM.tail);
    tabs.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ setView(b.getAttribute('data-view')); }); });
  window.FOX={ setView:setView, info:function(){
    return { view:state.view, parts:document.querySelectorAll('#fox .part').length,
      svgEls:document.querySelectorAll('#foxSvg *').length };
  }};
})();</script>
</body>
</html>
