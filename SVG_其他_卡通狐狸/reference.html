<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机芯狐首 MECHANICAL FOX</title>
<style>
  :root{ --stage:#0a0a0c; --ink:#ffe9cc; --dim:#b08a60; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#060504;overflow:hidden}
  body{font:12px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--dim)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{display:block;flex:none;width:100%;height:100%;background:var(--stage)}

  /* ── L1 环境场与背板底衬：秋林暮色 ─────────────────────── */
  .sky{fill:url(#gSky)}
  .halo{fill:url(#rHalo)}
  .haze{fill:url(#gHaze)}
  .tree-far{fill:url(#gTree)}
  .tree-near{fill:url(#gTreeN)}
  .guide{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.28}
  .bpgrid{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.24}
  .ticks{fill:none;stroke:url(#gTick);stroke-width:1;opacity:.40}
  .shaft{fill:url(#gShaftX);opacity:.50}
  .leaf{opacity:.7}
  .vignette{fill:#0a0603}

  /* ── L2 基座承重与接触阴影：远侧构件退入暗场 ────────────── */
  .ao{fill:url(#rAO)}
  .ruff-far{fill:url(#gDark)}
  .whisk-far{fill:url(#gWhisk);opacity:.30}

  /* ── L3 主构架与核心机构内胆 ───────────────────────────── */
  .gear{fill:none;stroke:url(#gGear);stroke-width:2;stroke-linejoin:round}
  .gear-hub{fill:url(#gCollar)}
  .couple{fill:url(#gCouple);stroke:#7a4a14;stroke-width:.8}
  .bolt{fill:url(#rBore1)}
  .collar{fill:url(#gCollar)}
  .neck-tube{fill:url(#gFur)}
  .neck-band{fill:none;stroke:url(#gSeam);stroke-width:1.3}
  .bore{fill:url(#rBore0)}
  .eye-sock{fill:url(#rEyeSock)}
  .eye-lid{fill:url(#rEyeLid)}
  .iris{fill:url(#rIris);stroke:#ffcf7a;stroke-width:1.2;stroke-opacity:.5}
  .pupil{fill:#140a04}
  .eye-hi{fill:#fff8e8;opacity:.78}
  .mz-bridge{fill:url(#gMuzzleD);opacity:.9}
  .ch-plate2{fill:url(#gPlate2)}
  .ch-core{fill:url(#rCore)}

  /* ── L4 曲面外壳与多曲率包络 ───────────────────────────── */
  .skull{fill:url(#gSkull)}
  .sk-seam{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .sk-ridge{fill:none;stroke:url(#gRidge);stroke-width:2.6;stroke-linecap:round}
  .sk-plate{fill:url(#gPlate);opacity:.92}
  .muzzle{fill:url(#gMuzzle)}
  .mz-seam{fill:none;stroke:url(#gSeam);stroke-width:1.1}
  .mz-nose{fill:url(#rBore0)}
  .mz-nostril{fill:#0d0603}
  .mz-mouth{fill:none;stroke:#5a2a0c;stroke-width:2.2;stroke-linecap:round}
  .ear-near{fill:url(#gFur)}
  .ear-far{fill:url(#gDark)}
  .ear-near-in{fill:url(#gEarIn)}
  .ear-far-in{fill:url(#gEarIn);opacity:.6}
  .ear-rib{fill:none;stroke:#a8622a;stroke-width:1.1;stroke-opacity:.5}
  .ruff-near{fill:url(#gRuff)}
  .chest{fill:url(#gChest)}
  .ch-seam{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .ch-plate{fill:url(#gPlate)}
  .ch-slat{fill:url(#gSlat)}
  .ch-rivet{fill:url(#gClaw);opacity:.85}
  .leg-near{fill:url(#gFur)}
  .leg-far{fill:url(#gDark)}
  .leg-near-band,.leg-far-band{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .leg-near-paw{fill:url(#gToe)}
  .leg-far-paw{fill:url(#gDark)}
  .leg-near-toe,.leg-far-toe{fill:none;stroke:#6a3410;stroke-width:2;stroke-opacity:.7}
  .leg-near-claw{fill:none;stroke:url(#gClaw);stroke-width:3.2;stroke-linecap:round}
  .leg-far-claw{fill:none;stroke:#4a2408;stroke-width:2.6;stroke-linecap:round}
  .tail-fur{fill:url(#gTail);opacity:.9}
  .tail{fill:url(#gTail)}
  .tail-seg{fill:none;stroke:url(#gSeam);stroke-width:1.3}
  .tail-tip{fill:url(#gTailTip)}
  .tail-wisp{fill:url(#gFur);opacity:.92}
  .whisk-near{fill:url(#gWhisk)}

  /* ── L5 镜面高光与视差辉光 ─────────────────────────────── */
  .lens{fill:url(#gLens)}
  .fresnel{fill:none;stroke:url(#gFres);stroke-width:2.4;stroke-linecap:round}
  .glow-mote{fill:url(#rTipGlow)}
  .mote{fill:url(#rMote)}

  /* ── L6 读数与部件标注 ─────────────────────────────────── */
  #annot{display:none}
  body.annot #annot{display:block}
  .readout{fill:#8a6a44;font:11px ui-monospace,monospace;letter-spacing:.18em}
  .an-lead{fill:none;stroke:url(#gAnno);stroke-width:1}
  .an-badge{fill:rgba(18,10,4,.74);stroke:#f0b878;stroke-width:1.4}
  .an-no{fill:#ffe9cc;font:600 14px ui-monospace,monospace;text-anchor:middle}
  .lg-panel{fill:rgba(16,9,4,.55);stroke:#8a5a28;stroke-width:1}
  .lg-dot{fill:#f0b878}
  .lg-no{fill:#c08a4c;font:600 11px ui-monospace,monospace}
  .lg-zh{fill:#f4e0c4;font-size:12px}
  .lg-en{fill:#96683a;font:9.5px ui-monospace,monospace;letter-spacing:.1em}
  .lg-ly{fill:#6e4a24;font:9.5px ui-monospace,monospace}
  .lg-h{fill:#fff2dc;font-size:14px;letter-spacing:.34em}
  .lg-h2{fill:#96683a;font:9px ui-monospace,monospace;letter-spacing:.22em}

  /* ── 高对比冷色阶：整图色阶对位替换，几何零变化 ────────── */
  body.theme-b{--stage:#0a0301}
  body.theme-b #stage{background:#0a0301}
  body.theme-b .sky{fill:url(#aSky)}
  body.theme-b .halo{fill:url(#rHaloW)}
  body.theme-b .tree-far{fill:url(#aTree)}
  body.theme-b .tree-near{fill:url(#aTreeN)}
  body.theme-b .skull{fill:url(#aSkull)}
  body.theme-b .chest{fill:url(#aChest)}
  body.theme-b .tail{fill:url(#aTail)}
  body.theme-b .tail-fur{fill:url(#aTail)}
  body.theme-b .muzzle{fill:url(#aFur)}
  body.theme-b .ear-near{fill:url(#aFur)}
  body.theme-b .leg-near{fill:url(#aFur)}
  body.theme-b .ruff-near{fill:url(#aRuff)}
  body.theme-b .ch-plate,body.theme-b .sk-plate{fill:url(#aPlate)}
  body.theme-b .neck-tube,body.theme-b .collar{fill:url(#aPlate)}
  body.theme-b .tail-wisp{fill:url(#aFur)}
  body.theme-b .shaft{fill:url(#aShaft)}
  body.theme-b .fresnel{stroke:url(#aFres)}
  body.theme-b .leaf{fill:url(#aLeaf)}

  /* ── 线稿拓扑蓝图：轮廓即拓扑分界线，绝不使用纯黑描边 ──── */
  body.bp .sky{fill:#0a1420}
  body.bp .halo,body.bp .haze,body.bp .vignette,body.bp .shaft,body.bp .leaf,
  body.bp .ao,body.bp .tail-fur,body.bp .tail-tip,body.bp .glow-mote{opacity:.05}
  body.bp .skull{fill:none;stroke:#7fd0ff;stroke-width:1.8}
  body.bp .muzzle{fill:none;stroke:#7fd0ff;stroke-width:1.6}
  body.bp .chest{fill:none;stroke:#5fb6e8;stroke-width:1.6}
  body.bp .tail{fill:none;stroke:#7fd0ff;stroke-width:1.6}
  body.bp .ear-near,body.bp .ear-far{fill:none;stroke:#7fd0ff;stroke-width:1.5}
  body.bp .ear-near-in,body.bp .ear-far-in{fill:none;stroke:#3f88b8;stroke-width:1;opacity:.8}
  body.bp .sk-plate{fill:none;stroke:#9fe0ff;stroke-width:1.2;opacity:.85}
  body.bp .sk-seam,body.bp .mz-seam,body.bp .ch-seam{stroke:#3f88b8;opacity:.85}
  body.bp .ear-rib{stroke:#9fe0ff;stroke-opacity:.8}
  body.bp .leg-near-claw,body.bp .leg-far-claw{stroke:#bfeaff;stroke-opacity:.85}
  body.bp .sk-ridge{stroke:#9fe0ff}
  body.bp .sk-plate{opacity:.9}
  body.bp .ruff-near{fill:none;stroke:#6fc0ea;stroke-width:1.1}
  body.bp .ruff-far{fill:none;stroke:#2b6a94;stroke-width:1;opacity:.9}
  body.bp .ch-plate,body.bp .ch-plate2{fill:none;stroke:#9fe0ff;stroke-width:1.3}
  body.bp .ch-slat{fill:none;stroke:#8fd4f4;stroke-width:1;opacity:.8}
  body.bp .ch-rivet,body.bp .bolt,body.bp .pupil{fill:none;stroke:#9fe0ff;stroke-width:1}
  body.bp .leg-near,body.bp .leg-far,body.bp .leg-near-paw,body.bp .leg-far-paw{
    fill:none;stroke:#5fb6e8;stroke-width:1.3}
  body.bp .leg-near-band,body.bp .leg-far-band{stroke:#3f88b8}
  body.bp .collar,body.bp .gear-hub{fill:none;stroke:#6fc0ea;stroke-width:1.2}
  body.bp .neck-tube{fill:none;stroke:#5fb6e8;stroke-width:1.6}
  body.bp .neck-band{stroke:#3f88b8;opacity:.85}
  body.bp .couple{fill:none;stroke:#bfeaff;stroke-width:1.4}
  body.bp .bore,body.bp .ch-core,body.bp .mz-nose{fill:none;stroke:#8fd4f4;stroke-width:1.1}
  body.bp .eye-sock{fill:none;stroke:#4f9fd0;stroke-width:1;opacity:.8}
  body.bp .eye-lid{fill:none;stroke:#8fd4f4;stroke-width:1.3}
  body.bp .iris{fill:none;stroke:#cfeaff;stroke-width:1.1}
  body.bp .pupil{fill:none;stroke:#cfeaff;stroke-width:1}
  body.bp .eye-hi{opacity:0}
  body.bp .mz-bridge{fill:none;stroke:#5fb6e8;stroke-width:1;opacity:.7}
  body.bp .iris{stroke:#bfeaff}
  body.bp .tail-seg{stroke:#3f88b8;opacity:.85}
  body.bp .tail-wisp{fill:none;stroke:#6fc0ea;stroke-width:1}
  body.bp .whisk-near,body.bp .whisk-far{fill:none;stroke:#8fd4f4;stroke-width:1}
  body.bp .lens{opacity:.35}
  body.bp .gear,body.bp .fresnel{stroke:#9fe0ff}
  body.bp .mz-mouth,body.bp .mz-nostril,body.bp .leg-near-toe,body.bp .leg-far-toe{
    fill:none;stroke:#6fc0ea;stroke-width:1.2}
  body.bp .guide,body.bp .bpgrid,body.bp .ticks{stroke:#4a9fdc}
  body.bp .tree-far,body.bp .tree-near{fill:none;stroke:#1d5f88;stroke-width:1}
  body.bp .mote{fill:#9fe8ff;opacity:.8}

  /* ── 复合微交互 ────────────────────────────────────────── */
  #L2 .part,#L3 .part,#L4 .part,#L5 .part{
    transition:transform .46s cubic-bezier(.22,.9,.24,1),opacity .32s ease}
  #L5,#L1{transition:transform .22s ease-out}
  #stage.hasfocus .part{opacity:.28}
  #stage.hasfocus #L6{opacity:.28}
  #stage.hasfocus .part.focused{opacity:1}
  #stage.hasfocus .part.focused .skull{filter:url(#fBloom)}
  #stage.nohit #L7 .hit{pointer-events:none!important}
  #L7 .hit{fill:transparent;stroke:none;pointer-events:all}
  #L7{cursor:pointer}

  /* ── 演示外壳 ──────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;
       padding:9px 16px;background:linear-gradient(180deg,rgba(10,6,3,.92),rgba(10,6,3,0));
       z-index:9;pointer-events:none}
  #bar button{pointer-events:auto;font:11px ui-monospace,monospace;color:#c8a072;
       background:rgba(28,17,8,.72);border:1px solid #6a4420;border-radius:4px;
       padding:4px 11px;cursor:pointer}
  #bar button.on{color:#1a0e05;background:#f0b878;border-color:#f0b878}
  #bar .sp{flex:1}
  #ttl{font:600 15px/1 ui-monospace,monospace;color:#ffe9cc;letter-spacing:.30em}
  #ttl small{display:block;font-size:10px;color:#96683a;letter-spacing:.20em;margin-top:5px}
  #read{font:11px ui-monospace,monospace;color:#8a6a44;margin-right:8px}
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1536 864" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" role="img" aria-label="秋林机械狐：五层 Z 序矢量插画">
    <defs>
      <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0a1420" stop-opacity="1"/><stop offset="38%" stop-color="#1c2637" stop-opacity="1"/><stop offset="70%" stop-color="#3d2a22" stop-opacity="1"/><stop offset="100%" stop-color="#140e0f" stop-opacity="1"/></linearGradient>
      <linearGradient id="gHaze" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffa855" stop-opacity="0.34"/><stop offset="46%" stop-color="#e07a34" stop-opacity="0.14"/><stop offset="100%" stop-color="#8c3a16" stop-opacity="0"/></linearGradient>
      <linearGradient id="gFur" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe2b4" stop-opacity="0.97"/><stop offset="24%" stop-color="#f2a552" stop-opacity="0.97"/><stop offset="60%" stop-color="#c2621f" stop-opacity="0.97"/><stop offset="100%" stop-color="#6d2c0c" stop-opacity="0.98"/></linearGradient>
      <linearGradient id="gFurIn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff4de" stop-opacity="0"/><stop offset="30%" stop-color="#ffd39a" stop-opacity="0.34"/><stop offset="64%" stop-color="#c8621f" stop-opacity="0"/><stop offset="100%" stop-color="#5c2208" stop-opacity="0"/></linearGradient>
      <linearGradient id="gRuff" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffcb8c" stop-opacity="0.96"/><stop offset="46%" stop-color="#e08a3c" stop-opacity="0.95"/><stop offset="100%" stop-color="#8a4413" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gMuzzle" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffeed4" stop-opacity="0.98"/><stop offset="38%" stop-color="#e3a76c" stop-opacity="0.97"/><stop offset="100%" stop-color="#8b4a1e" stop-opacity="0.97"/></linearGradient>
      <linearGradient id="gSkull" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffdcae" stop-opacity="0.98"/><stop offset="28%" stop-color="#e9974b" stop-opacity="0.98"/><stop offset="64%" stop-color="#a95420" stop-opacity="0.98"/><stop offset="100%" stop-color="#5e2609" stop-opacity="0.99"/></linearGradient>
      <linearGradient id="gChest" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd39a" stop-opacity="0.98"/><stop offset="32%" stop-color="#d98241" stop-opacity="0.98"/><stop offset="68%" stop-color="#8f4315" stop-opacity="0.98"/><stop offset="100%" stop-color="#4c1d06" stop-opacity="0.99"/></linearGradient>
      <linearGradient id="gMuzzleD" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6d3a12" stop-opacity="0.78"/><stop offset="58%" stop-color="#4a2408" stop-opacity="0.7"/><stop offset="100%" stop-color="#2a1204" stop-opacity="0.54"/></linearGradient>
      <linearGradient id="gPlate2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c69a5c" stop-opacity="0.94"/><stop offset="46%" stop-color="#8a6028" stop-opacity="0.94"/><stop offset="100%" stop-color="#40230a" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8bd80" stop-opacity="0.92"/><stop offset="44%" stop-color="#a9762f" stop-opacity="0.92"/><stop offset="100%" stop-color="#4a2708" stop-opacity="0.94"/></linearGradient>
      <linearGradient id="gGear" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff2cc" stop-opacity="1"/><stop offset="46%" stop-color="#d8a860" stop-opacity="0.98"/><stop offset="100%" stop-color="#8a5a22" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gCouple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffeec8" stop-opacity="0.98"/><stop offset="50%" stop-color="#c9922e" stop-opacity="0.96"/><stop offset="100%" stop-color="#6e4210" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gCollar" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8c489" stop-opacity="0.95"/><stop offset="50%" stop-color="#9a6a2c" stop-opacity="0.95"/><stop offset="100%" stop-color="#4a2a0c" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffdca6" stop-opacity="0.97"/><stop offset="34%" stop-color="#e18e40" stop-opacity="0.97"/><stop offset="70%" stop-color="#9d4914" stop-opacity="0.97"/><stop offset="100%" stop-color="#4f1f08" stop-opacity="0.98"/></linearGradient>
      <linearGradient id="gTailTip" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7e2c0" stop-opacity="0.9"/><stop offset="52%" stop-color="#dcbb8a" stop-opacity="0.88"/><stop offset="100%" stop-color="#9c7444" stop-opacity="0.9"/></linearGradient>
      <linearGradient id="gWhisk" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff4dc" stop-opacity="0.92"/><stop offset="60%" stop-color="#f0c088" stop-opacity="0.52"/><stop offset="100%" stop-color="#d8a05c" stop-opacity="0.12"/></linearGradient>
      <linearGradient id="gLens" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="46%" stop-color="#ffffff" stop-opacity="0.96"/><stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/></linearGradient>
      <linearGradient id="gFres" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffd9a0" stop-opacity="0"/><stop offset="32%" stop-color="#fff6e6" stop-opacity="0.92"/><stop offset="68%" stop-color="#ffb268" stop-opacity="0.42"/><stop offset="100%" stop-color="#a04a1a" stop-opacity="0"/></linearGradient>
      <linearGradient id="gSeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a2208" stop-opacity="0.22"/><stop offset="100%" stop-color="#2a1204" stop-opacity="0.1"/></linearGradient>
      <linearGradient id="gRidge" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6d3a4" stop-opacity="0.2"/><stop offset="100%" stop-color="#8a4a18" stop-opacity="0.06"/></linearGradient>
      <linearGradient id="gSlat" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1206" stop-opacity="0.62"/><stop offset="100%" stop-color="#0e0703" stop-opacity="0.3"/></linearGradient>
      <linearGradient id="gClaw" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff8ea" stop-opacity="0.98"/><stop offset="60%" stop-color="#d8b070" stop-opacity="0.95"/><stop offset="100%" stop-color="#6a4418" stop-opacity="0.9"/></linearGradient>
      <linearGradient id="gCrush" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a4a18" stop-opacity="0.4"/><stop offset="100%" stop-color="#3a1c08" stop-opacity="0"/></linearGradient>
      <linearGradient id="gEarIn" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d98a72" stop-opacity="0.9"/><stop offset="48%" stop-color="#b25a4c" stop-opacity="0.86"/><stop offset="100%" stop-color="#6d2c2c" stop-opacity="0.88"/></linearGradient>
      <linearGradient id="gToe" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8b878" stop-opacity="0.95"/><stop offset="100%" stop-color="#7a4418" stop-opacity="0.95"/></linearGradient>
      <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3a1c08" stop-opacity="0.7"/><stop offset="100%" stop-color="#120803" stop-opacity="0.9"/></linearGradient>
      <linearGradient id="gShaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffcb90" stop-opacity="0.22"/><stop offset="100%" stop-color="#ffcb90" stop-opacity="0"/></linearGradient>
      <linearGradient id="gShaftX" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffb877" stop-opacity="0"/><stop offset="32%" stop-color="#ffdcae" stop-opacity="0.28"/><stop offset="50%" stop-color="#fff2e0" stop-opacity="0.4"/><stop offset="68%" stop-color="#ffdcae" stop-opacity="0.28"/><stop offset="100%" stop-color="#ffb877" stop-opacity="0"/></linearGradient>
      <linearGradient id="gGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c88a4a" stop-opacity="0.3"/><stop offset="100%" stop-color="#4a2a14" stop-opacity="0.04"/></linearGradient>

<div id="bar">
  <span id="ttl">MECH · FOX<small>机芯狐首 · 矢量插画</small></span>
  <span class="sp"></span>
  <span id="read">—</span>
  <button data-v="overall" class="on">整体</button>
  <button data-v="warm">配色</button>
  <button data-v="head">头部</button>
  <button data-v="tail">尾部</button>
  <button data-v="bp">线稿</button>
  <button data-v="explode">爆炸图</button>
  <button data-v="annot">标注</button>
</div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var wrap  = document.getElementById('wrap');
  var body  = document.body;
  var FULL  = '0 0 1536 864';
  var HEAD  = '440 96 800 450';
  var TAIL  = '736 26 800 450';
  /* 沿透视法线的屏幕方向：+1 = 推向观察者（右下），-1 = 退向纵深（左上） */
  var NX = 0.943, NY = 0.333;
  /* 每层的位移量：负值 = 退向纵深，正值 = 推向观察者。跨度必须足够大，
     否则五层叠在一起看不出分层；内胆层为负、外壳层为正，两者反向拉开。 */
  var EXPL = {1:-238, 2:-124, 3:-34, 4:152, 5:152};
  var parts = [].slice.call(document.querySelectorAll('.part'));
  var hits  = [].slice.call(document.querySelectorAll('#L7 .hit'));
  var view  = 'overall';

  function tf(depth){
    return 'translate(' + (NX * depth).toFixed(1) + ',' + (NY * depth).toFixed(1) + ')';
  }
  /* ── 爆炸图：五层沿透视法线分层位移 ───────────────────── */
  /* 位移与视差各自独立累加：L1/L5 同时受两者驱动，互不覆盖 */
  var expl = false;
  function layerTf(L){
    var dx = 0, dy = 0, e = EXPL[L];
    if (expl && e){ dx += NX * e; dy += NY * e; }
    if (L === 5){ dx += -px * 9; dy += -py * 6; }
    if (L === 1){ dx +=  px * 4; dy +=  py * 3; }
    return 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')';
  }
  function explode(on){
    expl = on;
    for (var L = 1; L <= 5; L++){
      var g = document.getElementById('L' + L);
      if (g) g.setAttribute('transform', layerTf(L));
    }
  }
  /* ── 视图切换 ─────────────────────────────────────────── */
  function apply(v){
    view = v;
    body.classList.toggle('theme-b', v === 'warm');
    body.classList.toggle('bp',      v === 'bp');
    body.classList.toggle('annot',   v === 'annot');
    stage.classList.toggle('hasfocus', v === 'focus');
    if (v !== 'focus') parts.forEach(function(p){ p.classList.remove('focused'); });
    explode(v === 'explode');
    stage.setAttribute('viewBox', v === 'head' ? HEAD : (v === 'tail' ? TAIL : FULL));
    [].forEach.call(document.querySelectorAll('#bar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
    read();
  }
  [].forEach.call(document.querySelectorAll('#bar button'), function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-v')); });
  });
  window.addEventListener('keydown', function(e){
    var k = {Digit1:'overall',Digit2:'warm',Digit3:'head',Digit4:'tail',
             Digit5:'bp',Digit6:'explode',Digit7:'annot'}[e.code];
    if (k) apply(k);
  });

  /* ── 微交互 1：悬停外层壳体沿透视法线外移（微爆炸展开） ── */
  function same(p, i){
    return p.getAttribute('data-i') === i && p.getAttribute('data-hero') === '1';
  }
  function shellOf(i){
    return parts.filter(function(p){ return same(p, i) &&
             p.getAttribute('data-layer') === 'L4'; });
  }
  hits.forEach(function(h){
    var i = h.getAttribute('data-i');
    h.addEventListener('mouseenter', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', tf(18)); });
    });
    h.addEventListener('mouseleave', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', 'translate(0,0)'); });
    });
    /* ── 微交互 3：点击聚焦，其余部件透明度下降 ── */
    h.addEventListener('click', function(){
      var on = stage.classList.toggle('hasfocus');
      parts.forEach(function(p){
        p.classList.toggle('focused', on && same(p, i));
      });
      read();
    });
  });

  /* ── 微交互 2：视差光斑——高光层与背景层反向微幅位移 ──── */
  var px = 0, py = 0, tx = 0, ty = 0, lw = -1, lh = -1;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth  - .5) * 2;
    ty = (e.clientY / window.innerHeight - .5) * 2;
  });
  var gL5 = document.getElementById('L5'), gL1 = document.getElementById('L1');
  function tick(){
    refit();
    px += (tx - px) * .09; py += (ty - py) * .09;
    gL5.setAttribute('transform', layerTf(5));
    gL1.setAttribute('transform', layerTf(1));
  }
  window.FOX_TICK = tick;
  setInterval(tick, 16);

  /* ── 微交互 4：无损等比全视口居中适配 ─────────────────── */
  function fit(){
    var a = 1536 / 864;
    var W = wrap.clientWidth  || window.innerWidth;
    var H = (wrap.clientHeight || window.innerHeight) - 46;
    if (H < 60) H = 60;
    var w = W, h = W / a;
    if (h > H) { h = H; w = H * a; }
    stage.style.setProperty('width',  w.toFixed(2) + 'px', 'important');
    stage.style.setProperty('height', h.toFixed(2) + 'px', 'important');
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();
  function refit(){
    if (!wrap) return;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    if (cw !== lw || ch !== lh){ lw = cw; lh = ch; fit(); read(); }
  }

  function read(){
    var n = document.querySelectorAll('#stage path').length;
    document.getElementById('read').textContent =
      'view=' + view + '  path=' + n + '  layers=' +
      document.querySelectorAll('#stage [data-layer]').length +
      '  viewBox=' + stage.getAttribute('viewBox');
  }
  read();
  window.FOX = { apply: apply, fit: fit, tick: tick, stage: stage,
    pathCount: function(){ return document.querySelectorAll('#stage path').length; } };
})();
</script>
