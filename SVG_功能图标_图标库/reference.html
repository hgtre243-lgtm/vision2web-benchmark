<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --bg:#eef1f8;--bg2:#e4e9f6;--panel:#ffffff;--line:#e2e7f3;
  --ink:#232a44;--ink2:#8b94b8;--ic:#4f6df5;--ic2:#b6c3ff;--onIc:#ffffff;
  --bp:#5a76c8;
}
body.theme-b{
  --bg:#fbf1e4;--bg2:#f3e7d2;--panel:#fffaf1;--line:#f0e0c8;
  --ink:#33240f;--ink2:#a68b6a;--ic:#e8791a;--ic2:#ffc07a;--onIc:#2a1806;
  --bp:#c07a3a;
}
body{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg2),var(--bg));font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:20px;letter-spacing:2px;font-weight:600;color:var(--ic)}
.brand .zh{font-size:13px;color:var(--ink2);letter-spacing:3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 16px;border-radius:20px;font-size:14px;letter-spacing:1px;cursor:pointer;transition:all .18s ease}
.tabs button:hover{border-color:var(--ic);color:var(--ic)}
.tabs button.active{background:var(--ic);color:var(--onIc);border-color:var(--ic);font-weight:600}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#iconSvg{width:100%;height:100%;display:block;overflow:hidden}
/* 图标绘制 */
.tile{fill:var(--panel);stroke:var(--line);stroke-width:2}
.ic{fill:var(--ic)}
.ac{fill:var(--ic2)}
.ics{fill:none;stroke:var(--ic);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.acs{fill:none;stroke:var(--ic2);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.ilabel{fill:var(--ink2);font-size:17px;letter-spacing:2px}
.watermark{fill:var(--ink);opacity:.5;font-size:34px;letter-spacing:14px}
.watermark-sub{fill:var(--ink2);opacity:.55;font-size:16px;letter-spacing:10px}
.ro{fill:var(--ink2);font-size:14px;letter-spacing:2px;font-family:Consolas,Menlo,monospace;opacity:.8}
/* 悬停微交互 */
#iconSvg .part{transition:filter .15s ease;cursor:pointer}
#iconSvg .part:hover{filter:drop-shadow(0 10px 22px rgba(50,70,140,.28))}
#iconSvg .part:hover .tile{stroke:var(--ic)}
/* 线稿蓝图 */
#bpGrid{display:none}
#annotations{display:none}
#legend{display:none}
#iconSvg.bp #backdrop{display:none}
#iconSvg.bp #bpGrid{display:block}
.bpbg{fill:#fbfcfe}.bpg{stroke:#dce5f2;stroke-width:1}.bpg-c{stroke:#c0d0ea;stroke-width:1.6}.bpg-d{stroke:#c0d0ea;stroke-width:1.4;stroke-dasharray:6 8}.bpt{fill:#5a76c8;font-size:20px;letter-spacing:3px;opacity:.85}
#iconSvg.bp #grid .part{filter:none}
#iconSvg.bp #grid .tile{fill:#ffffff!important;stroke:#c9d6ec!important}
#iconSvg.bp #grid .ic,#iconSvg.bp #grid .ac{fill:none!important;stroke:var(--bp)!important;stroke-width:2.4!important}
#iconSvg.bp #grid .ics,#iconSvg.bp #grid .acs{stroke:var(--bp)!important}
#iconSvg.bp #grid .ilabel{display:none}
/* 标注视图 */
#iconSvg.ann #annotations{display:block}
#iconSvg.ann #legend{display:block}
.badge{fill:var(--ic)}
.badge-num{fill:var(--onIc);font-size:15px;font-weight:700;font-family:Georgia,serif}
.ann-dot{fill:var(--ic)}
.ann-num{fill:var(--onIc);font-size:14px;font-weight:700;font-family:Georgia,serif}
.ann-name{fill:var(--ink);font-size:14px;letter-spacing:1px}
.legend-panel{fill:var(--panel);stroke:var(--line);stroke-width:1;opacity:.98}
/* 选中态 */
#iconSvg.sel #grid .part{opacity:.42}
#iconSvg.sel #grid .part:hover{filter:none}
#iconSvg.sel #grid .part.selected{opacity:1}
#iconSvg.sel #grid .part.selected .tile{fill:var(--ic);stroke:var(--ic)}
#iconSvg.sel #grid .part.selected .ic{fill:#ffffff}
#iconSvg.sel #grid .part.selected .ac{fill:rgba(255,255,255,.72)}
#iconSvg.sel #grid .part.selected .ics{stroke:#ffffff}
#iconSvg.sel #grid .part.selected .ilabel{fill:#ffffff}</style>
</head>

      <text class="ann-name" x="1410" y="841">下载</text>
    </g>
  </g>
</svg></main>
<script>
(function(){
  var state={view:'overview'};
  var svg=document.getElementById('iconSvg');
  var cam=document.getElementById('cam');
  var tabs=document.querySelectorAll('.tabs button');
  var ZOOM={ closeup:{x:338,y:70,w:524,h:430} };
  function zoomTo(box){
    var W=1200,H=800,pad=52;
    var s=Math.max(W/(box.w+pad*2), H/(box.h+pad*2));
    var tx=W/2-(box.x+box.w/2)*s, ty=H/2-(box.y+box.h/2)*s;
    cam.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') scale('+s.toFixed(3)+')');
  }
  function setView(v){
    state.view=v;
    svg.classList.remove('bp','ann','sel');
    document.body.classList.remove('theme-b');
    cam.removeAttribute('transform');
    if(v==='theme') document.body.classList.add('theme-b');
    else if(v==='blueprint') svg.classList.add('bp');
    else if(v==='annotate') svg.classList.add('ann');
    else if(v==='select') svg.classList.add('sel');
    else if(v==='closeup') zoomTo(ZOOM.closeup);
    tabs.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ setView(b.getAttribute('data-view')); }); });
  window.ICONSET={ setView:setView, info:function(){
    return { view:state.view, parts:document.querySelectorAll('#grid .part').length,
      svgEls:document.querySelectorAll('#iconSvg *').length };
  }};
})();</script>
</body>
</html>
