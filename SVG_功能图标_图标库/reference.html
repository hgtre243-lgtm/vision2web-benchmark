<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机芯图标库 ICONARIUM</title>
<style>
  :root{
    --ink:#e8eeff; --dim:#98a4c8; --stage:#0e1119;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden}
  body{font:12px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--dim)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{display:block;flex:none;width:100%;height:100%;background:var(--stage)}

  /* ── L1 环境场与背板底衬 ───────────────────────────────── */
  .env-bg{fill:#0a0e18}
  .env-vignette{fill:#04060a}
  .env-halo{fill:url(#rHalo)}
  .env-guide{fill:none;stroke:url(#gBpGrid);stroke-width:1;opacity:.28}
  .env-ticks{fill:none;stroke:url(#gTick);stroke-width:1;opacity:.46}
  .env-bpgrid{fill:none;stroke:url(#gBpGrid);stroke-width:1;opacity:.42}
  .env-dust{fill:#8f9dc4;opacity:.20}
  #envBp{display:none}
  body.bp #envBp{display:block}

  #stage path{fill-rule:evenodd}
  /* 侧带是可见四边形之并集，必须用 nonzero，否则相邻四边形在 evenodd 下互相抵消成条纹 */
  .shell-side,.plate-side{fill-rule:nonzero}

  /* ── L2 基座承重与接触阴影 ─────────────────────────────── */
  .plate-base{fill:url(#gPlate)}
  .plate-side{fill:url(#gPlateEdge)}
  .plate-ao{fill:url(#rAO2);opacity:.40}
  .ao-under{fill:url(#rAO);opacity:.34}
  .plate-grid{fill:none;stroke:url(#gTick);stroke-width:1;opacity:.40}
  .plate-tick{fill:url(#gTick);opacity:.46}

  /* ── L3 主构架与核心机构内胆 ───────────────────────────── */
  .core-gear{fill:url(#rCore)}
  .core-gear2{fill:url(#rCore2)}
  .core-gear3{fill:url(#rCore2);opacity:.92}
  .core-ring{fill:url(#rCore)}
  .core-ring2{fill:url(#rHub)}
  .core-hub{fill:url(#rHub)}
  .core-axle{fill:url(#gSide)}
  .bore-floor{fill:url(#gCut)}
  .bore-wall{fill:url(#gPlateEdge)}

  /* ── L4 曲面外壳与多曲率包络 ───────────────────────────── */
  .shell-face{fill:url(#gFace)}
  .shell-side{fill:url(#gSide)}
  .shell-sheet{fill:url(#gSheet)}
  .shell-bevel{fill:url(#gBevel)}
  .shell-rim{fill:url(#gBevel);opacity:.55}
  .cradle{fill:url(#gCradle);opacity:.55}

  /* ── L5 镜面高光与视差辉光 ─────────────────────────────── */
  .spec-main{fill:none;stroke:#e9faff;stroke-width:2;stroke-linecap:round;opacity:.72;filter:url(#fGlow)}
  .spec-thin{fill:none;stroke:#c2e6fa;stroke-width:1;stroke-linecap:round}
  .fresnel{fill:none;stroke:#7fc8e8;stroke-width:1.4;opacity:.48}
  .brushed{fill:none;stroke:url(#gBrushed);stroke-width:11;opacity:.15}
  .glow-dots{fill:url(#rGlow)}
  .aperture-rim{fill:none;stroke:#0e2a3d;stroke-width:2.2;opacity:.85}

  /* ── 标注层 ────────────────────────────────────────────── */
  #annot{display:none}
  body.annot #annot{display:block}
  .an-badge{fill:rgba(10,13,22,.82);stroke:#b9c6ea;stroke-width:1.6}
  .an-no{fill:#e8eeff;font:600 15px ui-monospace,monospace;text-anchor:middle}
  .ilabel{fill:#8b97b8;font-size:15px;text-anchor:middle;letter-spacing:.16em}
  .lg-dot{fill:#8fa2d8}
  .lg-no{fill:#6f7c9e;font:600 11px ui-monospace,monospace}
  .lg-zh{fill:#c3cee8;font-size:12px}
  .lg-en{fill:#7d8aac;font:10px ui-monospace,monospace;letter-spacing:.1em}
  .lg-d{fill:#4e5878;font:9px ui-monospace,monospace}
  .lg-h{fill:#dbe4f8;font-size:14px;letter-spacing:.3em}
  .lg-h2{fill:#6f7c9e;font:9px ui-monospace,monospace;letter-spacing:.22em}

  /* ── 暖色阶主题：整图明暗对比无损重构 ──────────────────── */
  body.theme-b{--stage:#14100a}
  body.theme-b #stage{background:#14100a}
  body.theme-b .env-bg{fill:#14100a}
  body.theme-b .env-vignette{fill:#0a0704}
  body.theme-b .env-halo{fill:url(#aHalo)}
  body.theme-b .env-dust{fill:#d0a460;opacity:.22}
  body.theme-b .plate-base{fill:url(#aPlate)}
  body.theme-b .plate-side{fill:url(#aPlateEdge)}
  body.theme-b .plate-ao{fill:url(#aAO2)}
  body.theme-b .ao-under{fill:url(#aAO)}
  body.theme-b .plate-grid{stroke:url(#aTick)}
  body.theme-b .plate-tick{fill:url(#aTick)}
  body.theme-b .core-gear{fill:url(#aCore)}
  body.theme-b .core-gear2{fill:url(#aCore2)}
  body.theme-b .core-gear3{fill:url(#aCore2)}
  body.theme-b .core-ring{fill:url(#aCore)}
  body.theme-b .core-ring2,body.theme-b .core-hub{fill:url(#aHub)}
  body.theme-b .core-axle{fill:url(#aSide)}
  body.theme-b .shell-face{fill:url(#aFace)}
  body.theme-b .shell-side{fill:url(#aSide)}
  body.theme-b .shell-sheet{fill:url(#aSheet)}
  body.theme-b .shell-bevel{fill:url(#aBevel)}
  body.theme-b .bore-floor{fill:url(#aCut)}
  body.theme-b .bore-wall{fill:url(#aPlateEdge)}
  body.theme-b .cradle{fill:url(#aCradle)}
  body.theme-b .brushed{stroke:url(#aBrushed)}
  body.theme-b .glow-dots{fill:url(#aGlow)}
  body.theme-b .spec-main{stroke:#fff4dd}
  body.theme-b .spec-thin{stroke:#f0d6a4}
  body.theme-b .fresnel{stroke:#c79a58}
  body.theme-b .env-guide,body.theme-b .env-bpgrid{stroke:url(#aBpGrid)}
  body.theme-b .env-ticks{stroke:url(#aTick)}

  /* ── 线稿拓扑蓝图：轮廓是拓扑分界线，绝不使用纯黑描边 ── */
  body.bp .env-bg{fill:#0b1220}
  body.bp .plate-base,body.bp .plate-side,body.bp .plate-ao,
  body.bp .ao-under,body.bp .core-gear,body.bp .core-gear2,
  body.bp .core-gear3,body.bp .core-ring,body.bp .core-ring2,body.bp .core-hub,
  body.bp .core-axle,body.bp .cradle,body.bp .glow-dots,
  body.bp .bore-floor,body.bp .bore-wall{opacity:.10}
  body.bp .shell-face{fill:none;stroke:#63c8ff;stroke-width:1.7}
  body.bp .shell-side{fill:none;stroke:#2b7fbf;stroke-width:1.1}
  body.bp .shell-bevel{fill:none;stroke:#9fe4ff;stroke-width:1}
  body.bp .shell-sheet{fill:none;stroke:#3d93d6;stroke-width:.8;stroke-dasharray:5 4}
  body.bp .shell-rim{fill:none;stroke:#7fd4ff;stroke-width:1.4}
  body.bp .plate-grid{stroke:#4a9fdc;opacity:.7}
  body.bp .plate-tick{fill:#4a9fdc;opacity:.7}
  body.bp .spec-main,body.bp .spec-thin,body.bp .fresnel,body.bp .brushed{stroke:#bfeaff;opacity:.55}
  body.bp .aperture-rim{stroke:#63c8ff;opacity:.9}

  /* ── 复合微交互 ────────────────────────────────────────── */
  #L2 .part,#L4 .part,#L3 .part,#L5 .part{
    transition:transform .44s cubic-bezier(.22,.9,.24,1),opacity .3s ease}
  /* 沿透视法线的可辨夹层：基座退向纵深（右上），内胆承在其上，
     外层壳体与镜面高光一同推向观察者（左下）—— 高光是壳体的反射，不能脱开 */
  #L2 .part.ex{transform:translate(26px,-15px)}
  #L3 .part.ex{transform:translate(12px,-7px)}
  #L4 .part.ex{transform:translate(-52px,30px)}
  #L5 .part.ex{transform:translate(-52px,30px)}
  #L5{transition:transform .18s ease-out}
  #L1{transition:transform .28s ease-out}
  .part.focused{animation:pulse 1.15s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
  #stage.hasfocus .part{opacity:.30}
  #stage.hasfocus #L6{opacity:.34}
  #stage.hasfocus .part.focused{opacity:1;filter:url(#fGlow)}
  #L7 .hit{fill:transparent;stroke:none;pointer-events:all}
  #L7{cursor:pointer}

  /* ── 控制条 ────────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;
       align-items:center;padding:8px 14px;background:rgba(5,7,12,.86);
       border-top:1px solid #1b2133;backdrop-filter:blur(6px);z-index:9}
  #bar button{font:11px ui-monospace,monospace;color:#a9b6d8;background:#141a28;
       border:1px solid #232c42;border-radius:4px;padding:4px 10px;cursor:pointer}
  #bar button.on{color:#0b1018;background:#8fa2d8;border-color:#8fa2d8}
  #bar .sp{flex:1}
  #read{font:11px ui-monospace,monospace;color:#5f6b8c}
  #tip{position:fixed;left:12px;top:10px;font:11px ui-monospace,monospace;color:#4e5878;z-index:9}
</style>
</head>

<div id="tip">机芯图标库 · ICONARIUM · 12 构件 / 5 层 Z 序 / 8 类拓扑图元</div>
<div id="bar">
  <button data-v="overview" class="on">整体</button>
  <button data-v="warm">高对比暖色阶</button>
  <button data-v="explode">爆炸图</button>
  <button data-v="bp">线稿拓扑</button>
  <button data-v="focus">焦点聚焦</button>
  <button data-v="zoom">特写适配</button>
  <button data-v="annot">部件标注</button>
  <span class="sp"></span>
  <span id="read">—</span>
</div>
<script>
(function(){
  var SVG = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('stage');
  var wrap  = document.getElementById('wrap');
  var body  = document.body;
  var FULL  = '0 0 1536 864';
  var ZOOM  = '560 190 620 400';
  var parts = [].slice.call(document.querySelectorAll('.part'));
  var hits  = [].slice.call(document.querySelectorAll('#L7 .hit'));
  var view  = 'overview';

  /* ── 视图切换 ─────────────────────────────────────────── */
  function apply(v){
    view = v;
    body.classList.toggle('theme-b', v === 'warm');
    body.classList.toggle('bp',      v === 'bp');
    body.classList.toggle('annot',   v === 'annot');
    stage.classList.toggle('explode', v === 'explode');
    stage.classList.toggle('hasfocus', v === 'focus');
    if (v !== 'focus') parts.forEach(function(p){ p.classList.remove('focused'); });
    if (v === 'focus') parts.forEach(function(p){
      p.classList.toggle('focused', p.getAttribute('data-i') === '4');
    });
    if (v === 'explode') parts.forEach(function(p){ p.classList.add('ex'); });
    else parts.forEach(function(p){ p.classList.remove('ex'); });
    stage.setAttribute('viewBox', v === 'zoom' ? ZOOM : FULL);
    [].forEach.call(document.querySelectorAll('#bar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
    read();
  }
  [].forEach.call(document.querySelectorAll('#bar button'), function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-v')); });
  });

  /* ── 微交互 1：悬停爆炸微展开（外层壳体沿透视法线外移） ── */
  hits.forEach(function(h){
    var i = h.getAttribute('data-i');
    h.addEventListener('mouseenter', function(){
      if (view === 'explode' || view === 'focus') return;
      parts.forEach(function(p){ if (p.getAttribute('data-i') === i) p.classList.add('ex'); });
    });
    h.addEventListener('mouseleave', function(){
      if (view === 'explode' || view === 'focus') return;
      parts.forEach(function(p){ p.classList.remove('ex'); });
    });
    /* ── 微交互 3：点击聚焦构件，其余层透明度降至 0.4 ── */
    h.addEventListener('click', function(){
      var on = stage.classList.toggle('hasfocus');
      parts.forEach(function(p){
        p.classList.toggle('focused', on && p.getAttribute('data-i') === i);
      });
      read();
    });
  });

  /* ── 微交互 2：交互式视差光斑平移（高光层反向微幅位移） ── */
  var px = 0, py = 0, tx = 0, ty = 0;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth  - .5) * 2;
    ty = (e.clientY / window.innerHeight - .5) * 2;
  });
  var gL5 = document.getElementById('L5'), gL1 = document.getElementById('L1');
  function tick(){
    refit();
    px += (tx - px) * .09; py += (ty - py) * .09;
    gL5.setAttribute('transform',
      'translate(' + (-px * 7).toFixed(2) + ',' + (-py * 5).toFixed(2) + ')');
    gL1.setAttribute('transform',
      'translate(' + (px * 3).toFixed(2) + ',' + (py * 2).toFixed(2) + ')');
  }
  window.ICONARIUM_TICK = tick;
  setInterval(tick, 16);

  /* ── 微交互 4：无损等比全视口居中适配 ────────────────── */
  function fit(){
    var a = 1536 / 864;
    var W = wrap.clientWidth  || window.innerWidth;
    var H = (wrap.clientHeight || window.innerHeight) - 40;
    if (H < 60) H = 60;
    var w = W, h = W / a;
    if (h > H) { h = H; w = H * a; }
    stage.style.setProperty('width',  w.toFixed(2) + 'px', 'important');
    stage.style.setProperty('height', h.toFixed(2) + 'px', 'important');
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();
  var lw = -1, lh = -1;
  function refit(){
    if (!wrap) return;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    if (cw !== lw || ch !== lh) { lw = cw; lh = ch; fit(); read(); }
  }

  /* ── 读数 ─────────────────────────────────────────────── */
  function read(){
    var n = document.querySelectorAll('#stage path').length;
    var g = document.querySelectorAll('#stage [data-layer]').length;
    document.getElementById('read').textContent =
      'view=' + view + '  path=' + n + '  layers=' + g + '  viewBox=' + stage.getAttribute('viewBox');
  }
  read();
  window.ICONARIUM = { apply: apply, fit: fit, pathCount: function(){
    return document.querySelectorAll('#stage path').length; } };
})();
</script>
