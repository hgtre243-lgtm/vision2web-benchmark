<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弦轨 CHORDLINE · 张力环道竞速</title>
<style>
:root{
  --bg-0:#060A14; --bg-1:#0A1122; --bg-2:#101A33; --bg-3:#16234A; --bg-4:#1E2E5E;
  --ink-0:#EAF2FF; --ink-1:#BCCBEA; --ink-2:#8698C0; --ink-3:#5D6F97; --ink-4:#3B4A6B;
  --mint:#5FE3C8; --amber:#FFB454; --rose:#FF5E7A; --peri:#7C8CFF;
  --lime:#B9F227; --violet:#B57BFF; --ice:#7FE9FF;
  --f-xxs:10px; --f-xs:11px; --f-sm:12px; --f-md:13px; --f-lg:15px; --f-xl:19px; --f-2xl:27px;
  --s-1:4px; --s-2:7px; --s-3:11px; --s-4:15px; --s-5:21px; --s-6:30px;
  --r-1:4px; --r-2:8px; --r-3:13px; --r-4:20px;
  --sh-1:0 1px 3px rgba(0,0,0,.55); --sh-2:0 6px 18px rgba(0,0,0,.5);
  --sh-3:0 0 22px rgba(95,227,200,.22); --sh-4:0 0 26px rgba(255,94,122,.3);
  --g-shell:linear-gradient(168deg,#0C1428 0%,#060A14 58%,#080D1C 100%);
  --g-panel:linear-gradient(160deg,rgba(30,46,94,.62) 0%,rgba(12,20,40,.72) 100%);
  --g-mint:linear-gradient(96deg,rgba(95,227,200,.9),rgba(127,233,255,.35));
  --g-amber:linear-gradient(96deg,rgba(255,180,84,.92),rgba(255,94,122,.4));
  --g-peri:linear-gradient(96deg,rgba(124,140,255,.9),rgba(181,123,255,.35));
  --g-rose:linear-gradient(96deg,rgba(255,94,122,.95),rgba(255,180,84,.3));
  --g-lime:linear-gradient(96deg,rgba(185,242,39,.88),rgba(95,227,200,.3));
  --g-vig:radial-gradient(120% 90% at 50% 0%,rgba(124,140,255,.16),transparent 62%);
  --g-scan:repeating-linear-gradient(180deg,rgba(127,233,255,.05) 0 1px,transparent 1px 3px);
  --g-bar:linear-gradient(90deg,var(--mint),var(--peri) 55%,var(--violet));
  --dur-1:120ms; --dur-2:260ms; --dur-3:520ms;
  --ez-1:cubic-bezier(.22,.68,.32,1); --ez-2:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--g-shell);color:var(--ink-0);
  font:var(--f-md)/1.42 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
.num{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.app{min-height:100vh;display:flex;flex-direction:column;background-image:var(--g-vig);position:relative}
.app::after{content:"";position:absolute;inset:0;background-image:var(--g-scan);opacity:.5;pointer-events:none}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-4);
  background:linear-gradient(180deg,rgba(30,46,94,.55),rgba(10,17,34,.15));
  border-bottom:1px solid rgba(124,140,255,.24);flex-wrap:wrap;position:relative;z-index:3}
.brand{display:flex;align-items:baseline;gap:var(--s-2);min-width:0}
.brand b{font-size:var(--f-lg);letter-spacing:.16em;
  background:var(--g-mint);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand i{font-style:normal;font-size:var(--f-xxs);color:var(--ink-3);letter-spacing:.22em}
.chip{display:inline-flex;align-items:center;gap:var(--s-1);padding:2px var(--s-2);border-radius:var(--r-1);
  font-size:var(--f-xs);border:1px solid rgba(124,140,255,.3);background:rgba(22,35,74,.5);color:var(--ink-1);white-space:nowrap}
.tok{font-family:ui-monospace,monospace;letter-spacing:.06em;color:var(--mint);
  border-color:rgba(95,227,200,.5);box-shadow:var(--sh-3)}
.tok.warn{color:var(--rose);border-color:rgba(255,94,122,.55);box-shadow:var(--sh-4)}
.topbar .sp{flex:1 1 auto;min-width:var(--s-2)}
.readouts{display:flex;gap:var(--s-3);flex-wrap:wrap;min-width:0}
.ro{display:flex;flex-direction:column;min-width:0}
.ro .k{font-size:var(--f-xxs);color:var(--ink-3);letter-spacing:.1em}
.ro .v{font-size:var(--f-md);color:var(--ink-0)}
.ro .v.mint{color:var(--mint)} .ro .v.amber{color:var(--amber)} .ro .v.rose{color:var(--rose)}

/* ---------- 主体网格 ---------- */
.stage{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) 296px;
  gap:var(--s-3);padding:var(--s-3);min-height:0;position:relative;z-index:2}
.viewport{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.card{background:var(--g-panel);border:1px solid rgba(124,140,255,.2);border-radius:var(--r-3);
  box-shadow:var(--sh-2);min-width:0;position:relative;overflow:hidden}
.card>h2{margin:0;padding:var(--s-2) var(--s-3);font-size:var(--f-xs);letter-spacing:.18em;
  color:var(--ink-2);border-bottom:1px solid rgba(124,140,255,.16);display:flex;justify-content:space-between;
  align-items:center;gap:var(--s-2);font-weight:600}
.card>h2 em{font-style:normal;color:var(--ink-3);letter-spacing:.04em;font-size:var(--f-xxs)}
.world{flex:1 1 auto;min-height:250px;display:flex}
.world canvas{display:block;width:100%;height:100%}
.instr{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:var(--s-3);min-width:0;flex:0 0 auto}
.hudbox,.radarbox{display:flex;height:188px;min-width:0}
.hudbox canvas,.radarbox canvas{display:block;width:100%;height:100%}

/* ---------- 右栏 ---------- */
.rail{display:flex;flex-direction:column;gap:var(--s-2);min-width:0;min-height:0}
.led{display:grid;grid-template-columns:1fr auto;gap:1px var(--s-2);padding:var(--s-2) var(--s-3);font-size:var(--f-sm)}
.led .n{color:var(--ink-2);overflow-wrap:anywhere}
.led .d{text-align:right;color:var(--ink-0)}
.led .d.mint{color:var(--mint)} .led .d.rose{color:var(--rose)} .led .d.amber{color:var(--amber)}
.led .sep{grid-column:1/-1;height:1px;background:rgba(124,140,255,.2);margin:var(--s-1) 0}
.led .tot .n{color:var(--ink-1)} .led .tot .d{color:var(--mint)}
.log{list-style:none;margin:0;padding:var(--s-1) var(--s-3);max-height:154px;overflow:auto}
.log li{display:flex;gap:var(--s-2);font-size:var(--f-xs);padding:2px 0;border-bottom:1px dashed rgba(124,140,255,.13);
  color:var(--ink-2);overflow-wrap:anywhere}
.log li b{color:var(--ink-1);font-weight:600;white-space:nowrap}
.log li .tt{color:var(--ink-4);white-space:nowrap}
.drawer{padding:var(--s-2) var(--s-3) var(--s-3);display:flex;flex-direction:column;gap:var(--s-2)}
.row{display:flex;justify-content:space-between;gap:var(--s-2);font-size:var(--f-sm)}
.row .n{color:var(--ink-2)} .row .d{color:var(--ink-0)}
.stagebar{display:flex;align-items:center;gap:var(--s-2);font-size:var(--f-xs);color:var(--ink-2)}
.stagebar .pip{width:9px;height:9px;border-radius:50%;background:var(--ink-4)}
.stagebar .pip.on{background:var(--amber);box-shadow:0 0 10px rgba(255,180,84,.75)}
.note{width:100%;background:rgba(6,10,20,.72);border:1px solid rgba(124,140,255,.3);border-radius:var(--r-1);
  color:var(--ink-0);font:inherit;font-size:var(--f-sm);padding:var(--s-1) var(--s-2);resize:vertical;min-height:44px}
.note.bad{border-color:rgba(255,94,122,.6)}
.acts{display:flex;gap:var(--s-2)}
.acts button{flex:1 1 0;min-width:0;padding:var(--s-2) var(--s-1);border-radius:var(--r-2);cursor:pointer;
  font:inherit;font-size:var(--f-sm);color:var(--ink-0);background:linear-gradient(180deg,rgba(30,46,94,.9),rgba(16,26,51,.9));
  border:1px solid rgba(124,140,255,.35);transition:transform var(--dur-1) var(--ez-1),border-color var(--dur-1)}
.acts button:hover{border-color:rgba(95,227,200,.6);transform:translateY(-1px)}
.acts button[disabled]{opacity:.42;cursor:not-allowed;transform:none;border-color:rgba(124,140,255,.18)}
.acts button.pri{background:var(--g-mint);color:#04121A;border-color:transparent;font-weight:700}
.acts button.pri[disabled]{background:linear-gradient(90deg,rgba(120,130,150,.4),rgba(90,100,120,.4));color:var(--ink-3)}

/* ---------- 底栏 ---------- */
.statusbar{display:flex;gap:var(--s-3);align-items:center;flex-wrap:wrap;padding:var(--s-2) var(--s-4);
  border-top:1px solid rgba(124,140,255,.24);background:rgba(6,10,20,.66);
  font-size:var(--f-xs);color:var(--ink-2);position:relative;z-index:3}
.statusbar .sb{display:flex;gap:var(--s-1);align-items:center;min-width:0}
.statusbar b{color:var(--ink-0);font-weight:600}
.statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.statusbar .dot.warn{background:var(--rose)}

/* 覆盖层 */
.veil{position:absolute;inset:0;background:rgba(6,10,20,.68);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-3);z-index:9}
.veil.off{display:none}
.veil h3{margin:0;font-size:var(--f-xl);letter-spacing:.24em;color:var(--ink-1)}
.veil .pbar{width:min(360px,72%);height:5px;border-radius:3px;background:rgba(124,140,255,.2);overflow:hidden}
.veil .pbar i{display:block;height:100%;background:var(--g-bar)}
.veil p{margin:0;font-size:var(--f-sm);color:var(--ink-3);letter-spacing:.1em}

/* 校验码模态 */
.modal{position:fixed;inset:0;background:rgba(4,7,14,.78);display:flex;align-items:center;justify-content:center;z-index:40}
.modal.off{display:none}
.modal .box{width:min(360px,88vw);background:var(--g-panel);border:1px solid rgba(255,94,122,.45);
  border-radius:var(--r-3);padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3);box-shadow:var(--sh-4)}
.modal h3{margin:0;font-size:var(--f-lg);color:var(--rose);letter-spacing:.08em}
.modal p{margin:0;font-size:var(--f-sm);color:var(--ink-2)}
.modal .code{font-family:ui-monospace,monospace;font-size:var(--f-2xl);letter-spacing:.34em;color:var(--amber);
  text-align:center;padding:var(--s-2);border:1px dashed rgba(255,180,84,.5);border-radius:var(--r-2)}
.modal input{background:rgba(6,10,20,.8);border:1px solid rgba(124,140,255,.4);border-radius:var(--r-2);
  color:var(--ink-0);font:inherit;font-size:var(--f-lg);letter-spacing:.3em;text-align:center;padding:var(--s-1)}
.modal .err{color:var(--rose);font-size:var(--f-xs);min-height:14px}

/* 响应式 */
@media (max-width:1023px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;flex-wrap:wrap}
  .rail .card{flex:1 1 260px}
  .instr{grid-template-columns:minmax(0,1fr) 210px}
}
@media (max-width:899px){
  .instr{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:column}
  .world{min-height:220px}
  .hudbox,.radarbox{height:216px}
}
@media (max-width:560px){
  .topbar{padding:var(--s-1) var(--s-2)}
  .brand i{display:none}
  .stage{padding:var(--s-2);gap:var(--s-2)}
  .hudbox,.radarbox{height:238px}
  .world{min-height:190px}
  .log{max-height:118px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <nav class="brand"><b>弦轨</b><i>CHORDLINE</i></nav>
    <span class="chip tok" id="tok">PADDOCK_IDLE</span>
    <span class="chip" id="chipPhase">相位 A</span>
    <span class="chip" id="chipLock">同调 未锁定</span>
    <span class="sp"></span>
    <div class="readouts">
      <div class="ro"><span class="k">里程</span><span class="v num" id="roS">0</span></div>
      <div class="ro"><span class="k">车速</span><span class="v num mint" id="roV">0</span></div>
      <div class="ro"><span class="k">张力守恒</span><span class="v num amber" id="roT">132.000</span></div>
      <div class="ro"><span class="k">因果结余</span><span class="v num" id="roC">1000</span></div>
      <div class="ro"><span class="k">重试</span><span class="v num rose" id="roR">3</span></div>
    </div>
  </header>

  <main class="stage">
    <section class="viewport">
      <article class="card world">
        <canvas id="cvWorld" aria-label="主场景视口"></canvas>
      </article>
      <section class="instr">
        <article class="card hudbox"><canvas id="cvHud" aria-label="仪表台"></canvas></article>
        <article class="card radarbox"><canvas id="cvRadar" aria-label="环道雷达"></canvas></article>
      </section>
    </section>

    <aside class="rail">
      <article class="card">
        <h2>张力守恒账本 <em>板 132.000</em></h2>
        <div class="led" id="ledger"></div>
      </article>
      <article class="card">
        <h2>谐振桩目录 <em>5 座</em></h2>
        <div class="led" id="pylons"></div>
      </article>
      <article class="card">
        <h2>事件流水 <em id="logN">0</em></h2>
        <ol class="log" id="log"></ol>
      </article>
      <article class="card">
        <h2>张力索 · 两阶段提交</h2>
        <div class="drawer">
          <div class="stagebar"><span class="pip" id="pipStage"></span><span id="stageTxt">未暂存</span></div>
          <div class="row"><span class="n">暂存动作</span><span class="d num" id="drAct">—</span></div>
          <div class="row"><span class="n">锚点张力</span><span class="d num" id="drT">—</span></div>
          <textarea class="note" id="note" rows="2" placeholder="审计附注（不少于 10 字）"></textarea>
          <div class="acts">
            <button id="btnStage">暂存</button>
            <button id="btnCommit" class="pri" disabled>确认提交</button>
          </div>
        </div>
      </article>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="sb"><i class="dot" id="sbDot"></i><b id="sbState">PADDOCK_IDLE</b></span>
    <span class="sb">风切变 <b class="num" id="sbWind">0.0</b></span>
    <span class="sb">同调 <b class="num" id="sbDwell">0</b> ms</span>
    <span class="sb">应变 <b class="num" id="sbStrain">0.0</b></span>
    <span class="sb">活跃板块 <b class="num" id="sbPlate">240</b></span>
    <span class="sb">账本差额 <b class="num mint" id="sbDiff">0.000</b></span>
  </footer>

  <div class="veil" id="veil">
    <h3>弦轨装载</h3>
    <div class="pbar"><i id="veilBar" style="width:46%"></i></div>
    <p id="veilTxt">张力场标定中 · 46%</p>
  </div>
</div>

<div class="modal off" id="modal">
  <div class="box">
    <h3>微小片段拦截</h3>
    <p>连续输错三次将锁定通道，须经守恒审计闭合方可解锁。</p>
    <div class="code" id="mCode">0000</div>
    <input id="mInput" maxlength="4" inputmode="numeric" placeholder="····">
    <div class="err" id="mErr"></div>
    <div class="acts"><button id="mCancel">取消</button><button id="mOk" class="pri">确认</button></div>
  </div>
</div>
<script>/* 弦轨 CHORDLINE · 世界事实层
   固定种子确定性生成；赛道为闭合环带，弧长 s ∈ [0, L) 环绕。 */
var CHDATA = (function () {
  'use strict';

  var SEED = 20261002;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rg = mulberry32(SEED);

  /* ---- 赛道几何 ---- */
  var L = 4800;                 /* 赛道总弧长（世界单位） */
  var NPLATE = 240;             /* 板块数 */
  var PLATE_L = L / NPLATE;     /* 每块 20 世界单位 */
  var VIEW_W = 1600;            /* 视口宽（世界单位） */
  var VIEW_H = 620;             /* 视口高 */

  /* 环带高度剖面：三条谐波叠加，决定赛道起伏 */
  function ribbonY(s) {
    var u = (s / L) * Math.PI * 2;
    return 58 * Math.sin(3 * u + 0.4) + 26 * Math.sin(7 * u + 1.9) + 12 * Math.sin(11 * u + 3.1);
  }
  function ribbonSlope(s) {
    var u = (s / L) * Math.PI * 2, d = Math.PI * 2 / L;
    return (58 * 3 * Math.cos(3 * u + 0.4) + 26 * 7 * Math.cos(7 * u + 1.9) + 12 * 11 * Math.cos(11 * u + 3.1)) * d;
  }

  /* ---- 谐振桩：全环五座，等距 960 ---- */
  var RESON = [480, 1440, 2400, 3360, 4320];
  var RESON_W = 46;             /* 桩的接收半宽 */

  /* ---- 切变风区：一段集中风廊 ---- */
  var SHEAR_A = 2640, SHEAR_B = 3120;
  var SHEAR_GAIN = 2.15;        /* 风廊内风强放大倍数 */

  /* ---- 板块阵列 ---- */
  var PLATES = [];
  (function () {
    for (var i = 0; i < NPLATE; i++) {
      var s0 = i * PLATE_L;
      var t0 = 0.55 + 0.28 * Math.sin((i / NPLATE) * Math.PI * 2 * 5 + 0.8)
                    + 0.12 * Math.sin((i / NPLATE) * Math.PI * 2 * 13 + 2.2);
      if (t0 < 0.18) t0 = 0.18; if (t0 > 0.98) t0 = 0.98;
      var inShear = (s0 >= SHEAR_A - PLATE_L && s0 < SHEAR_B);
      PLATES.push({
        i: i, s: s0 + PLATE_L / 2,
        t0: +t0.toFixed(4), t: +t0.toFixed(4),
        phase: +(((i / NPLATE) * Math.PI * 2 * 3) % (Math.PI * 2)).toFixed(4),
        jit: +(rg() * 6 - 3).toFixed(3),
        shear: inShear,
        sink: 0, rebound: 0, dead: false, deadAt: 0, stress: 0
      });
    }
  })();

  function wrap(s) { s = s % L; if (s < 0) s += L; return s; }
  function plateAt(s) { return PLATES[Math.floor(wrap(s) / PLATE_L) % NPLATE]; }
  function resIndexNear(s) {
    var w = wrap(s);
    for (var k = 0; k < RESON.length; k++) {
      var d = Math.abs(((w - RESON[k]) % L + L * 1.5) % L - L / 2);
      if (d <= L / 2 - RESON_W && Math.abs(w - RESON[k]) <= RESON_W) return k;
    }
    return -1;
  }
  function inShear(s) { var w = wrap(s); return w >= SHEAR_A && w < SHEAR_B; }

  /* ---- 风场：沿轨向分量，随时间旋转的行波 ---- */
  var WMAX = 46;                /* 基准风强上限（世界单位/秒） */
  var WSPIN = 2 * Math.PI / 12; /* 风场整周 12.000 秒，与结算宏周期同源 */
  function windX(s, t) {
    var u = (s / L) * Math.PI * 2;
    var w = Math.sin(2 * u - WSPIN * t + 0.7) * 0.72 + Math.sin(5 * u + WSPIN * t * 0.5 + 2.4) * 0.28;
    if (inShear(s)) w *= SHEAR_GAIN;
    return w * WMAX;
  }

  /* ---- 动力学常数 ---- */
  var K = {
    IDLE_V: 0.05,          /* 相对静止阈值 */
    DWELL_MS: 350,         /* 同调所需停留时长 */
    DRAG_HEAD: 0.40,       /* 顺风附加阻力系数，倍率上限恰为 ×1.40 */
    LIFT_GAIN: 0.45,       /* 逆风升力系数 */
    ROLL_BASE: 0.085,
    SINK_K: 0.0135,        /* 下沉位移 = SINK_K * vImpact^2 */
    REBOUND_K: 0.68,       /* 反冲弹力系数 */
    COLLAPSE_MS: 500,      /* 反冲后碎裂延时 */
    GRIP_LOCK: 1.00,
    GRIP_SLIP: 0.25,
    STRAIN_CAP: 100,
    STRAIN_WARN: 78,
    CHARGE_CAP: 100,
    CHARGE_RATE: 34,       /* 每秒蓄能 */
    IDLE_DECAY: 3.2,       /* 非操作时每秒熵增衰减 */
    LAUNCH_LOCK_MS: 900,   /* 起步锁定 */
    ROPE_RANGE: 300,
    RETRY_MAX: 3
  };

  /* ---- 张力配平：把全环板块基准张力归一化到恰好 132.000 ---- */
  var TENSION_TOTAL = 132.000;
  (function () {
    var sum = 0, i;
    for (i = 0; i < NPLATE; i++) sum += PLATES[i].t0;
    var sc = TENSION_TOTAL / sum, acc = 0;

    /* 风矢量 */
    var wnow = windAt();
    if (Math.abs(wnow) > 6) {
      var dir = wnow > 0 ? 1 : -1, mag = Math.min(34, Math.abs(wnow) * .34);
      g.strokeStyle = wnow > 0 ? 'rgba(255,94,122,.55)' : 'rgba(185,242,39,.55)';
      g.lineWidth = 1.4;
      for (i = 0; i < 9; i++) {
        var yy = 40 + i * ((H_ - 80) / 8), xx = ((G.t * 40 * dir + i * 180) % (W_ + 200)) - 100;
        g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + mag * dir, yy); g.stroke();
        g.beginPath(); g.moveTo(xx + mag * dir, yy);
        g.lineTo(xx + mag * dir - 6 * dir, yy - 4); g.lineTo(xx + mag * dir - 6 * dir, yy + 4);
        g.closePath(); g.fillStyle = g.strokeStyle; g.fill();
      }
      g.fillStyle = wnow > 0 ? '#FF5E7A' : '#B9F227';
      g.font = '600 12px ui-monospace,monospace';
      var dm = 1 + K.DRAG_HEAD * Math.min(1, Math.max(0, wnow / D.WMAX));
      var lf = K.LIFT_GAIN * Math.min(1, Math.max(0, -wnow / D.WMAX));
      g.fillText((wnow > 0 ? '顺风 +' : '逆风 ') + NF(wnow, 1)
        + (wnow > 0 ? ' · 空气阻力 ×' + NF(dm, 2) : ' · 升力 ×' + NF(lf, 2) + ' · 法向载荷 ' + NF(Math.max(0.15, 1 - lf), 2)),
        12, H_ - 12);
    }
    if (G.x === S.BREACH) {
      g.fillStyle = '#FF5E7A'; g.font = '700 15px ui-monospace,monospace';
      g.fillText('脱轨 · 张力索已发射 · 剩余重试 ' + G.retries, 12, 30);
    }
  }

  /* ---------- HUD：五件独立仪表（自适应栅格：宽屏 5×1，窄屏 3×2） ---------- */
  function drawHud() {
    var g = HX, i; g.clearRect(0, 0, HW, HH);
    var bg = g.createLinearGradient(0, 0, 0, HH);
    bg.addColorStop(0, 'rgba(16,26,51,.9)'); bg.addColorStop(1, 'rgba(6,10,20,.92)');
    g.fillStyle = bg; g.fillRect(0, 0, HW, HH);
    var cols = (HW / HH) > 2.4 ? 5 : 3, rows = Math.ceil(5 / cols);
    var cw2 = HW / cols, ch2 = HH / rows;
    function cell(k) { return { x: (k % cols) * cw2, y: Math.floor(k / cols) * ch2, w: cw2, h: ch2 }; }
    g.strokeStyle = 'rgba(124,140,255,.2)'; g.lineWidth = 1;
    for (i = 1; i < cols; i++) { g.beginPath(); g.moveTo(i * cw2, 4); g.lineTo(i * cw2, HH - 4); g.stroke(); }
    if (rows > 1) { g.beginPath(); g.moveTo(0, ch2); g.lineTo(HW, ch2); g.stroke(); }
    var wnow = windAt(), wN = wnow / D.WMAX;
    var lift = K.LIFT_GAIN * Math.min(1, Math.max(0, -wN));
    var load = clamp(1 - lift, .15, 1);

    /* 1 风向罗盘 */
    var c1 = cell(0), r1 = Math.min(c1.w * .27, c1.h * .30);
    var ax = c1.x + c1.w * .5, ay = c1.y + c1.h * .50;
    g.strokeStyle = 'rgba(124,140,255,.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(ax, ay, r1, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(ax - r1, ay); g.lineTo(ax + r1, ay);
    g.moveTo(ax, ay - r1); g.lineTo(ax, ay + r1); g.stroke();
    g.strokeStyle = wnow > 0 ? '#FF5E7A' : '#B9F227'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(ax, ay);
    g.lineTo(ax + r1 * clamp(wN, -1, 1), ay - r1 * .28 * Math.min(1, Math.abs(wN))); g.stroke();
    g.font = '600 10px ui-monospace,monospace'; g.textAlign = 'center';
    g.fillStyle = 'rgba(190,205,235,.95)'; g.fillText('风向罗盘', c1.x + c1.w * .5, c1.y + c1.h - 6);
    g.fillStyle = wnow > 0 ? '#FF5E7A' : '#B9F227';
    g.fillText(NF(wnow, 1), ax, ay - r1 - 7); g.textAlign = 'left';

    /* 2 动能示波条 */
    var c2 = cell(1), x0 = c2.x + 12, y0 = c2.y + 20, sw = c2.w - 24, sh = c2.h - 40;
    g.strokeStyle = 'rgba(124,140,255,.3)'; g.lineWidth = 1; g.strokeRect(x0, y0, sw, sh);
    g.beginPath();
    var fs = G.frames.slice(-160);
    for (i = 0; i < fs.length; i++) {
      var px2 = x0 + (i / Math.max(1, fs.length - 1)) * sw;
      var py = y0 + sh - clamp(fs[i].vs / 700, 0, 1) * sh;
      if (i === 0) g.moveTo(px2, py); else g.lineTo(px2, py);
    }
    g.strokeStyle = '#5FE3C8'; g.lineWidth = 1.6; g.stroke();
    g.font = '600 10px ui-monospace,monospace';
    g.fillStyle = 'rgba(190,205,235,.95)'; g.fillText('动能示波条', x0, y0 - 7);
    g.fillStyle = '#5FE3C8'; g.textAlign = 'right';
    g.fillText(NF(C.vs, 0) + ' u/s', x0 + sw, y0 - 7); g.textAlign = 'left';

    /* 3 同调稳定性环形标尺 */
    var c3 = cell(2), r3 = Math.min(c3.w * .27, c3.h * .30);
    var bx = c3.x + c3.w * .5, by = c3.y + c3.h * .50;
    g.strokeStyle = 'rgba(124,140,255,.3)'; g.lineWidth = 6;
    g.beginPath(); g.arc(bx, by, r3, 0, Math.PI * 2); g.stroke();
    var prog = clamp(C.dwell / K.DWELL_MS, 0, 1);
    g.strokeStyle = prog >= 1 ? '#B9F227' : '#7C8CFF'; g.lineWidth = 6;
    g.beginPath(); g.arc(bx, by, r3, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(95,227,200,.85)'; g.lineWidth = 3;
    g.beginPath(); g.arc(bx, by, Math.max(2, r3 - 11), -Math.PI / 2, -Math.PI / 2 + (C.lock / 100) * Math.PI * 2); g.stroke();
    g.font = '600 10px ui-monospace,monospace'; g.textAlign = 'center';
    g.fillStyle = prog >= 1 ? '#B9F227' : '#BCCBEA';
    g.fillText(NF(C.dwell, 0) + '/' + K.DWELL_MS + 'ms', bx, by + 4);
    g.fillStyle = 'rgba(190,205,235,.95)'; g.fillText('同调环形标尺', c3.x + c3.w * .5, c3.y + c3.h - 6);
    g.fillText('锁 ' + NF(C.lock, 0), bx, by + r3 + 13); g.textAlign = 'left';

    /* 4 法向矢量仪 */
    var c4 = cell(3), r4 = Math.min(c4.w * .27, c4.h * .30);
    var dx = c4.x + c4.w * .5, dy = c4.y + c4.h * .50;
    g.strokeStyle = 'rgba(124,140,255,.3)'; g.lineWidth = 1;
    g.beginPath(); g.arc(dx, dy, r4, 0, Math.PI * 2); g.stroke();
    var vgx = wN * .5, vgy = 1 - lift * 1.35, m = Math.hypot(vgx, vgy) || 1;
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(dx, dy); g.lineTo(dx, dy + r4 * .8); g.stroke();
    g.strokeStyle = '#FFB454'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(dx, dy); g.lineTo(dx + (vgx / m) * r4 * .86, dy + (vgy / m) * r4 * .86); g.stroke();
    g.font = '600 10px ui-monospace,monospace'; g.textAlign = 'center';
    g.fillStyle = '#FFB454'; g.fillText('载 ' + NF(load, 2), dx, dy - r4 - 7);
    g.fillStyle = 'rgba(190,205,235,.95)'; g.fillText('法向矢量仪', c4.x + c4.w * .5, c4.y + c4.h - 6);
    g.textAlign = 'left';

    /* 5 收益倍率表 */
    var c5 = cell(4), cx5 = c5.x + 14, cy5 = c5.y + 24;
    g.font = '600 10px ui-monospace,monospace';
    g.fillStyle = 'rgba(190,205,235,.95)'; g.fillText('收益倍率表', cx5, c5.y + 13);
    var cc = conservation();
    var rw = [
      ['张力守恒', NF(cc.total, 3), '#5FE3C8'],
      ['车体蓄能', NF(cc.charge, 3), '#7FE9FF'],
      ['已转成功', NF(cc.conv, 3), '#B9F227'],
      ['熵增损耗', NF(cc.vent, 3), '#FF5E7A'],
      ['因果结余', NF(G.causal, 0), '#FFB454'],
      ['重试余量', NF(G.retries, 0), '#B57BFF'],
      ['板块存档', NF(NP - PL.filter(function (p) { return p.dead; }).length, 0), '#BCCBEA']
    ];
    var step = Math.min(17, (c5.h - 30) / rw.length);
    for (i = 0; i < rw.length; i++) {
      g.fillStyle = 'rgba(134,152,192,.95)'; g.fillText(rw[i][0], cx5, cy5 + i * step);
      g.fillStyle = rw[i][2]; g.fillText(rw[i][1], cx5 + Math.min(62, c5.w * .45), cy5 + i * step);
    }
  }

  /* ---------- 雷达 ---------- */
  function drawRadar() {
    var g = RX, i; g.clearRect(0, 0, RW, RH);
    var bg = g.createLinearGradient(0, 0, 0, RH);
    bg.addColorStop(0, 'rgba(16,26,51,.9)'); bg.addColorStop(1, 'rgba(6,10,20,.94)');
    g.fillStyle = bg; g.fillRect(0, 0, RW, RH);
    var cx = RW / 2, cy = RH / 2, rw = RW * .40, rh = RH * .34;
    g.strokeStyle = 'rgba(124,140,255,.55)'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2); g.stroke();
    var shA = (D.SHEAR_A / L) * Math.PI * 2 - Math.PI / 2, shB = (D.SHEAR_B / L) * Math.PI * 2 - Math.PI / 2;
    g.strokeStyle = 'rgba(255,180,84,.9)'; g.lineWidth = 5;
    g.beginPath(); g.ellipse(cx, cy, rw, rh, 0, shA, shB); g.stroke();
    for (i = 0; i < D.RESON.length; i++) {
      var a = (D.RESON[i] / L) * Math.PI * 2 - Math.PI / 2;
      g.fillStyle = nearPylon(C.s) === i ? '#B9F227' : '#5FE3C8';
      g.beginPath(); g.arc(cx + Math.cos(a) * rw, cy + Math.sin(a) * rh, 3.4, 0, Math.PI * 2); g.fill();
    }
    for (i = 0; i < NP; i += 1) { if (!PL[i].dead) continue;
      var a2 = (PL[i].s / L) * Math.PI * 2 - Math.PI / 2;
      g.strokeStyle = '#FF5E7A'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(cx + Math.cos(a2) * (rw - 5), cy + Math.sin(a2) * (rh - 5));
      g.lineTo(cx + Math.cos(a2) * (rw + 5), cy + Math.sin(a2) * (rh + 5)); g.stroke(); }
    var ca = (C.s / L) * Math.PI * 2 - Math.PI / 2;
    g.fillStyle = '#FF5E7A'; g.shadowBlur = 10; g.shadowColor = '#FF5E7A';
    g.beginPath(); g.arc(cx + Math.cos(ca) * rw, cy + Math.sin(ca) * rh, 4.6, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(190,205,235,.9)'; g.font = '600 10px ui-monospace,monospace';
    g.fillText('环道雷达', 8, 14);
  }

  /* ================= 面板 ================= */
  var $ = function (id) { return document.getElementById(id); };

    G.log.push({ t: G.t, k: k, m: String(msg) });

    P.logS = '';
  }
  var P = { ledS: '', logS: '', pylS: '', stS: '', drS: '' };
  function renderLedger() {
    var c = conservation(), sig = NF(c.plate, 3) + NF(c.charge, 3) + NF(c.vent, 3) + NF(c.conv, 3);

  function renderLog() {

    if (P.logS === sig) return; P.logS = sig;

    for (var i = G.log.length - 1; i >= 0; i--) {
      var e = G.log[i];

    }
    $('log').innerHTML = h; $('logN').textContent = String(G.log.length);
  }
  function renderDrawer() {
    var s = (G.staged ? JSON.stringify(G.staged) : '') + '|' + G.note + '|' + G.locked + '|' + G.tries;
    if (P.drS === s) return; P.drS = s;
    $('drAct').textContent = G.staged ? G.staged.a : '—';

      : (G.locked ? '通道锁定' : '未暂存');
    var ok = !!G.staged && G.note.length >= 10 && !G.locked;

  }
  function renderStatus() {
    var c = conservation(), nd = 0, si;
    for (si = 0; si < NP; si++) if (PL[si].dead) nd++;
    var sig = G.st + NF(C.s, 0) + NF(C.vs, 0) + NF(c.total, 3) + NF(C.dwell, 0) + NF(G.causal, 0)
      + G.retries + NF(windAt(), 1) + nd + NF(C.strain, 1) + G.locked + G.tries + G.retries;
    if (P.stS === sig) return; P.stS = sig;

    $('tok').className = 'chip tok' + (G.x >= S.STRAIN ? ' warn' : '');
    $('chipPhase').textContent = '相位 ' + (C.phase === 0 ? 'A' : 'B');
    $('chipLock').textContent = '同调 ' + (C.lock > 80 ? '锁定' : C.lock > 40 ? '半锁' : '未锁定');
    $('roS').textContent = COMMA(C.s);
    $('roV').textContent = NF(C.vs, 0);
    $('roT').textContent = NF(c.total, 3);
    $('roC').textContent = COMMA(G.causal);
    $('roR').textContent = String(G.retries);
    $('sbState').textContent = G.st;
    $('sbDot').className = 'dot' + (G.x >= S.STRAIN ? ' warn' : '');
    $('sbWind').textContent = NF(windAt(), 1);
    $('sbDwell').textContent = NF(C.dwell, 0);
    $('sbStrain').textContent = NF(C.strain, 1);
    $('sbPlate').textContent = String(NP - nd);

  function render() {
    drawWorld(); drawHud(); drawRadar();
    renderLedger(); renderPylons(); renderLog(); renderDrawer(); renderStatus();
  }

  /* ================= 渲染循环 ================= */
  var acc = 0, last = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    if (!G.paused) {
      acc += dt;
      var guard = 0;
      while (acc >= DT && guard++ < 8) { step(); acc -= DT; }
      stepParticles(dt);
    }
    render();
    tickWall(dt);
  }
  function tickWall(dt) {
    if (G.paused) return;
    if (G.x === S.ARM) {
      G.armT += dt;
      if (G.armT >= 3.0) { setSt(S.LNCH, '倒计时结束 · 起步'); G.launchT = 0; }
    }
    if (G.x === S.LNCH) G.launchT += dt;
    /* 静置计时：任何输入都清零 */
    var idle = (performance.now() - G.lastIn) / 1000;
    if (idle >= STILL_MS / 1000) G.still = idle; else G.still = 0;
    if (G.x >= S.RUN && G.x <= S.STRAIN && G.still >= STILL_MS / 1000) {
      G.still = 0; log('still', '静置 ' + NF(STILL_MS, 0) + 'ms 达成 · 结算条件满足');
    }
  }

  /* ================= 结算 ================= */
  function doSettle() {
    var f = G.frames, n = f.length;
    var sumV = 0, sumLk = 0, sumSt = 0, i;
    for (i = 0; i < n; i++) { sumV += f[i].vs; sumLk += f[i].lk; sumSt += f[i].st; }
    var dev = 0;
    for (i = 0; i < G.landings.length; i++) dev += G.landings[i].dev;
    dev = G.landings.length ? dev / G.landings.length : 0;
    var conv = G.converted, vent = G.vented;
    var eff = (conv + vent) > 0 ? (conv / (conv + vent)) * 100 : 0;
    var dead = PL.filter(function (p) { return p.dead; }).length;
    var att = (dead / NP) * 100;
    var reward = Math.round(eff * 6 + Math.max(0, 100 - att) * 2);
    G.causal += reward;
    G.settle = {
      frames: n, avgV: sumV / Math.max(1, n), lockAvg: sumLk / Math.max(1, n),
      strainAvg: sumSt / Math.max(1, n), landings: G.landings.length,
      dev: dev, eff: eff, att: att, reward: reward, dead: dead,
      pulses: G.pulses, swaps: G.swaps, vent: vent, conv: conv
    };
    log('settle', '落点偏离 ' + NF(dev, 1) + ' · 转化 ' + NF(eff, 1) + '% · 损耗 ' + NF(att, 1) + '% · 奖励 ' + reward);
    P.ledS = ''; P.stS = '';
  }

  /* ================= 输入 ================= */
  function markInput() { G.lastIn = performance.now(); G.still = 0; }
  window.addEventListener('mousemove', markInput, { passive: true });
  window.addEventListener('wheel', markInput, { passive: true });
  window.addEventListener('keydown', function (e) {
    markInput();
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); pulse(); }
    else if (e.key === 'ArrowDown' || e.key === 's') { C.dive = true; }
    else if (e.key === 'q' || e.key === 'Q' || e.key === 'e' || e.key === 'E') { swapPhase(); }
    else if (e.key === 'r' || e.key === 'R') { rope(); }
    else if (e.key === 'ArrowUp' || e.key === 'w') { C.throttle = Math.min(1, C.throttle + .34); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowDown' || e.key === 's') C.dive = false;
    if (e.key === 'ArrowUp' || e.key === 'w') C.throttle = Math.max(0, C.throttle - .34);
  });
  cw.addEventListener('mousedown', function () {
    markInput();
    if (G.x === S.ARM) { G.launchHold = Math.min(1, G.launchHold + .25); C.charge += 0.6; }
    else C.throttle = Math.min(1, C.throttle + .5);
  });
  cw.addEventListener('contextmenu', function (e) { e.preventDefault(); rope(); });
  function pulse() {
    if (G.x < S.RUN || G.x > S.STRAIN) return false;
    if (C.charge < 6) { log('pulse', '脉冲拒绝 · 蓄能 ' + NF(C.charge, 2)); return false; }
    if (C.lock < 40) { log('pulse', '脉冲拒绝 · 同调未锁 ' + NF(C.lock, 1)); return false; }
    var use = 6;
    C.charge -= use; G.converted += use;
    C.vs = Math.min(760, C.vs + 90); G.pulses++; G.causal -= 35; G.spent += 35;
    log('pulse', '同调脉冲 · 释放 ' + NF(use, 2) + ' · 车速 ' + NF(C.vs, 0)); return true;
  }
  function swapPhase() {
    if (G.x < S.RUN) return false;
    C.phase = C.phase ? 0 : 1; G.swaps++; G.causal -= 20; G.spent += 20;
    log('phase', '磁极相位瞬切 → ' + (C.phase ? 'B' : 'A')); return true;
  }
  function rope() {
    if (G.rope > 0 || G.retries <= 0) return false;
    var best = -1, bd = 1e9;
    for (var i = 0; i < D.RESON.length; i++) {
      var d = Math.abs(C.s - D.RESON[i]); if (d > L / 2) d = L - d;
      if (d < bd) { bd = d; best = i; }
    }
    if (bd > K.ROPE_RANGE) { log('rope', '张力索拒绝 · 最近桩距 ' + NF(bd, 0)); return false; }
    C.rope = 100; C.ropeTo = best; G.retries--; G.causal -= 90; G.spent += 90;
    log('rope', '张力索发射 → 桩 ' + (best + 1) + ' · 距离 ' + NF(bd, 0)); return true;
  }

  /* ================= 两阶段提交 ================= */
  function autoAction() { return G.locked ? '审计' : (G.x === S.PAD ? '起步' : '结算'); }
  function auditClose() {
    var c = conservation(), d = z3(bal3(c.total - D.TENSION_TOTAL));
    if (d !== 0) { log('audit', '闭合失败 · 差额 ' + NF(d, 3)); return false; }
    G.locked = false; G.tries = 0;
    G.retries = Math.min(K.RETRY_MAX, G.retries + 1);
    log('audit', '守恒审计闭合 · 差额 0.000 · 通道解锁 · 返还重试 1');
    return true;
  }
  function stage(a) {
    if (G.locked && a !== '审计') { log('stage', '通道锁定 · 仅可暂存审计'); return false; }
    a = a || autoAction();
    G.staged = { a: a, t: bal3(C.charge) };
    log('stage', '暂存 ' + a); P.drS = ''; return true;
  }
  function commit() {
    if (!G.staged) { log('commit', '无暂存态 · 提交被拒'); return false; }
    if (G.note.length < 10) { log('commit', '驳回 · 审计附注不足 10 字'); P.drS = ''; return false; }
    var a = G.staged.a, t = G.staged.t;
    G.staged = null;
    if (a === '审计') { auditClose(); }
    else if (a === '起步') { G.causal -= 60; G.spent += 60; setSt(S.LNCH, '两阶段提交 · 起步'); G.launchT = 0; }
    else if (a === '张力索') { rope(); }
    else if (a === '结算') { G.causal -= 40; G.spent += 40; setSt(S.SETTLE, '两阶段提交 · 结算'); }
    else if (a === '重置') { setSt(S.PAD, '两阶段提交 · 重置'); }
    log('commit', '提交 ' + a + ' · 张力 ' + NF(t, 3) + ' · 附注 ' + G.note.length + ' 字');
    P.drS = ''; return true;
  }
  function hardReset() {
    for (var i = 0; i < NP; i++) { var p = PL[i];
      p.t = p.t0; p.sink = 0; p.rebound = 0; p.dead = false; p.deadAt = 0; p.stress = 0; }
    C.s = 300; C.vs = 0; C.y = D.ribbonY(300); C.vy = 0; C.grounded = true;
    C.dwell = 0; C.lock = 0; C.charge = 0; C.strain = 0; C.rope = 0; C.plate = 15;
    C.throttle = 0; C.brake = 0; C.dive = false;
    G.t = 0; G.vented = 0; G.converted = 0; G.causal = 1000; G.spent = 0; G.retries = K.RETRY_MAX;
    G.frames = []; G.landings = []; G.pulses = 0; G.swaps = 0; G.armT = 0; G.launchT = 0;
    G.staged = null; G.note = ''; G.locked = false; G.tries = 0; G.settle = null;
    PT.length = 0; G.log = []; P.ledS = P.stS = P.logS = P.drS = P.pylS = '';
    log('reset', '环带复位 · 张力 ' + NF(D.TENSION_TOTAL, 3));
  }
  function arm() {
    if (G.x !== S.PAD) return false;
    setSt(S.ARM, '接手 · 起跑待命'); G.armT = 0; G.launchHold = 0;
    return true;
  }

  /* ================= 校验码 ================= */
  function openCode() {
    G.code = 1000 + Math.floor(Math.random() * 9000);
    G.codeArmed = true;
    $('mCode').textContent = String(G.code);
    $('mInput').value = ''; $('mErr').textContent = '';
    $('modal').className = 'modal';
  }
  function closeCode() { $('modal').className = 'modal off'; G.codeArmed = false; }
  function redeem(v) {
    if (!G.codeArmed) return false;
    if (G.locked) { log('code', '通道已锁定 · 校验码失效，须走守恒审计'); return false; }
    if (String(v) === String(G.code)) {
      G.locked = false; G.tries = 0; G.retries = Math.min(K.RETRY_MAX, G.retries + 1);
      log('code', '校验通过 · 返还重试 1 · 错误计数归零'); closeCode(); return true;
    }
    G.tries++;
    if (G.tries >= 3) { G.locked = true; log('code', '连续错 ' + G.tries + ' 次 · 通道锁定'); closeCode(); }
    else { $('mErr').textContent = '校验码不符 · 已错 ' + G.tries + ' 次'; }
    return false;
  }
  $('mOk').addEventListener('click', function () { redeem($('mInput').value); });
  $('mCancel').addEventListener('click', closeCode);
  $('btnStage').addEventListener('click', function () { stage(autoAction()); });
  $('btnCommit').addEventListener('click', commit);
  $('note').addEventListener('input', function () { G.note = this.value; P.drS = ''; });

  /* ================= 启动 ================= */
  function boot() {
    fit();
    C.y = D.ribbonY(C.s);
    C.plate = Math.floor(C.s / D.PLATE_L);
    window.__pw = window.innerWidth;
    window.addEventListener('resize', function () {
      fit();
      if (window.__pw !== window.innerWidth) {
        window.__pw = window.innerWidth;
        var back = G.x === S.PAD ? S.PAD : G.x;
        if (G.x > S.PAD && G.x < S.BREACH) { G.log.push({ t: G.t, k: 'reflow', m: '视口重排 · 重新整定像素密度' }); }
      }
      P.ledS = P.stS = P.logS = P.drS = P.pylS = '';
      fit();
    });
    for (var i = 0; i < 24; i++) { G.frames.push({ t: 0, vs: 0, ch: 0, st: 0, lk: 0, sx: 300 }); }
    log('boot', '张力场标定 · 板块 ' + NP + ' · 谐振桩 ' + D.RESON.length + ' · 种子 ' + D.SEED);
    requestAnimationFrame(loop);
  }

  /* ================= 探针 ================= */
  window.CHORD = {
    freeze: function (b) { G.paused = !!b; return G.paused; },
    step: function (n) { for (var i = 0; i < (n || 1); i++) step(); render(); return G.t; },
    enter: function () { return arm(); },
    setBoot: function (v) { G.boot = v; var ve = $('veil');
      if (v >= 1) ve.className = 'veil off'; else { ve.className = 'veil';
        $('veilBar').style.width = (v * 100).toFixed(0) + '%';
        $('veilTxt').textContent = '张力场标定中 · ' + (v * 100).toFixed(0) + '%'; } return v; },
    setState: function (n) { var i = SN.indexOf(n); if (i < 0) return false; G.x = i; G.st = SN[i]; P.stS = ''; return true; },
    setCar: function (o) { for (var k in o) if (k in C) C[k] = o[k]; P.stS = P.pylS = ''; return true; },
    setWind: function (v) { G.windOverride = v; return true; },
    audit: auditClose,
    setThrottle: function (v) { C.throttle = v; return true; },
    setTime: function (v) { G.t = v; return G.t; },
    setNote: function (s) { G.note = s; $('note').value = s; P.drS = ''; return true; },
    setRetries: function (n) { G.retries = n; P.stS = ''; return true; },
    setStrain: function (v) { C.strain = v; P.stS = ''; return true; },
    setDwell: function (v) { C.dwell = v; P.pylS = ''; return true; },
    setLock: function (v) { C.lock = v; P.pylS = ''; return true; },
    setCharge: function (v) { var d = v - C.charge, i, pool = [];
      if (d > 0) { for (i = 0; i < NP; i++) pool.push(PL[i]);
        pool.sort(function (a, b) { return b.t - a.t; });
        for (i = 0; i < pool.length && d > 1e-9; i++) { var take = Math.min(d, Math.max(0, pool[i].t - 0.05));
          pool[i].t -= take; d -= take; C.charge += take; } }
      else if (d < 0) { C.charge = v; G.vented -= d; }
      P.ledS = ''; return true; },
    sink: function (i, v) { PL[i].sink = v; return PL[i].sink; },
    stress: function (i, v) { PL[i].stress = v; return PL[i].stress; },
    killPlate: function (i) { if (!PL[i].dead) { G.vented += PL[i].t; PL[i].t = 0; }
      PL[i].dead = true; P.ledS = P.stS = ''; return true; },
    reviveAll: function () { for (var i = 0; i < NP; i++) { var p = PL[i];
        var need = p.t0 - p.t; if (need > 0) { var take = Math.min(need, G.vented);
          G.vented -= take; p.t += take; }
        p.dead = false; p.deadAt = 0; p.sink = 0; p.stress = 0; }
      P.ledS = P.stS = ''; return true; },
    burst: function (n) { burst(C.s, C.y, n || 12); return PT.length; },
    launch: function () { setSt(S.LNCH, '探针'); G.launchT = 0; return true; },
    pulse: pulse, swapPhase: swapPhase, rope: rope, stage: stage, commit: commit,
    ropeFixed: function (i) { i = i || 0; C.rope = 100; C.ropeTo = i; G.retries = Math.max(0, G.retries - 1);
      G.causal -= 90; log('rope', '张力索发射 → 桩 ' + (i + 1)); return true; },
    park: function (s, th) { C.s = D.wrap(s); C.y = D.ribbonY(C.s) - plateAtS(C.s).sink; C.vy = 0; C.vs = 0;
      C.grounded = true; C.plate = Math.floor(D.wrap(C.s) / D.PLATE_L); if (th !== undefined) C.throttle = th;
      return C.y; },
    surface: function (s) { return D.ribbonY(D.wrap(s)) - plateAtS(D.wrap(s)).sink; },
    codeNow: function () { return G.code; },
    arm: arm, reset: function () { setSt(S.PAD, '探针复位'); }, settle: function () { setSt(S.SETTLE, '探针结算'); },
    openCode: openCode, redeem: redeem, codeNow: function () { return G.code; },
    counts: function () { return { frames: G.frames.length, landings: G.landings.length,
      log: G.log.length, dead: PL.filter(function (p) { return p.dead; }).length,
      particles: PT.length, plates: NP }; },
    info: function () { var c = conservation();
      return { st: G.st, t: +G.t.toFixed(3), vs: +C.vs.toFixed(2), s: +C.s.toFixed(1),
        dwell: +C.dwell.toFixed(1), lock: +C.lock.toFixed(2), charge: c.charge, strain: +C.strain.toFixed(2),
        phase: C.phase, grounded: C.grounded, rope: +C.rope.toFixed(1),
        plate: +c.plate.toFixed(3), vent: c.vent, conv: c.conv, total: +c.total.toFixed(3),
        diff: +z3(c.total - D.TENSION_TOTAL).toFixed(3), wind: +windAt().toFixed(2),
        causal: G.causal, retries: G.retries, dead: PL.filter(function (p) { return p.dead; }).length,
        pylon: nearPylon(C.s), laminar: !PL.some(function (p) { return p.dead; }) };
    },
    readAll: function () { return { info: window.CHORD.info(),
      ledger: $('ledger').innerText, log: G.log.slice(-8).map(function (e) { return e.k + ' ' + e.m; }),
      settle: G.settle || null, pylons: $('pylons').innerText, status: $('sbState').textContent }; },
    painted: function () {
      function ratio(cv) { var c = cv.getContext('2d'); var d = c.getImageData(0, 0, cv.width, cv.height).data;
        var n = 0, tot = 0; for (var i = 0; i < d.length; i += 16) { tot++;
          if (d[i] > 26 || d[i + 1] > 26 || d[i + 2] > 34) n++; } return n / tot; }
      return { world: +ratio(cw).toFixed(4), hud: +ratio(ch).toFixed(4), radar: +ratio(cr).toFixed(4) };
    },
    lockDbg: function () { return { locked: G.locked, tries: G.tries }; }
  };
  boot();
})();
</script>
</body>
