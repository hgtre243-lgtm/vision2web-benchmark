<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮汐灯塔 TIDAL LIGHTHOUSE</title>
<style>
  :root{ --stage:#050a11; --ink:#e8f0f4; --dim:#7e9aa8; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#03060a;overflow:hidden}
  body{font:12px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--dim)}
  /* 顶部让出 46px 给视图栏。画布只在下方的余量里等比居中，
     栏与画不重叠——截图整页时按钮不会压住塔尖。 */
  #wrap{position:fixed;left:0;right:0;top:46px;bottom:0;display:flex;align-items:center;justify-content:center}
  #stage{display:block;flex:none;width:100%;height:100%;background:var(--stage)}

  /* ── L1 环境场与背板底衬：夜海天幕 ─────────────────────── */
  .sky{fill:url(#gSky)}
  .starfield{opacity:.72}
  .moon{fill:url(#rMoon)}
  .halo{fill:url(#rHalo)}
  .moonbar{fill:url(#rFlare)}
  .cloud{opacity:.5}
  .farsea{fill:url(#gSea)}
  .hazeband{fill:url(#gMist)}
  .farstack{fill:url(#gFarRock)}
  .guide{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.30}
  .ticks{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.34}
  .vignette{fill:#060b12}
  .mote{opacity:.5}

  /* ── L2 基座承重与接触阴影：接触暗场与投下的长影 ────────── */
  .ao{fill:url(#rAO)}
  .cast{fill:url(#rShadow)}
  .wave-ao{fill:url(#rShadow)}

  /* ── L3 主构架与核心机构内胆 ───────────────────────────── */
  .tw-inner{fill:url(#gInner)}
  .in-ring{fill:none;stroke:url(#gStair);stroke-width:1.1}
  .stair{fill:none;stroke:url(#gStair);stroke-width:1.6}
  .lamp-seat{fill:url(#gCollar)}
  .lamp-core{fill:url(#rLamp)}
  .lamp-cap{fill:url(#gCollar)}
  .fresnel{fill:none}
  .gear{fill:none;stroke:url(#gGear);stroke-width:1.8;stroke-linejoin:round}
  .gear-hub{fill:url(#gCollar)}
  .shaft{fill:url(#gCollar)}
  .shaft-collar{fill:url(#gCollar)}
  .couple{fill:url(#gCouple)}
  .couple-rim{fill:none;stroke:url(#gCollar);stroke-width:1.4}
  .win-bore{fill:url(#rBore)}

  /* ── L4 曲面外壳与多曲率包络 ───────────────────────────── */
  .cliff{fill:url(#gCliff)}
  .cliff-seam{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .cliff-top{fill:url(#gRockTop)}
  .cliff-lit{fill:url(#gRim);opacity:.55}
  .cliff-face-l{fill:url(#gFaceL)}
  .cliff-face-d{fill:url(#gFaceD)}
  .talus{fill:url(#gTalus)}
  .talus-top{fill:url(#gRockTop)}
  .island{fill:url(#gCliff)}
  .isl-seam{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .isl-top{fill:url(#gRockTop)}
  .isl-front{fill:url(#gIslFront)}
  .isl-front-top{fill:url(#gRockTop)}
  .pine-far{fill:url(#gPineF)}
  .pine-near{fill:url(#gPineN)}
  .tower{fill:url(#gTower)}
  .band{fill:url(#gBand)}
  .tw-plinth{fill:url(#gPlinth)}
  .win-rim{fill:none;stroke:url(#gRim);stroke-width:2.2}
  .win-sill{fill:url(#gPlinth)}
  .gal{fill:url(#gDeck)}
  .gal-rib{fill:none;stroke:url(#gSeam);stroke-width:1.3}
  .gal-deck{fill:url(#gDeck)}
  .rail-post{fill:none;stroke:url(#gRail);stroke-width:2.6}
  .rail-bar{fill:none;stroke:url(#gRail)}
  .lantern{fill:url(#gPlinth)}
  .lan-capring{fill:url(#gPlinth)}
  .glazing{fill:url(#gGlazA)}
  .mullion{fill:none;stroke:url(#gRail);stroke-width:3}
  .lan-rail{fill:none;stroke:url(#gRail);stroke-width:2.4}
  .dome{fill:url(#gDome)}
  .dome-rib{fill:none;stroke:url(#gSeam);stroke-width:1.2}
  .dome-face{fill:url(#gDomeFace)}
  .fin-rod{fill:url(#gCollar)}
  .fin-ball{fill:url(#rFinBall)}
  .fin-vane{fill:url(#gVane)}
  .cot-wall{fill:url(#gWall)}
  .cot-face{fill:url(#gWall)}
  .cot-eave{fill:none;stroke:url(#gChim);stroke-width:1.4}
  .cot-gable{fill:url(#gWall)}
  .cot-roofR{fill:url(#gChim)}
  .cot-roofL{fill:url(#gRoof)}
  /* 窗是凹进去的孔：外圈压一道暗边当孔壁，孔口才从墙面上立得起来。
     只铺一层暖光的话，光心跟月光照亮的墙面差不多亮，窗就糊进墙里看不见了。 */
  .cot-win{fill:url(#rWin);stroke:#241c12;stroke-width:1.6}
  .cot-door{fill:url(#gDoor)}
  .chim{fill:url(#gChim)}
  .wave{fill:url(#gWave)}
  .foam{fill:url(#gFoam)}
  .foam-haze{fill:url(#gFoam);opacity:.5}
  .fgrock{fill:url(#gCliff)}
  .fgrock-top{fill:url(#gTalus)}
  .fgrock-wash{fill:url(#gFoam)}
  .gull{fill:url(#gGull)}

  /* ── L5 镜面高光与视差辉光 ─────────────────────────────── */
  .beam{opacity:.6}
  .beam-core{opacity:.5}
  .lamp-bloom{opacity:.82}
  .lens-flare{opacity:.5}
  .lens-flare2{opacity:.6}
  .flare-dot{opacity:.5}
  .fresnel-rim{fill:url(#gFres);opacity:.7}
  .crest-hi{fill:url(#gCrest)}
  .spark{opacity:.7}
  .glow-mote{opacity:.6}

  /* ── L6 读数与部件标注 ─────────────────────────────────── */
  #annot{display:none}
  body.annot #annot{display:block}
  .readout{fill:#5f7e8e;font:11px ui-monospace,monospace;letter-spacing:.18em}
  .an-lead{fill:none;stroke:url(#gRim);stroke-width:1}
  .an-badge{fill:rgba(6,12,20,.78);stroke:#8fc4dc;stroke-width:1.4}
  .an-no{fill:#e8f0f4;font:600 14px ui-monospace,monospace;text-anchor:middle}
  .lg-panel{fill:rgba(5,10,18,.58);stroke:#2e5468;stroke-width:1}
  .lg-dot{fill:#8fc4dc}
  .lg-no{fill:#5f8ea4;font:600 11px ui-monospace,monospace}
  .lg-zh{fill:#e2eef4;font-size:12px}
  .lg-en{fill:#547e92;font:9.5px ui-monospace,monospace;letter-spacing:.1em}
  .lg-ly{fill:#3e6274;font:9.5px ui-monospace,monospace}
  .lg-h{fill:#f2f8fb;font-size:14px;letter-spacing:.34em}
  .lg-h2{fill:#547e92;font:9px ui-monospace,monospace;letter-spacing:.22em}

  /* ── 月夜冷色阶：整图色阶对位替换，几何零变化 ──────────── */
  body.theme-b{--stage:#03070c}
  body.theme-b #stage{background:#03070c}
  body.theme-b .sky{fill:url(#aSky)}
  body.theme-b .farsea{fill:url(#aSea)}
  body.theme-b .hazeband{fill:url(#aFoam)}
  body.theme-b .farstack{fill:url(#aCliff)}
  body.theme-b .wave{fill:url(#aWave)}
  body.theme-b .foam,body.theme-b .foam-haze,body.theme-b .fgrock-wash{fill:url(#aFoam)}
  body.theme-b .tower{fill:url(#aTower)}
  body.theme-b .band{fill:url(#aBand)}
  body.theme-b .tw-plinth,body.theme-b .lantern,body.theme-b .lan-capring,
  body.theme-b .gal,body.theme-b .gal-deck{fill:url(#aDeck)}
  body.theme-b .cliff,body.theme-b .fgrock{fill:url(#aCliff)}
  body.theme-b .cliff-face-l{fill:url(#aIslFront);opacity:.55}
  body.theme-b .cliff-face-d{fill:url(#aCliff);opacity:.7}
  body.theme-b .talus{fill:url(#aCliff)}
  body.theme-b .island,body.theme-b .isl-front{fill:url(#aIslFront)}
  body.theme-b .pine-far,body.theme-b .pine-near{fill:url(#aPine)}
  body.theme-b .dome{fill:url(#aDome)}
  body.theme-b .beam{fill:url(#aBeam)}
  body.theme-b .glazing{fill:url(#aDeck)}
  body.theme-b .crest-hi{fill:url(#aFoam)}

  /* ── 线稿拓扑蓝图：轮廓即拓扑分界线，绝不使用纯黑描边 ──── */
  body.bp .sky{fill:#050a12}
  body.bp .halo,body.bp .cloud,body.bp .vignette,
  body.bp .farstack,body.bp .hazeband,body.bp .foam-haze{opacity:.04}
  /* 月面在蓝图里降不透明度只会剩一个灰盘（它本身是亮白径向），
     干脆改成冷青空心圆：位置读得出来，色不带进来。 */
  body.bp .moon{fill:none;stroke:#8fd4f0;stroke-width:1.2;opacity:1}
  /* 加性暖光在蓝图里一律熄净：留一点点残辉都会被读成「填充没剥干净」 */
  body.bp .moonbar,body.bp .lamp-bloom,body.bp .lens-flare,body.bp .lens-flare2,
  body.bp .flare-dot,body.bp .beam,body.bp .beam-core,body.bp .spark,
  body.bp .glow-mote{opacity:0}
  /* 星点原来沿用月面那支暖白径向渐变，压到 .18 仍是一片带回温的填充块。
     蓝图态直接换成一支冷青实色，只留"有点"的读数，不留色。 */
  body.bp .starfield{fill:#7fc6e6;opacity:.30}
  body.bp .spark,body.bp .glow-mote,body.bp .mote{opacity:.18}
  /* 塔基座圈的 gPlinth 是暖棕三停靠点，蓝图态没给规则，于是塔脚糊着一块棕灰——
     正是验收里「塔基接触处见棕灰色填充块」那一处。改空心青描边。 */
  body.bp .tw-plinth{fill:none;stroke:#6fc0e0;stroke-width:1.3}
  body.bp .farsea{fill:#050a12;stroke:none}
  body.bp .cliff{fill:none;stroke:#6fc0e0;stroke-width:1.5}
  body.bp .cliff-seam{stroke:#2f7ea6;opacity:.7}
  body.bp .cliff-top{fill:none;stroke:#8fd4f0;stroke-width:1}
  body.bp .cliff-face-l,body.bp .cliff-face-d{fill:none;stroke:#3f8fb4;stroke-width:.9;opacity:.55}
  body.bp .cliff-lit{fill:none;stroke:#5fb0d4;stroke-width:1;opacity:.7}
  body.bp .talus,body.bp .talus-top{fill:none;stroke:#4f9fc4;stroke-width:1.2}
  body.bp .island{fill:none;stroke:#6fc0e0;stroke-width:1.5}
  body.bp .isl-seam{stroke:#2f7ea6;opacity:.7}
  body.bp .isl-top{fill:none;stroke:#8fd4f0;stroke-width:1}
  body.bp .fgrock,body.bp .fgrock-top{fill:none;stroke:#4f9fc4;stroke-width:1.2}
  body.bp .tower{fill:none;stroke:#8fd4f0;stroke-width:1.9}
  body.bp .tw-inner{fill:none;stroke:#2f6f92;stroke-width:1.1}
  body.bp .in-ring{stroke:#2f6f92;opacity:.8}
  body.bp .stair{stroke:#6fb6d6}
  body.bp .band{fill:none;stroke:#5fb6e0;stroke-width:1.3}
  body.bp .win-bore{fill:none;stroke:#bfeaff;stroke-width:1.1}
  body.bp .win-rim{stroke:#bfeaff;stroke-opacity:.9}
  body.bp .win-sill{fill:none;stroke:#5fb6e0;stroke-width:1}
  body.bp .gal,body.bp .gal-deck{fill:none;stroke:#7fd0ff;stroke-width:1.4}
  body.bp .gal-rib{stroke:#2f7ea6}
  body.bp .rail-post,body.bp .rail-bar{stroke:#9fe0ff}
  body.bp .lantern,body.bp .lan-capring{fill:none;stroke:#7fd0ff;stroke-width:1.5}
  body.bp .glazing{fill:none;stroke:#5fb6e0;stroke-width:1.2}
  body.bp .mullion,body.bp .lan-rail{stroke:#9fe0ff}
  body.bp .dome{fill:none;stroke:#7fd0ff;stroke-width:1.6}
  body.bp .dome-rib{stroke:#2f7ea6}
  body.bp .dome-face{fill:none;stroke:#8fd4f0;stroke-width:1}
  body.bp .fin-rod,body.bp .fin-ball,body.bp .fin-vane{fill:none;stroke:#bfeaff;stroke-width:1.3}
  body.bp .cot-wall,body.bp .cot-face,body.bp .cot-gable,body.bp .cot-roofR,
  body.bp .cot-roofL,body.bp .chim,body.bp .cot-win,body.bp .cot-door{
    fill:none;stroke:#7fd0ff;stroke-width:1.3}
  body.bp .cot-eave{stroke:#9fe0ff}
  body.bp .lamp-seat,body.bp .lamp-cap,body.bp .gear-hub,body.bp .shaft-collar,
  body.bp .lamp-core{fill:none;stroke:#cfeaff;stroke-width:1.2}
  body.bp .shaft{fill:none;stroke:#9fe0ff;stroke-width:1.3}
  body.bp .couple,body.bp .couple-rim{fill:none;stroke:#bfeaff;stroke-width:1.4}
  body.bp .gear,body.bp .fresnel{stroke:#9fe0ff}
  body.bp .wave{fill:none;stroke:#4f9fc4;stroke-width:1.2}
  body.bp .foam{fill:none;stroke:#8fd4f0;stroke-width:1;opacity:.6}
  body.bp .pine-far,body.bp .pine-near{fill:none;stroke:#1d5f88;stroke-width:1}
  body.bp .gull{fill:none;stroke:#8fd4f0;stroke-width:1.1;opacity:.8}
  body.bp .guide,body.bp .ticks{stroke:#3f86b0}
  /* 菲涅尔边缘光走的是暖琥珀渐变，蓝图态只剩轮廓线（.fresnel 那条），这层熄灭 */
  body.bp .fresnel-rim{opacity:0}
  body.bp .crest-hi{opacity:.25}
  /* 接触阴影与环境光遮蔽本是暖调半透明填充（阴影色偏棕），蓝图态若只降不透明度，
     塔基那一圈会留下一片棕灰斑，被读成「填充没剥干净」。改成空心青描边椭圆。 */
  body.bp .cast,body.bp .ao,body.bp .wave-ao{fill:none;stroke:#2f7ea6;stroke-width:.9;opacity:.5}
  body.bp .wave-ao{opacity:.26}

  /* ── 复合微交互 ────────────────────────────────────────── */
  /* 只给 transform 留过渡。不透明度是「聚焦态」的判据本身（其余件必须 ≤0.4），
     让它走过渡就是把判据交给合成器：无头渲染里过渡不一定推进，读数会停在 1，
     截出来的聚焦图完全没有压暗。悬停的外移照旧有缓动，状态切换改为瞬时。 */
  #L2 .part,#L3 .part,#L4 .part,#L5 .part{
    transition:transform .46s cubic-bezier(.22,.9,.24,1)}
  #L5,#L1{transition:transform .22s ease-out}
  #stage.hasfocus .part{opacity:.18}
  #stage.hasfocus #L6{opacity:.18}
  #stage.hasfocus .part.focused{opacity:1}
  #stage.hasfocus .part.focused .tower{filter:url(#fBloom)}
  #stage.hasfocus .part.focused .cliff{filter:url(#fBloom)}
  #stage.hasfocus .part.focused .island{filter:url(#fBloom)}
  #stage.hasfocus .part.focused .beam{filter:url(#fBloom)}
  #stage.nohit #L7 .hit{pointer-events:none!important}
  #L7 .hit{fill:transparent;stroke:none;pointer-events:all}
  #L7{cursor:pointer}

  /* ── 爆炸图的层带标识：只在爆炸态出现，随各自所在层一起位移 ── */
  #bandlab{display:none}
  body.explode #bandlab{display:block}
  .lb-guide{fill:none;stroke:#2e5468;stroke-width:1;stroke-dasharray:4 7;opacity:.8}
  .lb-plate{fill:rgba(6,14,22,.82);stroke:#2e5468;stroke-width:1}
  .lb-txt{font:11px ui-monospace,monospace;fill:#9fd0e6;letter-spacing:.06em}
  .lb-no{font:600 11px ui-monospace,monospace;fill:#04121c;text-anchor:middle}
  .lb-chip{fill:#8fc4dc}

  /* ── 演示外壳 ──────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;top:0;height:46px;display:flex;gap:6px;align-items:center;
       padding:0 16px;background:rgba(6,12,20,.90);border-bottom:1px solid #16323f;
       z-index:9;pointer-events:none}
  #bar button{pointer-events:auto;font:11px ui-monospace,monospace;color:#7ea6bc;
       background:rgba(10,22,34,.74);border:1px solid #2e5468;border-radius:4px;
       padding:4px 11px;cursor:pointer}
  #bar button.on{color:#04121c;background:#8fc4dc;border-color:#8fc4dc}
  #bar .sp{flex:1}
  #ttl{font:600 15px/1 ui-monospace,monospace;color:#e8f0f4;letter-spacing:.30em}
  #ttl small{display:block;font-size:10px;color:#547e92;letter-spacing:.20em;margin-top:5px}
  #read{font:11px ui-monospace,monospace;color:#5f7e8e;margin-right:8px}
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1536 864" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" role="img" aria-label="潮汐灯塔：五层 Z 序矢量插画">
    <defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#04070d"/><stop offset="34%" stop-color="#081524"/><stop offset="66%" stop-color="#12293e"/><stop offset="86%" stop-color="#16394c"/><stop offset="100%" stop-color="#1f4a5c"/></linearGradient>
<linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fa8be" stop-opacity="0.3"/><stop offset="52%" stop-color="#4a7186" stop-opacity="0.16"/><stop offset="100%" stop-color="#1a3244" stop-opacity="0"/></linearGradient>
<linearGradient id="gMist" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fa4b6" stop-opacity="0"/><stop offset="46%" stop-color="#5f8496" stop-opacity="0.3"/><stop offset="100%" stop-color="#7fa4b6" stop-opacity="0"/></linearGradient>
<linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1b4256"/><stop offset="16%" stop-color="#112c3d"/><stop offset="48%" stop-color="#081827"/><stop offset="100%" stop-color="#03070d"/></linearGradient>
<linearGradient id="gFarRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a4658" stop-opacity="0.9"/><stop offset="100%" stop-color="#101f2c" stop-opacity="0.96"/></linearGradient>
<linearGradient id="gWave" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f6178" stop-opacity="0.4"/><stop offset="36%" stop-color="#1a3f54" stop-opacity="0.36"/><stop offset="78%" stop-color="#0b1f2e" stop-opacity="0.3"/><stop offset="100%" stop-color="#050e17" stop-opacity="0.26"/></linearGradient>
<linearGradient id="gFoam" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d3e6ee" stop-opacity="0.74"/><stop offset="38%" stop-color="#8fb2c0" stop-opacity="0.44"/><stop offset="100%" stop-color="#3f6478" stop-opacity="0"/></linearGradient>
<linearGradient id="gCrest" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f2fafd" stop-opacity="0"/><stop offset="42%" stop-color="#bfdae6" stop-opacity="0.58"/><stop offset="100%" stop-color="#7fa4b6" stop-opacity="0"/></linearGradient>
<linearGradient id="gTower" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e0d6c2"/><stop offset="16%" stop-color="#b9b4a4"/><stop offset="42%" stop-color="#8b9198"/><stop offset="70%" stop-color="#4e5b66"/><stop offset="100%" stop-color="#1c2731"/></linearGradient>
<linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c2503a"/><stop offset="24%" stop-color="#9c3520"/><stop offset="64%" stop-color="#601d12"/><stop offset="100%" stop-color="#2c0d07"/></linearGradient>
<linearGradient id="gPlinth" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#736e60" stop-opacity="0.88"/><stop offset="52%" stop-color="#434a51" stop-opacity="0.88"/><stop offset="100%" stop-color="#1e242a" stop-opacity="0.88"/></linearGradient>
<linearGradient id="gDeck" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#9aa2a4" stop-opacity="0.96"/><stop offset="60%" stop-color="#4c565e" stop-opacity="0.96"/><stop offset="100%" stop-color="#232c33" stop-opacity="0.96"/></linearGradient>

<div id="bar">
  <span id="ttl">TIDAL · LH<small>潮汐灯塔 · 矢量插画</small></span>
  <span class="sp"></span>
  <span id="read">—</span>
  <button data-v="overall" class="on">整体</button>
  <button data-v="warm">配色</button>
  <button data-v="tower">塔身</button>
  <button data-v="cliff">崖岸</button>
  <button data-v="bp">线稿</button>
  <button data-v="explode">爆炸图</button>
  <button data-v="annot">标注</button>
</div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var wrap  = document.getElementById('wrap');
  var body  = document.body;
  var FULL  = '0 0 1536 864';
  /* 两处特写都按主体的实际包围盒取景：塔桥段在 x≈617..803，
     原来的窗口把塔挤在左三分之一；岬角窗则要留出左下角，
     否则 HUD 读数会被窗口边缘拦腰截断。 */
  var TOWER = '311 30 800 450';
  var CLIFF = '0 414 800 450';
  /* 沿透视法线的屏幕方向：+1 = 推向观察者（右下），-1 = 退向纵深（左上） */
  var NX = 0.976, NY = 0.216;
  /* 每层的位移量：负值 = 退向纵深，正值 = 推向观察者。跨度必须足够大，
     否则五层叠在一起看不出分层；内胆层为负、外壳层为正，两者反向拉开。 */
  var EXPL = {1:-330, 2:-190, 3:-50, 4:95, 5:255};
  var parts = [].slice.call(document.querySelectorAll('.part'));
  var hits  = [].slice.call(document.querySelectorAll('#L7 .hit'));
  var view  = 'overall';

  function tf(depth){
    return 'translate(' + (NX * depth).toFixed(1) + ',' + (NY * depth).toFixed(1) + ')';
  }
  /* ── 爆炸图：五层沿透视法线分层位移 ───────────────────── */
  /* 位移与视差各自独立累加：L1/L5 同时受两者驱动，互不覆盖 */
  var expl = false;
  function layerTf(L){
    var dx = 0, dy = 0, e = EXPL[L];
    if (expl && e){ dx += NX * e; dy += NY * e; }
    if (L === 5){ dx += -px * 9; dy += -py * 6; }
    if (L === 1){ dx +=  px * 4; dy +=  py * 3; }
    return 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')';
  }
  function explode(on){
    expl = on;
    for (var L = 1; L <= 5; L++){
      var g = document.getElementById('L' + L);
      if (g) g.setAttribute('transform', layerTf(L));
    }
    /* 层带标识跟着自己那一层走：牌子停在原位、层却移开了，就失去指认作用 */
    [].forEach.call(document.querySelectorAll('#bandlab > g'), function(e){
      e.setAttribute('transform', on ? layerTf(+e.getAttribute('data-l')) : '');
    });
  }
  /* ── 视图切换 ─────────────────────────────────────────── */
  function apply(v){
    view = v;
    body.classList.toggle('theme-b', v === 'warm');
    body.classList.toggle('bp',      v === 'bp');
    body.classList.toggle('annot',   v === 'annot');
    body.classList.toggle('explode', v === 'explode');
    stage.classList.toggle('hasfocus', v === 'focus');
    if (v !== 'focus') parts.forEach(function(p){ p.classList.remove('focused'); });
    explode(v === 'explode');
    stage.setAttribute('viewBox', v === 'tower' ? TOWER : (v === 'cliff' ? CLIFF : FULL));
    [].forEach.call(document.querySelectorAll('#bar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
    read();
  }
  [].forEach.call(document.querySelectorAll('#bar button'), function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-v')); });
  });
  window.addEventListener('keydown', function(e){
    var k = {Digit1:'overall',Digit2:'warm',Digit3:'tower',Digit4:'cliff',
             Digit5:'bp',Digit6:'explode',Digit7:'annot'}[e.code];
    if (k) apply(k);
  });

  /* ── 微交互 1：悬停外层壳体沿透视法线外移（微爆炸展开） ── */
  function same(p, i){
    return p.getAttribute('data-i') === i && p.getAttribute('data-hero') === '1';
  }
  function shellOf(i){
    return parts.filter(function(p){ return same(p, i) &&
             p.getAttribute('data-layer') === 'L4'; });
  }
  hits.forEach(function(h){
    var i = h.getAttribute('data-i');
    h.addEventListener('mouseenter', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', tf(18)); });
    });
    h.addEventListener('mouseleave', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', 'translate(0,0)'); });
    });
    /* ── 微交互 3：点击聚焦，其余部件透明度下降 ── */
    h.addEventListener('click', function(){
      var on = stage.classList.toggle('hasfocus');
      parts.forEach(function(p){
        p.classList.toggle('focused', on && same(p, i));
      });
      read();
    });
  });

  /* ── 微交互 2：视差光斑——高光层与背景层反向微幅位移 ──── */
  var px = 0, py = 0, tx = 0, ty = 0, lw = -1, lh = -1;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth  - .5) * 2;
    ty = (e.clientY / window.innerHeight - .5) * 2;
  });
  var gL5 = document.getElementById('L5'), gL1 = document.getElementById('L1');
  function tick(){
    refit();
    px += (tx - px) * .09; py += (ty - py) * .09;
    gL5.setAttribute('transform', layerTf(5));
    gL1.setAttribute('transform', layerTf(1));
  }
  window.LH_TICK = tick;
  setInterval(tick, 16);

  /* ── 微交互 4：无损等比全视口居中适配 ─────────────────── */
  function fit(){
    var a = 1536 / 864;
    /* wrap 已经被顶部视图栏压到 top:46px，这里不能再减一次，
       否则画布会被推到栏底下，切图时按钮正压住塔尖。 */
    var W = wrap.clientWidth  || window.innerWidth;
    var H = wrap.clientHeight || (window.innerHeight - 46);
    if (H < 60) H = 60;
    var w = W, h = W / a;
    if (h > H) { h = H; w = H * a; }
    stage.style.setProperty('width',  w.toFixed(2) + 'px', 'important');
    stage.style.setProperty('height', h.toFixed(2) + 'px', 'important');
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();
  function refit(){
    if (!wrap) return;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    if (cw !== lw || ch !== lh){ lw = cw; lh = ch; fit(); read(); }
  }

  function read(){
    var n = document.querySelectorAll('#stage path').length;
    document.getElementById('read').textContent =
      'view=' + view + '  path=' + n + '  layers=' +
      document.querySelectorAll('#stage [data-layer]').length +
      '  viewBox=' + stage.getAttribute('viewBox');
  }
  read();
  window.LH = { apply: apply, fit: fit, tick: tick, stage: stage,
    pathCount: function(){ return document.querySelectorAll('#stage path').length; } };
})();
</script>
