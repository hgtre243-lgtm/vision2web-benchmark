        <div><dt><i style="--c:var(--marine)"></i>海蓝</dt><dd>#2B4A72 · 天空中段 · 远礁 · 岩纹</dd></div>
        <div><dt><i style="--c:var(--ember)"></i>霞橙</dt><dd>#E8975A · 地平线霞光 · 崖顶受光边 · 屋顶受光</dd></div>
        <div><dt><i style="--c:var(--moonlight)"></i>月光</dt><dd>#FFD98A · 月 · 灯室 · 光束 · 窗</dd></div>
        <div><dt><i style="--c:var(--foam)"></i>浪白</dt><dd>#F2ECE0 · 塔身 · 星 · 浪花</dd></div>
        <div><dt><i style="--c:var(--brick)"></i>砖红</dt><dd>#C0463C · 塔身条纹 · 屋顶</dd></div>
        <div><dt><i style="--c:var(--ink)"></i>墨黑</dt><dd>#0C1620 · 松林 · 飞鸟 · 前景剪影</dd></div>

    <div id="tip"></div>
  </figure>
</main>
<script>
(function(){
  var S={view:'all',palette:'dusk',zoom:'wide',layer:'none',hover:null};
  var CAM={wide:[0,0,1],tower:[-2994,-348,3],cliff:[-1532,-768,2]};
  var VIEWS={all:['dusk','wide','none'],dawn:['dawn','wide','none'],
             tower:['dusk','tower','none'],cliff:['dusk','cliff','none'],
             blueprint:['dusk','wide','bp'],annot:['dusk','wide','annot']};
  var scene=document.getElementById('scene'),cam=document.getElementById('cam');
  var tip=document.getElementById('tip');
  var tabs=[].slice.call(document.querySelectorAll('#tabs button'));
  var parts=[].slice.call(cam.querySelectorAll('[data-part]'));
  function apply(){
    var c=CAM[S.zoom]||CAM.wide;
    cam.setAttribute('transform','translate('+c[0]+' '+c[1]+') scale('+c[2]+')');
    document.body.className=S.palette==='dawn'?'dawn':'';
    scene.setAttribute('class',S.layer==='bp'?'bp':(S.layer==='annot'?'annot':''));
    for(var i=0;i<parts.length;i++)
      parts[i].classList.toggle('hl',parts[i].getAttribute('data-part')===S.hover);
    if(S.hover){tip.textContent=S.hover;tip.classList.add('on');}else{tip.classList.remove('on');}
    for(var j=0;j<tabs.length;j++)
      tabs[j].classList.toggle('on',tabs[j].getAttribute('data-view')===S.view);
  }
  function setView(v){ if(!VIEWS[v])return; S.view=v; S.palette=VIEWS[v][0];
    S.zoom=VIEWS[v][1]; S.layer=VIEWS[v][2]; apply(); }
  window.BEACON={
    setView:setView,
    set:function(o){ o=o||{}; if(o.view){return setView(o.view);}
      if('palette' in o)S.palette=o.palette; if('zoom' in o)S.zoom=o.zoom;
      if('layer' in o)S.layer=o.layer; if('hover' in o)S.hover=o.hover; apply(); },
    info:function(){ return {view:S.view,palette:S.palette,zoom:S.zoom,layer:S.layer,
      hover:S.hover,parts:parts.length,cam:CAM[S.zoom]||CAM.wide,
      markers:document.querySelectorAll('#annotMarks circle').length,
      swatches:document.querySelectorAll('#inks i').length}; }
  };
  for(var a=0;a<tabs.length;a++)(function(b){
    b.addEventListener('click',function(){setView(b.getAttribute('data-view'));});
  })(tabs[a]);
  for(var k=0;k<parts.length;k++)(function(g){
    g.addEventListener('mouseenter',function(){S.hover=g.getAttribute('data-part');apply();});
    g.addEventListener('mouseleave',function(){
      if(S.hover===g.getAttribute('data-part')){S.hover=null;apply();}});
  })(parts[k]);
  apply();
})();
</script>
</body>
</html>
