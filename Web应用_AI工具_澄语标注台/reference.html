    if (nm.indexOf('前往') === 0) { goRail(nm.indexOf('波形') > 0 ? 'wave' : nm.indexOf('标签') > 0 ? 'tag'
      : nm.indexOf('质检') > 0 ? 'diff' : nm.indexOf('结算') > 0 ? 'settle' : 'tasks'); return; }
    if (nm.indexOf('重叠校验') === 0) { render(); doCheck(); return; }
    if (nm.indexOf('提交质检') === 0) { render(); doCommit(); return; }
    if (nm.indexOf('导出') === 0) { S.modal = 'export'; render(); return; }

  }
  if ((el = hit(e, '[data-toggle]'))) {
    var k = el.getAttribute('data-toggle');

  if ((el = hit(e, '[data-act]'))){
    var a = el.getAttribute('data-act');
    if (a === 'play'){ S.playing = !S.playing; setSt('SEGMENT_HOVER'); render(); return; }
    if (a === 'stop'){ S.playT = S.sel.a; S.playing = false; render(); return; }
    if (a === 'zin'){ zoomBy(1.4); return; }
    if (a === 'zout'){ zoomBy(1 / 1.4); return; }
    if (a === 'split'){ doSplit(); return; }

    if (a === 'commit'){ doCommit(); return; }
    if (a === 'save'){ doSave(); return; }
    if (a === 'code'){ S.modal = 'code'; render(); return; }
    if (a === 'codeok'){ doCodeOk(); return; }
    if (a === 'pullback'){ doPullback(); return; }
    if (a === 'export'){ S.modal = 'export'; render(); return; }
    if (a === 'doexport'){ S.modal = ''; toast('ok', '导出完成', 'B-0718-export.zip · 71.8 KB · ' + S.fmt.length + ' 种格式'); return; }
    if (a === 'shake'){

      }

      toast('warn', '已向冲突片段注入抖动', '受影响：段 #3、段 #5');
      return;
    }
    if (a === 'autofix'){ S.seg = 's5'; var s5 = segById('s5'); S.sel = { a: s5.a, b: s5.b }; S.cursor = 16040; render(); return; }
    if (a === 'revert'){
      S.reason = ''; S.codeOk = false; S.code = '';
      setSt('SEGMENT_HOVER'); toast('warn', '已撤销本次修改', '置信度与音素层回到预标注状态'); return;
    }
    if (a === 'selall'){ S.sel = { a: 0, b: AUDIO.dur }; render(); return; }
    if (a === 'reason'){ return; }
    if (a === 'import'){ S.drawer = 'import'; render(); return; }
    if (a === 'refresh'){ render(); toast('ok', '队列已刷新', '1 个活动解析 · 4 个排队'); return; }
    if (a === 'phonall'){ toast('ok', '已展开全部 12 个音素', '段 #3 · PH-03'); return; }
    if (a === 'audit'){ S.drawer = 'audit'; render(); return; }
    if (a === 'pin'){ toast('ok', '属性面板已固定', '切换相位时保持展开'); return; }
    if (a === 'drawerok'){ S.drawer = ''; render(); toast('ok', '设置已保存', '规则集 v3.2'); return; }
    return;
  }
  /* 点击空白关闭模态 / 关闭快捷轮盘 */
  if (e.target && e.target.classList && e.target.classList.contains('mask')) { S.modal = ''; render(); }
  else if (S.radial) { S.radial = false; render(); }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if (!t || !t.getAttribute) return;
  if (t.id === 'f-code'){
    var need = codeOf(PHONS[5]);
    var raw = String(t.value).replace(/[^0-9]/g, '').slice(0, 4);
    if (t.value !== raw) t.value = raw;
    S.code = raw;
    var bad = raw.length === 4 && raw !== need;
    if (bad) S.codeOk = false;
    t.className = 'codeinput' + (bad ? ' err' : (S.codeOk ? ' ok' : ''));
    t.setAttribute('aria-invalid', bad ? 'true' : 'false');
    var hc = t.parentElement.querySelector('.fhint');
    if (hc){
      hc.className = 'fhint ' + (bad ? 'bad' : (S.codeOk ? 'good' : ''));
      hc.innerHTML = ic(bad ? 'i-alert' : (S.codeOk ? 'i-check' : 'i-ruler')) +
        (bad ? '校验码不匹配，请核对音素起始毫秒'
             : S.codeOk ? '校验码通过 · 音素 ' + PHONS[5].sym + ' ' + PHONS[5].dur + ' ms 已放行'
                        : '校验码 = 该音素起始毫秒的后四位（起始 ' + PHONS[5].a + ' ms）');
    }
    return;
  }
  if (t.id === 'f-reason'){
    S.reason = t.value;
    var h = t.parentElement.querySelector('.fhint');
    if (h){
      var okLen = S.reason.length >= 10;
      h.className = 'fhint ' + (okLen ? 'good' : 'bad');
      h.innerHTML = ic(okLen ? 'i-check' : 'i-alert') +
        (okLen ? '已满足原因长度要求' : '还差 ' + (10 - S.reason.length) + ' 个字符');
    }
    return;
  }
  if (t.getAttribute('data-act') === 'zoomset'){
    S.zoom = +t.value;
    var zv = t.parentElement.querySelector('.zval');
    if (zv) zv.textContent = S.zoom + ' px/s';
    t.style.setProperty('--z', Math.round((S.zoom - 8) / 392 * 100) + '%');
    redrawOnly(); return;
  }
  if (t.getAttribute('data-act') === 'thresh'){
    S.confTh = (+t.value) / 100;
    render(); return;
  }
  if (t.id === 'f-s5b'){
    var v = parseInt(t.value, 10);
    if (!isNaN(v)){ S.s5b = v; S.ovErr = overlaps().length > 0; redrawOnly(); }
    return;
  }
});

/* ── 手势 ②：空格播放/暂停（瞬态切换） ── */
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) || '';
  var typing = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === ' ' && !typing){
    e.preventDefault(); S.playing = !S.playing; render(); return;
  }
  if (e.key === 'Escape'){
    if (S.modal) { S.modal = ''; render(); return; }
    if (S.cmdk) { S.cmdk = false; render(); return; }
    if (S.drawer) { S.drawer = ''; render(); return; }
    if (S.radial) { S.radial = false; render(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); S.cmdk = true; render(); syncFocus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); doCommit(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'e' || e.key === 'E')){ e.preventDefault(); S.modal = 'export'; render(); return; }
  if (typing) return;
  if (e.key === '1' || e.key === '2' || e.key === '3'){
    goRail(['tasks','wave','tag'][+e.key - 1]); return;
  }
  if (e.key === '4'){ goRail('diff'); return; }
  if (e.key === '6'){ goRail('settle'); return; }
  if (e.key === 'n' || e.key === 'N'){ S.cursor = clamp(S.cursor + 500, 0, AUDIO.dur); render(); return; }
  if (e.key === 'p' || e.key === 'P'){ S.cursor = clamp(S.cursor - 500, 0, AUDIO.dur); render(); return; }
  if (e.key === 'f' || e.key === 'F'){
    S.zoom = S.zoom >= 200 ? 26 : Math.min(400, S.zoom * 2);
    toast('ok', '流速 / 缩放已切换', '时间轴 ' + S.zoom + ' px/s'); return;
  }
});

/* ── 手势 ③：Shift + 滚轮缩放时间轴 ── */
document.addEventListener('wheel', function(e){
  if (!e.shiftKey) return;
  e.preventDefault();
  S.zoom = clamp(Math.round(S.zoom * (e.deltaY > 0 ? 0.86 : 1.16)), 8, 400);
  render();
}, { passive: false });

/* ── 手势 ①：拖拽框选（drag-to-select） ── */
document.addEventListener('mousedown', function(e){
  var box = hit(e, '.cvtracks .cvbox');
  if (!box || e.altKey) return;
  drag.on = true; drag.moved = false; drag.a = tOf(e.clientX - box.getBoundingClientRect().left);
  S.hover = true; S.hoverT = drag.a;
  e.preventDefault();
});
document.addEventListener('mousemove', function(e){
  var box = hit(e, '.cvtracks .cvbox');
  if (!box && !drag.on) return;
  if (box){
    var t = clamp(tOf(e.clientX - box.getBoundingClientRect().left), 0, AUDIO.dur);
    S.hoverT = t; if (drag.on) S.cursor = t;
  }
  if (drag.on && box){
    var tb = clamp(tOf(e.clientX - box.getBoundingClientRect().left), 0, AUDIO.dur);
    if (Math.abs(tb - drag.a) > 8) drag.moved = true;
    S.sel = { a: Math.min(drag.a, tb), b: Math.max(drag.a, tb) };
    S.hover = true;
    setSt('SEGMENT_HOVER');
    redrawOnly(); paintOverlays(); positionTip();
    return;
  }
  if (S.phase === 2){ redrawOnly(); paintOverlays(); positionTip(); }
});
document.addEventListener('mouseup', function(){
  if (!drag.on) return;
  drag.on = false;
  /* 原地点击（未拖动）不整树重渲染：保持同一 Canvas 节点，使后续 dblclick 手势可命中 */
  if (!drag.moved){
    S.hover = false;
    var tp = document.getElementById('tip');
    if (tp) tp.classList.remove('show');
    redrawOnly(); paintOverlays();
    return;
  }
  var arr = segs();
  for (var i = 0; i < arr.length; i++){
    if (Math.abs(arr[i].a - S.sel.a) < 40 && Math.abs(arr[i].b - S.sel.b) < 40) S.seg = arr[i].id;
  }
  render();
  if (S.sel.b - S.sel.a > 0)
    toast('ok', '已捕获选区 ' + t3(S.sel.a) + ' – ' + t3(S.sel.b) + ' s', '时长 ' + tdur(S.sel.b - S.sel.a));
});
document.addEventListener('mouseleave', function(){
  if (drag.on) return;
  S.hover = false; render();
});

/* ── 手势 ④：Alt + 点击波形 = 在此切分 ── */
/* ── 手势 ⑤：双击 = 径向打标轮盘 ── */

      cursor: S.cursor, radial: S.radial, radialAt: S.radialAt,
      seg: S.seg, phon: S.phon, hover: S.hover, hoverT: S.hoverT,
      dur: AUDIO.dur, sr: AUDIO.sr, alloc: allocMs(), free: freeMs(),
      overlap: ov, gaps: gaps().length, segCount: arr.length,
      confTh: S.confTh, confOrig: segById('s3').conf,
      confAfter: +confAfter(segById('s3').conf).toFixed(3),
      needReason: needReason(), reasonLen: S.reason.length,
      code: S.code, codeOk: S.codeOk, codeNeed: codeOf(PHONS[5]),
      phonMin: PHON_MIN, phonBad: bad, phonCount: PHONS.length,
      staged: S.staged, stagedAt: S.stagedAt, stagedWritten: false,
      commitDisabled: ov !== 0,
      sec: +b.sec.toFixed(2), rate: +b.rate.toFixed(4), coef: +b.coef.toFixed(3),
      amount: +b.amount.toFixed(2), edits: b.edits,
      unitPrice: UNIT_PRICE, reworkW: REWORK_W,
      fmt: S.fmt.join(','), modal: S.modal, drawer: S.drawer, cmdk: S.cmdk,
      conflicts: CONFLICTS.length, radarAvg: +radarTotal().toFixed(1),
      s5b: S.s5b, toasts: S.toasts.length,
      svgIcons: document.querySelectorAll('#icons symbol').length,
      canvases: document.querySelectorAll('canvas').length
    };
  },
  go: function(n){ resetFor(n); render(); return S.phase; },
  action: function(a){
    var map = {
      play: function(){ S.playing = !S.playing; }, split: doSplit, merge: doMerge,
      check: doCheck, commit: doCommit, save: doSave, pullback: doPullback,
      codeok: doCodeOk, export: function(){ S.modal = 'export'; },
      doexport: function(){ S.modal = ''; }, zoomIn: function(){ zoomBy(1.4); },
      zoomOut: function(){ zoomBy(1 / 1.4); }
    };
    if (map[a]) { map[a](); render(); }
    return this.info();
  },
  billing: billing,
  overlaps: overlaps,
  confAfter: confAfter,
  t3: t3
};

/* ══════════════════════════════════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════════════════════════════════ */
resetFor(1);
render();
window.addEventListener('resize', function(){ redrawOnly(); positionTip(); });

</script>
