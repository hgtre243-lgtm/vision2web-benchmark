/* ══════════════════════════════════════════════════════════════════
   0. 设计令牌
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* 底面层级（越靠前越亮） */
  --bg0:#080c12;  --bg1:#0d131c;  --bg2:#131b26;  --bg3:#19222f;  --bg4:#212c3c;
  --bg5:#2a374a;  --bg-glass:rgba(13,19,28,.86);
  /* 描边 */
  --line:#22303f;  --line2:#19232e;  --line3:#2d3d52;  --line-hot:#3a5069;
  --line-dash:#33455c;
  /* 文字 */
  --tx0:#e4eef9;  --tx1:#a6b7cb;  --tx2:#72859c;  --tx3:#4f6076;  --tx4:#3a4757;
  /* 语义色 */
  --cy:#2dd4bf;  --cy-d:#12a594;  --cy-k:#0b6b62;  --cyA:rgba(45,212,191,.13);
  --vi:#a78bfa;  --vi-d:#7c5cf5;  --viA:rgba(167,139,250,.13);
  --am:#f5a524;  --am-d:#c47f10;  --amA:rgba(245,165,36,.13);
  --ro:#fb5c72;  --ro-d:#dc3450;  --roA:rgba(251,92,114,.13);
  --em:#34d399;  --em-d:#149a6c;  --emA:rgba(52,211,153,.13);
  --bl:#60a5fa;  --bl-d:#2f74dc;  --blA:rgba(96,165,250,.13);
  --sl:#8fa3ba;  --slA:rgba(143,163,186,.10);
  /* 尺寸 */
  --w-nav:208px;  --w-draw:284px;  --w-qc:244px;
  --h-top:46px;   --h-bot:24px;    --h-tool:38px;
  --r1:3px; --r2:5px; --r3:8px; --r4:11px; --r5:16px; --rfull:999px;
  /* 字体 */
  --ff:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --fm:"JetBrains Mono","Cascadia Mono","Consolas",ui-monospace,monospace;
  /* 阴影 */
  --sh1:0 1px 2px rgba(0,0,0,.35);
  --sh2:0 4px 14px rgba(0,0,0,.42);
  --sh3:0 12px 34px rgba(0,0,0,.55);
  --sh4:0 20px 60px rgba(0,0,0,.68);
  --sh-cy:0 0 0 1px rgba(45,212,191,.42),0 0 18px rgba(45,212,191,.28);
  --sh-am:0 0 0 1px rgba(245,165,36,.45),0 0 18px rgba(245,165,36,.3);
  --sh-ro:0 0 0 1px rgba(251,92,114,.5),0 0 20px rgba(251,92,114,.35);
  /* 动效 */
  --e1:cubic-bezier(.32,.72,0,1);  --dur1:.14s;  --dur2:.24s;
}

/* ══════════════════════════════════════════════════════════════════
   1. 重置与外壳
   ══════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ff);background:var(--bg0);color:var(--tx0);
  font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:var(--cy);text-decoration:none}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
/* 图标基线尺寸：所有内联 SVG 图标默认 13px，由具体组件类放大 */
svg{width:13px;height:13px;flex:0 0 auto;display:block}
#icons{position:absolute;width:0;height:0;overflow:hidden;clip:rect(0 0 0 0)}
.radial{display:none}
.radial.show{display:block}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:var(--rfull);border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:var(--line-hot)}

/* 四栏 Dock 网格 */
.app{
  display:grid;height:100vh;width:100%;
  grid-template-columns:var(--w-nav) minmax(0,1fr) var(--w-draw) var(--w-qc);
  grid-template-rows:var(--h-top) minmax(0,1fr) var(--h-bot);
  background:var(--bg0);
}
.topbar{grid-column:1/-1;grid-row:1}
.statusbar{grid-column:1/-1;grid-row:3}
.navcol{grid-column:1;grid-row:2}
.maincol{grid-column:2;grid-row:2}
.drawcol{grid-column:3;grid-row:2}
.qccol{grid-column:4;grid-row:2}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ══════════════════════════════════════════════════════════════════
   2. 顶栏
   ══════════════════════════════════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));
  border-bottom:1px solid var(--line);box-shadow:var(--sh1);z-index:30;
}
.tb-brand{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid var(--line2)}
.tb-logo{
  width:26px;height:26px;border-radius:var(--r2);display:grid;place-items:center;
  background:linear-gradient(135deg,var(--cy-d),var(--vi-d));box-shadow:var(--sh-cy);flex:0 0 auto;
}
.tb-logo svg{width:16px;height:16px;stroke:#04120f;fill:none;stroke-width:2.1}
.tb-name{font-size:13px;font-weight:650;letter-spacing:.3px}
.tb-name em{font-style:normal;font-family:var(--fm);font-size:9px;color:var(--tx2);margin-left:5px;letter-spacing:.6px}
.tb-crumb{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:11.5px;min-width:0}
.tb-crumb b{color:var(--tx0);font-weight:600}
.tb-crumb .sep{color:var(--tx4)}
.tb-crumb .mono{color:var(--cy);background:var(--cyA);padding:1px 6px;border-radius:var(--r1);font-size:10px}
.tb-spacer{flex:1}
.tb-search{
  display:flex;align-items:center;gap:7px;width:212px;height:27px;padding:0 9px;
  background:var(--bg0);border:1px solid var(--line);border-radius:var(--r2);color:var(--tx2);
  transition:border-color var(--dur1) var(--e1),box-shadow var(--dur1) var(--e1);
}
.tb-search:focus-within{border-color:var(--cy-k);box-shadow:0 0 0 2px var(--cyA)}
.tb-search svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.tb-search input{flex:1;background:none;border:0;outline:0;color:var(--tx0);font-size:11.5px}
.tb-search input::placeholder{color:var(--tx3)}
.tb-search kbd{
  font-family:var(--fm);font-size:9.5px;color:var(--tx2);background:var(--bg3);
  border:1px solid var(--line);border-radius:var(--r1);padding:1px 4px;
}
.tb-ico{
  position:relative;width:28px;height:28px;border-radius:var(--r2);display:grid;place-items:center;
  color:var(--tx1);transition:background var(--dur1) var(--dur1) var(--e1),color var(--dur1);
}
.tb-ico:hover{background:var(--bg3);color:var(--tx0)}
.tb-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.tb-ico .dot{
  position:absolute;top:4px;right:4px;min-width:13px;height:13px;padding:0 3px;border-radius:var(--rfull);
  background:var(--ro);color:#fff;font-size:8.5px;font-weight:700;display:grid;place-items:center;
  border:1.5px solid var(--bg1);
}
.tb-user{display:flex;align-items:center;gap:7px;padding:3px 8px 3px 3px;border-radius:var(--rfull);background:var(--bg3)}
.tb-av{
  width:22px;height:22px;border-radius:var(--rfull);display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--cy),var(--bl));color:#061014;font-size:10px;font-weight:750;
}
.tb-user span{font-size:11px;color:var(--tx1)}
.tb-user .rl{font-size:9px;color:var(--tx3);font-family:var(--fm)}

/* ══════════════════════════════════════════════════════════════════
   3. 状态栏
   ══════════════════════════════════════════════════════════════════ */
.statusbar{
  display:flex;align-items:center;gap:0;padding:0 10px;font-size:10.5px;
  background:linear-gradient(180deg,var(--bg1),var(--bg0));border-top:1px solid var(--line);
  color:var(--tx2);z-index:30;
}
.sb-i{display:flex;align-items:center;gap:5px;padding:0 9px;height:100%;white-space:nowrap}
.sb-i svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.1}
.sb-i.b{border-left:1px solid var(--line2)}
.sb-i .k{color:var(--tx3)}
.sb-i .v{color:var(--tx1);font-family:var(--fm)}
.sb-state{
  display:flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--rfull);
  background:var(--bg3);border:1px solid var(--line3);font-family:var(--fm);font-size:10px;
  letter-spacing:.3px;color:var(--cy);
}
.sb-state .pulse{width:6px;height:6px;border-radius:var(--rfull);background:currentColor;box-shadow:0 0 8px currentColor}
.sb-ok{color:var(--em)}   .sb-bad{color:var(--ro)}   .sb-warn{color:var(--am)}
.sb-spacer{flex:1}

/* 按状态机着色 */
body[data-st="IDLE"] .sb-state{color:var(--sl);border-color:var(--line)}
body[data-st="AUDIO_DECODING"] .sb-state{color:var(--bl);border-color:var(--bl-d);background:var(--blA)}
body[data-st="SEGMENT_HOVER"] .sb-state{color:var(--cy);border-color:var(--cy-k);background:var(--cyA)}
body[data-st="ACTIVE_EDITING"] .sb-state{color:var(--vi);border-color:var(--vi-d);background:var(--viA)}
body[data-st="CONFLICT_FLAGGED"] .sb-state{color:var(--am);border-color:var(--am-d);background:var(--amA)}
body[data-st="VALIDATION_FAILED"] .sb-state{color:var(--ro);border-color:var(--ro-d);background:var(--roA)}
body[data-st="PENDING_AUDIT"] .sb-state{color:var(--bl);border-color:var(--bl-d);background:var(--blA)}
body[data-st="ARCHIVED_COMMITTED"] .sb-state{color:var(--em);border-color:var(--em-d);background:var(--emA)}

/* ══════════════════════════════════════════════════════════════════
   4. 栏1 · 全局项目/批次导航
   ══════════════════════════════════════════════════════════════════ */
.navcol{background:var(--bg1);border-right:1px solid var(--line);position:relative}
.nav-rail{
  display:flex;flex-direction:column;align-items:center;gap:2px;width:44px;padding:8px 0;
  background:var(--bg0);border-right:1px solid var(--line2);flex:0 0 auto;
}
.nav-rail .rb{
  width:32px;height:32px;border-radius:var(--r2);display:grid;place-items:center;color:var(--tx2);
  position:relative;transition:color var(--dur1) var(--e1),background var(--dur1) var(--e1);
}
.nav-rail .rb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.85}
.nav-rail .rb:hover{background:var(--bg3);color:var(--tx0)}
.nav-rail .rb.on{background:var(--cyA);color:var(--cy)}
.nav-rail .rb.on::before{
  content:'';position:absolute;left:-6px;top:6px;bottom:6px;width:2.5px;border-radius:var(--rfull);
  background:var(--cy);box-shadow:0 0 9px var(--cy);
}
.nav-rail .rb .rbadge{
  position:absolute;top:2px;right:2px;min-width:12px;height:12px;padding:0 3px;border-radius:var(--rfull);
  background:var(--am);color:#160f02;font-size:8px;font-weight:800;display:grid;place-items:center;
}
.nav-rail .rsp{flex:1}

.nav-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.proj{padding:9px 10px;border-bottom:1px solid var(--line2)}
.proj-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:var(--r2);
  background:var(--bg2);border:1px solid var(--line);text-align:left;
  transition:border-color var(--dur1) var(--e1),background var(--dur1) var(--e1);
}
.proj-btn:hover{border-color:var(--line-hot);background:var(--bg3)}
.proj-av{
  width:24px;height:24px;border-radius:var(--r2);display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--vi-d),var(--bl-d));font-size:11px;font-weight:700;color:#fff;
}
.proj-tx{flex:1;min-width:0}
.proj-tx b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-tx span{display:block;font-size:9.5px;color:var(--tx3);font-family:var(--fm)}
.proj-btn>svg{width:13px;height:13px;stroke:var(--tx2);fill:none;stroke-width:2.2;flex:0 0 auto}

.navsec{border-bottom:1px solid var(--line2);display:flex;flex-direction:column;min-height:0}
.navsec.grow{flex:1}
.navsec-hd{
  display:flex;align-items:center;gap:6px;padding:8px 10px 6px;font-size:9.5px;font-weight:700;
  letter-spacing:1.1px;color:var(--tx3);text-transform:uppercase;
}
.navsec-hd svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.navsec-hd .cnt{
  margin-left:auto;font-family:var(--fm);font-size:9px;color:var(--tx2);
  background:var(--bg3);padding:0 5px;border-radius:var(--rfull);letter-spacing:0;
}
.navsec-bd{overflow-y:auto;padding:0 6px 8px;min-height:0}
.navsec-bd.flat{overflow:visible;padding:0}

.bitem{
  display:block;width:100%;padding:7px 8px;border-radius:var(--r2);text-align:left;margin-bottom:2px;
  border:1px solid transparent;transition:background var(--dur1) var(--e1),border-color var(--dur1) var(--e1);
}
.bitem:hover{background:var(--bg2)}
.bitem.on{background:var(--bg3);border-color:var(--line3)}
.bitem.on::before{
  content:'';position:absolute;margin-left:-8px;margin-top:3px;width:2.5px;height:14px;border-radius:var(--rfull);
  background:var(--cy);box-shadow:0 0 8px var(--cy);
}
.brow{display:flex;align-items:center;gap:6px}
.brow b{font-size:11.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .st{font-size:9px;font-family:var(--fm);padding:1px 5px;border-radius:var(--r1);flex:0 0 auto}
.st-run{background:var(--blA);color:var(--bl)}   .st-done{background:var(--emA);color:var(--em)}
.st-hold{background:var(--slA);color:var(--sl)}  .st-warn{background:var(--amA);color:var(--am)}
.bmeta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:9.5px;color:var(--tx3);font-family:var(--fm)}
.btrack{height:3px;border-radius:var(--rfull);background:var(--bg4);overflow:hidden;margin-top:5px}
.bfill{height:100%;border-radius:var(--rfull);background:linear-gradient(90deg,var(--cy-d),var(--cy));transition:width var(--dur2) var(--e1)}
.bfill.bl{background:linear-gradient(90deg,var(--bl-d),var(--bl))}
.bfill.am{background:linear-gradient(90deg,var(--am-d),var(--am))}

.titem{
  display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:var(--r2);
  text-align:left;transition:background var(--dur1) var(--e1);
}
.titem:hover{background:var(--bg2)}
.titem.on{background:var(--cyA)}
.titem .ti-ico{width:14px;height:14px;flex:0 0 auto;stroke:var(--tx2);fill:none;stroke-width:2}
.titem.on .ti-ico{stroke:var(--cy)}
.titem .ti-tx{flex:1;min-width:0}
.titem .ti-tx b{display:block;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .ti-tx span{display:block;font-size:9.5px;color:var(--tx3);font-family:var(--fm)}
.titem .ti-n{font-size:9px;font-family:var(--fm);color:var(--tx3);flex:0 0 auto}

.navfoot{border-top:1px solid var(--line2);padding:7px 9px;display:flex;align-items:center;gap:7px}
.nf-av{
  width:22px;height:22px;border-radius:var(--rfull);display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,var(--am),var(--ro));color:#180a04;font-size:10px;font-weight:750;
}
.nf-tx{flex:1;min-width:0}
.nf-tx b{display:block;font-size:11px;font-weight:600}
.nf-tx span{display:block;font-size:9px;color:var(--tx3)}

/* ══════════════════════════════════════════════════════════════════
   5. 栏2 · 主视窗（波形 + 上下文面板）
   ══════════════════════════════════════════════════════════════════ */
.maincol{background:var(--bg1);position:relative}
.wtool{
  display:flex;align-items:center;flex-wrap:wrap;gap:3px;padding:5px 9px;min-height:var(--h-tool);
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.wbtn{
  display:inline-flex;align-items:center;gap:4px;height:25px;padding:0 6px;border-radius:var(--r2);
  color:var(--tx1);border:1px solid transparent;white-space:nowrap;
  transition:background var(--dur1) var(--e1),color var(--dur1) var(--e1),border-color var(--dur1) var(--e1);
}
.wbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.wbtn:hover{background:var(--bg4);color:var(--tx0)}
.wbtn.on{background:var(--cyA);color:var(--cy);border-color:var(--cy-k)}
.wbtn.pri{background:linear-gradient(180deg,var(--cy-d),var(--cy-k));color:#04120f;font-weight:650;border-color:var(--cy-d)}
.wbtn.pri svg{stroke-width:2.4}
.wbtn.danger{color:var(--ro)}
.wbtn.danger:hover{background:var(--roA)}
.wbtn[disabled]{opacity:.38;cursor:not-allowed;filter:grayscale(.5)}
.wbtn .lbl{font-size:11px}
.wsep{width:1px;height:18px;background:var(--line);margin:0}
.wspacer{flex:1;min-width:0}
.zoomwrap{display:flex;align-items:center;gap:6px;padding:0 7px;height:25px;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r2)}
.zoomwrap svg{width:12px;height:12px;stroke:var(--tx2);fill:none;stroke-width:2.2}
.zslider{
  -webkit-appearance:none;appearance:none;width:64px;height:3px;border-radius:var(--rfull);
  background:linear-gradient(90deg,var(--cy-d) var(--z,50%),var(--bg4) var(--z,50%));outline:0;
}
.zslider::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:var(--rfull);background:var(--cy);
  border:2px solid var(--bg1);box-shadow:0 0 8px rgba(45,212,191,.6);cursor:grab;
}
.zval{font-family:var(--fm);font-size:10px;color:var(--cy);min-width:44px;text-align:right}
.thumbwrap{display:flex;align-items:center;gap:5px;height:25px;padding:0 7px;background:var(--bg0);border:1px solid var(--line);border-radius:var(--r2)}
.thumbwrap span{font-size:10px;color:var(--tx2);font-family:var(--fm)}
.thslider{-webkit-appearance:none;appearance:none;width:58px;height:3px;border-radius:var(--rfull);background:var(--bg4);outline:0}
.thslider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:var(--rfull);background:var(--am);border:2px solid var(--bg1);cursor:grab}

/* ── 波形主检区 ── */
.cvwrap{flex:0 0 auto;display:flex;flex-direction:column;background:var(--bg0);border-bottom:1px solid var(--line);position:relative}
.cvruler{display:flex;height:22px;border-bottom:1px solid var(--line2);background:var(--bg1)}
.cv-gut{width:56px;flex:0 0 auto;border-right:1px solid var(--line2);background:var(--bg1)}
.track{display:flex;border-bottom:1px solid var(--line2);position:relative}
.tlabel{
  width:56px;flex:0 0 auto;border-right:1px solid var(--line2);background:var(--bg1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;
}
.tlabel svg{width:13px;height:13px;stroke:var(--tx2);fill:none;stroke-width:2}
.tlabel b{font-size:9px;font-family:var(--fm);color:var(--tx2);letter-spacing:.4px;writing-mode:horizontal-tb}
.tlabel .tg{font-size:8px;font-family:var(--fm);color:var(--tx4)}
.tlabel.a svg{stroke:var(--cy)}  .tlabel.a b{color:var(--cy)}
.tlabel.b svg{stroke:var(--vi)}  .tlabel.b b{color:var(--vi)}
.cvbox{flex:1;min-width:0;position:relative;overflow:hidden}
.cvbox canvas{display:block;width:100%;height:100%}
.cvtracks{position:relative;display:flex;flex-direction:column}
.track.t1{height:134px}
.track.t2{height:98px;border-bottom:0}
.ovl{position:absolute;left:56px;right:0;top:0;bottom:0;pointer-events:none;z-index:4}
/* 冲突区间带（相位 4）：红色脉冲 */
.cfband{
  position:absolute;top:0;bottom:0;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,rgba(251,92,114,.24),rgba(251,92,114,.10));
  border-left:1.5px solid var(--ro);border-right:1.5px solid var(--ro);
  animation:cfpulse 1.5s var(--e1) infinite;
}
/* 重叠错误带（相位 5）：斜纹 + 标签 */
.ovband{
  position:absolute;top:0;bottom:0;z-index:6;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(251,92,114,.55) 0 5px,rgba(251,92,114,.12) 5px 10px);
  border:1px solid var(--ro);box-shadow:0 0 16px rgba(251,92,114,.55);
  animation:cfpulse 1.1s var(--e1) infinite;
}
.ovband span{
  position:absolute;top:4px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--fm);font-size:8.5px;color:#fff;background:var(--ro-d);
  padding:1px 5px;border-radius:var(--r1);box-shadow:var(--sh1);
}
/* 暂存切分点（两阶段提交） */
.stagedmark{
  position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--am);
  box-shadow:0 0 12px var(--am);z-index:7;pointer-events:none;
}
.stagedmark::after{
  content:'Staged';position:absolute;top:-14px;left:-17px;
  font-family:var(--fm);font-size:8px;color:var(--am);background:var(--bg2);
  border:1px solid var(--am-d);border-radius:var(--r1);padding:0 3px;white-space:nowrap;
}
/* hover 十字线 + 时间气泡 */
.hxhair{position:absolute;top:0;bottom:0;width:1px;background:rgba(45,212,191,.72);z-index:5;pointer-events:none}
.hxhair i{
  position:absolute;top:3px;left:4px;font-style:normal;font-family:var(--fm);font-size:8.5px;
  color:var(--cy);background:rgba(8,12,18,.92);border:1px solid var(--cy-k);
  padding:0 4px;border-radius:var(--r1);white-space:nowrap;
}
/* 波形区底栏读数 */
.wfoot{
  display:flex;align-items:center;gap:13px;padding:5px 10px;background:var(--bg1);
  border-top:1px solid var(--line2);font-size:9.5px;color:var(--tx3);flex:0 0 auto;
}
.wfoot .wf-i{display:flex;align-items:center;gap:5px;font-family:var(--fm);white-space:nowrap}
.wfoot .wf-i svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.wfoot .wf-i b{color:var(--tx1);font-weight:600}
.wfoot .wf-i.am b{color:var(--am)}
.wfoot .wf-i.bad b{color:var(--ro)}
.wfoot .wf-i.good b{color:var(--em)}
.wfoot .wspacer{flex:1}
.ph{
  position:absolute;top:0;bottom:0;width:1px;background:var(--ro);
  box-shadow:0 0 8px rgba(251,92,114,.9);pointer-events:none;z-index:5;
}
.ph::before{
  content:'';position:absolute;top:-1px;left:-3.5px;width:8px;height:8px;
  background:var(--ro);clip-path:polygon(0 0,100% 0,50% 100%);
}
.selband{
  position:absolute;top:0;bottom:0;background:rgba(45,212,191,.12);
  border-left:1px solid var(--cy);border-right:1px solid var(--cy);pointer-events:none;z-index:2;
  box-shadow:inset 0 0 26px rgba(45,212,191,.24),0 0 16px rgba(45,212,191,.3);
}
.selband.staged{
  background:rgba(245,165,36,.13);border-color:var(--am);border-style:dashed;
  box-shadow:inset 0 0 26px rgba(245,165,36,.22);
}
.selband.conflict{
  background:rgba(251,92,114,.13);border-color:var(--ro);
  animation:cfpulse 1.5s var(--e1) infinite;
}
.cv-grid{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5}

/* 段落条 */
.segstrip{flex:0 0 auto;display:flex;height:40px;background:var(--bg1);border-bottom:1px solid var(--line);align-items:center}
.segstrip .sg-gut{
  width:56px;flex:0 0 auto;height:100%;border-right:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-family:var(--fm);color:var(--tx3);letter-spacing:.4px;
}
.segrow{flex:1;min-width:0;position:relative;height:26px;margin:0 10px}
.seg{
  position:absolute;top:0;height:26px;border-radius:var(--r1);overflow:hidden;
  border:1px solid var(--cy-k);background:linear-gradient(180deg,rgba(45,212,191,.28),rgba(18,165,148,.16));
  display:flex;align-items:center;padding:0 5px;transition:box-shadow var(--dur1) var(--e1);
}
.seg b{font-size:9px;font-family:var(--fm);color:var(--tx0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.spk-b{border-color:var(--vi-d);background:linear-gradient(180deg,rgba(167,139,250,.28),rgba(124,92,245,.16))}
.seg.low{border-color:var(--am-d);background:linear-gradient(180deg,rgba(245,165,36,.3),rgba(196,127,16,.18))}
.seg.conf{border-color:var(--ro-d);background:linear-gradient(180deg,rgba(251,92,114,.32),rgba(220,52,80,.2));animation:cfpulse 1.5s var(--e1) infinite}
.seg.sel{box-shadow:var(--sh-cy);z-index:3}
.seg.staged{border-style:dashed;opacity:.85}
.seg.ovl-mark::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(251,92,114,.5) 0 4px,transparent 4px 8px)}

/* ── 上下文面板（6 相位各自内容） ── */
.ctxpanel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg1)}
.cp-hd{
  display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.cp-hd h2{font-size:11.5px;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.cp-hd h2 svg{width:13px;height:13px;stroke:var(--cy);fill:none;stroke-width:2.1}
.cp-hd .sub{font-size:10px;color:var(--tx3);font-family:var(--fm)}
.cp-hd .rt{margin-left:auto;display:flex;align-items:center;gap:6px}
.cp-body{flex:1;min-height:0;overflow:auto;padding:9px 11px}

/* 数据表 */
.tb{width:100%;font-size:11px}
.tb thead th{
  text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.8px;color:var(--tx3);
  text-transform:uppercase;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tb tbody td{padding:6px 8px;border-bottom:1px solid var(--line2);color:var(--tx1);vertical-align:middle}
.tb tbody tr{transition:background var(--dur1) var(--e1)}
.tb tbody tr:hover{background:var(--bg2)}
.tb tbody tr.on{background:var(--cyA)}
.tb tbody tr.on td{color:var(--tx0)}
.tb .num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.tb .r{text-align:right}
.tb .c{text-align:center}
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:var(--r1);
  font-size:9.5px;font-family:var(--fm);letter-spacing:.2px;
}
.pill svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}
.p-cy{background:var(--cyA);color:var(--cy)}   .p-vi{background:var(--viA);color:var(--vi)}
.p-am{background:var(--amA);color:var(--am)}   .p-ro{background:var(--roA);color:var(--ro)}
.p-em{background:var(--emA);color:var(--em)}   .p-bl{background:var(--blA);color:var(--bl)}
.p-sl{background:var(--slA);color:var(--sl)}

/* 进度条（导入/解析） */
.prog{height:6px;border-radius:var(--rfull);background:var(--bg4);overflow:hidden;position:relative}
.prog i{display:block;height:100%;border-radius:var(--rfull);background:linear-gradient(90deg,var(--bl-d),var(--bl));
  box-shadow:0 0 10px rgba(96,165,250,.5);transition:width var(--dur2) var(--e1)}
.prog.cy i{background:linear-gradient(90deg,var(--cy-d),var(--cy));box-shadow:0 0 10px rgba(45,212,191,.5)}
.prog.am i{background:linear-gradient(90deg,var(--am-d),var(--am))}
.prog-stripe i{background-image:linear-gradient(115deg,rgba(255,255,255,.22) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.22) 75%,transparent 75%);
  background-size:14px 14px;animation:stripe .9s linear infinite}
.decodecard{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r3);
  background:linear-gradient(120deg,var(--bg2),var(--bg1));border:1px solid var(--line3);box-shadow:var(--sh2);
}
.decodecard .dc-ico{
  width:34px;height:34px;border-radius:var(--r2);display:grid;place-items:center;flex:0 0 auto;
  background:var(--blA);border:1px solid var(--bl-d);
}
.decodecard .dc-ico svg{width:17px;height:17px;stroke:var(--bl);fill:none;stroke-width:1.9}
.decodecard .dc-tx{flex:1;min-width:0}
.decodecard .dc-tx b{display:block;font-size:11.5px;font-weight:600;margin-bottom:3px}
.decodecard .dc-tx span{display:block;font-size:10px;color:var(--tx3);font-family:var(--fm);margin-bottom:6px}
.decodecard .dc-n{font-family:var(--fm);font-size:19px;font-weight:600;color:var(--bl);letter-spacing:-.5px}
.decodecard .dc-n small{font-size:10px;color:var(--tx3);margin-left:2px}

/* 统计小卡 */
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.stat{
  padding:8px 10px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--line);
  position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cy)}
.stat.vi::before{background:var(--vi)}  .stat.am::before{background:var(--am)}
.stat.ro::before{background:var(--ro)}  .stat.em::before{background:var(--em)}
.stat .k{font-size:9.5px;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.stat .v{font-family:var(--fm);font-size:17px;font-weight:600;color:var(--tx0);letter-spacing:-.4px;margin-top:2px}
.stat .v small{font-size:10px;color:var(--tx3);margin-left:2px;font-weight:400}
.stat .d{font-size:9.5px;color:var(--tx3);font-family:var(--fm);margin-top:1px}

/* ── Diff 双列对比 ── */
.difwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;height:100%;min-height:0}
.difcol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--bg2);min-height:0}
.difhd{
  display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--bg3);
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.difhd .av{
  width:22px;height:22px;border-radius:var(--rfull);display:grid;place-items:center;flex:0 0 auto;
  font-size:10px;font-weight:750;color:#05100c;
}
.difhd.a .av{background:linear-gradient(135deg,var(--cy),var(--em))}
.difhd.b .av{background:linear-gradient(135deg,var(--vi),var(--bl));color:#0c0618}
.difhd .nm{flex:1;min-width:0}
.difhd .nm b{display:block;font-size:11px;font-weight:600}
.difhd .nm span{display:block;font-size:9.5px;color:var(--tx3);font-family:var(--fm)}
.difbd{flex:1;min-height:0;overflow:auto;padding:6px}
.difrow{
  padding:6px 8px;border-radius:var(--r2);margin-bottom:4px;border:1px solid transparent;
  font-size:11px;line-height:1.55;transition:background var(--dur1) var(--e1);
}
.difrow .idx{font-family:var(--fm);font-size:9.5px;color:var(--tx3);margin-right:6px}
.difrow .spk{font-family:var(--fm);font-size:9.5px;color:var(--tx2);margin-right:6px;padding:0 4px;border-radius:var(--r1);background:var(--bg3)}
.difrow.same{color:var(--tx2)}
.difrow.diff{background:var(--roA);border-color:var(--ro-d)}
.difrow.diff .hl{background:rgba(251,92,114,.3);border-bottom:1px solid var(--ro);padding:0 2px;border-radius:2px}
.difrow.diff2{background:var(--amA);border-color:var(--am-d)}
.difrow.diff2 .hl{background:rgba(245,165,36,.28);border-bottom:1px solid var(--am);padding:0 2px;border-radius:2px}
.difrow .conf{margin-left:6px;font-family:var(--fm);font-size:9.5px;color:var(--tx3)}
.difrow .tag{float:right;font-family:var(--fm);font-size:9px;padding:0 5px;border-radius:var(--r1)}

/* ── 结算面板 ── */
.settle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.settle .span2{grid-column:1/-1}
.panel{border:1px solid var(--line);border-radius:var(--r3);background:var(--bg2);overflow:hidden}
.panel-hd{
  display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--bg3);
  border-bottom:1px solid var(--line);font-size:10.5px;font-weight:650;letter-spacing:.3px;
}
.panel-hd svg{width:12px;height:12px;stroke:var(--cy);fill:none;stroke-width:2.2}
.panel-hd .rt{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--tx3);font-weight:400}
.panel-bd{padding:8px 10px}
.hero{
  display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:var(--r3);
  background:linear-gradient(120deg,var(--emA),transparent 62%),var(--bg2);
  border:1px solid var(--em-d);box-shadow:var(--sh2);
}
.hero .hico{
  width:38px;height:38px;border-radius:var(--rfull);display:grid;place-items:center;flex:0 0 auto;
  background:var(--emA);border:1.5px solid var(--em);
}
.hero .hico svg{width:19px;height:19px;stroke:var(--em);fill:none;stroke-width:2.3}
.hero .htx{flex:1;min-width:0}
.hero .htx b{display:block;font-size:14px;font-weight:680;letter-spacing:.2px}
.hero .htx span{display:block;font-size:10.5px;color:var(--tx3);font-family:var(--fm);margin-top:2px}
.hero .hrank{
  font-family:var(--fm);font-size:26px;font-weight:700;color:var(--em);letter-spacing:-1px;
  text-shadow:0 0 22px rgba(52,211,153,.45);flex:0 0 auto;
}
.barstat{display:flex;flex-direction:column;gap:4px}
.barstat .bs{display:flex;align-items:center;gap:7px}
.barstat .bs .k{width:34px;font-family:var(--fm);font-size:9.5px;color:var(--tx3);flex:0 0 auto}
.barstat .bs .t{flex:1;height:8px;border-radius:var(--r1);background:var(--bg4);overflow:hidden;position:relative}
.barstat .bs .t i{display:block;height:100%;border-radius:var(--r1);background:linear-gradient(90deg,var(--cy-d),var(--cy))}
.barstat .bs .v{width:52px;text-align:right;font-family:var(--fm);font-size:9.5px;color:var(--tx1);flex:0 0 auto}
.radarwrap{display:flex;align-items:center;gap:11px}
.radarwrap canvas{flex:0 0 auto}
.radarleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.radarleg .rl{display:flex;align-items:center;gap:6px;font-size:10px}
.radarleg .rl .dot{width:6px;height:6px;border-radius:var(--rfull);background:var(--cy);flex:0 0 auto}
.radarleg .rl .k{flex:1;min-width:0;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radarleg .rl .v{font-family:var(--fm);color:var(--cy);flex:0 0 auto}
.ledger{width:100%;font-size:10.5px}
.ledger tr td{padding:3px 0;color:var(--tx2)}
.ledger tr td:last-child{text-align:right;font-family:var(--fm);color:var(--tx0)}
.ledger tr.tot td{border-top:1px dashed var(--line3);padding-top:5px;color:var(--tx0);font-weight:650}
.ledger tr.tot td:last-child{color:var(--em);font-size:15px}
.ledger tr.sub td{color:var(--am);font-family:var(--fm);font-size:10px}

/* ══════════════════════════════════════════════════════════════════
   6. 栏3 · 属性抽屉
   ══════════════════════════════════════════════════════════════════ */
.drawcol{background:var(--bg1);border-left:1px solid var(--line)}
.dc-hd{
  display:flex;align-items:center;gap:7px;padding:0 10px;height:var(--h-tool);
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.dc-hd h2{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.dc-hd h2 svg{width:13px;height:13px;stroke:var(--vi);fill:none;stroke-width:2.1}
.dc-hd .rt{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{width:22px;height:22px;border-radius:var(--r1);display:grid;place-items:center;color:var(--tx2);transition:background var(--dur1) var(--e1),color var(--dur1) var(--e1)}
.ibtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.ibtn:hover{background:var(--bg4);color:var(--tx0)}
.dc-body{flex:1;min-height:0;overflow:auto;padding:9px}
.dc-sec{margin-bottom:11px}
.dc-sec>h3{
  display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:1px;
  color:var(--tx3);text-transform:uppercase;margin-bottom:6px;
}
.dc-sec>h3 svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.dc-sec>h3 .rt{margin-left:auto;font-family:var(--fm);font-size:9px;color:var(--tx3);letter-spacing:0;text-transform:none}

/* 级联分类器 */
.cascade{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--bg2)}
.casc-lv{border-bottom:1px solid var(--line2)}
.casc-lv:last-child{border-bottom:0}
.casc-hd{
  display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg3);
  font-size:9.5px;font-family:var(--fm);color:var(--tx3);letter-spacing:.4px;
}
.casc-hd .idx{
  width:14px;height:14px;border-radius:var(--r1);background:var(--viA);color:var(--vi);
  display:grid;place-items:center;font-size:8.5px;font-weight:700;
}
.casc-hd .cur{margin-left:auto;color:var(--vi);font-weight:600}
.casc-opts{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
.casc-opt{
  padding:3px 8px;border-radius:var(--rfull);font-size:10.5px;color:var(--tx1);
  background:var(--bg1);border:1px solid var(--line);
  transition:background var(--dur1) var(--e1),border-color var(--dur1) var(--e1),color var(--dur1) var(--e1);
}
.casc-opt:hover{border-color:var(--line-hot);color:var(--tx0)}
.casc-opt.on{background:var(--viA);border-color:var(--vi-d);color:var(--vi)}
.casc-path{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;background:var(--bg0);
  border-top:1px solid var(--line2);font-family:var(--fm);font-size:9.5px;color:var(--tx3);
}
.casc-path b{color:var(--cy);font-weight:600}
.casc-path .arr{color:var(--tx4)}

/* 音素表 */
.phontbl{width:100%;font-size:10.5px;font-family:var(--fm)}
.phontbl th{
  font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--tx3);text-align:left;
  padding:4px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;
}
.phontbl td{padding:4px 6px;border-bottom:1px solid var(--line2);color:var(--tx1)}
.phontbl tr{transition:background var(--dur1) var(--e1)}
.phontbl tr:hover{background:var(--bg2)}
.phontbl tr.on{background:var(--viA)}
.phontbl tr.bad{background:var(--roA)}
.phontbl tr.bad td{color:var(--ro)}
.phontbl tr.bad .dur{font-weight:700}
.phontbl .sym{color:var(--tx0);font-weight:600;font-size:11.5px}
.phontbl .dur{text-align:right}
.phontbl tr.bad .sym::after{content:'⌁';margin-left:3px;color:var(--ro)}
.phonbar{height:18px;border-radius:var(--r1);background:var(--bg4);overflow:hidden;display:flex;margin-bottom:7px;border:1px solid var(--line2)}
.phonbar i{height:100%;border-right:1px solid rgba(0,0,0,.4)}
.phonbar i:last-child{border-right:0}

/* 置信度 */
.confbox{padding:8px;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--line);margin-bottom:8px}
.confbox.warn{border-color:var(--ro-d);background:linear-gradient(120deg,var(--roA),var(--bg2) 70%);box-shadow:var(--sh-ro)}
.confrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.confrow .k{width:66px;font-size:10px;color:var(--tx3);flex:0 0 auto}
.confrow .track{flex:1;height:7px;border-radius:var(--rfull);background:var(--bg4);overflow:hidden;border:0}
.confrow .track i{display:block;height:100%;border-radius:var(--rfull);background:linear-gradient(90deg,var(--cy-d),var(--cy))}
.confrow .track i.lo{background:linear-gradient(90deg,var(--ro-d),var(--ro))}
.confrow .track i.mid{background:linear-gradient(90deg,var(--am-d),var(--am))}
.confrow .v{width:44px;text-align:right;font-family:var(--fm);font-size:11px;color:var(--tx0);flex:0 0 auto}
.confrow .v.lo{color:var(--ro)}
.conf-formula{
  font-family:var(--fm);font-size:9.5px;color:var(--tx3);padding-top:5px;border-top:1px dashed var(--line3);
  display:flex;align-items:center;gap:4px;
}
.conf-formula b{color:var(--am)}
.conf-gate{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--ro)}
.conf-gate svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}

/* 表单 */
.frow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.frow>label{width:66px;font-size:10px;color:var(--tx3);flex:0 0 auto}
.inp{
  flex:1;min-width:0;height:26px;padding:0 8px;background:var(--bg0);color:var(--tx0);
  border:1px solid var(--line);border-radius:var(--r2);font-size:11px;outline:0;
  transition:border-color var(--dur1) var(--e1),box-shadow var(--dur1) var(--e1);
}
.inp::placeholder{color:var(--tx3)}
.inp:focus{border-color:var(--cy-k);box-shadow:0 0 0 2px var(--cyA)}
.inp.err{border-color:var(--ro);box-shadow:0 0 0 2px var(--roA);background:rgba(251,92,114,.05)}
textarea.inp{height:auto;min-height:54px;padding:6px 8px;resize:vertical;line-height:1.55;font-family:var(--fm);font-size:10.5px}
.frow.stack{display:block}
.frow.stack>label{display:block;width:auto;margin-bottom:4px}
.fhint{display:flex;align-items:center;gap:5px;font-size:9.5px;font-family:var(--fm);color:var(--tx3);margin-top:4px}
.fhint.bad{color:var(--ro)}
.fhint.good{color:var(--em)}
.fhint svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;
  border-radius:var(--r2);font-size:11.5px;font-weight:600;color:var(--tx1);
  background:var(--bg3);border:1px solid var(--line3);
  transition:background var(--dur1) var(--e1),color var(--dur1) var(--e1),border-color var(--dur1) var(--e1),transform 90ms var(--e1);
}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.btn:hover{background:var(--bg4);color:var(--tx0)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--cy-d),var(--cy-k));color:#04120f;border-color:var(--cy-d)}
.btn.pri:hover{background:linear-gradient(180deg,var(--cy),var(--cy-d));color:#04120f}
.btn.vi{background:linear-gradient(180deg,var(--vi-d),#5b3fd6);color:#fff;border-color:var(--vi-d)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.55)}
.btn[disabled]:hover{background:var(--bg3);color:var(--tx1)}
.btn.locked::after{content:'🔒';font-size:9px}
.btnrow{display:flex;gap:7px}
.btnrow .btn{flex:1}

/* 快捷键提示 */
.kbdhint{display:flex;flex-direction:column;gap:4px;padding:7px 8px;border-radius:var(--r2);background:var(--bg0);border:1px solid var(--line2)}
.kbdhint .kh{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--tx2)}
.kbdhint .kh .kbs{margin-left:auto;display:flex;gap:3px;flex:0 0 auto}
kbd{
  font-family:var(--fm);font-size:9px;color:var(--tx1);background:var(--bg3);
  border:1px solid var(--line3);border-bottom-width:2px;border-radius:var(--r1);padding:1px 4px;min-width:15px;text-align:center;
}

/* 只读审核蒙版 */
.lockmask{
  position:absolute;inset:0;z-index:20;background:var(--bg-glass);
  backdrop-filter:blur(1.5px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;text-align:center;padding:18px;
}
.lockmask .lm-ico{
  width:40px;height:40px;border-radius:var(--rfull);display:grid;place-items:center;
  background:var(--amA);border:1.5px solid var(--am-d);
}
.lockmask .lm-ico svg{width:19px;height:19px;stroke:var(--am);fill:none;stroke-width:2.1}
.lockmask b{font-size:12.5px;font-weight:650}
.lockmask span{font-size:10.5px;color:var(--tx3);font-family:var(--fm);max-width:260px;line-height:1.65}

.hintbar{
  display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:var(--r2);
  background:var(--blA);border:1px solid var(--bl-d);font-size:10px;color:var(--bl);font-family:var(--fm);
}
.hintbar svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;flex:0 0 auto}
.hintbar.warn{background:var(--amA);border-color:var(--am-d);color:var(--am)}
.hintbar.bad{background:var(--roA);border-color:var(--ro-d);color:var(--ro)}
.hintbar.good{background:var(--emA);border-color:var(--em-d);color:var(--em)}

/* ══════════════════════════════════════════════════════════════════
   7. 栏4 · 质检与审核侧栏
   ══════════════════════════════════════════════════════════════════ */
.qccol{background:var(--bg1);border-left:1px solid var(--line)}
.qc-hd{
  display:flex;align-items:center;gap:7px;padding:0 10px;height:var(--h-tool);
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.qc-hd h2{font-size:11.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.qc-hd h2 svg{width:13px;height:13px;stroke:var(--am);fill:none;stroke-width:2.1}
.qc-hd .rt{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--tx3)}
.qc-body{flex:1;min-height:0;overflow:auto;padding:9px}

.qc-gate{
  padding:9px 10px;border-radius:var(--r2);margin-bottom:10px;
  background:var(--emA);border:1px solid var(--em-d);
}
.qc-gate.blocked{background:var(--roA);border-color:var(--ro-d);box-shadow:var(--sh-ro)}
.qc-gate .gt{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:var(--em);margin-bottom:5px}
.qc-gate.blocked .gt{color:var(--ro)}
.qc-gate .gt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.3}
.qc-gate .gs{font-size:9.5px;font-family:var(--fm);color:var(--tx3);line-height:1.6}
.qc-gate .gbtn{margin-top:8px;width:100%;height:30px}

.citem{
  padding:8px 9px;border-radius:var(--r2);margin-bottom:6px;background:var(--bg2);
  border:1px solid var(--line);border-left:2.5px solid var(--am);cursor:pointer;
  transition:background var(--dur1) var(--e1),border-color var(--dur1) var(--e1);
}
.citem:hover{background:var(--bg3)}
.citem.on{border-color:var(--ro-d);border-left-color:var(--ro);background:var(--roA)}
.citem.ro{border-left-color:var(--ro)}
.citem .ch{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.citem .ch b{font-size:10.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ch .n{font-family:var(--fm);font-size:9px;color:var(--tx3)}
.citem .cb{display:grid;grid-template-columns:14px minmax(0,1fr);gap:5px;font-size:10px;line-height:1.55;color:var(--tx2)}
.citem .cb .who{font-family:var(--fm);font-size:9px;color:var(--tx3)}
.citem .cb .txt{overflow:hidden;text-overflow:ellipsis}
.citem .cb .txt em{font-style:normal;color:var(--ro);background:rgba(251,92,114,.15);padding:0 2px;border-radius:2px}
.citem .cb .txt s{color:var(--am);text-decoration:line-through}

.histline{position:relative;padding-left:15px;padding-bottom:11px}
.histline::before{content:'';position:absolute;left:4px;top:5px;width:6px;height:6px;border-radius:var(--rfull);background:var(--cy);box-shadow:0 0 8px var(--cy)}
.histline.warn::before{background:var(--am);box-shadow:0 0 8px var(--am)}
.histline.err::before{background:var(--ro);box-shadow:0 0 8px var(--ro)}
.histline.info::before{background:var(--bl);box-shadow:0 0 8px var(--bl)}
.histline:not(:last-child)::after{content:'';position:absolute;left:6.5px;top:13px;bottom:2px;width:1px;background:var(--line3)}
.histline .ht{display:flex;align-items:baseline;gap:6px}
.histline .ht b{font-size:10.5px;font-weight:600;flex:1;min-width:0}
.histline .ht .tm{font-family:var(--fm);font-size:9px;color:var(--tx3);flex:0 0 auto}
.histline .hs{font-size:9.5px;color:var(--tx3);font-family:var(--fm);margin-top:2px;line-height:1.5}

/* ══════════════════════════════════════════════════════════════════
   8. 浮层：悬浮卡 / 径向轮盘 / 模态 / Toast
   ══════════════════════════════════════════════════════════════════ */
.tip{
  position:fixed;z-index:70;min-width:186px;padding:9px 10px;border-radius:var(--r3);
  background:var(--bg2);border:1px solid var(--line3);box-shadow:var(--sh3);pointer-events:none;
  opacity:0;transform:translateY(-4px);transition:opacity var(--dur1) var(--e1),transform var(--dur1) var(--e1);
}
.tip.show{opacity:1;transform:translateY(0)}
.tip::after{
  content:'';position:absolute;left:14px;bottom:-5px;width:8px;height:8px;transform:rotate(45deg);
  background:var(--bg2);border-right:1px solid var(--line3);border-bottom:1px solid var(--line3);
}
.tip h4{font-size:10.5px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tip h4 .sw{width:7px;height:7px;border-radius:2px;background:var(--cy)}
.tip .tr{display:flex;align-items:center;gap:7px;font-size:10px;margin-bottom:3px}
.tip .tr .k{color:var(--tx3);width:58px;flex:0 0 auto}
.tip .tr .v{font-family:var(--fm);color:var(--tx1)}
.tip .tr .v.cy{color:var(--cy)}  .tip .tr .v.am{color:var(--am)}  .tip .tr .v.ro{color:var(--ro)}

/* 径向轮盘 */
.radial{
  position:fixed;z-index:80;width:0;height:0;pointer-events:none;
  opacity:0;transition:opacity var(--dur2) var(--e1);
}
.radial.show{opacity:1;pointer-events:auto}
.radial .rcore{
  position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:var(--rfull);
  background:var(--bg3);border:1.5px solid var(--cy);box-shadow:var(--sh-cy);
  display:grid;place-items:center;font-family:var(--fm);font-size:8.5px;color:var(--cy);
}
.radial .ritem{
  position:absolute;width:66px;height:66px;border-radius:var(--rfull);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--bg2);border:1px solid var(--line3);box-shadow:var(--sh2);
  transform:translate(-50%,-50%);transition:background var(--dur1) var(--e1),border-color var(--dur1) var(--e1);
  pointer-events:auto;cursor:pointer;
}
.radial .ritem:hover,.radial .ritem.act{background:var(--cyA);border-color:var(--cy);box-shadow:var(--sh-cy)}
.radial .ritem svg{width:17px;height:17px;stroke:var(--cy);fill:none;stroke-width:2}
.radial .ritem span{font-size:8.5px;color:var(--tx1);font-family:var(--fm)}
.radial .rlink{position:absolute;left:0;top:0;width:0;height:0;border-top:1px dashed var(--line3);transform-origin:0 0;pointer-events:none}

/* 模态 */
.mask{
  position:fixed;inset:0;z-index:90;background:rgba(6,10,15,.42);
  display:flex;align-items:center;justify-content:center;padding:22px;
  opacity:0;pointer-events:none;transition:opacity var(--dur2) var(--e1);
}
.mask.show{opacity:1;pointer-events:auto}
/* 侧靠模态：贴右停驻，主视窗内容保持完整可见 */
.mask.side{align-items:center;justify-content:flex-end;padding:56px 14px 14px}
.modal{
  width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg1);border:1px solid var(--line3);border-radius:var(--r4);box-shadow:var(--sh4);
  transform:translateY(10px) scale(.985);transition:transform var(--dur2) var(--e1);
}
.mask.show .modal{transform:none}
.modal.wide{width:min(760px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal.side{width:min(540px,100%)}
.modal-hd{
  display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg2),var(--bg1));flex:0 0 auto;
}
.modal-hd .mh-ico{
  width:28px;height:28px;border-radius:var(--r2);display:grid;place-items:center;flex:0 0 auto;
  background:var(--blA);border:1px solid var(--bl-d);
}
.modal-hd .mh-ico svg{width:14px;height:14px;stroke:var(--bl);fill:none;stroke-width:2.1}
.modal-hd.ro .mh-ico{background:var(--roA);border-color:var(--ro-d)}
.modal-hd.ro .mh-ico svg{stroke:var(--ro)}
.modal-hd h2{flex:1;min-width:0;font-size:13px;font-weight:660}
.modal-hd h2 small{display:block;font-size:10px;color:var(--tx3);font-family:var(--fm);font-weight:400;margin-top:1px}
.modal-bd{padding:14px;overflow:auto;min-height:0}
.modal-ft{
  display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);
  background:var(--bg2);flex:0 0 auto;
}
.modal-ft .sp{flex:1}

/* 校验码输入（音素下限熔断的二次人工确认） */
.codeform{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0 4px}
.code-lb{font-size:9.5px;font-family:var(--fm);letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3)}
.codeinput{
  width:228px;height:52px;border-radius:var(--r3);background:var(--bg0);border:1.5px solid var(--line3);
  text-align:center;font-family:var(--fm);font-size:22px;font-weight:600;letter-spacing:14px;
  text-indent:14px;color:var(--ro);box-shadow:inset 0 2px 10px rgba(0,0,0,.5);outline:0;
  transition:border-color var(--dur1) var(--e1),box-shadow var(--dur1) var(--e1);
}
.codeinput::placeholder{color:var(--tx3);letter-spacing:14px;text-indent:14px}
.codeinput:focus{border-color:var(--ro);box-shadow:var(--sh-ro)}
.codeinput.err{border-color:var(--ro);box-shadow:var(--sh-ro)}
.codeinput.ok{border-color:var(--em);color:var(--em);box-shadow:0 0 0 2px rgba(45,212,191,.18)}

/* 导出格式选择 */
.fmtgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:12px}
.fmt{
  display:flex;align-items:center;gap:9px;padding:10px;border-radius:var(--r2);
  background:var(--bg2);border:1px solid var(--line);cursor:pointer;
  transition:border-color var(--dur1) var(--e1),background var(--dur1) var(--e1);
}
.fmt:hover{border-color:var(--line-hot)}
.fmt.on{border-color:var(--cy-k);background:var(--cyA)}
.fmt .ck{
  width:16px;height:16px;border-radius:var(--r1);border:1.5px solid var(--line3);flex:0 0 auto;
  display:grid;place-items:center;
}
.fmt.on .ck{background:var(--cy);border-color:var(--cy)}
.fmt .ck svg{width:10px;height:10px;stroke:#04120f;fill:none;stroke-width:3;opacity:0}
.fmt.on .ck svg{opacity:1}
.fmt .ft{flex:1;min-width:0}
.fmt .ft b{display:block;font-size:11.5px;font-weight:650;font-family:var(--fm)}
.fmt .ft span{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px}
.fmt .sz{font-family:var(--fm);font-size:10px;color:var(--tx3);flex:0 0 auto}

/* Toast */
.toastbox{
  position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:95;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:var(--r3);
  background:var(--bg2);border:1px solid var(--line3);box-shadow:var(--sh3);
  font-size:11.5px;color:var(--tx0);max-width:600px;
  opacity:0;transform:translateY(-10px);transition:opacity var(--dur2) var(--e1),transform var(--dur2) var(--e1);
}
.toast.show{opacity:1;transform:none}
.toast .ti{
  width:20px;height:20px;border-radius:var(--rfull);display:grid;place-items:center;flex:0 0 auto;
  background:var(--blA);
}
.toast .ti svg{width:11px;height:11px;stroke:var(--bl);fill:none;stroke-width:2.6}
.toast.ok{border-color:var(--em-d)}    .toast.ok .ti{background:var(--emA)}    .toast.ok .ti svg{stroke:var(--em)}
.toast.warn{border-color:var(--am-d)}  .toast.warn .ti{background:var(--amA)}  .toast.warn .ti svg{stroke:var(--am)}
.toast.err{border-color:var(--ro-d)}   .toast.err .ti{background:var(--roA)}   .toast.err .ti svg{stroke:var(--ro)}
.toast .tt{flex:1;min-width:0;line-height:1.5}
.toast .tt small{display:block;font-family:var(--fm);font-size:10px;color:var(--tx3);margin-top:1px}

/* 命令面板 */
.cmdk{
  position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:88;
  width:min(540px,92vw);border-radius:var(--r4);background:var(--bg1);border:1px solid var(--line3);
  box-shadow:var(--sh4);overflow:hidden;opacity:0;pointer-events:none;
  transition:opacity var(--dur2) var(--e1),transform var(--dur2) var(--e1);
}
.cmdk.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.cmdk-in{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)}
.cmdk-in svg{width:14px;height:14px;stroke:var(--tx2);fill:none;stroke-width:2.1}
.cmdk-in input{flex:1;background:none;border:0;outline:0;font-size:13px;color:var(--tx0)}
.cmdk-list{max-height:322px;overflow:auto;padding:6px}
.cmdk-it{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:var(--r2);text-align:left;
  transition:background var(--dur1) var(--e1);
}
.cmdk-it:hover,.cmdk-it.on{background:var(--bg3)}
.cmdk-it svg{width:14px;height:14px;stroke:var(--tx2);fill:none;stroke-width:2}
.cmdk-it.on svg{stroke:var(--cy)}
.cmdk-it .ct{flex:1;min-width:0}
.cmdk-it .ct b{display:block;font-size:11.5px;font-weight:600}
.cmdk-it .ct span{display:block;font-size:9.5px;color:var(--tx3);font-family:var(--fm)}
.cmdk-it .cg{font-family:var(--fm);font-size:9px;color:var(--tx3);background:var(--bg4);padding:1px 5px;border-radius:var(--r1)}
.cmdk-grp{font-size:9px;font-weight:700;letter-spacing:.9px;color:var(--tx3);text-transform:uppercase;padding:7px 9px 4px}

/* 抽屉（导入 / 邀请 / 审核） */
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:86;width:min(400px,94vw);
  display:flex;flex-direction:column;background:var(--bg1);border-left:1px solid var(--line3);
  box-shadow:var(--sh4);transform:translateX(103%);
  transition:transform var(--dur2) var(--e1);
}
.drawer.show{transform:none}
.drawer>header{
  display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--bg2);flex:0 0 auto;
}

function segs(){
  return SEGS.map(function(s){
    var o = { id:s.id, a:s.a, b:s.b, spk:s.spk, txt:s.txt, ph:s.ph, conf:s.conf, low:!!s.low };
    if (s.id === 's5') o.b = S.s5b;
    o.dur = o.b - o.a;
    return o;
  });
}
function segById(id){
  var arr = segs();
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return arr[0];
}
function segIdx(id){ for (var i = 0; i < SEGS.length; i++) if (SEGS[i].id === id) return i; return 0; }

/* ── 子系统①：切分 / 合并 / 时长守恒 ── */
function allocMs(){
  var arr = segs(), n = 0;
  for (var i = 0; i < arr.length; i++) n += arr[i].dur;
  return n;
}
function freeMs(){ return AUDIO.dur - allocMs(); }

/* ── 子系统③：重叠校验（必须精确 = 0 ms） ── */
function overlaps(){
  var arr = segs().slice().sort(function(x, y){ return x.a - y.a; }), out = [];
  for (var i = 0; i < arr.length - 1; i++){
    var d = arr[i].b - arr[i + 1].a;
    if (d > 0) out.push({ a: arr[i].id, b: arr[i + 1].id, ms: d,
      from: arr[i + 1].a, to: arr[i].b });
  }
  return out;
}
function overlapMs(){ var o = overlaps(); return o.length ? o[0].ms : 0; }
/* 空档（gap）恒为 0 才算严格连续；overlap = 0 且 gap = 0 即完美切分 */
function gaps(){
  var arr = segs().slice().sort(function(x, y){ return x.a - y.a; }), out = [];
  for (var i = 0; i < arr.length - 1; i++){
    var d = arr[i + 1].a - arr[i].b;
    if (d > 0) out.push(d);
  }
  return out;
}

/* ── 子系统⑤：置信度惩罚闭环 ── */
/* 最终置信度 = 原始置信度 × 0.6 + 人工修正权重 0.35 */
var W_ORIG = 0.6, W_FIX = 0.35;
function confAfter(orig){ return orig * W_ORIG + W_FIX; }
function segConf(s){ return s.low ? confAfter(s.conf) : s.conf; }
function confGate(orig){ return confAfter(orig) < S.confTh; }
function needReason(){ return confGate(segById(S.seg).conf); }

/* ── 子系统④：音素 < 80ms 熔断 ── */
var PHON_MIN = 80;
function phonBad(p){ return p.dur < PHON_MIN; }
function phonBadCount(){
  var n = 0;
  for (var i = 0; i < PHONS.length; i++) if (phonBad(PHONS[i])) n++;
  return n;
}
/* 4 位校验码 = 该音素「起始毫秒」的后四位 */
function codeOf(p){ var s = String(p.a); return s.length >= 4 ? s.slice(-4) : ('0000' + s).slice(-4); }

/* ── 子系统⑤：计费 / 时效账本 ── */
var UNIT_PRICE = 0.48;          /* ¥ / 有效标注秒 */
var REWORK_W   = 0.5;           /* 修改率惩罚权重 */
function billing(){
  var arr = segs(), sec = 0, edits = 0;
  for (var i = 0; i < arr.length; i++){
    sec += arr[i].dur / 1000;
    if (arr[i].low) edits++;
  }
  var rate = edits / arr.length;
  var coef = 1 - rate * REWORK_W;
  var amount = sec * UNIT_PRICE * coef;
  return { sec: sec, edits: edits, total: arr.length, rate: rate, coef: coef,
           amount: amount, secTxt: sec.toFixed(2), rateTxt: (rate * 100).toFixed(1),
           coefTxt: coef.toFixed(3), amountTxt: amount.toFixed(2) };
}
function radarTotal(){
  var n = 0; for (var i = 0; i < RADAR.length; i++) n += RADAR[i].v;
  return n / RADAR.length;
}

/* ══════════════════════════════════════════════════════════════════════════
   波形 / 频谱数据（闭式哈希，确定性）
   ══════════════════════════════════════════════════════════════════════════ */
/* 带包络的波形采样：6 段语音能量 + 段间 12ms 静音过渡；
   18.12s 之后为尚未分配的原始音轨（低电平环境噪声，仍可见） */
function envAt(t){
  var e = 0.24;
  if (t < 3120)      e = 0.72 + 0.20 * Math.sin(t / 340);
  else if (t < 6480) e = 0.62 + 0.22 * Math.sin(t / 470 + 1.1);
  else if (t < 9960) e = 0.80 + 0.18 * Math.sin(t / 300 + 2.2);
  else if (t < 12980)e = 0.55 + 0.20 * Math.sin(t / 520 + 3.3);
  else if (t < 15840)e = 0.70 + 0.20 * Math.sin(t / 380 + 4.4);
  else if (t < 18120)e = 0.60 + 0.18 * Math.sin(t / 440 + 5.5);
  else                e = 0.24 + 0.06 * Math.sin(t / 610 + 6.6);
  /* 段间 12ms 静音过渡，切分点可视化 */
  var bnd = [0, 3120, 6480, 9960, 12980, 15840, 18120];
  for (var i = 1; i < bnd.length; i++){
    if (Math.abs(t - bnd[i]) < 12) e *= 0.18;
  }
  return clamp(e, 0.03, 1);
}
function waveAt(t){
  var e = envAt(t);
  var n = h32(SEED, Math.floor(t / 8), 17) * 2 - 1;
  var m = h32(SEED ^ 0x51ed, Math.floor(t / 26), 41) * 2 - 1;
  return clamp(e * (0.62 * n + 0.38 * m), -1, 1);
}
/* 频谱能量：频带 × 时间单元的归一化能量 0..1 */
var BANDS = 40;
function specAt(t, band){
  var e = envAt(t);
  /* 低频能量更强（语音常识），并叠加共振峰条纹 */
  var f = 1 - band / BANDS;
  var form = 0.5 + 0.5 * Math.sin(band * 0.85 + t / 260) * Math.sin(band * 0.31 + 1.7);
  var n = h32(SEED ^ 0x7f3a, Math.floor(t / 34), band * 7 + 3);
  var v = e * (0.30 + 0.70 * f) * (0.62 + 0.38 * form) * (0.70 + 0.55 * n);
  /* 顶端高频衰减 */
  if (band < 4) v *= 0.55;
  return clamp(v, 0, 1);
}

/* ══════════════════════════════════════════════════════════════════════════
   状态写入（含 DOM 同步）
   ══════════════════════════════════════════════════════════════════════════ */
function setSt(st){ S.st = st; document.body.setAttribute('data-st', st); }
function setPh(n){
  S.phase = n;
  document.body.setAttribute('data-ph', String(n));
}
function resetFor(n){
  setPh(n); setSt(PH_ST[n]);
  S.resolved = { 0:'A', 1:'B', 2:'A' };
  S.radial = false;
  S.cand = 0;
  S.ovErr = (n === 5);
  S.s5b = (n === 5) ? 16040 : 15840;
  S.staged = (n >= 3);
  S.hover = (n === 2);
  S.hoverT = 1600;
  S.playing = false;
  if (n === 2){ S.sel = { a: 0, b: 3120 }; S.seg = 's1'; S.playT = 1240; S.zoom = 26; }
  if (n === 3){ S.sel = { a: 6480, b: 9960 }; S.seg = 's3'; S.zoom = 150; S.playT = 8220;
                S.reason = '音素边界与原始录音不符，按重听结果修正'; S.phon = 'p6'; }
  if (n === 4){ S.sel = { a: 6480, b: 9960 }; S.seg = 's3'; S.zoom = 30; S.playT = 11860; }
  if (n === 5){ S.sel = { a: 12980, b: 16040 }; S.seg = 's5'; S.zoom = 96; S.playT = 16040;
                S.code = '7780'; S.modal = ''; }
  if (n === 6){ S.sel = { a: 0, b: 18120 }; S.seg = 's6'; S.zoom = 26; S.playT = 18120; S.modal = 'export'; }
  if (n === 1){ S.modal = ''; S.sel = { a: 0, b: 0 }; S.zoom = 26; S.seg = 's1'; S.playT = 1240; }
}

/* ══════════════════════════════════════════════════════════════════════════
   Canvas 渲染层
   ══════════════════════════════════════════════════════════════════════════ */
var CV = {};          /* {ruler, wave, spec, radar} canvas 引用 */
var CTX = {};
var VW = { a: 0, b: 24600, pps: 0.026, w: 600 };

/* 每次 render 后 DOM 被重建，必须重新绑定画布引用 */
function bindCv(){
  CV.ruler = document.getElementById('cv-ruler');
  CV.wave  = document.getElementById('cv-wave');
  CV.spec  = document.getElementById('cv-spec');
  CV.radar = document.getElementById('cv-radar');
  CV.bars  = document.getElementById('cv-bars');
}

function cvsSetup(cv){
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(1, cv.parentElement.clientWidth);
  var h = Math.max(1, cv.parentElement.clientHeight);
  if (cv._w !== w || cv._h !== h || cv._dpr !== dpr){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv._w = w; cv._h = h; cv._dpr = dpr;
  }
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c: c, w: w, h: h };
}

/* 视窗：由 zoom(px/秒) 与选区中心决定；span 超全长则全览 */
function view(){
  var w = Math.max(120, CV.wave ? CV.wave.parentElement.clientWidth : 600);
  var pps = S.zoom / 1000;                       /* px / ms */
  var span = w / pps;
  if (span >= AUDIO.dur) return { a: 0, b: AUDIO.dur, pps: pps, w: w, full: true };
  var c = (S.sel.a + S.sel.b) / 2;
  var a = clamp(c - span / 2, 0, AUDIO.dur - span);
  return { a: a, b: a + span, pps: pps, w: w, full: false };
}
function xOf(t){ return (t - VW.a) * VW.pps; }
function tOf(x){ return VW.a + x / VW.pps; }
function visA(){ return Math.max(0, VW.a); }
function visB(){ return Math.min(AUDIO.dur, VW.b); }

/* ── 时间标尺步长（保证刻度间距 ≥ 62px） ── */
var STEPS = [5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000];
function tickStep(){
  for (var i = 0; i < STEPS.length; i++) if (STEPS[i] * VW.pps >= 62) return STEPS[i];
  return 20000;
}
function tickLabel(t, step){
  if (step >= 5000) return (t / 1000) + 's';
  if (step >= 1000) return (t / 1000).toFixed(1) + 's';
  return t3(t);
}

/* ══ 轨 0：毫秒时间标尺 ══ */
function drawRuler(){
  var cv = CV.ruler; if (!cv) return;
  var s = cvsSetup(cv), c = s.c, w = s.w, h = s.h;
  c.clearRect(0, 0, w, h);
  VW.w = w; VW.pps = S.zoom / 1000;
  var v = view(); VW.a = v.a; VW.b = v.b; VW.full = v.full;

  c.fillStyle = '#0d131c'; c.fillRect(0, 0, w, h);
  var step = tickStep();
  var t0 = Math.floor(visA() / step) * step, t1 = visB();
  c.strokeStyle = '#22303f'; c.lineWidth = 1;
  for (var t = t0; t <= t1 + 1; t += step){
    var x = Math.round(xOf(t)) + .5;
    if (x < -30 || x > w + 30) continue;
    c.beginPath(); c.moveTo(x, h - 8); c.lineTo(x, h); c.stroke();
    c.fillStyle = '#72859c';
    c.font = '9px "JetBrains Mono",Consolas,monospace';
    c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText(tickLabel(t, step), x, 2);
    /* 次级刻度：4 等分 */
    c.strokeStyle = '#19232e';
    for (var k = 1; k < 4; k++){
      var xk = Math.round(xOf(t + step * k / 4)) + .5;
      if (xk < 0 || xk > w) continue;
      c.beginPath(); c.moveTo(xk, h - 4); c.lineTo(xk, h); c.stroke();
    }
    c.strokeStyle = '#22303f';
  }
  /* 选区在标尺上的色带 */
  var sa = Math.max(0, xOf(S.sel.a)), sb = Math.min(w, xOf(S.sel.b));
  if (SB_VISIBLE() && sb > sa){
    c.fillStyle = S.ovErr ? 'rgba(251,92,114,.22)' : (S.staged && S.phase !== 2
      ? 'rgba(245,165,36,.22)' : 'rgba(45,212,191,.22)');
    c.fillRect(sa, 0, sb - sa, h - 6);
  }
}
function SB_VISIBLE(){ return S.sel.b > S.sel.a && S.phase !== 1; }

/* ══ 轨 1：原声包络波形 ══ */
function drawWave(){
  var cv = CV.wave; if (!cv) return;
  var s = cvsSetup(cv), c = s.c, w = s.w, h = s.h;
  c.clearRect(0, 0, w, h);
  c.fillStyle = '#080c12'; c.fillRect(0, 0, w, h);
  var mid = h * 0.5;

  /* 背景：时间刻度网格 + 段边界竖线 */
  var step = tickStep();
  c.strokeStyle = 'rgba(34,48,63,.85)'; c.lineWidth = 1;
  for (var t = Math.floor(visA() / step) * step; t <= visB(); t += step){
    var x = Math.round(xOf(t)) + .5;
    if (x < 0 || x > w) continue;
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke();
  }
  var arr = segs();
  c.strokeStyle = 'rgba(45,80,105,.6)'; c.lineWidth = 1;
  for (var i = 1; i < arr.length; i++){
    var xb = Math.round(xOf(arr[i].a)) + .5;
    if (xb < 0 || xb > w) continue;
    c.beginPath(); c.moveTo(xb, 0); c.lineTo(xb, h); c.stroke();
  }
  /* 中线 */
  c.strokeStyle = 'rgba(45,212,191,.16)';
  c.beginPath(); c.moveTo(0, Math.round(mid) + .5); c.lineTo(w, Math.round(mid) + .5); c.stroke();

  /* 可解码比例（相位 1 = 解析中 68%） */
  var cov = (S.phase === 1) ? 0.68 : 1;
  var covX = xOf(Math.min(AUDIO.dur * cov, visB()));
  var amp = h * 0.42;

  /* 包络填充 */
  var grad = c.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0,   'rgba(45,212,191,.34)');
  grad.addColorStop(0.5, 'rgba(45,212,191,.62)');
  grad.addColorStop(1,   'rgba(45,212,191,.34)');
  c.fillStyle = grad;
  c.beginPath();
  var xStart = Math.max(0, xOf(visA()));
  var xEnd = Math.min(w, covX);
  for (var x = xStart; x <= xEnd; x++){
    var tt = tOf(x), e = envAt(tt) * amp;
    if (x === xStart) c.moveTo(x, mid - e); else c.lineTo(x, mid - e);
  }
  for (var x2 = xEnd; x2 >= xStart; x2--){
    var tt2 = tOf(x2), e2 = envAt(tt2) * amp;
    c.lineTo(x2, mid + e2);
  }
  c.closePath(); c.fill();

  /* 逐像素峰值竖线（波形质感） */
  c.strokeStyle = 'rgba(94,234,212,.72)'; c.lineWidth = 1;
  for (var px = Math.floor(xStart); px <= xEnd; px++){
    var tA = tOf(px), tB = tOf(px + 1), lo = 1, hi = -1, n = 7;
    for (var k = 1; k <= n; k++){
      var v2 = waveAt(tA + (tB - tA) * k / n);
      if (v2 < lo) lo = v2; if (v2 > hi) hi = v2;
    }
    var y1 = mid - hi * amp, y2 = mid - lo * amp;
    if (y2 - y1 < 1) y2 = y1 + 1;
    c.beginPath(); c.moveTo(px + .5, y1); c.lineTo(px + .5, y2); c.stroke();
  }
  /* 亮边（说话人 A 段用青色，B 段用紫色） */
  c.strokeStyle = 'rgba(167,139,250,.62)'; c.lineWidth = 1.4;
  for (var pi = 0; pi < arr.length; pi++){
    if (arr[pi].spk !== 'B') continue;
    var xa = Math.max(xOf(arr[pi].a), 0), xb2 = Math.min(xOf(arr[pi].b), covX);
    for (var q = xa; q <= xb2; q++){
      var tq = tOf(q), eq = envAt(tq) * amp;
      if (q === xa) { c.beginPath(); c.moveTo(q, mid - eq); } else c.lineTo(q, mid - eq);
    }
    c.stroke();
  }

  /* 相位 1：未解码区骨架 + 遮罩 */
  if (S.phase === 1 && covX < w){
    c.fillStyle = 'rgba(8,12,18,.72)'; c.fillRect(covX, 0, w - covX, h);
    c.strokeStyle = 'rgba(38,50,67,.9)'; c.lineWidth = 1;
    for (var gx = covX + 10; gx < w; gx += 22){
      c.beginPath(); c.moveTo(Math.round(gx) + .5, 0); c.lineTo(Math.round(gx) + .5, h); c.stroke();
    }
    c.fillStyle = 'rgba(96,165,250,.55)';
    c.font = '9.5px "JetBrains Mono",Consolas,monospace';
    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillText('待解码 ' + (AUDIO.dur - Math.round(AUDIO.dur * 0.68)) + ' ms', covX + 10, mid);
  }

  /* 相位 3：音素边界叠加（虚线 + 音素符号） */
  if (S.phase === 3){
    c.setLineDash([3, 3]); c.lineWidth = 1;
    for (var pi2 = 0; pi2 < PHONS.length; pi2++){
      var p = PHONS[pi2];
      var xp = Math.round(xOf(p.a)) + .5;
      if (xp < 0 || xp > w) continue;
      c.strokeStyle = p.bad ? 'rgba(251,92,114,.85)' : 'rgba(167,139,250,.6)';
      c.beginPath(); c.moveTo(xp, 0); c.lineTo(xp, h); c.stroke();
    }
    c.setLineDash([]);
    /* 音素符号条 */
    c.font = '9px "JetBrains Mono",Consolas,monospace';
    c.textAlign = 'center'; c.textBaseline = 'top';
    for (var pi3 = 0; pi3 < PHONS.length; pi3++){
      var p2 = PHONS[pi3];
      var xc = xOf(p2.a + p2.dur / 2);
      if (xc < 8 || xc > w - 8) continue;
      var bw = xOf(p2.dur);
      if (bw < 16) continue;
      c.fillStyle = p2.bad ? 'rgba(251,92,114,.9)' : 'rgba(167,139,250,.85)';
      c.fillText(p2.sym, xc, 3);
      c.fillStyle = 'rgba(79,96,118,.95)';
      c.fillText(p2.dur + '', xc, h - 13);
    }
  }
}

/* ══ 轨 2：频谱能量热力图 ══ */
function heat(v){
  /* 0 → 近黑；.28 → 深青；.5 → 青；.7 → 黄绿；.88 → 琥珀；1 → 亮黄白 */
  var stops = [
    [0.00, [8, 12, 18]],    [0.18, [12, 45, 58]],  [0.36, [18, 165, 148]],
    [0.54, [60, 200, 150]], [0.70, [170, 210, 110]], [0.85, [245, 165, 36]],
    [1.00, [255, 238, 190]]
  ];
  var i = 0;
  for (; i < stops.length - 1; i++) if (v <= stops[i + 1][0]) break;
  var s0 = stops[i], s1 = stops[Math.min(i + 1, stops.length - 1)];
  var k = (v - s0[0]) / Math.max(1e-6, s1[0] - s0[0]);
  k = clamp(k, 0, 1);
  return 'rgb(' + Math.round(s0[1][0] + (s1[1][0] - s0[1][0]) * k) + ','
                + Math.round(s0[1][1] + (s1[1][1] - s0[1][1]) * k) + ','
                + Math.round(s0[1][2] + (s1[1][2] - s0[1][2]) * k) + ')';
}
function drawSpec(){
  var cv = CV.spec; if (!cv) return;
  var s = cvsSetup(cv), c = s.c, w = s.w, h = s.h;
  c.clearRect(0, 0, w, h);
  c.fillStyle = '#080c12'; c.fillRect(0, 0, w, h);
  var cov = (S.phase === 1) ? 0.68 : 1;
  var covX = Math.min(w, xOf(AUDIO.dur * cov));
  var cellW = 3, cellH = h / BANDS;
  var xStart = Math.max(0, xOf(visA()));
  for (var x = xStart; x < covX; x += cellW){
    var t = tOf(x);
    for (var b = 0; b < BANDS; b++){
      var v = specAt(t, b);
      if (v < 0.05) continue;                     /* 省色：近零不画 */
      c.fillStyle = heat(v);
      c.fillRect(x, h - (b + 1) * cellH, cellW + .6, cellH + .6);
    }
  }
  /* 频带刻度（高频在上、0Hz 在下；能量按低频更强绘制在下半） */
  c.fillStyle = 'rgba(114,133,156,.78)';
  c.font = '8px "JetBrains Mono",Consolas,monospace';
  c.textAlign = 'left'; c.textBaseline = 'middle';
  var labels = [[0.05, '8k'], [0.28, '4k'], [0.52, '2k'], [0.74, '1k'], [0.95, '0']];
  for (var li = 0; li < labels.length; li++){
    c.fillText(labels[li][1], 3, clamp(labels[li][0] * h, 6, h - 6));
  }
  if (S.phase === 1 && covX < w){
    c.fillStyle = 'rgba(8,12,18,.8)'; c.fillRect(covX, 0, w - covX, h);
  }
  /* 相位 3：音素边界延伸到频谱轨 */
  if (S.phase === 3){
    c.setLineDash([3, 3]); c.lineWidth = 1;
    for (var pi = 0; pi < PHONS.length; pi++){
      var xp = Math.round(xOf(PHONS[pi].a)) + .5;
      if (xp < 0 || xp > w) continue;
      c.strokeStyle = PHONS[pi].bad ? 'rgba(251,92,114,.7)' : 'rgba(167,139,250,.45)';
      c.beginPath(); c.moveTo(xp, 0); c.lineTo(xp, h); c.stroke();
    }
    c.setLineDash([]);
  }
}

/* ══ 结算雷达图（5 维） ══ */
function drawRadar(){
  var cv = CV.radar; if (!cv) return;
  var s = cvsSetup(cv), c = s.c, w = s.w, h = s.h;
  c.clearRect(0, 0, w, h);
  var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 16, N = RADAR.length;
  function pt(i, r){
    var ang = -Math.PI / 2 + i * 2 * Math.PI / N;
    return [cx + Math.cos(ang) * r, cy + Math.sin(ang) * r];
  }
  /* 网格环 + 轴 */
  for (var g = 1; g <= 4; g++){
    c.strokeStyle = g === 4 ? 'rgba(45,212,191,.30)' : 'rgba(34,48,63,.9)';
    c.lineWidth = 1;
    c.beginPath();
    for (var i = 0; i < N; i++){
      var p = pt(i, R * g / 4);
      if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]);
    }
    c.closePath(); c.stroke();
  }
  c.strokeStyle = 'rgba(34,48,63,.9)';
  for (var i2 = 0; i2 < N; i2++){
    var p2 = pt(i2, R);
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(p2[0], p2[1]); c.stroke();
  }
  /* 数据多边形 */
  c.beginPath();
  for (var i3 = 0; i3 < N; i3++){
    var p3 = pt(i3, R * RADAR[i3].v / 100);
    if (i3 === 0) c.moveTo(p3[0], p3[1]); else c.lineTo(p3[0], p3[1]);
  }
  c.closePath();
  var gd = c.createRadialGradient(cx, cy, 2, cx, cy, R);
  gd.addColorStop(0, 'rgba(45,212,191,.42)');
  gd.addColorStop(1, 'rgba(45,212,191,.08)');
  c.fillStyle = gd; c.fill();
  c.strokeStyle = '#2dd4bf'; c.lineWidth = 1.8; c.stroke();
  /* 顶点 */
  for (var i4 = 0; i4 < N; i4++){
    var p4 = pt(i4, R * RADAR[i4].v / 100);
    c.beginPath(); c.arc(p4[0], p4[1], 2.6, 0, Math.PI * 2);
    c.fillStyle = '#2dd4bf'; c.fill();
    c.strokeStyle = '#080c12'; c.lineWidth = 1.2; c.stroke();
  }
  /* 维度标签 */
  c.font = '8.5px "Segoe UI",system-ui,sans-serif';
  c.fillStyle = '#72859c'; c.textAlign = 'center'; c.textBaseline = 'middle';
  for (var i5 = 0; i5 < N; i5++){
    var p5 = pt(i5, R + 10);
    c.fillText(RADAR[i5].k, clamp(p5[0], 26, w - 26), clamp(p5[1], 7, h - 7));
  }
  /* 平均值 */
  c.fillStyle = '#e4eef9';
  c.font = '600 12px "JetBrains Mono",Consolas,monospace';
  c.fillText(radarTotal().toFixed(1), cx, cy + 1);
  c.font = '8px "Segoe UI",system-ui,sans-serif';
  c.fillStyle = '#4f6076';
  c.fillText('均值', cx, cy + 12);
}

/* ══ 导出账本 · 段时长条形 ══ */
function drawBars(){
  var cv = CV.bars; if (!cv) return;
  var s = cvsSetup(cv), c = s.c, w = s.w, h = s.h;
  c.clearRect(0, 0, w, h);
  var arr = segs(), max = 0;
  for (var i = 0; i < arr.length; i++) if (arr[i].dur > max) max = arr[i].dur;
  var bw = Math.max(8, (w - 8) / arr.length - 8), gap = (w - 8 - bw * arr.length) / Math.max(1, arr.length - 1);
  for (var j = 0; j < arr.length; j++){
    var x = 4 + j * (bw + gap);
    var bh = Math.max(3, (arr[j].dur / max) * (h - 24));
    var g2 = c.createLinearGradient(0, h - bh, 0, h);
    if (arr[j].spk === 'B'){ g2.addColorStop(0, '#a78bfa'); g2.addColorStop(1, 'rgba(124,92,245,.35)'); }
    else { g2.addColorStop(0, '#2dd4bf'); g2.addColorStop(1, 'rgba(18,165,148,.35)'); }
    c.fillStyle = g2;
    c.fillRect(x, h - bh, bw, bh);
    c.fillStyle = arr[j].spk === 'B' ? '#a78bfa' : '#2dd4bf';
    c.font = '8px "JetBrains Mono",Consolas,monospace';
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText(String(arr[j].dur), x + bw / 2, h - bh - 3);
    c.fillStyle = '#4f6076';
    c.textBaseline = 'bottom';
    c.fillText('#' + (j + 1), x + bw / 2, h);
  }
}

/* ══ DOM 覆盖层（播放头 / 选区 / 冲突带 / 暂存带） ══ */
function paintOverlays(){
  var ovl = document.getElementById('ovl'); if (!ovl) return;
  var arr = segs();
  var h = ovl.clientHeight || 1;
  var html = '';
  /* 冲突带（相位 4） */
  if (S.phase === 4){
    var c4 = [segById('s3'), segById('s5')];
    for (var i = 0; i < c4.length; i++){
      var xa = xOf(c4[i].a), xb = xOf(c4[i].b);
      if (xb < 0 || xa > VW.w) continue;
      html += '<div class="cfband" style="left:' + xa + 'px;width:' + Math.max(2, xb - xa) + 'px"></div>';
    }
  }
  /* 重叠错误带（相位 5） */
  var ov = overlaps();
  for (var k = 0; k < ov.length; k++){
    var xo = xOf(ov[k].from), xw = xOf(ov[k].to) - xo;
    if (xw < 1) continue;
    if (xo > VW.w || xo + xw < 0) continue;
    html += '<div class="ovband" style="left:' + xo + 'px;width:' + xw + 'px">' +
            '<span>' + ov[k].ms + 'ms 重叠</span></div>';
  }
  /* 选区带 */
  if (SB_VISIBLE()){
    var sa = xOf(S.sel.a), sb = xOf(S.sel.b);
    var cls = S.phase === 4 ? 'conflict'
            : ((S.staged && S.phase !== 2 && S.phase !== 6) ? 'staged' : '');
    html += '<div class="selband ' + cls + '" style="left:' + sa + 'px;width:' + Math.max(2, sb - sa) + 'px"></div>';
  }
  /* 暂存切分点（两阶段提交） */
  if (S.staged && S.phase !== 2 && S.phase !== 6){
    var xs = xOf(S.stagedAt);
    html += '<div class="stagedmark" style="left:' + xs + 'px"></div>';
  }
  /* 播放头 */
  if (S.phase !== 1 && S.phase !== 6){
    var xp = xOf(S.playT);
    html += '<div class="ph" style="left:' + xp + 'px"></div>';
  }
  /* hover 十字线 + 时间气泡（相位 2） */
  if (S.hover && S.hoverT > 0){
    var xh = xOf(S.hoverT);
    html += '<div class="hxhair" style="left:' + xh + 'px"><i>' + tmmss(S.hoverT) + '</i></div>';
  }
  ovl.innerHTML = html;
}

function vSegStrip(){

    if (S.phase === 4 && (s.id === 's3' || s.id === 's5')) cls += ' conf';
    if (S.seg === s.id) cls += ' sel';

    if (S.phase === 5 && ov) cls += ' ovl-mark';

      ((s.a - 0) * w) + '%;width:' + ((s.dur * w)) + '%">' +
      '<b>#' + (segIdx(s.id) + 1) + ' · ' + (s.spk === 'A' ? '甲' : '乙') + '</b></span>';
  }).join('');
  return '<div class="segstrip"><span class="sg-gut">段落</span><div class="segrow">' + inner + '</div></div>';
}

    '<div class="app">' + vTop() + vNav() +
      '<main class="col maincol" aria-label="波形主视窗">' +
        vTool() + vWave() + vCtx() +
      '</main>' +
      vDraw() + vQC() + vStatus() +
    '</div>' +
    vTip() + vRadial() + vCmdk() + vDrawer() + vToasts() + vModal();
  var root = document.getElementById('root');
  root.innerHTML = html;
  document.body.setAttribute('data-ph', String(S.phase));

function positionTip(){
  var tip = document.getElementById('tip'); if (!tip || !S.hover) return;
  var ovl = document.getElementById('ovl'); if (!ovl) return;
  var r = ovl.getBoundingClientRect();
  var x = r.left + xOf(S.hoverT), y = r.top + 26;
  tip.style.left = clamp(x + 16, 8, window.innerWidth - 214) + 'px';
  tip.style.top = clamp(y, 96, window.innerHeight - 200) + 'px';
}
function redrawOnly(){ drawAll(); }

   交互动作
   ══════════════════════════════════════════════════════════════════════════ */
function toast(kind, title, sub){
  S.toasts = [[kind, kind === 'ok' ? 'i-check' : kind === 'err' ? 'i-alert' : 'i-alert', title, sub || '']];
  render();
}
function goRail(k){
  S.nav = k;
  var m = { tasks:1, wave:2, tag:3, diff:4, settle:6 };
  if (m[k]) { resetFor(m[k]); S.nav = k; }
  render();
}
function zoomBy(f){
  S.zoom = clamp(Math.round(S.zoom * f), 8, 400);
  render();
}
function doSplit(){                     /* Alt + 点击 / 切分按钮 */
  var t = S.cursor;
  if (t <= 0 || t >= AUDIO.dur) { toast('warn', '切分点越界', '请在音频范围内选择切分位置'); return; }
  S.staged = true; S.stagedAt = t;
  setSt('ACTIVE_EDITING');
  toast('warn', '已生成暂存切分点 @ ' + tmmss(t), '两阶段提交：尚未扣除未分配时长，须补全说话人与文本后确认');
}
function doMerge(){
  S.staged = false;
  setSt('ACTIVE_EDITING');
  toast('ok', '已合并相邻段', '段数 6 → 5 · 未分配时长 ' + tdur(freeMs()));
}
function doCheck(){
  var ov = overlapMs();
  if (ov > 0){
    S.ovErr = true; setSt('VALIDATION_FAILED'); setPh(5); S.s5b = 16040;
    toast('err', '重叠校验失败 · 提交已被阻断',
      '重叠 ' + ov + ' ms（要求精确 = 0 ms）｜全局提交按钮已硬禁用');
  } else {
    toast('ok', '重叠校验通过', '全部相邻段重叠 = 0 ms · 切分严格连续');
  }
}
function doPullback(){                 /* 修正重叠 */
  S.s5b = 15840; S.ovErr = false; S.modal = '';
  var s = segs(), gp = gaps().length;
  setSt(gp ? 'VALIDATION_FAILED' : 'PENDING_AUDIT');
  if (!gp){ setPh(6); }
  toast('ok', '已拉回重叠区', '段 #5 止点 16040 → 15840 ms · 重叠 0 ms');
}
function doCommit(){
  var ov = overlapMs();
  if (ov > 0){ doCheck(); return; }
  var p = PHONS[5];
  if (!S.codeOk){ S.modal = 'code'; setSt('VALIDATION_FAILED'); render(); return; }
  if (needReason() && S.reason.length < 10){
    toast('err', '修改原因不足 10 个字符', '置信度 ' + confAfter(segById(S.seg).conf).toFixed(3) +
      ' < 阈值 ' + S.confTh.toFixed(2) + '，须填写原因'); return;
  }
  setSt('PENDING_AUDIT'); setPh(6);
  toast('ok', '已提交初审', '提交时间 14:22 · 审核员 周蕾');
}
function doSave(){
  var s = segById(S.seg), conf = confAfter(s.conf);
  if (conf < S.confTh && S.reason.length < 10){
    toast('err', '无法保存 · 修改原因不足', '修正后置信度 ' + conf.toFixed(3) + ' < 阈值 ' +
      S.confTh.toFixed(2) + '，附注栏须 ≥10 字符（当前 ' + S.reason.length + '）');
    return;
  }
  S.staged = true;
  toast('ok', '已保存到暂存区', '最终置信度 ' + conf.toFixed(3) + ' · 两阶段提交待确认');
}
function doCodeOk(){
  var p = PHONS[5], need = codeOf(p);
  if (S.code !== need){
    S.codeOk = false;
    toast('err', '校验码错误', '音素 ' + p.sym + ' 起始 ' + p.a + ' ms，应输入后四位 ' + need);
    render(); return;
  }
  S.codeOk = true; S.modal = '';

}
function applyCasc(lv, v){

var drag = { on:false, a:0, b0:0, moved:false };

function hit(e, sel){
  var t = e.target;
  while (t && t !== document.body){
    if (t.matches && t.matches(sel)) return t;
    t = t.parentElement;
  }
  return null;
}
document.addEventListener('click', function(e){

  if ((el = hit(e, '[data-radial]'))) {

  if ((el = hit(e, '[data-spk]'))) {

  }
  if ((el = hit(e, '[data-resolve]'))) {

    if (rid !== null && rid !== '' && rid !== undefined) S.resolved[+rid] = rv;

    render();

    return;
  }
  if ((el = hit(e, '[data-diff]'))) { S.diff = el.getAttribute('data-diff'); render(); return; }
  if ((el = hit(e, '[data-conf]'))) {
    var c = el.getAttribute('data-conf');
    for (var i = 0; i < CONFLICTS.length; i++) if (CONFLICTS[i].id === c) {
      S.seg = CONFLICTS[i].seg; var sg2 = segById(S.seg); S.sel = { a: sg2.a, b: sg2.b };
    }
    render(); return;
  }
  if ((el = hit(e, '[data-modal-close]'))) { S.modal = ''; render(); return; }
  if ((el = hit(e, '[data-fmt]'))) {
    var f = el.getAttribute('data-fmt'), ix = S.fmt.indexOf(f);
    if (ix >= 0) S.fmt.splice(ix, 1); else S.fmt.push(f);

  }
  if ((el = hit(e, '[data-drawer]'))) { S.drawer = el.getAttribute('data-drawer'); render(); return; }
  if ((el = hit(e, '[data-drawer-close]'))) {
    if (S.drawer === 'audit' && S.phase === 6) { /* 审核历史抽屉关闭 */ }

  }
  if ((el = hit(e, '[data-cmdk]'))) { S.cmdk = !S.cmdk; render(); syncFocus(); return; }
  if ((el = hit(e, '[data-cmd]'))) {
