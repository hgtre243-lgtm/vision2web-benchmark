.bell{fill:url(#bellGradA)} .theme-glow .bell{fill:url(#bellGradB)}

.backdrop{fill:url(#bgGradA)} .theme-glow .backdrop{fill:url(#bgGradB)}
.halo{fill:url(#haloGradA)} .theme-glow .halo{fill:url(#haloGradB)}
.snow{fill:#9fc4de} .theme-glow .snow{fill:#e0b8d8}
.bubble{fill:none;stroke:#5fd8e0} .theme-glow .bubble{stroke:#f5a0c8}
.watermark{fill:#cfe0ef;opacity:.5;font-size:34px;letter-spacing:14px}
.watermark-sub{fill:#8fa9c4;opacity:.4;font-size:16px;letter-spacing:10px}
.ro{fill:#5f82a6;font-size:14px;letter-spacing:2px;font-family:Consolas,Menlo,monospace;opacity:.72}
/* 部件悬停 */
#jellySvg .part{transition:filter .18s ease}
#jellySvg .part:hover{filter:brightness(1.22) drop-shadow(0 0 10px rgba(120,240,255,.55));cursor:pointer}
/* 蓝图视图 */
#bpGrid{display:none}
#annotations{display:none}
#legend{display:none}
#jellySvg.bp #backdrop{display:none}
#jellySvg.bp #bpGrid{display:block}
.bpbg{fill:#122a4a}.bpg{stroke:#1f5a8f;stroke-width:1}.bpg-c{stroke:#2f7bb8;stroke-width:1.6}.bpg-d{stroke:#2f7bb8;stroke-width:1.4;stroke-dasharray:6 8}.bpt{fill:#b8d4e8;font-size:20px;letter-spacing:3px;opacity:.85}
#jellySvg.bp #jelly .part{filter:none}
#jellySvg.bp #jelly path,#jellySvg.bp #jelly ellipse,#jellySvg.bp #jelly rect,#jellySvg.bp #jelly circle{fill:none!important;stroke:var(--bp)!important;stroke-width:1.6!important}
#jellySvg.bp #jelly .node,#jellySvg.bp #jelly .dot{fill:var(--bp)!important;stroke:none!important}
#jellySvg.bp #jelly .nodeGlow,#jellySvg.bp #jelly .dotGlow,#jellySvg.bp #jelly .shine{display:none}
#jellySvg.bp #jelly .canal{opacity:1}
/* 标注视图 */
#jellySvg.ann #annotations{display:block}
#jellySvg.ann #legend{display:block}
.ann-dot{fill:#e8d3a8}.theme-glow .ann-dot{fill:#e8d3a8}
.ann-num{fill:#1c1a12;font-size:17px;font-weight:700;font-family:Georgia,serif}
.ann-line{stroke:#f0d38a;stroke-width:2;fill:none}
.ann-name{fill:#cfe0ef;font-size:14px;letter-spacing:1px}
.legend-panel{fill:#101a28;stroke:#2e4a68;stroke-width:1;opacity:.96}</style>

<script>
(function(){
  var state={view:'overview'};
  var svg=document.getElementById('jellySvg');
  var cam=document.getElementById('cam');
  var tabs=document.querySelectorAll('.tabs button');
  var ZOOM={ head:{x:360,y:40,w:480,h:300}, tail:{x:360,y:296,w:480,h:440} };
  function zoomTo(box){
    var W=1200,H=800,pad=52;
    var s=Math.max(W/(box.w+pad*2), H/(box.h+pad*2));
    var tx=W/2-(box.x+box.w/2)*s, ty=H/2-(box.y+box.h/2)*s;
    cam.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') scale('+s.toFixed(3)+')');
  }
  function setView(v){
    state.view=v;
    svg.classList.remove('theme-glow','bp','ann');
    cam.removeAttribute('transform');
    if(v==='glow') svg.classList.add('theme-glow');
    else if(v==='blueprint') svg.classList.add('bp');
    else if(v==='annotate') svg.classList.add('ann');
    else if(v==='head') zoomTo(ZOOM.head);
    else if(v==='tail') zoomTo(ZOOM.tail);
    tabs.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ setView(b.getAttribute('data-view')); }); });
  window.JELLY={ setView:setView, info:function(){
    return { view:state.view, parts:document.querySelectorAll('#jelly .part').length,
      svgEls:document.querySelectorAll('#jellySvg *').length };
  }};
})();</script>
