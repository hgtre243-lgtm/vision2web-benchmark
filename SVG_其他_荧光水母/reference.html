<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>荧光水母 GLOW JELLY</title>
<style>
  :root{ --stage:#03060d; --ink:#dff4ff; --dim:#7f9dc0; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#010307;overflow:hidden}
  body{font:12px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--dim)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{display:block;flex:none;width:100%;height:100%;background:var(--stage)}

  /* ── L1 环境场与背板底衬 ───────────────────────────────── */
  .sky{fill:url(#gSky)}
  .halo{fill:url(#rHalo)}
  .guide{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.30}
  .bpgrid{fill:none;stroke:url(#gGrid);stroke-width:1;opacity:.26}
  .ticks{fill:none;stroke:url(#gTick);stroke-width:1;opacity:.42}
  .shaft{fill:url(#gShaft);opacity:.55}
  .plank{fill:url(#rPlank)}
  .vignette{fill:#01040a}

  /* ── 远景个体与深层遮挡 ────────────────────────────────── */
  .far-bell{fill:url(#rFar);opacity:.62}
  .far-rim{fill:none;stroke:url(#gFarRim)}
  .tent-distant{fill:none;stroke:url(#gFarRim);stroke-linecap:round;stroke-opacity:.5}

  /* ── L2 接触阴影 ──────────────────────────────────────── */
  .tent-far{fill:none;stroke:url(#gTentF);stroke-linecap:round;stroke-opacity:.55}

  /* ── L3 内胆：辐射管 / 器官瓣 / 齿环 / 深孔 ─────────────── */
  .canal{fill:none;stroke:url(#gCanal);stroke-width:2.2;stroke-linecap:round}
  .rim-far{fill:none;stroke-linecap:round}
  .tent-halo{opacity:.85}
  .tent-core{opacity:.9}
  .arm-lit{fill:none}
  .gonad{stroke:#ffd9f2;stroke-width:.8;stroke-opacity:.35}
  .gonad-hi{fill:none;stroke-linecap:round}
  .gearing{fill:none;stroke:url(#gGear);stroke-linecap:round}
  .bore{mix-blend-mode:normal}
  .chamber{fill:url(#rChamber)}
  .bore-rim{fill:none;stroke-width:1.3}

  /* ── L4 曲面外壳与多曲率包络 ───────────────────────────── */
  .bell{fill:url(#gBell)}
  .bell-veil{fill:url(#gVeil);opacity:.9}
  .bell-far{mask:url(#mFarRim);opacity:.8}
  .bell-sheet{opacity:.55}
  .lappet{fill:url(#gLap)}
  .lap-edge{fill:none;stroke-width:1.4;stroke-linecap:round}
  .stomach{fill:url(#rStom)}
  .arm{fill:url(#gArm)}
  .arm-lit{fill:url(#gArmLit)}
  .arm2{fill:url(#gArm2)}
  .arm-base{fill:url(#rStom)}
  .arm-fold{fill:none;stroke-linecap:round}
  .tent{fill:none;stroke-linecap:round}

  /* ── L5 镜面高光与视差辉光 ─────────────────────────────── */
  .spec{fill:none;stroke-linecap:round}
  .fresnel{fill:none;stroke-linecap:round}
  .rglow,.tglow{fill:url(#rRimGlow)}
  .rglow-far,.tglow-halo,.rglow-halo{fill:url(#rRimGlow)}
  .rglow-halo{fill:url(#rRimGlow)}

  /* ── L6 读数与标注 ────────────────────────────────────── */
  #annot{display:none}
  body.annot #annot{display:block}
  .readout{fill:#4f7ea0;font:11px ui-monospace,monospace;letter-spacing:.18em}
  .an-lead{fill:none;stroke:url(#gAnno);stroke-width:1}
  .an-badge{fill:rgba(4,10,20,.72);stroke:#9fd8f2;stroke-width:1.4}
  .an-no{fill:#dff4ff;font:600 14px ui-monospace,monospace;text-anchor:middle}
  .lg-panel{fill:rgba(4,10,20,.55);stroke:#3f83ab;stroke-width:1}
  .lg-dot{fill:#8fe0ff}
  .lg-no{fill:#5f9fc4;font:600 11px ui-monospace,monospace}
  .lg-zh{fill:#cfe9fa;font-size:12px}
  .lg-en{fill:#5f88a8;font:9.5px ui-monospace,monospace;letter-spacing:.1em}
  .lg-h{fill:#e6f7ff;font-size:14px;letter-spacing:.34em}
  .lg-h2{fill:#5f88a8;font:9px ui-monospace,monospace;letter-spacing:.22em}

  /* ── 高对比暖色阶：整图明暗色阶无损重构 ────────────────── */
  body.theme-b{--stage:#0b0710}
  body.theme-b #stage{background:#0b0710}
  body.theme-b .sky{fill:url(#gSkyW)}
  body.theme-b .bell{fill:url(#aBell)}
  body.theme-b .bell-veil{fill:url(#aVeil)}
  body.theme-b .bell-sheet{fill:url(#aSheet)}
  body.theme-b .lappet{fill:url(#aLap)}
  body.theme-b .arm{fill:url(#aArm)}
  body.theme-b .arm2{fill:url(#aArm2)}
  body.theme-b .tent{stroke:url(#aTentN)}
  body.theme-b .fresnel{stroke:url(#aFres)}
  body.theme-b .shaft{fill:url(#aShaft)}
  body.theme-b .halo{fill:url(#aHalo)}
  body.theme-b .plank{fill:url(#aPlank)}

  /* ── 线稿拓扑蓝图：轮廓是拓扑分界线，绝不使用纯黑描边 ─── */
  body.bp .sky{fill:#04121f}
  body.bp .halo,body.bp .vignette,body.bp .plank,body.bp .shaft,
  body.bp .gonad,body.bp .stomach,body.bp .lappet,body.bp .arm,
  body.bp .bore,body.bp .bell-veil,body.bp .chamber{opacity:.06}
  body.bp .bell{fill:none;stroke:#5fd0ff;stroke-width:1.6}
  body.bp .bell-far{fill:none;stroke:#2b7fbf;stroke-width:1;opacity:.9}
  body.bp .bell-sheet{fill:none;stroke:#9fe8ff;stroke-width:.8;opacity:.7;stroke-dasharray:6 5}
  body.bp .lappet,body.bp .arm,body.bp .arm2,body.bp .stomach{fill:none;stroke:#4fb6e6;stroke-width:1.2}
  body.bp .lap-edge{stroke:#9fe8ff;stroke-width:1}
  body.bp .bore-rim{stroke:#7fd8ff;opacity:.9}
  body.bp .canal{stroke:#7fe0ff;stroke-width:1.1}
  body.bp .gearing{stroke:#67c8f0;opacity:.85}
  body.bp .rim-far{stroke:#7fd8ff;opacity:.8}
  body.bp .tent-halo{opacity:0}
  body.bp .tent-core{opacity:0}
  body.bp .arm-lit{opacity:0}
  body.bp .rglow-halo{opacity:0}
  body.bp .tent{stroke:#3fa8d8;stroke-width:1}
  body.bp .tent-far{stroke:#1d5f88}
  body.bp .spec,body.bp .fresnel{stroke:#bfeaff;opacity:.6}
  body.bp .rglow,body.bp .tglow{fill:#9fe8ff;opacity:.9}
  body.bp .far-bell{fill:none;stroke:#2b7fbf;opacity:.5}
  body.bp .tent-distant{stroke:#2b7fbf;stroke-opacity:.6}
  body.bp .grid,body.bp .bpgrid,body.bp .guide,body.bp .ticks{stroke:#4a9fdc}

  /* ── 复合微交互 ────────────────────────────────────────── */
  #L2 .part,#L3 .part,#L4 .part,#L5 .part{
    transition:transform .46s cubic-bezier(.22,.9,.24,1),opacity .32s ease}
  #L5,#L1{transition:transform .22s ease-out}
  #stage.hasfocus .part{opacity:.30}
  #stage.hasfocus #L6{opacity:.30}
  #stage.hasfocus .part.focused{opacity:1}
  #stage.hasfocus .part.focused .bell{filter:url(#fBloom)}
  #L7 .hit{fill:transparent;stroke:none;pointer-events:all}
  #L7{cursor:pointer}

  /* ── 演示外壳 ──────────────────────────────────────────── */
  #bar{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;
       padding:9px 16px;background:linear-gradient(180deg,rgba(2,6,12,.92),rgba(2,6,12,0));
       z-index:9;pointer-events:none}
  #bar button{pointer-events:auto;font:11px ui-monospace,monospace;color:#8fb6d8;
       background:rgba(10,22,36,.72);border:1px solid #23486a;border-radius:4px;
       padding:4px 11px;cursor:pointer}
  #bar button.on{color:#04121f;background:#7fd8ff;border-color:#7fd8ff}
  #bar .sp{flex:1}
  #ttl{font:600 15px/1 ui-monospace,monospace;color:#cfeaff;letter-spacing:.30em}
  #ttl small{display:block;font-size:10px;color:#5f88a8;letter-spacing:.20em;margin-top:5px}
  #read{font:11px ui-monospace,monospace;color:#4f7ea0;margin-right:8px}
</style>
</head>

<div id="bar">
  <span id="ttl">GLOW · JELLY<small>荧光水母 · 矢量插画</small></span>
  <span class="sp"></span>
  <span id="read">—</span>
  <button data-v="overall" class="on">整体</button>
  <button data-v="warm">配色</button>
  <button data-v="head">头部</button>
  <button data-v="tail">尾部</button>
  <button data-v="bp">线稿</button>
  <button data-v="explode">爆炸图</button>
  <button data-v="annot">标注</button>
</div>
<script>
(function(){
  var stage = document.getElementById('stage');
  var wrap  = document.getElementById('wrap');
  var body  = document.body;
  var FULL  = '0 0 1536 864';
  var HEAD  = '440 118 800 450';
  var TAIL  = '430 412 800 450';
  /* 沿透视法线的屏幕方向：+1 = 远离观察者（左下），-1 = 推向观察者（右上） */
  var NX = -0.7857, NY = 0.6186;
  var EXPL = {1:[0,0], 2:[46,-1], 3:[18,-1], 4:[40,1], 5:[56,1]};
  var CXo = 768, CYo = 396;
  var parts = [].slice.call(document.querySelectorAll('.part'));
  var hits  = [].slice.call(document.querySelectorAll('#L7 .hit'));
  var view  = 'overall';

  function tf(depth){
    var m = NX * depth, n = NY * depth;
    return 'translate(' + m.toFixed(1) + ',' + n.toFixed(1) + ')';
  }
  /* ── 爆炸图：五层沿透视法线分层位移 ───────────────────── */
  function explode(on){
    for (var L = 1; L <= 5; L++){
      var g = document.getElementById('L' + L);
      if (!g) continue;
      var e = EXPL[L];
      g.setAttribute('transform', on && e ? tf(e[0] * e[1]) : 'translate(0,0)');
    }
  }
  /* ── 视图切换 ─────────────────────────────────────────── */
  function apply(v){
    view = v;
    body.classList.toggle('theme-b', v === 'warm');
    body.classList.toggle('bp',      v === 'bp');
    body.classList.toggle('annot',   v === 'annot');
    stage.classList.toggle('hasfocus', v === 'focus');
    if (v !== 'focus') parts.forEach(function(p){ p.classList.remove('focused'); });
    explode(v === 'explode');
    stage.setAttribute('viewBox', v === 'head' ? HEAD : (v === 'tail' ? TAIL : FULL));
    [].forEach.call(document.querySelectorAll('#bar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-v') === v);
    });
    read();
  }
  [].forEach.call(document.querySelectorAll('#bar button'), function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-v')); });
  });
  window.addEventListener('keydown', function(e){
    var k = {Digit1:'overall',Digit2:'warm',Digit3:'head',Digit4:'tail',
             Digit5:'bp',Digit6:'explode',Digit7:'annot'}[e.code];
    if (k) apply(k);
  });

  /* ── 微交互 1：悬停外层壳体沿透视法线外移（微爆炸展开） ── */
  /* 主个体标记在生成期写入 data-hero，悬停/聚焦只作用于它，其余个体保持静止 */
  function same(p, i){
    return p.getAttribute('data-i') === i && p.getAttribute('data-hero') === '1';
  }
  function shellOf(i){
    return parts.filter(function(p){ return same(p, i) &&
             p.getAttribute('data-layer') === 'L4'; });
  }
  hits.forEach(function(h){
    var i = h.getAttribute('data-i');
    h.addEventListener('mouseenter', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', tf(-16)); });
    });
    h.addEventListener('mouseleave', function(){
      if (view === 'explode') return;
      shellOf(i).forEach(function(p){ p.setAttribute('transform', 'translate(0,0)'); });
    });
    /* ── 微交互 3：点击聚焦，其余部件透明度下降 ── */
    h.addEventListener('click', function(){
      var on = stage.classList.toggle('hasfocus');
      parts.forEach(function(p){
        p.classList.toggle('focused', on && same(p, i));
      });
      read();
    });
  });

  /* ── 微交互 2：视差光斑——高光层与背景层反向微幅位移 ──── */
  var px = 0, py = 0, tx = 0, ty = 0, lw = -1, lh = -1;
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth  - .5) * 2;
    ty = (e.clientY / window.innerHeight - .5) * 2;
  });
  var gL5 = document.getElementById('L5'), gL1 = document.getElementById('L1');
  function tick(){
    refit();
    px += (tx - px) * .09; py += (ty - py) * .09;
    if (view !== 'explode'){
      gL5.setAttribute('transform', 'translate(' + (-px * 9).toFixed(2) + ',' + (-py * 6).toFixed(2) + ')');
    }
    gL1.setAttribute('transform', 'translate(' + (px * 4).toFixed(2) + ',' + (py * 3).toFixed(2) + ')');
  }
  window.JELLY_TICK = tick;
  setInterval(tick, 16);

  /* ── 微交互 4：无损等比全视口居中适配 ─────────────────── */
  function fit(){
    var a = 1536 / 864;
    var W = wrap.clientWidth  || window.innerWidth;
    var H = (wrap.clientHeight || window.innerHeight) - 46;
    if (H < 60) H = 60;
    var w = W, h = W / a;
    if (h > H) { h = H; w = H * a; }
    stage.style.setProperty('width',  w.toFixed(2) + 'px', 'important');
    stage.style.setProperty('height', h.toFixed(2) + 'px', 'important');
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();
  function refit(){
    if (!wrap) return;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    if (cw !== lw || ch !== lh){ lw = cw; lh = ch; fit(); read(); }
  }

  function read(){
    var n = document.querySelectorAll('#stage path').length;
    document.getElementById('read').textContent =
      'view=' + view + '  path=' + n + '  layers=' +
      document.querySelectorAll('#stage [data-layer]').length +
      '  viewBox=' + stage.getAttribute('viewBox');
  }
  read();
  window.JELLY = { apply: apply, fit: fit, tick: tick,
    pathCount: function(){ return document.querySelectorAll('#stage path').length; } };
})();
</script>
